-left:2px dotted var(--line)}\nol.steps li:last-child::after{display:none}\nol.steps b{display:block}\n\n/* glossary */\ndl.gloss{margin:.6rem 0 0;padding:0;border-top:1px solid var(--line)}\ndl.gloss div{display:grid;grid-template-columns:7.5rem 1fr;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}\ndl.gloss dt{font-weight:700;color:var(--azul)}\ndl.gloss dd{margin:0}\n\n/* apps */\n.apps{display:grid;gap:.6rem;margin-top:.6rem}\n.app{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;padding:.75rem .9rem;background:var(--card);border-left:4px solid var(--azul)}\n.app .ic{font-size:1.4rem;line-height:1}\n.app b{display:block}\n.app span{color:var(--muted);font-size:.95rem}\n\n/* tables */\ntable{width:100%;border-collapse:collapse;font-size:.95rem;margin:.6rem 0}\nth,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-weight:700;color:var(--azul)}\n.scroll{overflow-x:auto}\n\n/* callouts */\n.note{padding:.8rem 1rem;border-left:4px solid var(--amarelo);background:var(--amarelo-tint);margin:.8rem 0}\n.warn{padding:.8rem 1rem;border-left:4px solid var(--alerta);background:var(--alerta-tint);margin:.8rem 0}\n.ok{padding:.8rem 1rem;border-left:4px solid var(--ok);background:var(--ok-tint);margin:.8rem 0}\n\n/* maps */\nfigure{margin:1rem 0}\nfigure svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line)}\nfigcaption{font-size:.9rem;color:var(--muted);margin-top:.4rem}\n.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-size:.88rem;color:var(--muted);margin-top:.4rem}\n.legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;vertical-align:-2px;margin-right:.3rem}\n\n/* food options */\n.meal{margin:1.6rem 0 0}\n.meal .when{font-size:.92rem;color:var(--muted)}\n.opt{margin:.7rem 0 0;padding:.9rem 1rem;background:var(--card);border-top:3px solid var(--azul)}\n.opt.pick{border-top-color:var(--amarelo)}\n.opt .tag{display:inline-block;font-size:.78rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;background:var(--amarelo);color:#1a1a1a;margin-left:.4rem;vertical-align:middle}\n.opt h4{font-size:1.05rem}\n.opt .grid{display:grid;grid-template-columns:5.6rem 1fr;gap:.25rem .6rem;font-size:.95rem;margin-top:.4rem}\n.opt .grid b{color:var(--muted);font-weight:600}\n.opt .grid span{min-width:0}\n\n/* shops */\n.shop{padding:.8rem 0;border-bottom:1px solid var(--line)}\n.shop b{display:block}\n.shop small{color:var(--muted)}\n.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}\n.chip{font-size:.88rem;padding:.25rem .65rem;border:1px solid var(--line);border-radius:999px;background:var(--card)}\n\ndetails{border:1px solid var(--line);margin:.6rem 0;background:var(--card)}\nsummary{cursor:pointer;padding:.7rem .9rem;font-weight:700;list-style:none}\nsummary::-webkit-details-marker{display:none}\nsummary::before{content:\"+\";display:inline-block;width:1.2rem;color:var(--azul);font-weight:700}\ndetails[open] summary::before{content:\"\u2013\"}\ndetails .in{padding:0 .9rem .9rem}\n\n/* curiosidades: post-it dobrado */\n.curio{margin:.6rem 0 0;border:none;background:none}\n.curio summary{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;list-style:none;font-size:.85rem;font-weight:700;color:var(--azul-esc);padding:.35rem .7rem;background:var(--amarelo-tint);border:1px solid var(--amarelo);border-radius:2px;position:relative;box-shadow:1px 2px 3px rgba(0,0,0,.1)}\n.curio summary::-webkit-details-marker{display:none}\n.curio summary::after{content:\"\";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 9px 9px;border-color:transparent transparent var(--bg) transparent}\n.curio[open] summary{border-radius:2px 2px 0 0}\n.curio .in{padding:.65rem .85rem;background:var(--amarelo-tint);border:1px solid var(--amarelo);border-top:none;font-size:.92rem;margin-top:-1px}\n\nfooter{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}\n@media (max-width:420px){\n  h1{font-size:2rem}\n  dl.gloss div{grid-template-columns:6.2rem 1fr}\n  .opt .grid{grid-template-columns:5rem 1fr}\n}\n.say{display:inline-flex;align-items:center;gap:.25rem}\n.say-btn{border:0;background:none;padding:0 .15rem;font-size:.95em;cursor:pointer;line-height:1}\n.phrases{list-style:none;padding:0;margin:.4rem 0 0}\n.phrases li{padding:.35rem 0;border-bottom:1px dashed var(--line);font-size:.92rem}\n.phrases li:last-child{border-bottom:none}\n.pend{list-style:none;padding:0;margin:.4rem 0 1rem}\n.pend li{padding:.5rem 0;border-bottom:1px dashed var(--line);font-size:.92rem;line-height:1.45}\n.pend li:last-child{border-bottom:none}\n.pend label{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}\n.pend input[type=checkbox]{width:1.15rem;height:1.15rem;margin:.15rem 0 0;flex:none;accent-color:var(--azul)}\n.pend label{flex-wrap:wrap}\n.pend label > .pend-what{flex:1 1 auto}\n.pend input:checked ~ .pend-what{text-decoration:line-through;color:var(--muted)}\n.pend input:disabled{opacity:.5}\n.pend-what{font-weight:600}\n.pend-when{display:block;flex-basis:100%;font-size:.82rem;color:var(--azul-esc);margin:.1rem 0 0 1.7rem}\n.pend-how{display:block;flex-basis:100%;font-size:.82rem;color:var(--muted);margin-left:1.7rem}\n.docs .pend-when,.docs .pend-how{margin-left:0}\n.pend-links{display:block;margin-top:.15rem;font-size:.88rem}\n.pend-links a{color:var(--azul);text-decoration:none;font-weight:600}\n.pend-bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.2rem 0 .4rem;font-size:.85rem;color:var(--muted)}\n.pend-lock{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:.8rem;border-radius:999px;padding:.25rem .7rem;cursor:pointer}\n</style>\n<style>\nheader{background-image:radial-gradient(rgba(255,255,255,.12) 1.5px, transparent 1.5px);background-size:18px 18px}\n.m{font-family:\"Public Sans\",system-ui,sans-serif;font-size:10.5px;fill:var(--ink)}\n.ms{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;fill:var(--muted)}\n.mh{font-family:\"Fraunces\",Georgia,serif;font-size:13px;font-weight:600;fill:var(--azul)}\n.mg{font-family:\"Fraunces\",Georgia,serif;font-size:11px;font-style:italic;fill:var(--muted);opacity:.7}\n.water{fill:var(--azul-tint)}\n.park{fill:var(--ok-tint);opacity:.8}\n.hill{fill:var(--line);opacity:.35}\n.street{stroke:var(--line);stroke-width:5;fill:none;stroke-linecap:round}\n.walk{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:3 4;stroke-linecap:round}\n.bus{stroke:var(--amarelo);stroke-width:4;fill:none;stroke-linecap:round}\n.pt{fill:var(--azul);stroke:var(--bg);stroke-width:1.5}\n.eat{fill:var(--amarelo);stroke:var(--ink);stroke-width:1.2}\n.shop{fill:var(--bg);stroke:var(--azul);stroke-width:2}\n</style>\n<style>\n/* ---- rotas numeradas (injetado) ---- */\n.r-path{cursor:pointer}\n.r-hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:16px;cursor:pointer}\n.r-badge{cursor:pointer}\n.r-badge circle{stroke:var(--bg);stroke-width:1.6px}\n.r-badge text{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}\n.r-badge circle{stroke-dasharray:none}\n.r-badge text{stroke:none;stroke-dasharray:none}\n.r-badge.walk{stroke-dasharray:none}\n.r-badge.walk circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}\n.r-badge.walk text{fill:var(--ink)}\n.r-badge.transit circle{fill:var(--amarelo)}\n.r-badge.transit text{fill:#1a1a1a}\n.r-badge.taxi circle{fill:var(--azul)}\n.r-badge.taxi text{fill:#fff}\n.r-path.is-active,.r-hit.is-active + .r-path{stroke-width:5px !important}\n.r-badge.is-active circle{stroke:var(--amarelo);stroke-width:3px}\n.rota-painel{display:none;margin:.6rem 0 1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:2px;position:relative}\n.rota-painel.show{display:block}\n.rota-painel .num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;font-size:.85rem;margin-right:.5rem;vertical-align:middle}\n.rota-painel h4{display:inline;font-family:\"Public Sans\",sans-serif;font-size:1rem;font-weight:700}\n.rota-painel p{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}\n.rota-painel .fechar{position:absolute;top:.5rem;right:.6rem;background:none;border:0;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:.3rem}\n.mapa-dica{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <p class=\"kicker\">zoropa 2026 \u00b7 bloco 5 de 5</p>\n    <h1>Potsdam</h1>\n    <p class=\"sub\">Sexta 02/10, Rebeca sozinha (o Jorge est\u00e1 na bitcoin++ em Berlim) \u00b7 Sanssouci de manh\u00e3, Bairro Holand\u00eas no almo\u00e7o, Cecilienhof e a Ponte dos Espi\u00f5es \u00e0 tarde, volta a Berlim \u00e0s 17h.</p>\n  </div>\n</header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pend\u00eancias</a>\n  <a href=\"#transporte\">Transporte</a>\n  <a href=\"#mapas\">Mapa</a>\n  <a href=\"#comer\">Onde comer</a>\n  <a href=\"#glossario\">Gloss\u00e1rio</a>\n  <a href=\"#lembrancas\">Lembrancinhas e lojas</a>\n</div></nav>\n\n<div class=\"wrap\">\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pend\u00eancias e reservas</h2>\n  <div class=\"note\"><b>Lista compartilhada:</b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccb abrir a planilha \"Pend\u00eancias zoropa 2026\"</a> \u2014 \u00e9 a vers\u00e3o oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe t\u00eam edi\u00e7\u00e3o). As caixinhas abaixo s\u00e3o s\u00f3 um espelho r\u00e1pido neste aparelho.</div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"></span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">\ud83d\udd13 travar lista</button></div>\n  <h3>O que ainda falta</h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"potsdam-0\"> <span class=\"pend-what\">Sanssouci: ingresso \"sanssouci+\" com hor\u00e1rio (inclui Cecilienhof)</span> <span class=\"pend-when\">para sex 02/10, ~10:00 \u00b7 comprar agora</span> <span class=\"pend-how\">tickets.spsg.de</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"potsdam-1\"> <span class=\"pend-what\">Bilhete 24 h ABC no BVG</span> <span class=\"pend-when\">sex 02/10 de manh\u00e3, antes do RE1</span> <span class=\"pend-how\">zona C = Potsdam</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"potsdam-2\"> <span class=\"pend-what\">Conferir hor\u00e1rio do RE1 de volta (~17h) no DB Navigator</span> <span class=\"pend-when\">sex 02/10 \u00e0 tarde</span></label></li>\n  </ul>\n  <h3>Reservas e documentos</h3>\n  <p class=\"lead\">Os PDFs est\u00e3o no Drive da conta bexorxe (privados: quem n\u00e3o estiver logado nela v\u00ea \"pedir acesso\"). \ud83d\udccd abre o lugar no Maps.</p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">Pal\u00e1cio de Sanssouci</span> <span class=\"pend-when\">sex 02/10 manh\u00e3 \u00b7 \u00f4nibus 695 at\u00e9 \"Schloss Sanssouci\"</span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Schloss%20Sanssouci%2C%20Potsdam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Pal\u00e1cio de Cecilienhof</span> <span class=\"pend-when\">sex 02/10 tarde \u00b7 \u00f4nibus 603 at\u00e9 \"Schloss Cecilienhof\"</span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Schloss%20Cecilienhof%2C%20Potsdam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Ponte Glienicke</span> <span class=\"pend-when\">sex 02/10 fim da tarde \u00b7 25 min a p\u00e9 do Cecilienhof</span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Glienicker%20Br%C3%BCcke\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n  </ul>\n</section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar</h2>\n  <p class=\"lead\">Potsdam \u00e9 zona C: um \u00fanico bilhete <b>24 h ABC (\u20ac12,90 por pessoa)</b>, comprado no app BVG de manh\u00e3, cobre tudo o dia inteiro, inclusive os bondes e \u00f4nibus de Potsdam. Com o hotel na Gleisdreieck, o caminho mais r\u00e1pido n\u00e3o \u00e9 o do roteiro (S1 a Wannsee): \u00e9 <b>U2 at\u00e9 Zoologischer Garten e o trem regional RE1</b>.</p>\n\n  <h3>Ida, 09:00</h3>\n  <ol class=\"steps\">\n    <li><b>Compre os dois bilhetes 24 h ABC no app</b> antes de entrar na Gleisdreieck. Valem at\u00e9 as 9h de s\u00e1bado.</li>\n    <li><b>U2 sentido Ruhleben</b>, 7 paradas at\u00e9 Zoologischer Garten, ~12 min. Siga as placas \"DB / Regionalbahn\".</li>\n    <li><b>RE1 sentido Brandenburg ou Magdeburg</b>, plataforma indicada no painel, 22 min at\u00e9 Potsdam Hauptbahnhof. Passa a cada 20\u201330 min. O S7, na mesma esta\u00e7\u00e3o, tamb\u00e9m vai a Potsdam, mas leva 35 min.</li>\n    <li><b>Em Potsdam Hbf: \u00f4nibus 695</b> na sa\u00edda norte (\"Ausgang Innenstadt\"), at\u00e9 a parada \"Schloss Sanssouci\", 15 min. O 695 passa a cada 20 min; a alternativa \u00e9 o bonde 91 at\u00e9 \"Luisenplatz-S\u00fcd/Park Sanssouci\" e 10 min a p\u00e9 pela entrada principal, com a vista dos terra\u00e7os.</li>\n  </ol>\n\n  <h3>Dentro de Potsdam</h3>\n  <ol class=\"steps\">\n    <li><b>Parque Sanssouci:</b> gr\u00e1tis; entrar nos pal\u00e1cios \u00e9 pago. O parque tem 2,5 km de ponta a ponta: Pal\u00e1cio de Sanssouci (leste) \u2192 Casa Chinesa (10 min) \u2192 Orangerie (10 min) \u2192 Neues Palais (25 min). Se forem at\u00e9 o Neues Palais, o 695 tamb\u00e9m para l\u00e1 e volta pelo mesmo caminho.</li>\n    <li><b>Sanssouci \u2192 Bairro Holand\u00eas:</b> a p\u00e9, 20 min, descendo pela Brandenburger Stra\u00dfe (rua de pedestres, com lojas) at\u00e9 o Port\u00e3o de Brandemburgo de Potsdam e seguindo at\u00e9 a Mittelstra\u00dfe. Ou bonde 91/94 da Luisenplatz at\u00e9 \"Nauener Tor\".</li>\n    <li><b>Bairro Holand\u00eas \u2192 Cecilienhof:</b> \u00f4nibus 603 da parada \"Nauener Tor\" at\u00e9 \"Schloss Cecilienhof\", 10 min.</li>\n    <li><b>Cecilienhof \u2192 Ponte Glienicke:</b> 25 min a p\u00e9 pelo Neuer Garten e a margem do lago, ou 603 de volta + bonde 93 at\u00e9 \"Glienicker Br\u00fccke\".</li>\n    <li><b>Ponte \u2192 Hbf:</b> bonde 93 direto, 20 min.</li>\n  </ol>\n\n  <h3>Volta, ~17:00, com uma escolha</h3>\n  <ol class=\"steps\">\n    <li><b>Direto ao hotel:</b> RE1 sentido Berlin/Frankfurt (Oder) at\u00e9 Zoologischer Garten, U2 sentido Pankow at\u00e9 Gleisdreieck. 45 min no total.</li>\n    <li><b>Com o desvio do KaDeWe:</b> descer do RE1 no Zoo, 5 min a p\u00e9 at\u00e9 o KaDeWe (Tauentzienstra\u00dfe, aberto at\u00e9 20h), e depois U2 de Wittenbergplatz (a esta\u00e7\u00e3o em frente ao KaDeWe) at\u00e9 Gleisdreieck, 4 paradas, direto. O bilhete ABC cobre.</li>\n    <li><b>Com a Apple Store:</b> RE1 at\u00e9 Friedrichstra\u00dfe, 10 min a p\u00e9 at\u00e9 a Rosenthaler Stra\u00dfe 44 (at\u00e9 20h), depois U8 Weinmeisterstra\u00dfe \u2192 Alexanderplatz + U2. \u00c9 a janela de reserva do Mac mini (com o Jorge, que vem do evento).</li>\n  </ol>\n\n  <h3 id=\"glossario\">Gloss\u00e1rio</h3>\n  <dl class=\"gloss\">\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Zona C','de-DE',this)\" aria-label=\"Ouvir Zona C\">\ud83d\udd0a</button> Zona C</dt><dd>Potsdam. Bilhete AB de Berlim n\u00e3o vale: multa de \u20ac60.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('RE / RB','de-DE',this)\" aria-label=\"Ouvir RE / RB\">\ud83d\udd0a</button> RE / RB</dt><dd>Trem regional (Regional-Express / Regionalbahn). Vermelho, da Deutsche Bahn, coberto pelo bilhete ABC.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('ViP','de-DE',this)\" aria-label=\"Ouvir ViP\">\ud83d\udd0a</button> ViP</dt><dd>A empresa de bondes e \u00f4nibus de Potsdam. Mesmo bilhete.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Schloss','de-DE',this)\" aria-label=\"Ouvir Schloss\">\ud83d\udd0a</button> Schloss</dt><dd>Pal\u00e1cio. Sans souci = \"sem preocupa\u00e7\u00f5es\", em franc\u00eas, o nome que Frederico II deu \u00e0 casa de ver\u00e3o.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Nauener Tor','de-DE',this)\" aria-label=\"Ouvir Nauener Tor\">\ud83d\udd0a</button> Nauener Tor</dt><dd>O port\u00e3o neog\u00f3tico na ponta do Bairro Holand\u00eas; \u00e9 a parada de \u00f4nibus e bonde de refer\u00eancia.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Holl\u00e4ndisches Viertel','de-DE',this)\" aria-label=\"Ouvir Holl\u00e4ndisches Viertel\">\ud83d\udd0a</button> Holl\u00e4ndisches Viertel</dt><dd>Bairro Holand\u00eas: 134 casas de tijolo vermelho constru\u00eddas para artes\u00e3os holandeses entre 1733 e 1742.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Havel','de-DE',this)\" aria-label=\"Ouvir Havel\">\ud83d\udd0a</button> Havel</dt><dd>O rio, que aqui vira uma sequ\u00eancia de lagos; a Ponte Glienicke cruza um deles.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('As batatas no t\u00famulo','de-DE',this)\" aria-label=\"Ouvir As batatas no t\u00famulo\">\ud83d\udd0a</button> As batatas no t\u00famulo</dt><dd>Frederico II est\u00e1 enterrado no terra\u00e7o de Sanssouci, e os visitantes costumam deixar batatas sobre a l\u00e1pide.<details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">Frederico II imp\u00f4s o cultivo da batata \u00e0 Pr\u00fassia no s\u00e9culo XVIII, num momento em que os camponeses desconfiavam do tub\u00e9rculo (achavam venenoso, por ser da fam\u00edlia da beladona). Reza a lenda que ele mandou plantar um campo de batatas guardado por soldados s\u00f3 de dia, para despertar a curiosidade dos camponeses, que roubavam as mudas \u00e0 noite achando que era algo valioso \u2014 e assim a batata se espalhou pela Pr\u00fassia. Deixar batatas na l\u00e1pide dele, ao lado dos t\u00famulos dos c\u00e3es que ele amava, virou tradi\u00e7\u00e3o de visitantes gratos.</div></details></dd></div>\n  </dl>\n\n  <h3>Como se fala</h3>\n  <div class=\"note\"><span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Sanssouci','de-DE',this)\" aria-label=\"Ouvir Sanssouci\">\ud83d\udd0a</button> <b>Sanssouci</b> \u2014 <i>s\u00e3(n)-su-SI (\u00e9 franc\u00eas, n\u00e3o alem\u00e3o)</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Schloss','de-DE',this)\" aria-label=\"Ouvir Schloss\">\ud83d\udd0a</button> <b>Schloss</b> \u2014 <i>shl\u00f3s</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Holl\u00e4ndisches Viertel','de-DE',this)\" aria-label=\"Ouvir Holl\u00e4ndisches Viertel\">\ud83d\udd0a</button> <b>Holl\u00e4ndisches Viertel</b> \u2014 <i>ho-LEN-di-shes FIR-tel</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Havel','de-DE',this)\" aria-label=\"Ouvir Havel\">\ud83d\udd0a</button> <b>Havel</b> \u2014 <i>H\u00c1-fel</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Cecilienhof','de-DE',this)\" aria-label=\"Ouvir Cecilienhof\">\ud83d\udd0a</button> <b>Cecilienhof</b> \u2014 <i>ts\u00ea-TSI-li-en-h\u00f4f</i></span></div>\n\n  <h3>Frases \u00fateis</h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hallo','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Hallo</b> \u2014 <i>HA-l\u00f4 (ol\u00e1)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Morgen','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Guten Morgen</b> \u2014 <i>GU-ten M\u00d3R-guen (bom dia)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Abend','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Guten Abend</b> \u2014 <i>GU-ten \u00c1-bent (boa noite, ao chegar)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Danke sch\u00f6n','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Danke sch\u00f6n</b> \u2014 <i>DAN-ke sh\u00f6n (muito obrigada)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bitte','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Bitte</b> \u2014 <i>BI-te (por favor / de nada / pois n\u00e3o)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Entschuldigung','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Entschuldigung</b> \u2014 <i>ent-SHUL-di-gung (desculpe / com licen\u00e7a)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Sprechen Sie Englisch?','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Sprechen Sie Englisch?</b> \u2014 <i>SHPR\u00c9-rren zi \u00c9N-glish (fala ingl\u00eas?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ich verstehe nicht','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Ich verstehe nicht</b> \u2014 <i>irr fer-SHT\u00ca-e nirrt (n\u00e3o entendo)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Die Rechnung, bitte','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Die Rechnung, bitte</b> \u2014 <i>di R\u00c9RR-nung BI-te (a conta, por favor)</i></li>\n  </ul>\n\n  <h3>Quanto custa</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Item</th><th>Os dois</th></tr>\n    <tr><td>2 \u00d7 24 h ABC</td><td>\u20ac25,80</td></tr>\n    <tr><td>Pal\u00e1cio de Sanssouci por dentro (opcional, hor\u00e1rio marcado)</td><td>\u20ac28\u201338</td></tr>\n    <tr><td>Cecilienhof por dentro (opcional)</td><td>\u20ac20\u201324</td></tr>\n    <tr><td>Comida</td><td>\u20ac60\u201380</td></tr>\n    <tr><td><b>Total do dia</b></td><td><b>\u20ac85\u2013105 sem pal\u00e1cios \u00b7 \u20ac135\u2013165 com</b></td></tr>\n  </table></div>\n</section>\n\n<!-- ====================== MAPA ====================== -->\n<section id=\"mapas\">\n  <h2>Mapa do dia</h2>\n  <p class=\"lead\">Pontos nas coordenadas reais. O parque ocupa o oeste; o Bairro Holand\u00eas fica no centro, ao norte da esta\u00e7\u00e3o; Cecilienhof e a ponte, no nordeste, junto aos lagos.</p>\n\n  <figure>\n    <svg viewBox=\"0 0 360 255\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Potsdam, sexta 2 de outubro\">\n      <path d=\"M340 40 C 320 90, 300 130, 270 175 C 250 205, 235 230, 225 255 L360 255 L360 40 Z\" class=\"water\"/>\n      <ellipse cx=\"252\" cy=\"72\" rx=\"22\" ry=\"34\" class=\"water\"/>\n      <text x=\"300\" y=\"150\" class=\"mg\">Havel</text>\n      <text x=\"228\" y=\"30\" class=\"mg\">Heiliger See</text>\n      <rect x=\"28\" y=\"98\" width=\"130\" height=\"72\" class=\"park\" rx=\"24\"/><text x=\"46\" y=\"94\" class=\"mg\">Park Sanssouci (2,5 km)</text <text x=\"206\" y=\"156\" class=\"ms\">Charlotte \u00b7 Holl\u00e4nder \u00b7 Augustiner</text>\n      <circle cx=\"191\" cy=\"137\" r=\"3\" class=\"pt\"/><text x=\"150\" y=\"134\" class=\"ms\" style=\"text-anchor:end\">Nauener Tor</text>\n      <circle cx=\"237\" cy=\"48\" r=\"6\" class=\"pt\"/><text x=\"245\" y=\"46\" class=\"m\">Cecilienhof</text>\n      <circle cx=\"304\" cy=\"81\" r=\"6\" class=\"pt\"/><text x=\"276\" y=\"98\" class=\"m\">Ponte Glienicke</text>\n      <circle cx=\"135\" cy=\"139\" r=\"3\" class=\"shop\"/><text x=\"138\" y=\"146\" class=\"ms\">Museum Shop</text>\n    <g class=\"r-badge transit\" data-r=\"1\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: \u00d4nibus 695 \u00b7 Potsdam Hbf \u2192 Schloss Sanssouci\" transform=\"translate(168.7,184.5)\"><circle r=\"9\"/><text y=\".5\">1</text></g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A p\u00e9 \u00b7 Sanssouci \u2192 Casa Chinesa\" transform=\"translate(119,138)\"><circle r=\"9\"/><text y=\".5\">2</text></g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A p\u00e9 \u00b7 Casa Chinesa \u2192 Orangerie\" transform=\"translate(96,128)\"><circle r=\"9\"/><text y=\".5\">3</text></g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A p\u00e9 (opcional) \u00b7 Orangerie \u2192 Neues Palais\" transform=\"translate(73,137)\"><circle r=\"9\"/><text y=\".5\">4</text></g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A p\u00e9 \u00b7 Parque \u2192 Brandenburger Stra\u00dfe\" transform=\"translate(141,149)\"><circle r=\"9\"/><text y=\".5\">5</text></g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A p\u00e9 \u00b7 Brandenburger Stra\u00dfe \u2192 Bairro Holand\u00eas\" transform=\"translate(176,153.5)\"><circle r=\"9\"/><text y=\".5\">6</text></g><g class=\"r-badge transit\" data-r=\"7\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 7: \u00d4nibus 603 \u00b7 Nauener Tor \u2192 Schloss Cecilienhof\" transform=\"translate(216.6,95)\"><circle r=\"9\"/><text y=\".5\">7</text></g><g class=\"r-badge walk\" data-r=\"8\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 8: A p\u00e9 \u00b7 Cecilienhof \u2192 Ponte Glienicke\" transform=\"translate(271.3,63.4)\"><circle r=\"9\"/><text y=\".5\">8</text></g><g class=\"r-badge transit\" data-r=\"9\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 9: Bonde 93 \u00b7 Ponte Glienicke \u2192 Potsdam Hbf\" transform=\"translate(268.3,147.2)\"><circle r=\"9\"/><text y=\".5\">9</text></g></svg>\n    <figcaption>O dia em anel: \u00f4nibus at\u00e9 o parque, a p\u00e9 at\u00e9 o Bairro Holand\u00eas, \u00f4nibus at\u00e9 Cecilienhof, a p\u00e9 at\u00e9 a ponte, bonde de volta \u00e0 esta\u00e7\u00e3o.</figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"></i>ponto do roteiro</span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"></i>comer</span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"></i>loja</span>\n      <span>\u2014 \u2014 a p\u00e9</span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">\u2501</span> \u00f4nibus/bonde</span>\n    </div>\n  <div class=\"rota-painel\" id=\"rp-potsdam-0\" aria-live=\"polite\"></div></figure>\n\n  <p>Mapa real: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Potsdam+Hauptbahnhof&destination=Glienicker+Br%C3%BCcke&waypoints=Schloss+Sanssouci%7CChinesisches+Haus+Potsdam%7CHoll%C3%A4ndisches+Viertel+Potsdam%7CSchloss+Cecilienhof&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir no Google Maps</a>.</p>\n\n  <h3>Sobre os lugares</h3>\n  <div class=\"attractions\">\n    <h4>Pal\u00e1cio de Sanssouci</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Frederico II, o Grande, mandou construir o pal\u00e1cio em 1745 como ref\u00fagio pessoal, longe da etiqueta r\u00edgida da corte em Berlim \u2014 o nome, do franc\u00eas \"sans souci\" (sem preocupa\u00e7\u00f5es), resume bem a inten\u00e7\u00e3o. Ele mesmo participou do projeto ao lado do arquiteto Knobelsdorff, e \u00e9 ali que est\u00e1 enterrado, por vontade pr\u00f3pria, ao lado dos c\u00e3es que teve ao longo da vida (n\u00e3o no imponente mausol\u00e9u que construiu para si em Berlim).</div></details><details class=\"curio\"><summary>\ud83c\udfdb\ufe0f um pouco de arquitetura</summary><div class=\"in\">\u00c9 um dos maiores exemplos de rococ\u00f3 na Alemanha: linhas curvas, dourado, decora\u00e7\u00e3o bot\u00e2nica exuberante \u2014 um estilo bem mais leve e \u00edntimo que o barroco grandioso de Versalhes, que serviu de inspira\u00e7\u00e3o distante. O terra\u00e7o em degraus com videiras, na frente do pal\u00e1cio, foi ideia do pr\u00f3prio Frederico, fascinado por cultivar figos e uvas num clima que n\u00e3o ajudava muito.</div></details>\n    <h4>Pal\u00e1cio de Cecilienhof</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Constru\u00eddo entre 1914 e 1917 no estilo de uma mans\u00e3o de campo inglesa (Tudor Revival), foi o \u00faltimo pal\u00e1cio erguido pela dinastia Hohenzollern antes do fim da monarquia alem\u00e3 em 1918. Ficou mundialmente conhecido por outro motivo: foi ali, em julho e agosto de 1945, que Truman, Churchill (substitu\u00eddo por Attlee na metade) e St\u00e1lin se reuniram na Confer\u00eancia de Potsdam para decidir o destino da Alemanha derrotada e redesenhar as fronteiras do p\u00f3s-guerra \u2014 as salas onde eles se sentaram est\u00e3o preservadas e podem ser visitadas.</div></details>\n    <h4>Ponte Glienicke</h4><details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">Ficou conhecida como a \"Ponte dos Espi\u00f5es\" durante a Guerra Fria: era o ponto de troca de agentes capturados entre os EUA e a Uni\u00e3o Sovi\u00e9tica, porque cruzava exatamente a fronteira entre Berlim Ocidental e a Alemanha Oriental (Potsdam). A troca mais famosa aconteceu em 1962, quando o piloto americano Gary Powers foi trocado pelo espi\u00e3o sovi\u00e9tico Rudolf Abel \u2014 o epis\u00f3dio que inspirou o filme \"Ponte dos Espi\u00f5es\", de Steven Spielberg.</div></details>\n  </div>\n</section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 op\u00e7\u00f5es por parada</h2>\n\n  <div class=\"meal\">\n    <h3>Caf\u00e9 no parque \u00b7 11:30 \u00b7 Sanssouci</h3>\n    <p class=\"when\">Um lugar a evitar e um a usar. O <b>Gasthaus Zur Historischen M\u00fchle</b>, ao lado do pal\u00e1cio, \u00e9 o \u00fanico restaurante da entrada e as avalia\u00e7\u00f5es s\u00e3o un\u00e2nimes: espera de 20 min para ser atendido, nota 3,8. J\u00e1 o <b>Drachenhaus</b>, a casa-pagode de 1770 no meio do parque (Maulbeerallee 4, 11h\u201319h), serve caf\u00e9, bolo e Gl\u00fchwein em terra\u00e7o com vista, e um schnitzel decente para quem quiser almo\u00e7ar ali; servi\u00e7o lento tamb\u00e9m, mas \u00e9 a pausa entre a Orangerie e a Casa Chinesa.</p>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 13:30 \u00b7 Bairro Holand\u00eas</h3>\n    <p class=\"when\">Os tr\u00eas ficam na Mittelstra\u00dfe e na Benkertstra\u00dfe, as duas ruas principais do bairro, a 30 m uma da outra. Sexta lota entre 13h e 14h; a primeira aceita reserva.</p>\n\n    <div class=\"opt pick\"><h4>Maison Charlotte <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Mittelstra\u00dfe 20, numa casa holandesa com jardim de inverno nos fundos.</span>\n        <b>Por qu\u00ea</b><span>Um bistr\u00f4 franc\u00eas que os alsacianos elogiam como melhor que muitos da Als\u00e1cia. Menus fixos de almo\u00e7o, vinho por ta\u00e7a, o lugar bonito do bairro.</span>\n        <b>Estrela</b><span>Steak tartare; sopa de peixe; tarte flamb\u00e9e.</span>\n        <b>Custo</b><span>\u20ac22\u201335.</span>\n        <b>Hor\u00e1rio</b><span>Sex 12h\u201315h e 16h\u201323h. Reservar: +49 331 2805450.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Zum Fliegenden Holl\u00e4nder</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Benkertstra\u00dfe 5, esquina da Mittelstra\u00dfe.</span>\n        <b>Por qu\u00ea</b><span>A taberna alem\u00e3 do bairro, decora\u00e7\u00e3o de navio, schnitzel elogiado como o melhor de muita gente, por\u00e7\u00e3o grande, sem reserva.</span>\n        <b>Estrela</b><span>Wiener Schnitzel; sopa de tomate com p\u00e3o nos dias frios.</span>\n        <b>Custo</b><span>\u20ac16\u201324.</span>\n        <b>Hor\u00e1rio</b><span>Sex 12h\u201323h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Augustiner Potsdam</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Mittelstra\u00dfe 18, com jardim de cerveja nos fundos.</span>\n        <b>Por qu\u00ea</b><span>B\u00e1varo de rede, mas com mesa quando os outros lotam, chope Augustiner de Munique e jardim se o dia estiver bonito.</span>\n        <b>Estrela</b><span>Salsichas brancas com pretzel; Schweinsbraten.</span>\n        <b>Custo</b><span>\u20ac15\u201322. Servi\u00e7o lento nas avalia\u00e7\u00f5es.</span>\n        <b>Hor\u00e1rio</b><span>Sex 12h\u201322h.</span>\n      </div></div>\n\n    <div class=\"note\">Doce: <b>Caf\u00e9 Guam</b>, Mittelstra\u00dfe 39, o caf\u00e9 de cheesecake de Potsdam, 20 sabores a ~\u20ac3,50 a fatia, nota 4,6. <b>S\u00f3 dinheiro.</b> Sexta 11h\u201319h; fecha no fim de semana, ent\u00e3o \u00e9 hoje ou nunca.</div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar leve \u00b7 18:30\u201320:00 \u00b7 onde a volta terminar</h3>\n    <p class=\"when\">O roteiro dizia \"perto do hotel\". Depende do desvio que escolherem no trem de volta.</p>\n\n    <div class=\"opt pick\"><h4>Sem desvio: Monte Mente ou Lindenbr\u00e4u <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Sony Center, 12 min do hotel. Fichas completas no guia de Berlim, jantar de quinta.</span>\n        <b>Por qu\u00ea</b><span>Se na quinta foram ao Midtown Grill, sexta \u00e9 a vez do jantar barato e bom ali do lado.</span>\n        <b>Custo</b><span>\u20ac18\u201328.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Com o KaDeWe: o 6\u00ba andar</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Tauentzienstra\u00dfe 21, at\u00e9 20h.</span>\n        <b>Por qu\u00ea</b><span>A se\u00e7\u00e3o de comida tem balc\u00f5es onde se janta sentado: ostras e champanhe, currywurst chique no SchniekeWurst, sopas, sushi. Compras de comida e jantar no mesmo lugar.</span>\n        <b>Custo</b><span>\u20ac15\u201340, depende do balc\u00e3o.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Ficando em Potsdam: Zum Fliegenden Holl\u00e4nder</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Bairro Holand\u00eas, at\u00e9 23h.</span>\n        <b>Por qu\u00ea</b><span>Se o dia atrasar e a Ponte Glienicke ficar para as 18h, jantar no bairro e pegar o RE1 \u00e0s 20h30 \u00e9 mais gostoso do que correr. Trens at\u00e9 depois da meia-noite.</span>\n        <b>Custo</b><span>\u20ac16\u201324.</span>\n      </div></div>\n  </div>\n</section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas e lojas</h2>\n  <p class=\"lead\">Sexta \u00e9 dia \u00fatil e as lojas do bairro abrem; \u00e9 a melhor janela de compras \"de design\" da viagem inteira depois de Amsterdam, e a \u00faltima antes do fim de semana fechado em Berlim.</p>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O qu\u00ea</th><th>Por qu\u00ea</th><th>Onde</th><th>Pre\u00e7o</th></tr>\n    <tr><td>Porcelana e papelaria de Sanssouci</td><td>A loja da funda\u00e7\u00e3o dos pal\u00e1cios prussianos: reprodu\u00e7\u00f5es dos vasos, cadernos com os desenhos do jardim, o Frederico de bolso.</td><td>Museum Shop Sanssouci, na Maulbeerallee ao lado do pal\u00e1cio, sex 10h\u201318h.</td><td>\u20ac5\u201340</td></tr>\n    <tr><td>Cer\u00e2mica, joia e objetos de casa de Brandemburgo</td><td>Loja-conceito de produtores locais, nota 4,9, atendimento que ajuda a escolher presente.</td><td>Stilbude, Mittelstra\u00dfe 37, sex 11h\u201318h.</td><td>\u20ac8\u201360</td></tr>\n    <tr><td>Decora\u00e7\u00e3o e roupa sustent\u00e1vel</td><td>\"Nada que voc\u00ea precise, tudo que voc\u00ea quer\", nas palavras de uma avalia\u00e7\u00e3o. Coisas pequenas de casa que cabem na mala.</td><td>Tante Paula, Benkertstra\u00dfe 11, sex 11h\u201318h.</td><td>\u20ac10\u201350</td></tr>\n    <tr><td>Chaveiro feito na hora e miudezas musicais</td><td>Lojinha nova de presentes com piano no meio e bancada de montar o pr\u00f3prio chaveiro.</td><td>Menuett, Hebbelstra\u00dfe 43, sex 10h\u201315h: s\u00f3 at\u00e9 as 15h.</td><td>\u20ac5\u201320</td></tr>\n    <tr><td>Cheesecake para o trem</td><td>Uma fatia embrulhada do Guam para as 17h.</td><td>Caf\u00e9 Guam, Mittelstra\u00dfe 39, dinheiro.</td><td>\u20ac3,50</td></tr>\n  </table></div>\n\n  <div class=\"ok\">Ordem pr\u00e1tica: Stilbude e Tante Paula antes do almo\u00e7o (12h45), Menuett logo depois (at\u00e9 15h), Guam na sa\u00edda para o 603. Tudo num raio de 150 m.</div>\n</section>\n\n\n</div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"potsdam-0\": [{\"t\": \"\u00d4nibus 695 \u00b7 Potsdam Hbf \u2192 Schloss Sanssouci\", \"d\": \"~15 min, sa\u00edda norte \\\"Ausgang Innenstadt\\\". Alternativa: bonde 91 at\u00e9 Luisenplatz-S\u00fcd + 10 min a p\u00e9.\"}, {\"t\": \"A p\u00e9 \u00b7 Sanssouci \u2192 Casa Chinesa\", \"d\": \"Dentro do parque.\"}, {\"t\": \"A p\u00e9 \u00b7 Casa Chinesa \u2192 Orangerie\", \"d\": \"~10 min.\"}, {\"t\": \"A p\u00e9 (opcional) \u00b7 Orangerie \u2192 Neues Palais\", \"d\": \"~25 min a mais; o \u00f4nibus 695 tamb\u00e9m para l\u00e1 e volta pelo mesmo caminho.\"}, {\"t\": \"A p\u00e9 \u00b7 Parque \u2192 Brandenburger Stra\u00dfe\", \"d\": \"Rua de pedestres, com lojas.\"}, {\"t\": \"A p\u00e9 \u00b7 Brandenburger Stra\u00dfe \u2192 Bairro Holand\u00eas\", \"d\": \"~20 min ao todo desde Sanssouci, at\u00e9 o Nauener Tor.\"}, {\"t\": \"\u00d4nibus 603 \u00b7 Nauener Tor \u2192 Schloss Cecilienhof\", \"d\": \"~10 min.\"}, {\"t\": \"A p\u00e9 \u00b7 Cecilienhof \u2192 Ponte Glienicke\", \"d\": \"~25 min pelo Neuer Garten e a margem do lago.\"}, {\"t\": \"Bonde 93 \u00b7 Ponte Glienicke \u2192 Potsdam Hbf\", \"d\": \"~20 min, direto.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">\u00d7</button><span class=\"num\">'+n+'</span><h4>'+item.t+'</h4><p>'+item.d+'</p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var zoropaUtterance = null;\n  function zoropaSpeak(text, lang, btn){\n    var w = window;\n    try{ if (window.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador n\u00e3o suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '\ud83d\udd08'; };\n      u.onend = function(){ btn.textContent = '\ud83d\udd0a'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '\ud83d\udd0a';\n      alert('N\u00e3o consegui tocar o \u00e1udio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n    if (e.data && typeof e.data.zoropaJump === 'string'){\n      var jt = document.getElementById(e.data.zoropaJump);\n      if (jt) sendScroll(jt);\n      return;\n    }\n    if (!e.data || typeof e.data.zoropaSearch !== 'string') return;\n    var q = e.data.zoropaSearch.toLowerCase();\n    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);\n    var node, target = null;\n    while ((node = walker.nextNode())){\n      var nv = node.nodeValue ? node.nodeValue.replace(/\\s+/g,' ') : '';\n      if (nv && nv.toLowerCase().indexOf(q) !== -1){\n        var p = node.parentElement;\n        if (p && p.closest('script,style')) continue;\n        target = p; break;\n      }\n    }\n    if (!target) return;\n    var det = target.closest('details');\n    if (det && !det.open) det.open = true;\n    sendScroll(target);\n    var prevBg = target.style.backgroundColor, prevTr = target.style.transition;\n    target.style.transition = 'background-color .3s';\n    target.style.backgroundColor = 'rgba(245,197,24,.55)';\n    setTimeout(function(){ target.style.backgroundColor = prevBg; setTimeout(function(){ target.style.transition = prevTr; }, 350); }, 1400);\n  });\nif (window.parent && window.parent !== window){\n    var nj = document.querySelector('nav.jump'); if (nj) nj.style.display = 'none';\n  }\n  document.querySelectorAll('nav.jump a[href^=\"#\"]').forEach(function(a){\n    a.addEventListener('click', function(ev){\n      var el = document.getElementById(a.getAttribute('href').slice(1));\n      if(!el) return;\n      ev.preventDefault();\n      if(!sendScroll(el)) el.scrollIntoView({behavior:'smooth', block:'start'});\n    });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var KEYP='zoropa-pend-', LOCKK='zoropa-pend-lock';\n  var boxes=Array.prototype.slice.call(document.querySelectorAll('.pend input[data-pend]'));\n  var lockBtn=document.getElementById('pendLock'), countEl=document.getElementById('pendCount');\n  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }\n  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }\n  function locked(){ return get(LOCKK)==='1'; }\n  function render(){\n    var done=0;\n    boxes.forEach(function(b){ b.disabled=locked(); if(b.checked) done++; });\n    if(countEl) countEl.textContent=done+' de '+boxes.length+' feitos';\n    if(lockBtn) lockBtn.textContent=locked()?'\ud83d\udd12 destravar lista':'\ud83d\udd13 travar lista';\n  }\n  boxes.forEach(function(b){\n    b.checked=get(KEYP+b.getAttribute('data-pend'))==='1';\n    b.addEventListener('change',function(){ set(KEYP+b.getAttribute('data-pend'), b.checked?'1':'0'); render(); });\n  });\n  if(lockBtn) lockBtn.addEventListener('click',function(){ set(LOCKK, locked()?'0':'1'); render(); });\n  render();\n})();\n<\/script>\n</body>\n</html>\n";

(function(){
  var FX_DEFAULT_RATE = 5.91;
  var FX_DEFAULT_DATE = "17/09/2026";
  var fxToggle = document.getElementById("fxToggle");
  var fxBody = document.getElementById("fxBody");
  var fxEur = document.getElementById("fxEur");
  var fxBrl = document.getElementById("fxBrl");
  var fxRate = document.getElementById("fxRate");
  var fxDate = document.getElementById("fxDate");
  var fxRateStored = null;
  try{ fxRateStored = localStorage.getItem("zoropa-fx-rate"); }catch(e){}
  fxRate.value = fxRateStored || FX_DEFAULT_RATE;
  fxDate.textContent = fxRateStored ? "(taxa ajustada por você)" : "(PTAX/BCB " + FX_DEFAULT_DATE + " — cole a de hoje se preferir)";
  fxToggle.addEventListener("click", function(){
    var open = fxBody.hasAttribute("hidden");
    if (open){ fxBody.removeAttribute("hidden"); fxToggle.setAttribute("aria-expanded","true"); fxEur.focus();
      var sb = document.getElementById("searchBody"), st = document.getElementById("searchToggle");
      if (sb && !sb.hasAttribute("hidden")){ sb.setAttribute("hidden",""); st.setAttribute("aria-expanded","false"); } }
    else { fxBody.setAttribute("hidden",""); fxToggle.setAttribute("aria-expanded","false"); }
  });
  function rate(){ var r = parseFloat(fxRate.value); return (r > 0) ? r : FX_DEFAULT_RATE; }
  fxEur.addEventListener("input", function(){
    var v = parseFloat(fxEur.value);
    fxBrl.value = isNaN(v) ? "" : (v * rate()).toFixed(2);
  });
  fxBrl.addEventListener("input", function(){
    var v = parseFloat(fxBrl.value);
    fxEur.value = isNaN(v) ? "" : (v / rate()).toFixed(2);
  });
  fxRate.addEventListener("input", function(){
    try{ localStorage.setItem("zoropa-fx-rate", fxRate.value); }catch(e){}
    fxDate.textContent = "(taxa ajustada por você)";
    if (fxEur.value) fxBrl.value = (parseFloat(fxEur.value) * rate()).toFixed(2);
    else if (fxBrl.value) fxEur.value = (parseFloat(fxBrl.value) / rate()).toFixed(2);
  });

  var SLUGS = ["lisboa","paris","amsterdam","berlim","potsdam"];
  var HTML_MAP = {
    lisboa: HTML_LISBOA,
    paris: HTML_PARIS,
    amsterdam: HTML_AMSTERDAM,
    berlim: HTML_BERLIM,
    potsdam: HTML_POTSDAM
  };
  var loaded = {};

  var CITY_NAMES = {lisboa:"Lisboa", paris:"Paris", amsterdam:"Amsterdam", berlim:"Berlim", potsdam:"Potsdam"};
  var SEARCH_INDEX = null;
  function buildSearchIndex(){
    if (SEARCH_INDEX) return SEARCH_INDEX;
    SEARCH_INDEX = [];
    SLUGS.forEach(function(slug){
      var raw = HTML_MAP[slug];
      var noTags = raw
        .replace(/<script[\s\S]*?<\/script>/gi, " ")
        .replace(/<style[\s\S]*?<\/style>/gi, " ")
        .replace(/<[^>]+>/g, "\n")
        .replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g," ");
      var lines = noTags.split("\n").map(function(l){ return l.replace(/\s+/g," ").trim(); }).filter(function(l){ return l.length > 3; });
      lines.forEach(function(l){ SEARCH_INDEX.push({slug: slug, text: l}); });
    });
    return SEARCH_INDEX;
  }
  function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function runSearch(q){
    var results = document.getElementById("searchResults");
    results.innerHTML = "";
    q = q.trim();
    if (q.length < 2){ return; }
    var idx = buildSearchIndex();
    var ql = q.toLowerCase();
    var matches = [];
    for (var i = 0; i < idx.length && matches.length < 8; i++){
      var pos = idx[i].text.toLowerCase().indexOf(ql);
      if (pos !== -1) matches.push({item: idx[i], pos: pos});
    }
    if (!matches.length){
      results.innerHTML = '<div class="search-empty">Nada encontrado para "' + escapeHtml(q) + '".</div>';
      return;
    }
    matches.forEach(function(m){
      var text = m.item.text, pos = m.pos;
      var start = Math.max(0, pos - 35);
      var end = Math.min(text.length, pos + q.length + 45);
      var snippet = (start > 0 ? "…" : "") + text.slice(start, pos) +
        "<mark>" + escapeHtml(text.slice(pos, pos + q.length)) + "</mark>" +
        escapeHtml(text.slice(pos + q.length, end)) + (end < text.length ? "…" : "");
      snippet = escapeHtml(text.slice(start, pos)) + "<mark>" + escapeHtml(text.slice(pos, pos+q.length)) + "</mark>" + escapeHtml(text.slice(pos+q.length, end)) + (end < text.length ? "…" : "");
      snippet = (start > 0 ? "…" : "") + snippet;
      var btn = document.createElement("button");
      btn.className = "search-result";
      btn.innerHTML = '<span class="sr-city">' + CITY_NAMES[m.item.slug] + '</span><span class="sr-snip">' + snippet + '</span>';
      btn.addEventListener("click", function(){ goToSearchResult(m.item.slug, q); });
      results.appendChild(btn);
    });
  }
  function goToSearchResult(slug, q){
    selectTab(slug);
    var tries = 0;
    (function trySend(){
      var iframe = document.querySelector('#panel-' + slug + ' iframe');
      if (iframe && iframe.contentWindow){
        try{ iframe.contentWindow.postMessage({zoropaSearch:q}, "*"); }catch(e){}
      }
      if (tries++ < 8) setTimeout(trySend, 200);
    })();
  }

  function resizeIframe(iframe){
    try{
      var doc = iframe.contentWindow.document;
      iframe.style.height = "0px";
      var h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      iframe.style.height = h + "px";
    }catch(e){}
  }

  function loadPanel(slug){
    if (loaded[slug]) return;
    loaded[slug] = true;
    var panel = document.getElementById("panel-" + slug);
    if (!panel) return;
    panel.innerHTML = '<div class="loading">Carregando ' + slug + '…</div>';
    var iframe = document.createElement("iframe");
    iframe.setAttribute("title", "Guia — " + slug);
    iframe.setAttribute("loading", "eager");
    iframe.addEventListener("load", function(){
      resizeIframe(iframe);
      try{
        var ro = new ResizeObserver(function(){ resizeIframe(iframe); });
        ro.observe(iframe.contentDocument.documentElement);
      }catch(e){}
      // fonts podem trocar a altura depois do primeiro load
      setTimeout(function(){ resizeIframe(iframe); }, 400);
      setTimeout(function(){ resizeIframe(iframe); }, 1200);
    });
    panel.innerHTML = "";
    panel.appendChild(iframe);
    iframe.srcdoc = HTML_MAP[slug];
  }

  var JUMP_MAP = {
    lisboa: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    paris: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    amsterdam: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["coffeeshops","Coffee shops"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    berlim: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["notebook","Mac mini"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    potsdam: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapa"],["comer","Onde comer"],["glossario","Glossário"],["lembrancas","Lembrancinhas e lojas"]]
  };
  function jumpTo(slug, id){
    var tries = 0;
    (function trySend(){
      var iframe = document.querySelector('#panel-' + slug + ' iframe');
      if (iframe && iframe.contentWindow){ try{ iframe.contentWindow.postMessage({zoropaJump:id}, "*"); }catch(e){} }
      if (tries++ < 6) setTimeout(trySend, 200);
    })();
  }
  function renderJump(slug){
    var nav = document.getElementById("jumpOuter");
    if (!nav) return;
    nav.innerHTML = "";
    (JUMP_MAP[slug] || []).forEach(function(pair){
      var a = document.createElement("a");
      a.href = "#" + pair[0]; a.textContent = pair[1];
      a.addEventListener("click", function(ev){ ev.preventDefault(); jumpTo(slug, pair[0]); });
      nav.appendChild(a);
    });
  }

  function selectTab(slug){
    if (SLUGS.indexOf(slug) === -1) slug = "lisboa";
    renderJump(slug);
    SLUGS.forEach(function(s){
      var tab = document.getElementById("tab-" + s);
      var panel = document.getElementById("panel-" + s);
      var active = (s === slug);
      if (tab){
        tab.setAttribute("aria-selected", active ? "true" : "false");
        tab.setAttribute("tabindex", active ? "0" : "-1");
      }
      if (panel){
        panel.style.display = active ? "" : "none";
      }
    });
    loadPanel(slug);
    try{ localStorage.setItem("zoropa-tab", slug); }catch(e){}
    var activeIframe = document.querySelector('#panel-' + slug + ' iframe');
    if (activeIframe) resizeIframe(activeIframe);
  }

  document.querySelectorAll(".tab").forEach(function(tab){
    tab.addEventListener("click", function(){ selectTab(tab.dataset.slug); });
  });

  document.querySelector("nav.tabs").addEventListener("keydown", function(ev){
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var current = document.querySelector('.tab[aria-selected="true"]');
    if (!current) return;
    var idx = SLUGS.indexOf(current.dataset.slug);
    idx = ev.key === "ArrowRight" ? (idx + 1) % SLUGS.length : (idx - 1 + SLUGS.length) % SLUGS.length;
    var next = document.getElementById("tab-" + SLUGS[idx]);
    if (next){ next.focus(); selectTab(SLUGS[idx]); }
  });

  window.addEventListener("message", function(e){
    if (!e.data || typeof e.data.zoropaScroll !== "number") return;
    var iframe = null;
    document.querySelectorAll(".panel iframe").forEach(function(f){ if (f.contentWindow === e.source) iframe = f; });
    if (!iframe) return;
    var hdr = document.querySelector("header.shell");
    var hh = hdr ? hdr.offsetHeight : 0;
    var top = iframe.getBoundingClientRect().top + (window.pageYOffset||0) + e.data.zoropaScroll - hh - 6;
    window.scrollTo({top: Math.max(0, top), behavior: "smooth"});
  });

  var searchToggle = document.getElementById("searchToggle");
  var searchBody = document.getElementById("searchBody");
  var searchInput = document.getElementById("searchInput");
  searchToggle.addEventListener("click", function(){
    var open = searchBody.hasAttribute("hidden");
    if (open){ searchBody.removeAttribute("hidden"); searchToggle.setAttribute("aria-expanded","true"); searchInput.focus();
      if (!fxBody.hasAttribute("hidden")){ fxBody.setAttribute("hidden",""); fxToggle.setAttribute("aria-expanded","false"); } }
    else { searchBody.setAttribute("hidden",""); searchToggle.setAttribute("aria-expanded","false"); }
  });
  var searchTimer = null;
  searchInput.addEventListener("input", function(){
    clearTimeout(searchTimer);
    var v = searchInput.value;
    searchTimer = setTimeout(function(){ runSearch(v); }, 150);
  });

  var initial = "lisboa";
  try{
    var saved = localStorage.getItem("zoropa-tab");
    if (saved && SLUGS.indexOf(saved) !== -1) initial = saved;
  }catch(e){}
  selectTab(initial);
})();

</script>
</body>
</html>
