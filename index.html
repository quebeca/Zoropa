ar(--amarelo);stroke:var(--ink);stroke-width:1.2}\n.shop{fill:var(--bg);stroke:var(--azul);stroke-width:2}\n.cs{fill:var(--ok);stroke:var(--bg);stroke-width:1.5}\n.bed{fill:var(--ok);stroke:var(--bg);stroke-width:1.5}\n<\/style>\n<style>\n/* ---- rotas numeradas (injetado) ---- */\n.r-path{cursor:pointer}\n.r-hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:16px;cursor:pointer}\n.r-badge{cursor:pointer}\n.r-badge circle{stroke:var(--bg);stroke-width:1.6px}\n.r-badge text{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}\n.r-badge circle{stroke-dasharray:none}\n.r-badge text{stroke:none;stroke-dasharray:none}\n.r-badge.walk{stroke-dasharray:none}\n.r-badge.walk circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}\n.r-badge.walk text{fill:var(--ink)}\n.r-badge.transit circle{fill:var(--amarelo)}\n.r-badge.transit text{fill:#1a1a1a}\n.r-badge.taxi circle{fill:var(--azul)}\n.r-badge.taxi text{fill:#fff}\n.r-path.is-active,.r-hit.is-active + .r-path{stroke-width:5px !important}\n.r-badge.is-active circle{stroke:var(--amarelo);stroke-width:3px}\n.rota-painel{display:none;margin:.6rem 0 1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:2px;position:relative}\n.rota-painel.show{display:block}\n.rota-painel .num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;font-size:.85rem;margin-right:.5rem;vertical-align:middle}\n.rota-painel h4{display:inline;font-family:\"Public Sans\",sans-serif;font-size:1rem;font-weight:700}\n.rota-painel p{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}\n.rota-painel .fechar{position:absolute;top:.5rem;right:.6rem;background:none;border:0;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:.3rem}\n.mapa-dica{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <p class=\"kicker\">zoropa 2026 · bloco 3 de 5<\/p>\n    <h1>Amsterdam<\/h1>\n    <p class=\"sub\">Domingo 27/09 (chegada 23:50) · segunda 28/09 (canais, Van Gogh, Anne Frank) · terça 29/09 (moinhos, navio da VOC, NDSM) · quarta 30/09 (Albert Cuyp e trem para Berlim).<\/p>\n  <\/div>\n<\/header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pendências<\/a>\n  <a href=\"#transporte\">Transporte<\/a>\n  <a href=\"#mapas\">Mapas<\/a>\n  <a href=\"#comer\">Onde comer<\/a>\n  <a href=\"#coffeeshops\">Coffee shops<\/a>\n  <a href=\"#glossario\">Glossário<\/a>\n  <a href=\"#lembrancas\">Lembrancinhas<\/a>\n  <a href=\"#lojas\">Lojas<\/a>\n<\/div><\/nav>\n\n<div class=\"wrap\">\n\n<div class=\"warn\"><b>Mudança obrigatória no roteiro:<\/b> o Pasta e Basta só abre de quarta a domingo. Na terça 29/09 está fechado, e na segunda também. O jantar especial de terça precisa de outro lugar; as três opções estão abaixo, em “Jantar · ter 29/09”. Não liguem para reservar lá.<\/div>\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pendências e reservas<\/h2>\n  <div class=\"note\"><b>Lista compartilhada:<\/b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📋 abrir a planilha “Pendências zoropa 2026”<\/a> — é a versão oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe têm edição). As caixinhas abaixo são só um espelho rápido neste aparelho.<\/div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"><\/span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">🔓 travar lista<\/button><\/div>\n  <h3>O que ainda falta<\/h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-0\"> <span class=\"pend-what\">✅ Van Gogh Museum: comprado, 2 × €25, seg 28/09 ~11:30<\/span> <span class=\"pend-when\">feito · entrada pelo horário do bilhete<\/span> <span class=\"pend-how\">vangoghmuseum.nl<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-1\"> <span class=\"pend-what\">Avisar o Inntel por e-mail: chegada ~00:30 de 28/09<\/span> <span class=\"pend-when\">até sáb 26/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-2\"> <span class=\"pend-what\">Definir o cartão <a class=\"gl\" href=\"#g-ovpay\">OVpay<\/a> de cada um (um só, sem trocar)<\/span> <span class=\"pend-when\">antes do primeiro bonde, seg 28/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-3\"> <span class=\"pend-what\">Apps 9292 e <a class=\"gl\" href=\"#g-ns\">NS<\/a> instalados + mapa offline (Amsterdam e Zaandam)<\/span> <span class=\"pend-when\">até sáb 26/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-6\"> <span class=\"pend-what\">Bikes em Zaandam: reservar 2 para ter 29/09, meia diária (~€15–20 os dois)<\/span> <span class=\"pend-when\">até seg 28/09 · loja da estação ou recepção do Inntel<\/span> <span class=\"pend-how\">retirada 09:00, devolução 14:00 — confirmem o horário-limite na retirada<\/span><\/label><\/li>\\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-5\"> <span class=\"pend-what\">Scheepvaartmuseum (o navio da VOC): ingresso para ter 29/09, ~€18 cada<\/span> <span class=\"pend-when\">comprar agora · hetscheepvaartmuseum.nl<\/span> <span class=\"pend-how\">entrar até as 16:00 — o museu fecha às 17:00. Confiram o horário do dia no site, que muda por temporada<\/span><\/label><\/li>\\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-4\"> <span class=\"pend-what\">Conferir plataforma do ICE 241 no DB Navigator<\/span> <span class=\"pend-when\">qua 30/09, 15:00<\/span> <span class=\"pend-how\">bilhete diz 5a; pode mudar<\/span><\/label><\/li>\n  <\/ul>\n  <h3>Reservas e documentos<\/h3>\n  <p class=\"lead\">Os PDFs estão no Drive da conta bexorxe (privados: quem não estiver logado nela vê “pedir acesso”). 📍 abre o lugar no Maps.<\/p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">Inntel Hotels Amsterdam Zaandam<\/span> <span class=\"pend-when\">dom 27/09 → qua 30/09 · check-in ~00:30 de 28/09, recepção 24 h<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1-Ad5k7HpItHV2HvL8qnQNYyQY-dfRUzv/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 reserva<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Inntel%20Hotels%20Amsterdam%20Zaandam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Casa de Anne Frank<\/span> <span class=\"pend-when\">seg 28/09 19:15 · chegar 15 min antes<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1WUSSq-hTXktBL4q95irdV-n8JnGnQrFY/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 ingressos<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Anne%20Frank%20House%2C%20Amsterdam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">ICE 241 · Amsterdam Centraal → Berlin Hbf<\/span> <span class=\"pend-when\">qua 30/09 16:00 → 21:43 · plataforma 5a · 2ª classe<\/span> <span class=\"pend-leave\">🕐 saída sugerida do Albert Cuyp / De Pijp: 14:50 (metrô 52 até Centraal, ~12 min + folga para achar a plataforma)<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/13QJRzvIKHZGfCm3lpXwjtj9DU3JgyC1V/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 bilhete<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Amsterdam%20Centraal\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n  <\/ul>\n<\/section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar<\/h2>\n  <p class=\"lead\">Amsterdam é a cidade mais fácil da viagem: <b>não existe bilhete para comprar<\/b>. O cartão de banco por aproximação (ou o celular com Apple/Google Pay) é o bilhete, no trem, no bonde, no metrô e no ônibus. O sistema chama-se <a class=\"gl\" href=\"#g-ovpay\">OVpay<\/a>. A única regra que importa é encostar ao entrar <b>e ao sair<\/b>.<\/p>\n\n  <h3>Antes de sair do Brasil<\/h3>\n  <ol class=\"steps\">\n    <li><b>Decidam qual cartão é “o cartão de transporte” de cada um<\/b> e não mudem durante a estadia. O sistema cobra pelo par entrada+saída do mesmo cartão. Se entrar com o físico e sair com o celular, cobra tarifa cheia duas vezes. Um cartão por pessoa; dois não passam com o mesmo.<\/li>\n    <li><b>Instalem o app 9292<\/b> (planejador de rotas de toda a Holanda, em inglês) e o <b><a class=\"gl\" href=\"#g-ns\">NS<\/a><\/b> (trens: horários ao vivo e a plataforma). O Google Maps funciona bem aqui também.<\/li>\n    <li><b>Baixem o mapa offline<\/b> de Amsterdam e Zaandam.<\/li>\n    <li><b>Avisem o Inntel<\/b> por e-mail que chegam por volta de 00:30 do dia 28: a recepção é 24 h, mas o aviso evita a surpresa.<\/li>\n  <\/ol>\n\n  <h3>Chegada, dom 27/09, 23:50, Centraal<\/h3>\n  <ol class=\"steps\">\n    <li><b>Desça do Eurostar e siga “Uitgang/Exit” para as plataformas dos trens NS<\/b>, no mesmo prédio. Painéis azuis. Procure um Sprinter com destino Uitgeest, Hoorn ou Zaandam; todos param em Zaandam (2ª ou 3ª parada, ~12 min).<\/li>\n    <li><b>Encoste o cartão no totem branco e amarelo do NS na plataforma<\/b> (ou na catraca). Ele apita e mostra “check-in”. Em Zaandam, encoste de novo na saída: “check-out”. ~€3,50 cada.<\/li>\n    <li><b>Confira no app NS o último trem antes de embarcar no Eurostar em Paris.<\/b> Em domingo à noite os Sprinters para Zaandam rodam até por volta de 00:30, mas o horário muda. Se não houver: Uber/Bolt na saída da estação, lado do IJ, ~€40, 20 min.<\/li>\n    <li><b>O Inntel fica ao lado da estação de Zaandam<\/b> (o prédio de casinhas verdes empilhadas; não tem como errar). 3 min a pé.<\/li>\n  <\/ol>\n\n  <h3>Como funciona na prática<\/h3>\n  <ol class=\"steps\">\n    <li><b>Trem (NS):<\/b> check-in no totem ou catraca <b>do NS<\/b> antes de subir, check-out ao sair. Tarifa por distância. Esquecer o check-out cobra ~€20.<\/li>\n    <li><b>Bonde, metrô, ônibus (<a class=\"gl\" href=\"#g-gvb\">GVB<\/a>):<\/b> os leitores ficam <b>dentro<\/b> do veículo (bonde/ônibus) ou na catraca (metrô). Encoste ao entrar e ao descer. ~€3,40 por viagem, com baldeação grátis em 35 min.<\/li>\n    <li><b>NS e GVB são empresas diferentes.<\/b> Chegando de trem para pegar o bonde: check-out NS, depois check-in GVB. Duas “bipadas”.<\/li>\n    <li><b>Ferry (pont) atrás da Centraal:<\/b> grátis, sem encostar nada. É só entrar com os pedestres e as bikes.<\/li>\n    <li><b>Bilhete GVB de 24h (~€10)<\/b> só compensa com 4 ou mais viagens de bonde no mesmo dia. Segunda-feira vocês têm 3 (bonde ao Van Gogh, bonde à Anne Frank, talvez um a mais): não compensa. Fiquem no OVpay.<\/li>\n    <li><b>Bike (terça):<\/b> pedale pela direita, na faixa vermelha; braço estendido para virar; nunca pare em cima da ciclovia; tranque sempre; e cruze trilho de bonde em ângulo reto, senão a roda entra na fenda.<\/li>\n    <li><b>Pagar no comércio:<\/b> \"<a class=\"gl\" href=\"#g-pinnen\">pinnen<\/a>\" = pagar com cartão. Muitos lugares <b>não aceitam dinheiro<\/b>, e o supermercado Albert Heijn <b>não aceita cartão de crédito de fora da UE<\/b>: usem o cartão de débito global (Wise/Revolut) ou dinheiro lá.<\/li>\n  <\/ol>\n\n  <h3>Trecho a trecho<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Quando<\/th><th>Trecho<\/th><th>Como<\/th><th>Tempo<\/th><\/tr>\n    <tr><td>seg 09:00<\/td><td>Zaandam → Centraal<\/td><td>trem NS, check-in NS<\/td><td>12 min<\/td><\/tr>\n    <tr><td>seg 09:30–11:00<\/td><td>Damrak → Dam → Begijnhof → Bloemenmarkt<\/td><td>a pé, tudo em linha reta para o sul<\/td><td>25 min somados<\/td><\/tr>\n    <tr><td>seg 11:15<\/td><td>Bloemenmarkt → Van Gogh<\/td><td>bonde 2 ou 12 na parada Koningsplein, descer em Rijksmuseum (check-in GVB)<\/td><td>10 min<\/td><\/tr>\n    <tr><td>seg 13:30–16:30<\/td><td>Van Gogh → Vondelpark → barco → Jordaan<\/td><td>a pé (5 min ao parque; 20 min do Rijksmuseum ao Jordaan)<\/td><td><\/td><\/tr>\n    <tr><td>seg 19:05<\/td><td>Jordaan → Anne Frank<\/td><td>a pé: fica no Jordaan, 5 min do ’t Smalle<\/td><td>5 min<\/td><\/tr>\n    <tr><td>seg 22:30<\/td><td>Red Light → Centraal → Zaandam<\/td><td>a pé 10 min + trem<\/td><td>25 min<\/td><\/tr>\n    <tr><td>ter 09:00<\/td><td>Retirada das bikes em Zaandam<\/td><td>loja da estação ou o próprio Inntel. <b>Meia diária<\/b>: devolução às 14:00, antes do trem. Confirmem o horário de devolução na retirada.<\/td><td>15 min<\/td><\/tr>\\n    <tr><td>ter 09:15<\/td><td>Zaandam → Zaanse Schans <b>de bike<\/b><\/td><td>~20 min pela margem do rio Zaan — é o trecho bonito, com os moinhos surgindo pela água. Alternativa se estiver chovendo: trem 1 parada (Zaandijk Zaanse Schans, sentido Uitgeest) + 15 min a pé cruzando a ponte.<\/td><td>20 min<\/td><\/tr>\n    <tr><td>ter 14:00<\/td><td>Zaanse Schans → Zaandam, devolução das bikes<\/td><td>mesmo caminho pelo rio, ~20 min; devolver e seguir a pé até a estação<\/td><td>25 min<\/td><\/tr>\\n    <tr><td>ter 14:30<\/td><td>Zaandam → Centraal<\/td><td>trem<\/td><td>12 min<\/td><\/tr>\n    <tr><td>ter 14:45<\/td><td>Centraal → Scheepvaartmuseum<\/td><td>a pé 15 min pela orla leste, ou ônibus 22. <b>Última entrada às 16:00; fecha 17:00.<\/b><\/td><td>15 min<\/td><\/tr>\n    <tr><td>ter 17:00<\/td><td>Scheepvaartmuseum → NDSM<\/td><td>a pé/ônibus 22 até a Centraal + ferry F4 do cais atrás da estação (lado do IJ), grátis<\/td><td>30 min<\/td><\/tr>\n    <tr><td>ter 18:00<\/td><td>NDSM → jantar (Moeders/Pantry)<\/td><td>bonde 13/17 até Westermarkt (Moeders) ou 2/12 até Leidseplein (Pantry)<\/td><td>15 min<\/td><\/tr>\n    <tr><td>qua 10:00<\/td><td>Zaandam → Centraal (malas nos armários)<\/td><td>trem; armários “Lockers” na estação, pagamento só com cartão, ~€10–15 o dia<\/td><td>12 min<\/td><\/tr>\n    <tr><td>qua 10:45<\/td><td>Centraal → De Pijp<\/td><td>metrô 52 sentido Zuid, 3 paradas; check-in GVB na catraca<\/td><td>6 min<\/td><\/tr>\n    <tr><td>qua 15:30<\/td><td>Na plataforma 5a · ICE 241 para Berlim, 16:00<\/td><td>plataforma 5a; bilhete DB no celular + passaporte; sem check-in OVpay (é bilhete internacional)<\/td><td>5h43<\/td><\/tr>\n  <\/table><\/div>\n\n  <h3>E se…<\/h3>\n  <ol class=\"steps\">\n    <li><b>Chover forte na terça, o dia de bike.<\/b> Não retirem as bikes: Zaanse Schans de trem (1 parada) e o dinheiro fica no bolso. O museu e o NDSM continuam (o ferry é coberto, o Pllek também), mas o passeio de bike pelo rio sai. Se o dia inteiro estiver perdido: Rijksmuseum (ao lado do Van Gogh, ingresso na hora costuma ter) e o jantar segue.<\/li>\n    <li><b>O último Sprinter para Zaandam já ter saído no domingo.<\/b> Uber/Bolt na saída da Centraal, lado do IJ, ~€40, 20 min. Confiram no app NS antes de embarcar em Paris.<\/li>\n    <li><b>O cartão não funcionar no OVpay.<\/b> Máquina azul da GVB na Centraal: bilhete de 1 h (~€3,40) ou 24 h (~€10), cartão internacional aceito. É o único caso em que compensa o de 24 h.<\/li>\n  <\/ol>\n\n  <h3 id=\"glossario\">Glossário<\/h3>\n  <dl class=\"gloss\">\n    <div id=\"g-ovpay\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('OVpay','nl-NL',this)\" aria-label=\"Ouvir OVpay\">🔊<\/button> OVpay<\/dt><dd>Pagar o transporte encostando cartão de banco ou celular. Vale em todo o país.<\/dd><\/div>\n    <div id=\"g-inchecken-uitchecken\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Inchecken / uitchecken','nl-NL',this)\" aria-label=\"Ouvir Inchecken / uitchecken\">🔊<\/button> Inchecken / uitchecken<\/dt><dd>Encostar ao entrar / ao sair. A palavra que os avisos sonoros repetem.<\/dd><\/div>\n    <div id=\"g-ns\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('NS','nl-NL',this)\" aria-label=\"Ouvir NS\">🔊<\/button> NS<\/dt><dd>A ferrovia nacional. Trens amarelos e azuis. Sprinter para em tudo; Intercity só nas grandes.<\/dd><\/div>\n    <div id=\"g-gvb\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('GVB','nl-NL',this)\" aria-label=\"Ouvir GVB\">🔊<\/button> GVB<\/dt><dd>A empresa municipal: bondes, metrô, ônibus e ferries de Amsterdam.<\/dd><\/div>\n    <div id=\"g-pont-veer\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Pont / veer','nl-NL',this)\" aria-label=\"Ouvir Pont / veer\">🔊<\/button> Pont / veer<\/dt><dd>Ferry. O F4 vai ao NDSM; o F3 a Buiksloterweg (o mais curto, 3 min, se quiserem só a travessia).<\/dd><\/div>\n    <div id=\"g-fietspad\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Fietspad','nl-NL',this)\" aria-label=\"Ouvir Fietspad\">🔊<\/button> Fietspad<span class=\"tl\">FITS-pat<\/span><\/dt><dd>Ciclovia. Asfalto vermelho. As bikes têm preferência e não param.<\/dd><\/div>\n    <div id=\"g-gracht\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Gracht','nl-NL',this)\" aria-label=\"Ouvir Gracht\">🔊<\/button> Gracht<span class=\"tl\">rrákht (o “kh” é gutural, tipo pigarro)<\/span><\/dt><dd>Canal. Prinsengracht, Herengracht, Keizersgracht: os três anéis.<\/dd><\/div>\n    <div id=\"g-bruin-cafe\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Bruin café','nl-NL',this)\" aria-label=\"Ouvir Bruin café\">🔊<\/button> Bruin café<\/dt><dd>“Café marrom”: bar antigo de madeira escura, cerveja e petisco. O do roteiro é o ’t Smalle.<\/dd><\/div>\n    <div id=\"g-bitterballen\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Bitterballen','nl-NL',this)\" aria-label=\"Ouvir Bitterballen\">🔊<\/button> Bitterballen<span class=\"tl\">BI-ter-ba-len<\/span><\/dt><dd>Bolinhas fritas de ragu de carne, com mostarda. O petisco nacional.<\/dd><\/div>\n    <div id=\"g-borrel\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Borrel','nl-NL',this)\" aria-label=\"Ouvir Borrel\">🔊<\/button> Borrel<span class=\"tl\">BÓ-rel<\/span><\/dt><dd>A hora do aperitivo com petiscos, fim de tarde. “Borrelplank” é a tábua.<\/dd><\/div>\n    <div id=\"g-pinnen\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Pinnen','nl-NL',this)\" aria-label=\"Ouvir Pinnen\">🔊<\/button> Pinnen<span class=\"tl\">PI-nen<\/span><\/dt><dd>Pagar com cartão. “Alleen pinnen” = só cartão, sem dinheiro.<\/dd><\/div>\n    <div id=\"g-coffeeshop\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Coffeeshop','nl-NL',this)\" aria-label=\"Ouvir Coffeeshop\">🔊<\/button> Coffeeshop<\/dt><dd>Loja licenciada de cannabis. Café de café chama-se “koffiehuis” ou “café”.<\/dd><\/div>\n    <div id=\"g-gezellig\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Gezellig','nl-NL',this)\" aria-label=\"Ouvir Gezellig\">🔊<\/button> Gezellig<span class=\"tl\">rrê-ZÉ-luerkh<\/span><\/dt><dd>Aconchegante, agradável, a palavra que os holandeses dizem não ter tradução. Um bruin café cheio numa noite fria é gezellig.<\/dd><\/div>\n  <\/dl>\n\n    <h3>Frases úteis<\/h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hallo','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Hallo<\/b> — <i>HA-lô (olá)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Goedemorgen','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Goedemorgen<\/b> — <i>RRU-de-mór-rren (bom dia)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Dank u wel','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Dank u wel<\/b> — <i>dank ü VÉL (muito obrigada)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Alstublieft','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Alstublieft<\/b> — <i>als-tü-BLIFT (por favor / aqui está)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Sorry','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Sorry<\/b> — <i>SÓ-ri (desculpe / com licença)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Spreekt u Engels?','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Spreekt u Engels?<\/b> — <i>sprêkt ü ÉN-guels (fala inglês?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ik begrijp het niet','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Ik begrijp het niet<\/b> — <i>ik be-RRÊIP het NIT (não entendo)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Waar is het toilet?','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Waar is het toilet?<\/b> — <i>vár is het tua-LÉT (onde é o banheiro?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hoeveel kost dit?','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Hoeveel kost dit?<\/b> — <i>RU-vêl kóst dit (quanto custa isso?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Mag ik de rekening?','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Mag ik de rekening?<\/b> — <i>mahk ik de RÊ-ke-ning (a conta, por favor)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Twee, alstublieft','nl-NL',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Twee, alstublieft<\/b> — <i>tvê als-tü-BLIFT (dois, por favor)<\/i><\/li>\n  <\/ul>\n\n  <h3>Apps: qual e por quê<\/h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">🧭<\/div><div><b>9292<\/b><span>Rotas em toda a Holanda com trem, bonde, ferry e ônibus juntos. O único que vocês precisam para “como vou”.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">🚆<\/div><div><b>NS<\/b><span>Horários dos trens ao vivo, plataforma e o último Sprinter para Zaandam. Também mostra atrasos.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">💳<\/div><div><b>OVpay<\/b><span>Opcional: mostra cada viagem cobrada no cartão. Útil para conferir se o check-out foi registrado.<\/span><\/div><\/div>\n  <\/div>\n\n  <h3>Quanto custa<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Item<\/th><th>Os dois<\/th><\/tr>\n    <tr><td>Trem Zaandam ↔ Centraal, 6 idas/voltas<\/td><td>~€42<\/td><\/tr>\n    <tr><td>Bondes e metrô, ~7 viagens<\/td><td>~€24<\/td><\/tr>\n    <tr><td>Ferries<\/td><td>€0<\/td><\/tr>\n    <tr><td>Bike em Zaandam, meia diária (09:00–14:00)<\/td><td>€15–20<\/td><\/tr>\n    <tr><td>Armários na Centraal<\/td><td>€10–15<\/td><\/tr>\n    <tr><td><b>Total transporte em Amsterdam<\/b><\/td><td><b>~€90–100<\/b><\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia<\/h2>\n  <p class=\"lead\">Um mapa da região (Zaandam fica 12 km ao norte) e um zoom do centro com os pontos de segunda, terça à noite e quarta. Pontos nas coordenadas reais. Nos quadros do dia, toque no número de um trecho para ver como fazer.<\/p>\n\n  <figure>\n    <svg viewBox=\"0 0 360 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Região de Amsterdam: Zaandam, Zaanse Schans, NDSM, Centraal, De Pijp\">\n      <path d=\"M0 228 C 100 236, 200 226, 360 216 L360 246 C 200 256, 100 262, 0 254 Z\" class=\"water\"/>\n      <text x=\"300\" y=\"262\" class=\"mg\">o IJ<\/text>\n      <path d=\"M56 130 C 52 100, 60 60, 64 34\" class=\"canal\" style=\"stroke-width:5\"/>\n      <text x=\"70\" y=\"80\" class=\"mg\">rio Zaan<\/text>\n      <text x=\"14\" y=\"22\" class=\"mh\">Região · ter 29/09 e ligações<\/text>\n\n      <path d=\"M52 120 C 90 160, 200 200, 267 248\" class=\"rail\"/>\n      <text x=\"120\" y=\"176\" class=\"ms\" style=\"fill:var(--amarelo)\">trem 12 min<\/text>\n      <path d=\"M56 108 L62 44\" class=\"rail\" style=\"opacity:.6\"/>\n      <text x=\"70\" y=\"140\" class=\"ms\">bike 20 min pelo Zaan<\/text>\n      <path d=\"M264 246 C 256 232, 250 216, 248 208\" class=\"ferry\"/>\n      <text x=\"262\" y=\"228\" class=\"ms\" style=\"fill:var(--azul)\">F4 grátis<\/text>\n      <path d=\"M270 258 L266 296\" class=\"rail\" style=\"opacity:.6\"/><text x=\"276\" y=\"286\" class=\"ms\" style=\"fill:var(--amarelo)\">metrô 52<\/text>\n\n      <rect x=\"46\" y=\"109\" width=\"12\" height=\"12\" class=\"bed\"/><text x=\"62\" y=\"118\" class=\"m\">Inntel · Zaandam<\/text>\n      <circle cx=\"40\" cy=\"128\" r=\"4\" class=\"eat\"/><text x=\"8\" y=\"146\" class=\"ms\">Pannenkoeken Paleis<\/text>\n      <circle cx=\"64\" cy=\"34\" r=\"7\" class=\"pt\"/><text x=\"76\" y=\"30\" class=\"m\">Zaanse Schans (moinhos)<\/text>\n      <circle cx=\"80\" cy=\"44\" r=\"4\" class=\"eat\"/><text x=\"90\" y=\"48\" class=\"ms\">De Kraai · Swarte Walvis<\/text>\n      <circle cx=\"248\" cy=\"202\" r=\"7\" class=\"pt\"/><text x=\"180\" y=\"196\" class=\"m\">NDSM<\/text>\n      <circle cx=\"240\" cy=\"210\" r=\"4\" class=\"eat\"/><text x=\"184\" y=\"212\" class=\"ms\">Pllek<\/text>\n      <circle cx=\"267\" cy=\"253\" r=\"7\" class=\"pt\"/><text x=\"278\" y=\"257\" class=\"m\">Centraal<\/text>\n      <circle cx=\"304\" cy=\"270\" r=\"5\" class=\"pt\"/><text x=\"222\" y=\"278\" class=\"ms\">Scheepvaartmuseum<\/text>\n      <circle cx=\"253\" cy=\"307\" r=\"6\" class=\"pt\"/><text x=\"217\" y=\"312\" class=\"m\">Albert Cuyp · De Pijp (qua)<\/text>\n      <circle cx=\"214\" cy=\"292\" r=\"4\" class=\"pt\"/><text x=\"150\" y=\"300\" class=\"ms\">Vondelpark<\/text>\n      <text x=\"271\" y=\"322\" class=\"ms\">→ Berlim, ICE 5h43<\/text>\n    <\/svg>\n    <figcaption>Região. Zaandam e Zaanse Schans ficam ao norte, do outro lado do IJ. O ferry F4 sai do cais atrás da Centraal.<\/figcaption>\n  <\/figure>\n\n  <figure>\n    <svg viewBox=\"0 0 360 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Centro de Amsterdam, segunda 28 de setembro\">\n      <rect x=\"0\" y=\"0\" width=\"360\" height=\"36\" class=\"water\"/><text x=\"8\" y=\"26\" class=\"mg\">o IJ<\/text>\n      <path d=\"M150 40 C 140 90, 130 140, 136 176 C 150 200, 180 205, 205 206\" class=\"canal\"/>\n      <path d=\"M112 40 C 96 80, 80 130, 82 165 C 90 200, 120 220, 170 222 C 200 224, 215 222, 230 216\" class=\"canal\"/>\n      <path d=\"M210 206 C 214 240, 214 290, 216 330\" class=\"canal\"/>\n      <text x=\"40\" y=\"200\" class=\"mg\">Prinsengracht<\/text>\n      <text x=\"222\" y=\"270\" class=\"mg\">Amstel<\/text>\n      <rect x=\"30\" y=\"215\" width=\"70\" height=\"50\" class=\"hill\" rx=\"20\"/><text x=\"36\" y=\"246\" class=\"mg\">Vondelpark<\/text>\n      <rect x=\"55\" y=\"242\" width=\"70\" height=\"30\" class=\"hill\" style=\"opacity:.2\"/><text x=\"66\" y=\"290\" class=\"mg\">Museumplein<\/text>\n      <path d=\"M200 56 L148 112\" class=\"street\"/><text x=\"176\" y=\"78\" class=\"ms\">Damrak<\/text>\n      <text x=\"14\" y=\"52\" class=\"mh\" style=\"fill:var(--azul)\">Centro · seg 28/09<\/text>\n\n      <!-- caminhada seg -->\n      <path d=\"M200 56 L148 110\" class=\"r-hit\" data-r=\"1\" data-map=\"amsterdam-1\" tabindex=\"-1\"/><path d=\"M200 56 L148 110\" class=\"walk r-path\" data-r=\" le cx=\"200\" cy=\"52\" r=\"7\" class=\"pt\"/><text x=\"210\" y=\"50\" class=\"m\">Centraal<\/text>\n      <circle cx=\"148\" cy=\"112\" r=\"6\" class=\"pt\"/><text x=\"156\" y=\"116\" class=\"m\">Dam<\/text>\n      <circle cx=\"126\" cy=\"150\" r=\"5\" class=\"pt\"/><text x=\"50\" y=\"146\" class=\"ms\">Begijnhof<\/text>\n      <circle cx=\"135\" cy=\"176\" r=\"6\" class=\"pt\"/><text x=\"142\" y=\"180\" class=\"m\">Bloemenmarkt<\/text>\n      <circle cx=\"63\" cy=\"264\" r=\"7\" class=\"pt\"/><text x=\"8\" y=\"282\" class=\"m\">Van Gogh 11:30<\/text>\n      <circle cx=\"93\" cy=\"248\" r=\"5\" class=\"pt\"/><text x=\"100\" y=\"252\" class=\"ms\">Rijksmuseum · barco<\/text>\n      <circle cx=\"48\" cy=\"227\" r=\"5\" class=\"eat\"/><text x=\"8\" y=\"222\" class=\"ms\">AH · Chimney Cake<\/text>\n      <circle cx=\"81\" cy=\"77\" r=\"6\" class=\"eat\"/><text x=\"8\" y=\"72\" class=\"ms\">'t Smalle · Paradox<\/text>\n      <circle cx=\"84\" cy=\"90\" r=\"7\" class=\"pt\"/><text x=\"90\" y=\"86\" class=\"m\">Anne Frank 19:15<\/text>\n      <circle cx=\"100\" cy=\"79\" r=\"4\" class=\"cs\"/><text x=\"104\" y=\"76\" class=\"ms\">Grey Area<\/text>\n      <circle cx=\"88\" cy=\"99\" r=\"4\" class=\"eat\"/><text x=\"94\" y=\"104\" class=\"ms\">Black &amp; Blue · De Prins<\/text>\n      <circle cx=\"86\" cy=\"139\" r=\"4\" class=\"shop\"/><text x=\"36\" y=\"132\" class=\"ms\">Kaaskamer<\/text>\n      <circle cx=\"191\" cy=\"108\" r=\"6\" class=\"pt\"/><text x=\"198\" y=\"104\" class=\"m\">Red Light<\/text>\n      <circle cx=\"173\" cy=\"82\" r=\"4\" class=\"shop\"/><text x=\"150\" y=\"70\" class=\"ms\">Tony's<\/text>\n      <circle cx=\"165\" cy=\"120\" r=\"4\" class=\"shop\"/><text x=\"170\" y=\"132\" class=\"ms\">Wynand Fockink<\/text>\n      <circle cx=\"210\" cy=\"210\" r=\"6\" class=\"pt\"/><text x=\"218\" y=\"214\" class=\"m\">Magere Brug<\/text>\n      <circle cx=\"180\" cy=\"198\" r=\"4\" class=\"cs\"/><text x=\"150\" y=\"196\" class=\"ms\" style=\"text-anchor:end\">Boerejongens<\/text>\n      <circle cx=\"123\" cy=\"154\" r=\"4\" class=\"cs\"/><text x=\"128\" y=\"164\" class=\"ms\">Dampkring · Vleminckx (ter)<\/text>\n      <circle cx=\"130\" cy=\"206\" r=\"4\" class=\"eat\"/><text x=\"20\" y=\"176\" class=\"ms\">The Pantry (ter) ↓<\/text>\n      <circle cx=\"118\" cy=\"214\" r=\"4\" class=\"shop\"/><text x=\"8\" y=\"186\" class=\"ms\">Heinen Delft ↓<\/text>\n      <circle cx=\"50\" cy=\"128\" r=\"4\" class=\"eat\"/><text x=\"8\" y=\"112\" class=\"ms\">Moeders (ter) ←<\/text>\n      <circle cx=\"159\" cy=\"294\" r=\"6\" class=\"pt\"/><text x=\"167\" y=\"298\" class=\"m\">Albert Cuyp (qua)<\/text>\n      <circle cx=\"144\" cy=\"304\" r=\"4\" class=\"cs\"/><text x=\"88\" y=\"316\" class=\"ms\">Katsu<\/text>\n      <circle cx=\"170\" cy=\"304\" r=\"4\" class=\"eat\"/><text x=\"176\" y=\"310\" class=\"ms\">The Butcher · Bazar<\/text>\n      <circle cx=\"307\" cy=\"128\" r=\"5\" class=\"pt\"/><text x=\"240\" y=\"146\" class=\"ms\">Scheepvaartmuseum (ter)<\/text>\n    <g class=\"r-badge walk\" data-r=\"1\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: A pé · Centraal → Dam\" transform=\"translate(174,83)\"><circle r=\"9\"/><text y=\".5\">1<\/text><\/g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A pé · Dam → Begijnhof\" transform=\"translate(137,133)\"><circle r=\"9\"/><text y=\".5\">2<\/text><\/g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A pé · Begijnhof → Bloemenmarkt\" transform=\"translate(131,164)\"><circle r=\"9\"/><text y=\".5\">3<\/text><\/g><g class=\"r-badge transit\" data-r=\"4\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: Bonde 2 ou 12 · Bloemenmarkt → Van Gogh\" transform=\"translate(103.3,223.4)\"><circle r=\"9\"/><text y=\".5\">4<\/text><\/g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A pé · Van Gogh → Vondelpark\" transform=\"translate(56,247)\"><circle r=\"9\"/><text y=\".5\">5<\/text><\/g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A pé · Vondelpark → Jordaan ('t Smalle)\" transform=\"translate(86.1,165.1)\"><circle r=\"9\"/><text y=\".5\">6<\/text><\/g><g class=\"r-badge walk\" data-r=\"7\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 7: A pé · Jordaan → Anne Frank\" transform=\"translate(136,99)\"><circle r=\"9\"/><text y=\".5\">7<\/text><\/g><g class=\"r-badge walk\" data-r=\"8\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 8: A pé · Anne Frank/Red Light → Magere Brug\" transform=\"translate(200,158)\"><circle r=\"9\"/><text y=\".5\">8<\/text><\/g><g class=\"r-badge walk\" data-r=\"9\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 9: A pé + trem NS · Red Light → Centraal → Zaandam\" transform=\"translate(195,81)\"><circle r=\"9\"/><text y=\".5\">9<\/text><\/g><\/svg>\n    <figcaption>Centro. Segunda desce em linha reta da Centraal ao Bloemenmarkt, pega o bonde ao Van Gogh, e sobe a pé pelo Jordaan até a Anne Frank.<\/figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"><\/i>ponto do roteiro<\/span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"><\/i>comer<\/span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"><\/i>loja<\/span>\n      <span><i style=\"background:var(--ok)\"><\/i>coffee shop / hotel<\/span>\n      <span>— — a pé<\/span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">━<\/span> trem/bonde/metrô<\/span>\n      <span><span style=\"color:var(--azul);font-weight:900\">┅<\/span> ferry<\/span>\n    <\/div>\n  <div class=\"rota-painel\" id=\"rp-amsterdam-1\" aria-live=\"polite\"><\/div><\/figure>\n\n  <p>Mapa real de segunda: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Amsterdam+Centraal&destination=Magere+Brug&waypoints=Dam+Square%7CBegijnhof%7CBloemenmarkt%7CVan+Gogh+Museum%7CVondelpark%7CCaf%C3%A9+%27t+Smalle%7CAnne+Frank+House&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir no Google Maps<\/a>.<\/p>\n\n  <h3>Sobre os lugares<\/h3>\n  <div class=\"attractions\">\n    <h4>Casa de Anne Frank<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">A família Frank se escondeu no “Anexo Secreto”, atrás de uma estante-porta giratória, de julho de 1942 a agosto de 1944 — dois anos inteiros sem sair. Foram denunciados por alguém nunca identificado com certeza até hoje; Anne morreu no campo de Bergen-Belsen semanas antes da libertação, aos 15 anos. O pai, Otto Frank, único sobrevivente da família, foi quem publicou o diário dela em 1947, encontrado intacto no chão do esconderijo depois da prisão da família.<\/div><\/details><details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">Por escolha da fundação que administra a casa, os cômodos do Anexo Secreto ficam sem mobília — como estavam depois da guerra, quando os móveis foram removidos pelos nazistas. Otto Frank pediu explicitamente que continuasse assim.<\/div><\/details>\n    <h4>Museu Van Gogh<\/h4><details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">Tem a maior coleção do mundo de obras de Van Gogh — mais de 200 pinturas e 500 desenhos — reunida porque o irmão dele, Theo, guardou praticamente tudo que não foi vendido em vida (Van Gogh vendeu só uma pintura enquanto viveu). A coleção passou de Theo para o filho dele, e depois para o museu, inaugurado em 1973.<\/div><\/details>\n    <h4>Zaanse Schans (moinhos)<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Não é uma vila histórica intacta: é uma coleção de moinhos e casas antigas trazidas de outros pontos da região do rio Zaan e remontadas ali a partir dos anos 1960, para preservar um jeito de vida que estava desaparecendo com a industrialização. Os moinhos que ainda funcionam moem especiarias, óleo e madeira do jeito que faziam há séculos — a região do Zaan chegou a ter mais de mil moinhos no auge, no século XVII; hoje restam poucas dezenas.<\/div><\/details>\n  <\/div>\n<\/section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 opções por parada<\/h2>\n  <p class=\"lead\">Holanda almoça leve e cedo (sanduíche ao meio-dia) e janta às 18–19h; cozinha fecha às 21h30 em muita casa. Horários conferidos para segunda, terça e quarta. Preços por pessoa, sem bebida.<\/p>\n\n  <div class=\"meal\">\n    <h3>Café da manhã · todos os dias · Zaandam<\/h3>\n    <p class=\"when\">O Inntel serve buffet. Se não estiver incluído na reserva (confiram), o <b>Albert Heijn<\/b> ao lado da estação de Zaandam resolve por €5: broodje, suco, iogurte, e a Chimney Cake de segunda-feira abre 7h em Amsterdam.<\/p>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Piquenique · seg 28/09, 13:30 · Vondelpark<\/h3>\n    <p class=\"when\">Os três ficam na Van Baerlestraat, a rua entre o Van Gogh e a entrada do parque, 3–5 min a pé.<\/p>\n\n    <div class=\"opt pick\"><h4>Albert Heijn, Van Baerlestraat 33 <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Esquina do Museumplein, 3 min do Van Gogh.<\/span>\n        <b>Por quê<\/b><span>Supermercado grande: sushi feito na hora, sanduíches prontos, queijo, frutas, stroopwafel de pacote. O piquenique mais barato e mais holandês.<\/span>\n        <b>Estrela<\/b><span>Broodje kroket; queijo jong belegen fatiado; suco de laranja da máquina.<\/span>\n        <b>Custo<\/b><span>€6–9.<\/span>\n        <b>Horário<\/b><span>8h–22h. <b>Não aceita cartão de crédito estrangeiro:<\/b> débito global ou dinheiro.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Chimney Cake Bakery &amp; Café<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Van Baerlestraat 92a, em frente ao Vondelpark.<\/span>\n        <b>Por quê<\/b><span>Sanduíche de focaccia e stroopwafel feito na hora, para comer no parque. Dona simpática, preço baixo.<\/span>\n        <b>Estrela<\/b><span>Caprese na focaccia; stroopwafel quente.<\/span>\n        <b>Custo<\/b><span>€7–10.<\/span>\n        <b>Horário<\/b><span>7h–22h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Corner Bakery<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Johannes Vermeerstraat 40, 4 min do Van Gogh.<\/span>\n        <b>Por quê<\/b><span>Se chover: brunch sentado, panqueca e french toast, café forte. Pedido por QR code.<\/span>\n        <b>Estrela<\/b><span>Guilty Pleasure Brunch; queijo holandês com pão integral.<\/span>\n        <b>Custo<\/b><span>€12–18.<\/span>\n        <b>Horário<\/b><span>Seg 9h–16h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Borrel · seg 28/09, 16:30 · Jordaan<\/h3>\n    <p class=\"when\"><a class=\"gl\" href=\"#g-bitterballen\">Bitterballen<\/a> com mostarda e uma cerveja pequena, a hora do aperitivo. Os três são <a class=\"gl\" href=\"#g-bruin-cafe\">bruin cafés<\/a> de verdade, a 5 min a pé da Anne Frank.<\/p>\n\n    <div class=\"opt pick\"><h4>Café ’t Smalle <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Egelantiersgracht 12, com terraço flutuante no canal.<\/span>\n        <b>Por quê<\/b><span>Destilaria de 1780 virada bar; o bruin café que aparece em todo guia por merecimento. Se o sol aparecer, o deque sobre a água é o melhor lugar da cidade.<\/span>\n        <b>Estrela<\/b><span>Bitterballen; kaassoufflé com mel picante; uma jenever.<\/span>\n        <b>Custo<\/b><span>€10–15 o <a class=\"gl\" href=\"#g-borrel\">borrel<\/a>.<\/span>\n        <b>Horário<\/b><span>Seg 14h–0h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Café Papeneiland<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Prinsengracht 2, esquina com a Brouwersgracht, 6 min ao norte.<\/span>\n        <b>Por quê<\/b><span>De 1642, azulejos de Delft e a torta de maçã que disputa com a do Winkel 43 o título de melhor da cidade, sem a fila do Winkel.<\/span>\n        <b>Estrela<\/b><span>Appeltaart com chantilly; bitterballen.<\/span>\n        <b>Custo<\/b><span>€8–14.<\/span>\n        <b>Horário<\/b><span>Seg 10h–1h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Café de Prins<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Prinsengracht 124, em frente à Westerkerk, 2 min da Anne Frank.<\/span>\n        <b>Por quê<\/b><span>Bar de bairro com cozinha até tarde: serve de borrel às 16h30 e de plano B para o jantar depois da Anne Frank.<\/span>\n        <b>Estrela<\/b><span>Bitterballen; steak-frites com salada.<\/span>\n        <b>Custo<\/b><span>€8–20.<\/span>\n        <b>Horário<\/b><span>Seg 10h–1h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar leve · seg 28/09, 20:30 · depois da Anne Frank<\/h3>\n    <p class=\"when\">Saída da Anne Frank por volta de 20:20. A ideia é comer em 45 min e seguir para o Red Light e a Magere Brug. Os três ficam a 2–3 min da porta.<\/p>\n\n    <div class=\"opt pick\"><h4>Black and Blue <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Leliegracht 46, 2 min.<\/span>\n        <b>Por quê<\/b><span>Steakhouse pequeno de canal, rápido, com hambúrguer bom para quem não quer cerimônia às 20h30.<\/span>\n        <b>Estrela<\/b><span>Copa lombo (pork collar); hambúrguer; salada de bife.<\/span>\n        <b>Custo<\/b><span>€20–30.<\/span>\n        <b>Horário<\/b><span>Seg 11h–23h. +31 20 625 0807.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>’t Westerhuys<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Prinsengracht 277, 3 min, com vista da Westerkerk.<\/span>\n        <b>Por quê<\/b><span>Mesa no canal, salada e prato do dia, sossegado.<\/span>\n        <b>Estrela<\/b><span>Salada de beterraba; stamppot.<\/span>\n        <b>Custo<\/b><span>€18–25.<\/span>\n        <b>Horário<\/b><span>Seg até 22h: pedir até 21h15. O serviço é lento; contar com isso.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Café de Prins<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Prinsengracht 124, 2 min.<\/span>\n        <b>Por quê<\/b><span>Se quiserem só um prato rápido no balcão, sem sair do bruin café.<\/span>\n        <b>Estrela<\/b><span>Steak-frites; tosti.<\/span>\n        <b>Custo<\/b><span>€12–20.<\/span>\n        <b>Horário<\/b><span>Seg até 1h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · ter 29/09, 13:00 · Zaanse Schans / Zaandam<\/h3>\n    <p class=\"when\">Pannenkoeken: a panqueca holandesa, fina e do tamanho do prato, doce ou salgada. As duas primeiras ficam dentro da vila dos moinhos; a terceira, no centro de Zaandam, ao lado do hotel.<\/p>\n\n    <div class=\"opt pick\"><h4>Restaurant De Kraai <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Kraaienpad 1, no meio da Zaanse Schans, num celeiro antigo.<\/span>\n        <b>Por quê<\/b><span>A panquecaria da vila: 20 tipos, feitos à vista, autosserviço, mesas fora com os patos. Bate os ônibus de turismo se chegarem antes das 12h30.<\/span>\n        <b>Estrela<\/b><span>Panqueca de bacon, queijo e cebola; a de stroopwafel com mel e chantilly.<\/span>\n        <b>Custo<\/b><span>€12–15.<\/span>\n        <b>Horário<\/b><span>9h–18h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>De Hoop op d’Swarte Walvis<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Kalverringdijk 15, à beira do rio Zaan, na ponta da vila.<\/span>\n        <b>Por quê<\/b><span>Restaurante de verdade, com deque sobre a água e o “prato holandês” (sopa de mostarda, croquete, sanduíche aberto) para quem não quer doce ao meio-dia.<\/span>\n        <b>Estrela<\/b><span>Dutch lunch plate; ensopado de carne; batata com trufa.<\/span>\n        <b>Custo<\/b><span>€15–22.<\/span>\n        <b>Horário<\/b><span>Ter 12h–17h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Het Zaanse Pannenkoeken Paleis<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Wilhelminastraat 8, centro de Zaandam, 8 min a pé do Inntel.<\/span>\n        <b>Por quê<\/b><span>Para quem prefere almoçar de volta ao hotel antes do trem: poffertjes (as mini-panquecas fofas) elogiados como os melhores da região, mesas no canal.<\/span>\n        <b>Estrela<\/b><span>Poffertjes de morango e banana.<\/span>\n        <b>Custo<\/b><span>€10–14.<\/span>\n        <b>Horário<\/b><span>Ter 11h–21h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Lanche · ter 29/09, ~17:30 · NDSM (ou centro, antes do museu)<\/h3>\n    <p class=\"when\"><b>Vleminckx<\/b> (Voetboogstraat 33, ao lado do Spui): batata frita belga em cone com 30 molhos, só para viagem, €4–6, ter até 19h; peça “oorlog” (maionese + satay + cebola). Stroopwafel na hora: a <b>Van Wonderen<\/b> (Kalverstraat 190) é a famosa do Instagram e divide opiniões; a barraca do Albert Cuyp na quarta faz melhor e mais barato. No NDSM, o café-restaurante <b>Pllek<\/b>, feito de contêineres na beira do IJ, serve café e petisco das 9h30 à 1h. Com a ordem nova da terça, vocês chegam lá por volta das 17h30, na hora do pôr do sol sobre a água.<\/p>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar especial · ter 29/09, 18:30 · substitui o Pasta e Basta<\/h3>\n    <p class=\"when\">Já que o dia é do Jorge e o jantar era o especial, as três são o que Amsterdam tem de mais próprio: comida holandesa de casa, num salão com personalidade. Reservar hoje.<\/p>\n\n    <div class=\"opt pick\"><h4>Moeders <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rozengracht 251, na ponta oeste do Jordaan. Bonde 13/17 até Marnixstraat, ou 15 min a pé da Anne Frank.<\/span>\n        <b>Por quê<\/b><span>Comida holandesa como a de avó — o jantar com história para contar.<\/span>\n        <b>Estrela<\/b><span>Tábua holandesa (Hollandse rijsttafel: stamppot, hutspot, almôndega, chucrute); a sopa; o pudim.<\/span>\n        <b>Custo<\/b><span>€25–35.<\/span>\n        <b>Horário<\/b><span>Ter 17h–23h30. <b>Reservar: +31 20 626 7957.<\/b> Sem reserva a espera passa de 1 h. Levem uma foto impressa da mãe de cada um: eles penduram.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">“Mães”: as paredes são cobertas de fotos de mães que os próprios clientes trazem e deixam penduradas — a coleção já passa de mil retratos.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>The Pantry<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Leidsekruisstraat 21, perto do Leidseplein. Bonde 2/12 até Leidseplein.<\/span>\n        <b>Por quê<\/b><span>Salão minúsculo de madeira, menus fixos de 3 pratos holandeses por ~€32, nota 4,7 em quase 10 mil avaliações. Metade das mesas é reserva, metade fila.<\/span>\n        <b>Estrela<\/b><span>Menu 2: sopa, stamppot com salsicha defumada, poffertjes.<\/span>\n        <b>Custo<\/b><span>€28–35.<\/span>\n        <b>Horário<\/b><span>Ter 10h30–22h30. Reservar: +31 20 620 0922.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Loetje Centraal<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Stationsplein 10, na própria Centraal, mesa sobre a água.<\/span>\n        <b>Por quê<\/b><span>O bife holandês clássico com molho de manteiga e pão para molhar, a 2 min do trem para Zaandam. Era a alternativa do roteiro; continua valendo.<\/span>\n        <b>Estrela<\/b><span>Biefstuk Bali (com molho de amendoim picante) ou o “Ossenhaas met knoflook”; croquete de camarão.<\/span>\n        <b>Custo<\/b><span>€30–40.<\/span>\n        <b>Horário<\/b><span>10h–22h30. +31 20 623 3777.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · qua 30/09, 12:00 · Albert Cuyp<\/h3>\n    <p class=\"when\">Quarta é dia normal de feira (seg–sáb). A regra: comer de barraca em barraca. As alternativas são para sentar.<\/p>\n\n    <div class=\"opt pick\"><h4>As barracas do mercado <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Albert Cuypstraat, 1 km de feira. Saída do metrô De Pijp.<\/span>\n        <b>Por quê<\/b><span>É a refeição-degustação da Holanda inteira em 300 m: haring cru com cebola e picles (segure pelo rabo), kibbeling (bacalhau frito com molho de alho), poffertjes, stroopwafel saído da chapa, queijo de cunha.<\/span>\n        <b>Estrela<\/b><span>Haring “Hollandse Nieuwe” e kibbeling.<\/span>\n        <b>Custo<\/b><span>€12–18 comendo de tudo.<\/span>\n        <b>Horário<\/b><span>9h30–17h. Barracas aceitam cartão; algumas só dinheiro.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>The Butcher<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Albert Cuypstraat 129, dentro da feira.<\/span>\n        <b>Por quê<\/b><span>A hamburgueria original de Amsterdam, carne Angus maturada, decoração de açougue. Bar secreto atrás da geladeira.<\/span>\n        <b>Estrela<\/b><span>Truffle burger; Cowboy.<\/span>\n        <b>Custo<\/b><span>€15–20.<\/span>\n        <b>Horário<\/b><span>11h30–23h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>The Bazar<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Albert Cuypstraat 182, uma antiga igreja.<\/span>\n        <b>Por quê<\/b><span>Turco e marroquino num salão de igreja coberto de lanternas; prato do dia por menos de €10; todo mundo de De Pijp almoça aqui.<\/span>\n        <b>Estrela<\/b><span>Pilic sis (espetinho de frango); tábua de doces com chá.<\/span>\n        <b>Custo<\/b><span>€10–18.<\/span>\n        <b>Horário<\/b><span>Não confirmado para quarta: conferir no Maps na hora.<\/span>\n      <\/div><\/div>\n\n    <div class=\"note\">Para o trem das 16h (5h43 até Berlim): comprar na feira um saco de stroopwafel, queijo e fruta, e no Albert Heijn da Centraal água e sanduíche. O bar do ICE existe, mas é caro e acaba.<\/div>\n  <\/div>\n<\/section>\n\n<!-- ====================== COFFEE SHOPS ====================== -->\n<section id=\"coffeeshops\">\n  <h2>Coffee shops<\/h2>\n  <p class=\"lead\">Os <a class=\"gl\" href=\"#g-coffeeshop\">coffeeshops<\/a> são licenciados pela prefeitura: compra e consumo de cannabis dentro deles é tolerado por lei, para maiores de 18, até 5 g por pessoa por dia. Fora deles, não: comprar na rua é ilegal e é golpe, e fumar na rua no Red Light e no centro dá multa de €100.<\/p>\n\n  <h3>Como funciona<\/h3>\n  <ol class=\"steps\">\n    <li><b>Passaporte na mão.<\/b> Pedem documento na porta ou no balcão, mesmo para quem tem 40 anos.<\/li>\n    <li><b>O cardápio fica no balcão<\/b>, às vezes numa pasta, às vezes em tela. Divide-se em flor (wiet), haxixe (hasj), pré-enrolados (joints) e comestíveis (space cake, brownies). Diga o que procura em inglês; o atendente (“budtender”) explica.<\/li>\n    <li><b>“Pure” é sem tabaco.<\/b> Os pré-enrolados holandeses tradicionais vêm misturados com tabaco; os “pure” não. Pedir sempre “pure joint” se não fumam tabaco.<\/li>\n    <li><b>Álcool não é servido<\/b> em coffeeshop, por lei. Café, chá, suco e milkshake sim, e é educado consumir algo se ficar sentado.<\/li>\n    <li><b>Comestíveis demoram 1–2 h para fazer efeito e duram horas.<\/b> As avaliações de todas as lojas abaixo têm relatos de gente que comeu o bolo inteiro esperando efeito rápido. Meio ou um quarto, e esperar. Não combinar com a Anne Frank às 19:15 nem com o trem das 16h de quarta.<\/li>\n    <li><b>Não misturar com álcool<\/b> e não pedalar depois: os holandeses multam e, mais importante, as ciclovias não perdoam.<\/li>\n    <li><b>Cartão funciona<\/b> na maioria; alguns são só dinheiro. Preços: pré-enrolado €5–10; 1 g €10–16; comestível €6–10.<\/li>\n  <\/ol>\n\n  <h3>Os que valem a visita<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Loja<\/th><th>Onde · quando cai no roteiro<\/th><th>Por quê<\/th><\/tr>\n    <tr><td><b>Grey Area<\/b><\/td><td>Oude Leliestraat 2, Jordaan · seg, a 3 min do ’t Smalle · 11h–20h<\/td><td>Minúsculo, dono americano, cultuado por quem entende: qualidade e atendimento que ensinam. Sem banheiro, poucos lugares.<\/td><\/tr>\n    <tr><td><b>Paradox<\/b><\/td><td>Eerste Bloemdwarsstraat 2, Jordaan · seg, 2 min do ’t Smalle · 11h–20h<\/td><td>Calmo, cara de café de bairro, atendente que explica o que fazer e o que não fazer. O space cake é forte: a advertência acima vale aqui.<\/td><\/tr>\n    <tr><td><b>Boerejongens Centrum<\/b><\/td><td>Utrechtsestraat 21 · seg à noite, a 3 min da Magere Brug · 7h–0h45<\/td><td>Balcão que parece farmácia, atendentes de jaleco, pré-enrolados pure bem feitos, e os comestíveis mais fortes da cidade (red velvet). Abre cedo e fecha tarde.<\/td><\/tr>\n    <tr><td><b>Dampkring<\/b><\/td><td>Handboogstraat 29 · ter, ao lado do Vleminckx · 10h–1h<\/td><td>O cenário de Ocean’s Twelve, interior de madeira esculpida, milkshakes. Atendimento oscila; é a visita pela casa.<\/td><\/tr>\n    <tr><td><b>Katsu<\/b><\/td><td>Eerste van der Helststraat 70, De Pijp · qua, 2 min do Albert Cuyp · 10h–0h<\/td><td>Galeria de arte com coffeeshop dentro, mesas de jogo, o de bairro de De Pijp. Encaixa no “coffee shop opcional das 13:30” de quarta, com a ressalva do trem.<\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Amsterdam<\/h2>\n  <p class=\"lead\">Aqui as compras cabem no roteiro sem desvio: Tony’s e Wynand Fockink ficam entre a Centraal e o Dam (segunda de manhã); a Kaaskamer no caminho do Rijksmuseum ao Jordaan (segunda à tarde); a feira do Albert Cuyp na quarta.<\/p>\n\n  <div class=\"warn\">Três alertas. <b>Bulbos de tulipa não entram no Brasil<\/b> sem certificado fitossanitário: as barracas do Bloemenmarkt vendem “certified for USA/Canada”, não para o Brasil; a Receita apreende. <b>Líquidos acima de 100 ml não voam<\/b> no BER→LIS de mala de mão: jenever só em miniatura. <b>Queijo<\/b> passa (é alimento processado), a vácuo, e pesa: 500 g por cunha.<\/div>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O quê<\/th><th>Por quê<\/th><th>Onde (na rota)<\/th><th>Preço<\/th><\/tr>\n    <tr><td>Stroopwafels<\/td><td>O biscoito nacional. Na lata é presente; no pacote do Albert Heijn é o mesmo biscoito por um quarto do preço.<\/td><td>Feira do Albert Cuyp (qua): fresco, embalado na hora. Lata: Van Wonderen (Kalverstraat). Pacote: qualquer AH.<\/td><td>€3–12<\/td><\/tr>\n    <tr><td>Queijo a vácuo<\/td><td>Gouda velho (oude), com cominho (komijn) ou trufa. A Kaaskamer embala para viagem e deixa provar tudo.<\/td><td>De Kaaskamer, Runstraat 7 (seg 12h–18h, na rota Rijksmuseum → Jordaan). Ou a queijaria da Zaanse Schans (ter).<\/td><td>€8–15 a cunha<\/td><\/tr>\n    <tr><td>Chocolate Tony’s Chocolonely<\/td><td>Marca holandesa de comércio justo, barras desiguais de propósito; na Superstore vocês montam a própria barra com embalagem personalizada (leva 1h30 para ficar pronta).<\/td><td>Tony’s Superstore, Oudebrugsteeg 15, 3 min da Centraal, 10h–19h. Fecha 19h: encomendar a barra na terça às 14h45 (a caminho do ferry) e buscar na quarta às 15h, antes do trem.<\/td><td>€4–11<\/td><\/tr>\n    <tr><td>Casinhas de Delft<\/td><td>As miniaturas de casas de canal em azul e branco, as mesmas que a KLM dá na classe executiva.<\/td><td>Heinen Delftware, Prinsengracht 440 (na Spiegelstraat, 10h–18h); a loja embrulha uma por uma.<\/td><td>€10–30<\/td><\/tr>\n    <tr><td>Drop (alcaçuz)<\/td><td>O doce que os holandeses comem 2 kg por ano e o resto do mundo detesta: salgado, doce, duro, macio. Ótimo presente-provocação.<\/td><td>Het Oud-Hollandsch Snoepwinkeltje, Jordaan (só ter–sáb 11h–17h, só dinheiro: fora da rota de segunda). Na prática: prateleira do Albert Heijn.<\/td><td>€2–6<\/td><\/tr>\n    <tr><td>Jenever em miniatura<\/td><td>O “gin” original holandês, de 1679, em garrafinha de cerâmica ou 50 ml.<\/td><td>Wynand Fockink, Pijlsteeg 31, viela atrás do Dam, 14h–21h (segunda à noite no caminho do Red Light).<\/td><td>€5–12<\/td><\/tr>\n    <tr><td>Tamancos e pequenos moinhos<\/td><td>O clichê, mas feito na hora.<\/td><td>Fábrica de tamancos da Zaanse Schans (ter): demonstração grátis, os pintados custam mais.<\/td><td>€10–40<\/td><\/tr>\n    <tr><td>Hagelslag<\/td><td>Granulado de chocolate que os holandeses comem no pão de manhã. Caixa de €2, presente que explica um país.<\/td><td>Albert Heijn.<\/td><td>€2–3<\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que só existem aqui<\/h2>\n\n  <div class=\"shop\"><b>Tony’s Chocolonely Superstore<\/b><small>Oudebrugsteeg 15, ao lado do Damrak · todos os dias 10h–19h<\/small>\n    <p>Loja-fábrica com a “parede de chocolate”, a linha do tempo da marca contra o trabalho escravo no cacau, e a bancada de montar a própria barra. Fila que anda. A ver a caminho do Dam na segunda.<\/p><\/div>\n\n  <div class=\"shop\"><b>Wynand Fockink<\/b><small>Pijlsteeg 31, viela atrás do Dam · todos os dias 14h–21h<\/small>\n    <p>O barman serve o copinho cheio até a borda; você se curva para o primeiro gole, sem tocar no copo. Dois euros a dose. Segunda à noite, antes do Red Light.<\/p>\n    <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Sala de degustação de 1679, do tamanho de uma cozinha — uma das destilarias mais antigas da Holanda ainda em atividade no mesmo endereço.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>De Kaaskamer<\/b><small>Runstraat 7, Nove Ruas · seg 12h–18h<\/small>\n    <p>Trezentos queijos empilhados até o teto, funcionários que insistem em dar mais uma prova, e o melhor tosti de queijo da cidade para comer na porta.<\/p><\/div>\n\n  <div class=\"shop\"><b>Puccini Bomboni<\/b><small>Staalstraat 17 · seg 11h–19h<\/small>\n    <p>Bombons enormes feitos na cozinha ao lado, sabores como limoncello, amaretto e pimenta. Fica na Staalstraat, a rua bonita entre o Spui e o Waterlooplein: 10 min de desvio do Bloemenmarkt.<\/p><\/div>\n\n  <div class=\"shop\"><b>Heinen Delftware<\/b><small>Prinsengracht 440, Spiegelkwartier · 10h–18h<\/small>\n    <p>Porcelana de Delft, das casinhas de €10 ao prato pintado à mão. Na Spiegelstraat, a rua dos antiquários, 2 min do Rijksmuseum.<\/p><\/div>\n\n  <div class=\"shop\"><b>HEMA<\/b><small>várias: Nieuwendijk 174, perto do Dam · até 20h<\/small>\n    <p>A loja de departamentos barata que todo holandês usa: design simples, papelaria, Miffy oficial por metade do preço das lojas de souvenir, e o tompouce (o doce rosa) no café.<\/p><\/div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">Seg manhã: Tony’s<\/span>\n    <span class=\"chip\">Seg tarde: Kaaskamer · Heinen<\/span>\n    <span class=\"chip\">Seg noite: Wynand Fockink<\/span>\n    <span class=\"chip\">Ter: tamancos e queijo na Zaanse Schans<\/span>\n    <span class=\"chip\">Qua: feira do Albert Cuyp<\/span>\n  <\/div>\n<\/section>\n\n\n<\/div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"amsterdam-1\": [{\"t\": \"A pé · Centraal → Dam\", \"d\": \"~10 min, pela Damrak.\"}, {\"t\": \"A pé · Dam → Begijnhof\", \"d\": \"~5 min.\"}, {\"t\": \"A pé · Begijnhof → Bloemenmarkt\", \"d\": \"~5 min.\"}, {\"t\": \"Bonde 2 ou 12 · Bloemenmarkt → Van Gogh\", \"d\": \"Parada Koningsplein → Rijksmuseum, ~10 min. Check-in GVB no bonde.\"}, {\"t\": \"A pé · Van Gogh → Vondelpark\", \"d\": \"~5 min. Piquenique no Albert Heijn da Van Baerlestraat.\"}, {\"t\": \"A pé · Vondelpark → Jordaan ('t Smalle)\", \"d\": \"~20 min. Borrel no bruin café ao chegar.\"}, {\"t\": \"A pé · Jordaan → Anne Frank\", \"d\": \"~5 min. Horário reservado: 19:15.\"}, {\"t\": \"A pé · Anne Frank/Red Light → Magere Brug\", \"d\": \"Parte da volta noturna pelo centro.\"}, {\"t\": \"A pé + trem NS · Red Light → Centraal → Zaandam\", \"d\": \"~10 min a pé até a estação + trem. Check-in e check-out NS.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">×<\/button><span class=\"num\">'+n+'<\/span><h4>'+item.t+'<\/h4><p>'+item.d+'<\/p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var zoropaUtterance = null;\n  function zoropaSpeak(text, lang, btn){\n    var w = window;\n    try{ if (window.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador não suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '🔈'; };\n      u.onend = function(){ btn.textContent = '🔊'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '🔊';\n      alert('Não consegui tocar o áudio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n
