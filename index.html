w.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador n\u00e3o suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '\ud83d\udd08'; };\n      u.onend = function(){ btn.textContent = '\ud83d\udd0a'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '\ud83d\udd0a';\n      alert('N\u00e3o consegui tocar o \u00e1udio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n})();\n<\\/script>\n</body>\n</html>\n";
const HTML_PARIS = "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>zoropa \u00b7 Paris \u2014 guia de bolso</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,600;9..144,700,100&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#FFFFFF; --ink:#101828; --muted:#5B6472; --line:#DCE1E8;\n  --azul:#1F4D3A; --azul-esc:#12301F; --azul-tint:#E8F1EB;\n  --amarelo:#D9A21B; --amarelo-tint:#F7EDD0;\n  --ok:#1B7F4C; --ok-tint:#E4F5EA; --alerta:#B54708; --alerta-tint:#FDF0E1;\n  --card:#F7F8FA;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;\n    --azul:#7FC8A0; --azul-esc:#B9E3CC; --azul-tint:#17302A;\n    --amarelo:#D9A21B; --amarelo-tint:#3A2E10;\n    --ok:#6CCB92; --ok-tint:#13301F; --alerta:#F0A25A; --alerta-tint:#3A2510;\n    --card:#141F33;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;\n  --azul:#7FC8A0; --azul-esc:#B9E3CC; --azul-tint:#17302A;\n  --amarelo:#D9A21B; --amarelo-tint:#3A2E10;\n  --ok:#6CCB92; --ok-tint:#13301F; --alerta:#F0A25A; --alerta-tint:#3A2510;\n  --card:#141F33;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Public Sans\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{font-family:\"Fraunces\",\"Georgia\",serif;font-variation-settings:\"SOFT\" 100;line-height:1.15;margin:0}\nh1{font-size:2.4rem;font-weight:700;letter-spacing:-.01em}\nh2{font-size:1.7rem;font-weight:600;margin:0 0 .4rem}\nh3{font-size:1.2rem;font-weight:600;margin:1.4rem 0 .5rem}\nh4{font-size:1.02rem;font-weight:600;font-family:\"Public Sans\",sans-serif;margin:0 0 .25rem}\np{margin:.5rem 0}\na{color:var(--azul);text-decoration-thickness:1px;text-underline-offset:2px}\na:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}\n.wrap{max-width:720px;margin:0 auto;padding:0 18px 4rem}\n\n/* header: azulejo band */\nheader{background:var(--azul);color:#fff;padding:1.4rem 0 1.2rem;\n  background-image:\n    linear-gradient(45deg, rgba(255,255,255,.08) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.08) 75%),\n    linear-gradient(45deg, rgba(255,255,255,.08) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.08) 75%);\n  background-size:28px 28px;background-position:0 0,14px 14px}\nheader .wrap{padding-bottom:0}\nheader .kicker{font-size:.95rem;opacity:.9;margin:0 0 .3rem}\nheader h1{color:#fff}\nheader p.sub{margin:.6rem 0 0;max-width:36ch;opacity:.95}\nnav.jump{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}\nnav.jump .wrap{padding:0 18px}\nnav.jump a{display:inline-block;padding:.7rem .7rem .6rem 0;margin-right:.6rem;font-size:.92rem;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:3px solid transparent}\nnav.jump a:hover{border-bottom-color:var(--amarelo)}\n\nsection{padding-top:2.2rem}\n.lead{color:var(--muted);max-width:60ch}\n\n/* steps */\nol.steps{list-style:none;padding:0;margin:.8rem 0 0;counter-reset:s}\nol.steps li{position:relative;padding:0 0 1rem 2.6rem;counter-increment:s}\nol.steps li::before{content:counter(s);position:absolute;left:0;top:.05rem;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--amarelo);color:#1a1a1a;font-weight:700;display:grid;place-items:center;font-size:.9rem}\nol.steps li::after{content:\"\";position:absolute;left:.85rem;top:2rem;bottom:0;border-left:2px dotted var(--line)}\nol.steps li:last-child::after{display:none}\nol.steps b{display:block}\n\n/* glossary */\ndl.gloss{margin:.6rem 0 0;padding:0;border-top:1px solid var(--line)}\ndl.gloss div{display:grid;grid-template-columns:7.5rem 1fr;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}\ndl.gloss dt{font-weight:700;color:var(--azul)}\ndl.gloss dd{margin:0}\n\n/* apps */\n.apps{display:grid;gap:.6rem;margin-top:.6rem}\n.app{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;padding:.75rem .9rem;background:var(--card);border-left:4px solid var(--azul)}\n.app .ic{font-size:1.4rem;line-height:1}\n.app b{display:block}\n.app span{color:var(--muted);font-size:.95rem}\n\n/* tables */\ntable{width:100%;border-collapse:collapse;font-size:.95rem;margin:.6rem 0}\nth,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-weight:700;color:var(--azul)}\n.scroll{overflow-x:auto}\n\n/* callouts */\n.note{padding:.8rem 1rem;border-left:4px solid var(--amarelo);background:var(--amarelo-tint);margin:.8rem 0}\n.warn{padding:.8rem 1rem;border-left:4px solid var(--alerta);background:var(--alerta-tint);margin:.8rem 0}\n.ok{padding:.8rem 1rem;border-left:4px solid var(--ok);background:var(--ok-tint);margin:.8rem 0}\n\n/* maps */\nfigure{margin:1rem 0}\nfigure svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line)}\nfigcaption{font-size:.9rem;color:var(--muted);margin-top:.4rem}\n.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-size:.88rem;color:var(--muted);margin-top:.4rem}\n.legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;vertical-align:-2px;margin-right:.3rem}\n\n/* food options */\n.meal{margin:1.6rem 0 0}\n.meal .when{font-size:.92rem;color:var(--muted)}\n.opt{margin:.7rem 0 0;padding:.9rem 1rem;background:var(--card);border-top:3px solid var(--azul)}\n.opt.pick{border-top-color:var(--amarelo)}\n.opt .tag{display:inline-block;font-size:.78rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;background:var(--amarelo);color:#1a1a1a;margin-left:.4rem;vertical-align:middle}\n.opt h4{font-size:1.05rem}\n.opt .grid{display:grid;grid-template-columns:5.6rem 1fr;gap:.25rem .6rem;font-size:.95rem;margin-top:.4rem}\n.opt .grid b{color:var(--muted);font-weight:600}\n.opt .grid span{min-width:0}\n\n/* shops */\n.shop{padding:.8rem 0;border-bottom:1px solid var(--line)}\n.shop b{display:block}\n.shop small{color:var(--muted)}\n.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}\n.chip{font-size:.88rem;padding:.25rem .65rem;border:1px solid var(--line);border-radius:999px;background:var(--card)}\n\ndetails{border:1px solid var(--line);margin:.6rem 0;background:var(--card)}\nsummary{cursor:pointer;padding:.7rem .9rem;font-weight:700;list-style:none}\nsummary::-webkit-details-marker{display:none}\nsummary::before{content:\"+\";display:inline-block;width:1.2rem;color:var(--azul);font-weight:700}\ndetails[open] summary::before{content:\"\u2013\"}\ndetails .in{padding:0 .9rem .9rem}\n\n/* curiosidades: post-it dobrado */\n.curio{margin:.6rem 0 0;border:none;background:none}\n.curio summary{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;list-style:none;font-size:.85rem;font-weight:700;color:var(--azul-esc);padding:.35rem .7rem;background:var(--amarelo-tint);border:1px solid var(--amarelo);border-radius:2px;position:relative;box-shadow:1px 2px 3px rgba(0,0,0,.1)}\n.curio summary::-webkit-details-marker{display:none}\n.curio summary::after{content:\"\";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 9px 9px;border-color:transparent transparent var(--bg) transparent}\n.curio[open] summary{border-radius:2px 2px 0 0}\n.curio .in{padding:.65rem .85rem;background:var(--amarelo-tint);border:1px solid var(--amarelo);border-top:none;font-size:.92rem;margin-top:-1px}\n\nfooter{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}\n@media (max-width:420px){\n  h1{font-size:2rem}\n  dl.gloss div{grid-template-columns:6.2rem 1fr}\n  .opt .grid{grid-template-columns:5rem 1fr}\n}\n.say{display:inline-flex;align-items:center;gap:.25rem}\n.say-btn{border:0;background:none;padding:0 .15rem;font-size:.95em;cursor:pointer;line-height:1}\n.phrases{list-style:none;padding:0;margin:.4rem 0 0}\n.phrases li{padding:.35rem 0;border-bottom:1px dashed var(--line);font-size:.92rem}\n.phrases li:last-child{border-bottom:none}\n.pend{list-style:none;padding:0;margin:.4rem 0 1rem}\n.pend li{padding:.5rem 0;border-bottom:1px dashed var(--line);font-size:.92rem;line-height:1.45}\n.pend li:last-child{border-bottom:none}\n.pend label{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}\n.pend input[type=checkbox]{width:1.15rem;height:1.15rem;margin:.15rem 0 0;flex:none;accent-color:var(--azul)}\n.pend label{flex-wrap:wrap}\n.pend label > .pend-what{flex:1 1 auto}\n.pend input:checked ~ .pend-what{text-decoration:line-through;color:var(--muted)}\n.pend input:disabled{opacity:.5}\n.pend-what{font-weight:600}\n.pend-when{display:block;flex-basis:100%;font-size:.82rem;color:var(--azul-esc);margin:.1rem 0 0 1.7rem}\n.pend-how{display:block;flex-basis:100%;font-size:.82rem;color:var(--muted);margin-left:1.7rem}\n.docs .pend-when,.docs .pend-how{margin-left:0}\n.pend-links{display:block;margin-top:.15rem;font-size:.88rem}\n.pend-links a{color:var(--azul);text-decoration:none;font-weight:600}\n.pend-bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.2rem 0 .4rem;font-size:.85rem;color:var(--muted)}\n.pend-lock{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:.8rem;border-radius:999px;padding:.25rem .7rem;cursor:pointer}\n.pend-leave{display:block;font-size:.82rem;color:var(--ok,#1B7F4C);font-weight:600;margin-top:.15rem}\n</style>\n<style>\nheader{background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 14px);background-size:auto}\n.m{font-family:\"Public Sans\",system-ui,sans-serif;font-size:10.5px;fill:var(--ink)}\n.ms{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;fill:var(--muted)}\n.mh{font-family:\"Fraunces\",Georgia,serif;font-size:13px;font-weight:600;fill:var(--azul)}\n.mg{font-family:\"Fraunces\",Georgia,serif;font-size:11px;font-style:italic;fill:var(--muted);opacity:.7}\n.water{fill:var(--azul-tint)}\n.hill{fill:var(--line);opacity:.35}\n.street{stroke:var(--line);stroke-width:5;fill:none;stroke-linecap:round}\n.walk{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:3 4;stroke-linecap:round}\n.metro{stroke:var(--amarelo);stroke-width:4;fill:none;stroke-linecap:round}\n.taxi{stroke:var(--azul);stroke-width:2.5;fill:none;stroke-linecap:round}\n.pt{fill:var(--azul);stroke:var(--bg);stroke-width:1.5}\n.eat{fill:var(--amarelo);stroke:var(--ink);stroke-width:1.2}\n.shop{fill:var(--bg);stroke:var(--azul);stroke-width:2}\n.bed{fill:var(--ok);stroke:var(--bg);stroke-width:1.5}\n</style>\n<style>\n/* ---- rotas numeradas (injetado) ---- */\n.r-path{cursor:pointer}\n.r-hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:16px;cursor:pointer}\n.r-badge{cursor:pointer}\n.r-badge circle{stroke:var(--bg);stroke-width:1.6px}\n.r-badge text{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}\n.r-badge circle{stroke-dasharray:none}\n.r-badge text{stroke:none;stroke-dasharray:none}\n.r-badge.walk{stroke-dasharray:none}\n.r-badge.walk circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}\n.r-badge.walk text{fill:var(--ink)}\n.r-badge.transit circle{fill:var(--amarelo)}\n.r-badge.transit text{fill:#1a1a1a}\n.r-badge.taxi circle{fill:var(--azul)}\n.r-badge.taxi text{fill:#fff}\n.r-path.is-active,.r-hit.is-active + .r-path{stroke-width:5px !important}\n.r-badge.is-active circle{stroke:var(--amarelo);stroke-width:3px}\n.rota-painel{display:none;margin:.6rem 0 1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:2px;position:relative}\n.rota-painel.show{display:block}\n.rota-painel .num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;font-size:.85rem;margin-right:.5rem;vertical-align:middle}\n.rota-painel h4{display:inline;font-family:\"Public Sans\",sans-serif;font-size:1rem;font-weight:700}\n.rota-painel p{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}\n.rota-painel .fechar{position:absolute;top:.5rem;right:.6rem;background:none;border:0;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:.3rem}\n.mapa-dica{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <p class=\"kicker\">zoropa 2026 \u00b7 bloco 2 de 5</p>\n    <h1>Paris</h1>\n    <p class=\"sub\">Sexta 25/09 (chegada, Catacumbas) \u00b7 s\u00e1bado 26/09 (Versalhes, Montmartre) \u00b7 domingo 27/09 (Louvre, Notre-Dame, Eurostar \u00e0s 20:22).</p>\n  </div>\n</header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pend\u00eancias</a>\n  <a href=\"#transporte\">Transporte</a>\n  <a href=\"#mapas\">Mapas</a>\n  <a href=\"#comer\">Onde comer</a>\n  <a href=\"#glossario\">Gloss\u00e1rio</a>\n  <a href=\"#lembrancas\">Lembrancinhas</a>\n  <a href=\"#lojas\">Lojas</a>\n</div></nav>\n\n<div class=\"wrap\">\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pend\u00eancias e reservas</h2>\n  <div class=\"note\"><b>Lista compartilhada:</b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccb abrir a planilha \"Pend\u00eancias zoropa 2026\"</a> \u2014 \u00e9 a vers\u00e3o oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe t\u00eam edi\u00e7\u00e3o). As caixinhas abaixo s\u00e3o s\u00f3 um espelho r\u00e1pido neste aparelho.</div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"></span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">\ud83d\udd13 travar lista</button></div>\n  <h3>O que ainda falta</h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"paris-0\"> <span class=\"pend-what\">Catacumbas: ingresso com hor\u00e1rio (esgota; s\u00f3 online)</span> <span class=\"pend-when\">para sex 25/09 \u00e0 tarde \u00b7 comprar agora</span> <span class=\"pend-how\">catacombes.paris.fr</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-1\"> <span class=\"pend-what\">Versalhes: ingresso \"Passeport\" com hor\u00e1rio</span> <span class=\"pend-when\">para s\u00e1b 26/09 de manh\u00e3 \u00b7 comprar agora</span> <span class=\"pend-how\">chateauversailles.fr</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-2\"> <span class=\"pend-what\">App \u00cele-de-France Mobilit\u00e9s: conta criada e 10 bilhetes por pessoa</span> <span class=\"pend-when\">at\u00e9 qua 23/09</span> <span class=\"pend-how\">se o cart\u00e3o recusar: Navigo Easy na chegada</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-3\"> <span class=\"pend-what\">Citymapper instalado + mapa offline de Paris</span> <span class=\"pend-when\">at\u00e9 qua 23/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-4\"> <span class=\"pend-what\">Avisar o apartamento da hora de chegada (~15h)</span> <span class=\"pend-when\">at\u00e9 qui 24/09</span> <span class=\"pend-how\">+33 6 61 09 60 11</span></label></li>\n  </ul>\n  <h3>Reservas e documentos</h3>\n  <p class=\"lead\">Os PDFs est\u00e3o no Drive da conta bexorxe (privados: quem n\u00e3o estiver logado nela v\u00ea \"pedir acesso\"). \ud83d\udccd abre o lugar no Maps.</p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">Trocad\u00e9ro Studio \u00b7 9 bis Rue de Magdebourg, 16e</span> <span class=\"pend-when\">sex 25/09 check-in 14\u201323h \u00b7 check-out dom 27/09 at\u00e9 11h</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1B-7ggPM5NdWeXZcVnqGGEuBWk_L3IH7o/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 reserva</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=9%20bis%20Rue%20de%20Magdebourg%2C%2075116%20Paris\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Louvre \u00b7 entrada pela Pir\u00e2mide</span> <span class=\"pend-when\">dom 27/09 09:00 \u00b7 nominal, passaporte na m\u00e3o</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1M0l5-InJcWhUmMfcaaYj3zbTa-WRvV-r/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 ingressos</a> \u00b7 <a href=\"https://drive.google.com/file/d/1EqXMUinFdvFSDxtmE4eP5WeWWGjf3AxM/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 \u00e1udio-guia 1</a> \u00b7 <a href=\"https://drive.google.com/file/d/1ZlfQAPd5thmb54gOBwxeRzsE1pZJaGQI/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 \u00e1udio-guia 2</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Pyramide%20du%20Louvre%2C%20Paris\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Eurostar 9387 \u00b7 Gare du Nord \u2192 Amsterdam Centraal</span> <span class=\"pend-when\">dom 27/09 20:22 \u2192 23:50 \u00b7 chegar 19:52 \u00b7 carro 18, lugares 91/92</span> <span class=\"pend-leave\">\ud83d\udd50 sa\u00edda sugerida de Ch\u00e2telet\u2013Les Halles: 18:45 (RER B ou D, 1 parada, 5 min) \u2014 ou Uber ~25 min se estiverem mais longe</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/17Qr2icmqLoRJDHkYzJzCxlgyw9qjyOvv/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 bilhetes</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Gare%20du%20Nord%2C%20Paris\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n  </ul>\n</section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar</h2>\n  <p class=\"lead\">Paris mudou tudo em 2025\u20132026: acabou o bilhete de papel, acabaram as zonas. Hoje existe <b>um pre\u00e7o \u00fanico de \u20ac2,55</b> para metr\u00f4, RER e trem em toda a regi\u00e3o, inclusive Versalhes, carregado num cart\u00e3o de \u20ac2 ou no pr\u00f3prio celular. Isso simplifica muito o que voc\u00eas precisam fazer.</p>\n\n  <div class=\"note\"><b>A conta do que voc\u00eas v\u00e3o usar:</b> 2 viagens na sexta, 4 no s\u00e1bado, 2 no domingo = 8 por pessoa = \u20ac20,40. O passe di\u00e1rio (\u20ac12,30) nunca compensa, porque nenhum dia passa de 4 viagens. T\u00e1xi de Orly em vez de metr\u00f4: com mala, cansa\u00e7o e um trajeto de 60 min com baldea\u00e7\u00e3o, o t\u00e1xi de tarifa fixa vale os \u20ac44.</div>\n\n  <h3>Antes de sair do Brasil</h3>\n  <ol class=\"steps\">\n    <li><b>Instale o app \u00cele-de-France Mobilit\u00e9s</b> (\u00e9 o oficial) e crie uma conta. Ele faz duas coisas: vende o bilhete e vira o bilhete, encostando o celular na catraca. Funciona em iPhone e Android com NFC.</li>\n    <li><b>Tente comprar 1 bilhete M\u00e9tro-Train-RER pelo app ainda em Bras\u00edlia.</b> Se a compra passar, comprem 10 cada um (8 previstos + 2 de folga) e o assunto est\u00e1 resolvido antes de pousar. Se o cart\u00e3o brasileiro for recusado, o plano B \u00e9 o cart\u00e3o f\u00edsico Navigo Easy no passo 5.</li>\n    <li><b>Instale o Citymapper.</b> \u00c9 o melhor para \"como vou daqui at\u00e9 ali agora\", com os avisos de obra de fim de semana. O Google Maps tamb\u00e9m funciona em Paris, mas erra mais nas obras.</li>\n    <li><b>Baixe o mapa offline de Paris</b> no Google Maps, como em Lisboa. As esta\u00e7\u00f5es de metr\u00f4 n\u00e3o t\u00eam sinal em muitos trechos.</li>\n  </ol>\n\n  <h3>Chegada em Orly, sex 25/09, 13:10</h3>\n  <ol class=\"steps\">\n    <li><b>Siga as placas \"Taxis\".</b> A fila oficial fica na sa\u00edda do terminal. Ignore quem oferecer \"taxi?\" dentro do terminal: \u00e9 irregular e cobra o triplo.</li>\n    <li><b>Tarifa fixa Orly \u2192 margem direita de Paris: ~\u20ac44</b> (o Trocad\u00e9ro \u00e9 margem direita). O valor est\u00e1 na placa dentro do carro; confirme antes de sair: \"forfait rive droite?\". Aceitam cart\u00e3o. 40 min.</li>\n    <li><b>Se preferirem o metr\u00f4:</b> linha 14 direto de Orly at\u00e9 Bercy (bilhete \"Paris R\u00e9gion \u2194 A\u00e9roports\", \u20ac14 cada, comprado \u00e0 parte no app ou na m\u00e1quina), depois linha 6 at\u00e9 Trocad\u00e9ro. 60 min, escadas com mala. N\u00e3o recomendo hoje.</li>\n    <li><b>Se ainda n\u00e3o t\u00eam bilhetes no celular:</b> na primeira esta\u00e7\u00e3o de metr\u00f4 que usarem (Bir-Hakeim, 17:30), na m\u00e1quina: idioma \u2192 \"Passe Navigo Easy\" (\u20ac2) \u2192 carregar \"Ticket M\u00e9tro-Train-RER\" \u00d710. Um cart\u00e3o por pessoa; dois n\u00e3o podem passar com o mesmo cart\u00e3o na mesma catraca. A m\u00e1quina aceita cart\u00e3o banc\u00e1rio com chip.</li>\n  </ol>\n\n  <h3>Como funciona na pr\u00e1tica</h3>\n  <ol class=\"steps\">\n    <li><b>Entrar:</b> encoste o celular ou o Navigo Easy no leitor roxo da catraca. Um bilhete \u00e9 descontado.</li>\n    <li><b>Baldea\u00e7\u00e3o (correspondance):</b> dentro da esta\u00e7\u00e3o, sem sair, n\u00e3o gasta bilhete novo. Siga as placas laranja \"Correspondance\" com o n\u00famero da linha e o nome do fim da linha (\u00e9 assim que se sabe o sentido: \"direction Nation\", \"direction Charles de Gaulle\u2013\u00c9toile\").</li>\n    <li><b>Sair:</b> no metr\u00f4, empurre a porta. No RER, h\u00e1 catraca de sa\u00edda tamb\u00e9m: encoste de novo. Por isso o bilhete tem de ficar \"com voc\u00eas\" at\u00e9 a rua.</li>\n    <li><b>Fiscaliza\u00e7\u00e3o:</b> equipes param passageiros na sa\u00edda. Multa de \u20ac50+ sem bilhete v\u00e1lido. Com o app, mostre a tela; com o cart\u00e3o, eles leem.</li>\n    <li><b>\u00d4nibus:</b> \u00e9 outro bilhete (\u20ac2,05) e n\u00e3o vale a baldea\u00e7\u00e3o com o metr\u00f4. N\u00e3o usem \u00f4nibus neste roteiro.</li>\n    <li><b>Funicular de Montmartre:</b> conta como uma viagem de metr\u00f4, mesmo bilhete. Fica ao lado da esta\u00e7\u00e3o Anvers.</li>\n  </ol>\n\n  <h3>Trecho a trecho</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Quando</th><th>Trecho</th><th>Como</th><th>Tempo</th></tr>\n    <tr><td>sex 13:10</td><td>Orly \u2192 studio</td><td>t\u00e1xi tarifa fixa</td><td>40 min</td></tr>\n    <tr><td>sex 16:30</td><td>studio \u2192 Champ de Mars</td><td>a p\u00e9 pela Pont d'I\u00e9na</td><td>15 min</td></tr>\n    <tr><td>sex 17:30</td><td>Bir-Hakeim \u2192 Denfert-Rochereau</td><td>linha 6, dire\u00e7\u00e3o Nation, sem baldea\u00e7\u00e3o</td><td>20 min</td></tr>\n    <tr><td>sex 21:00</td><td>Denfert \u2192 Trocad\u00e9ro</td><td>linha 6, dire\u00e7\u00e3o \u00c9toile</td><td>22 min</td></tr>\n    <tr><td>s\u00e1b 08:15</td><td>studio \u2192 est. Champ de Mars\u2013Tour Eiffel</td><td>a p\u00e9, 15 min</td><td></td></tr>\n    <tr><td>s\u00e1b 08:30</td><td>\u2192 Versailles Ch\u00e2teau Rive Gauche</td><td>RER C: confira no painel que o trem vai a \"Versailles Ch\u00e2teau\"; nem todos v\u00e3o</td><td>40 min</td></tr>\n    <tr><td>s\u00e1b 16:30</td><td>Versalhes \u2192 Champ de Mars</td><td>RER C sentido Paris</td><td>40 min</td></tr>\n    <tr><td>s\u00e1b 18:30</td><td>Trocad\u00e9ro \u2192 Anvers</td><td>linha 6 at\u00e9 \u00c9toile + linha 2 dire\u00e7\u00e3o Nation</td><td>35 min</td></tr>\n    <tr><td>s\u00e1b 22:00</td><td>Pigalle \u2192 Trocad\u00e9ro</td><td>linha 2 at\u00e9 \u00c9toile + linha 6</td><td>35 min</td></tr>\n    <tr><td>dom 08:05</td><td>Trocad\u00e9ro \u2192 Ch\u00e2telet, com malas</td><td>linha 6 at\u00e9 \u00c9toile + linha 1 dire\u00e7\u00e3o Vincennes. Escadas. Uber ~\u20ac22 \u00e9 a alternativa s\u00e3</td><td>25 min</td></tr>\n    <tr><td>dom 18:45</td><td>Ch\u00e2telet\u2013Les Halles \u2192 Gare du Nord</td><td>RER B ou D, sentido norte, 1 parada</td><td>5 min</td></tr>\n  </table></div>\n\n  <h3>Gare du Nord e o Eurostar</h3>\n  <ol class=\"steps\">\n    <li>O Eurostar para Amsterdam sai do <b>terminal pr\u00f3prio, no andar de cima</b> (placas \"Eurostar\"). N\u00e3o \u00e9 a plataforma dos trens normais.</li>\n    <li>H\u00e1 <b>raio-X de bagagem e leitura do bilhete</b>, como num aeroporto pequeno. O port\u00e3o fecha 30 min antes; o bilhete pede 19:52 para as 20:22, e \u00e9 isso mesmo. N\u00e3o h\u00e1 controle de passaporte (Fran\u00e7a\u2013Holanda \u00e9 Schengen).</li>\n    <li>Vag\u00e3o 18 fica numa das pontas: veja no painel de que lado do trem ele est\u00e1 e caminhe pela plataforma antes de embarcar.</li>\n    <li>Comida: h\u00e1 bar a bordo, caro. Melhor comprar antes (ver Onde comer, domingo \u00e0 noite).</li>\n  </ol>\n\n  <h3 id=\"glossario\">Gloss\u00e1rio</h3>\n  <dl class=\"gloss\">\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('M\u00e9tro','fr-FR',this)\" aria-label=\"Ouvir M\u00e9tro\">\ud83d\udd0a</button> M\u00e9tro</dt><dd>16 linhas numeradas. O sentido \u00e9 indicado pelo nome da \u00faltima esta\u00e7\u00e3o (\"direction Nation\").</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('RER','fr-FR',this)\" aria-label=\"Ouvir RER\">\ud83d\udd0a</button> RER</dt><dd>Trem expresso que cruza a cidade e vai para os sub\u00farbios (Versalhes, aeroportos). Letras A a E. Tem catraca na sa\u00edda.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Correspondance','fr-FR',this)\" aria-label=\"Ouvir Correspondance\">\ud83d\udd0a</button> Correspondance</dt><dd>Baldea\u00e7\u00e3o. Placa laranja. Dentro da esta\u00e7\u00e3o n\u00e3o gasta bilhete.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Sortie','fr-FR',this)\" aria-label=\"Ouvir Sortie\">\ud83d\udd0a</button> Sortie</dt><dd>Sa\u00edda. Placa azul, numerada; o Citymapper diz qual sortie usar.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Navigo Easy','fr-FR',this)\" aria-label=\"Ouvir Navigo Easy\">\ud83d\udd0a</button> Navigo Easy</dt><dd>Cart\u00e3o recarreg\u00e1vel de \u20ac2 onde se carregam os bilhetes. N\u00e3o tem nome, pode ser emprestado, n\u00e3o pode ser compartilhado na mesma viagem.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Ticket M\u00e9tro-Train-RER','fr-FR',this)\" aria-label=\"Ouvir Ticket M\u00e9tro-Train-RER\">\ud83d\udd0a</button> Ticket M\u00e9tro-Train-RER</dt><dd>O bilhete de \u20ac2,55. Vale em toda a regi\u00e3o menos nas esta\u00e7\u00f5es dos aeroportos.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Valider','fr-FR',this)\" aria-label=\"Ouvir Valider\">\ud83d\udd0a</button> Valider</dt><dd>Encostar o cart\u00e3o/celular no leitor. Sempre, na entrada e (no RER) na sa\u00edda.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Rive droite / gauche','fr-FR',this)\" aria-label=\"Ouvir Rive droite / gauche\">\ud83d\udd0a</button> Rive droite / gauche</dt><dd>Margem direita (norte do Sena: Trocad\u00e9ro, Louvre, Montmartre) e esquerda (sul: Catacumbas, Quartier Latin). Define a tarifa do t\u00e1xi do aeroporto.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Arrondissement','fr-FR',this)\" aria-label=\"Ouvir Arrondissement\">\ud83d\udd0a</button> Arrondissement</dt><dd>Os 20 bairros, numerados em espiral a partir do Louvre. O CEP termina com o n\u00famero: 75016 = 16\u00ba, o do studio.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Bouillon','fr-FR',this)\" aria-label=\"Ouvir Bouillon\">\ud83d\udd0a</button> Bouillon</dt><dd>Restaurante popular de comida francesa cl\u00e1ssica, barato e r\u00e1pido, tradi\u00e7\u00e3o de 1896. N\u00e3o aceita reserva.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Formule / menu','fr-FR',this)\" aria-label=\"Ouvir Formule / menu\">\ud83d\udd0a</button> Formule / menu</dt><dd>Combo de entrada + prato ou prato + sobremesa, sempre mais barato que \u00e0 la carte. No almo\u00e7o, quase todo bistr\u00f4 tem.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Carafe d\\'eau','fr-FR',this)\" aria-label=\"Ouvir Carafe d'eau\">\ud83d\udd0a</button> Carafe d'eau</dt><dd>Jarra de \u00e1gua da torneira, gr\u00e1tis por lei. Pe\u00e7a assim; \"eau\" solta vem garrafa a \u20ac5.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Service compris','fr-FR',this)\" aria-label=\"Ouvir Service compris\">\ud83d\udd0a</button> Service compris</dt><dd>Gorjeta j\u00e1 inclu\u00edda na conta, sempre. Deixar \u20ac1\u20132 em moeda \u00e9 gentileza, n\u00e3o obriga\u00e7\u00e3o.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('L\\'addition','fr-FR',this)\" aria-label=\"Ouvir L'addition\">\ud83d\udd0a</button> L'addition</dt><dd>A conta. O gar\u00e7om n\u00e3o traz sem pedir: \u00e9 considerado apressar o cliente.</dd></div>\n  </dl>\n\n  <h3>Como se fala</h3>\n  <div class=\"note\"><span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Ch\u00e2telet','fr-FR',this)\" aria-label=\"Ouvir Ch\u00e2telet\">\ud83d\udd0a</button> <b>Ch\u00e2telet</b> \u2014 <i>sha-t\u00ea-L\u00ca</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Arrondissement','fr-FR',this)\" aria-label=\"Ouvir Arrondissement\">\ud83d\udd0a</button> <b>Arrondissement</b> \u2014 <i>a-rr\u00f5(n)-diss-M\u00c3(N)</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Bouillon','fr-FR',this)\" aria-label=\"Ouvir Bouillon\">\ud83d\udd0a</button> <b>Bouillon</b> \u2014 <i>bu-i-I\u00d5(N)</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Carafe d\\'eau','fr-FR',this)\" aria-label=\"Ouvir Carafe d'eau\">\ud83d\udd0a</button> <b>Carafe d'eau</b> \u2014 <i>ca-RAF d\u00f4</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Sacr\u00e9-C\u0153ur','fr-FR',this)\" aria-label=\"Ouvir Sacr\u00e9-C\u0153ur\">\ud83d\udd0a</button> <b>Sacr\u00e9-C\u0153ur</b> \u2014 <i>sa-cr\u00ea C\u00caR</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Montmartre','fr-FR',this)\" aria-label=\"Ouvir Montmartre\">\ud83d\udd0a</button> <b>Montmartre</b> \u2014 <i>m\u00f5(n)-MAR-tr</i></span></div>\n\n  <h3>Frases \u00fateis</h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bonjour','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Bonjour</b> \u2014 <i>b\u00f5-JUR (bom dia / ol\u00e1, at\u00e9 o fim da tarde)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bonsoir','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Bonsoir</b> \u2014 <i>b\u00f5-SU\u00c1R (boa noite, ao chegar)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('S\\'il vous pla\u00eet','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>S'il vous pla\u00eet</b> \u2014 <i>sil vu PL\u00ca (por favor)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Merci beaucoup','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Merci beaucoup</b> \u2014 <i>mer-SI b\u00f4-CU (muito obrigada)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Excusez-moi','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Excusez-moi</b> \u2014 <i>eks-k\u00fc-Z\u00ca mu\u00e1 (com licen\u00e7a / desculpe)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Parlez-vous anglais ?','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Parlez-vous anglais ?</b> \u2014 <i>par-l\u00ea VU \u00e3-GL\u00ca (fala ingl\u00eas?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Je ne comprends pas','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Je ne comprends pas</b> \u2014 <i>je ne c\u00f5-PR\u00c3 pa (n\u00e3o entendo)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('O\u00f9 sont les toilettes ?','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>O\u00f9 sont les toilettes ?</b> \u2014 <i>u s\u00f5 l\u00ea tua-L\u00c9T (onde \u00e9 o banheiro?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Combien \u00e7a co\u00fbte ?','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Combien \u00e7a co\u00fbte ?</b> \u2014 <i>c\u00f5-BI\u00c3 sa CUT (quanto custa?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('L\\'addition, s\\'il vous pla\u00eet','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>L'addition, s'il vous pla\u00eet</b> \u2014 <i>la-di-SI\u00d5 sil vu PL\u00ca (a conta, por favor)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Une table pour deux','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Une table pour deux</b> \u2014 <i>\u00fcn TABL pur D\u00ca (mesa para dois)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Une carafe d\\'eau, s\\'il vous pla\u00eet','fr-FR',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Une carafe d'eau, s'il vous pla\u00eet</b> \u2014 <i>\u00fcn ca-RAF d\u00f4 (uma jarra de \u00e1gua da torneira, gr\u00e1tis)</i></li>\n  </ul>\n\n  <h3>Apps: qual e por qu\u00ea</h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">\ud83c\udfab</div><div><b>\u00cele-de-France Mobilit\u00e9s</b><span>Compra o bilhete e serve de bilhete. O \u00fanico obrigat\u00f3rio.</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83e\udded</div><div><b>Citymapper</b><span>Rota em tempo real, com qual sa\u00edda usar e avisos de obra. Melhor que o Maps aqui.</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83d\ude95</div><div><b>Uber e Bolt</b><span>Para o domingo com malas e para qualquer noite em que a linha 6 estiver fechada por obra. Bolt costuma ser mais barato.</span></div></div>\n  </div>\n\n  <h3>Quanto custa</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Item</th><th>Os dois</th></tr>\n    <tr><td>T\u00e1xi Orly \u2192 Trocad\u00e9ro</td><td>\u20ac44</td></tr>\n    <tr><td>2 Navigo Easy (se precisarem)</td><td>\u20ac4</td></tr>\n    <tr><td>16 bilhetes M\u00e9tro-Train-RER</td><td>\u20ac41</td></tr>\n    <tr><td>Uber Trocad\u00e9ro \u2192 Ch\u00e2telet (opcional)</td><td>\u20ac22</td></tr>\n    <tr><td><b>Total transporte em Paris</b></td><td><b>~\u20ac90\u2013110</b></td></tr>\n  </table></div>\n</section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia</h2>\n  <p class=\"lead\">Um mapa geral com os tr\u00eas dias e um zoom no centro, para o domingo a p\u00e9. Pontos nas coordenadas reais; o Sena est\u00e1 desenhado no tra\u00e7ado real, simplificado. Nos quadros do dia, toque no n\u00famero de um trecho para ver como fazer.</p>\n\n  <figure>\n    <svg viewBox=\"0 0 360 385\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Paris, vis\u00e3o geral dos tr\u00eas dias\">\n      <!-- Sena -->\n      <path d=\"M0 260 C 30 250, 60 240, 95 205 C 130 185, 160 180, 190 195 C 215 210, 240 232, 268 246 C 290 258, 320 268, 360 272\" class=\"water\" style=\"fill:none;stroke:var(--azul-tint);stroke-width:14;stroke-linecap:round\"/>\n      <ellipse cx=\"262\" cy=\"246\" rx=\"18\" ry=\"6\" class=\"hill\"/>\n      <text x=\"300\" y=\"290\" class=\"mg\">Sena</text>\n      <!-- colinas -->\n      <ellipse cx=\"244\" cy=\"80\" rx=\"50\" ry=\"36\" class=\"hill\"/><text x=\"270\" y=\"50\" class=\"mg\">Montmartre</text>\n      <!-- \u00c9toile / Champs-\u00c9lys\u00e9es -->\n      <path d=\"M73 147 L168 187\" class=\"street\"/><text x=\"96\" y=\"160\" class=\"ms\">Champs-\u00c9lys\u00e9es</text>\n      <!-- linha 6 arc -->\n      <path d=\"M46 201 C 44 230, 60 250, 100 262 C 150 280, 190 320, 206 341\" class=\"metro\" style=\"opacity:.55\"/>\n      <text x=\"90\" y=\"300\" class=\"ms\" style=\"fill:var(--amarelo)\">linha 6</text>\n      <path d=\"M46 201 C 50 175, 60 150, 73 147\" class=\"metro\" style=\"opacity:.55\"/>\n      <path d=\"M73 147 C 110 110, 170 105, 2 p\"/><text x=\"101\" y=\"80\" class=\"ms\" style=\"text-anchor:end\">Fragonard (Carrousel)</text>\n      <circle cx=\"191\" cy=\"109\" r=\"5\" class=\"eat\"/><text x=\"197\" y=\"121\" class=\"ms\">BO&amp;MIE</text>\n      <circle cx=\"224\" cy=\"106\" r=\"5\" class=\"eat\"/><text x=\"228\" y=\"98\" class=\"ms\">Painorama</text>\n      <circle cx=\"209\" cy=\"71\" r=\"4\" class=\"shop\"/><text x=\"215\" y=\"68\" class=\"ms\">Dehillerin (fecha dom)</text>\n      <circle cx=\"56\" cy=\"55\" r=\"5\" class=\"eat\"/><text x=\"62\" y=\"35\" class=\"ms\">Angelina \u00b7 Galignani</text>\n      <circle cx=\"41\" cy=\"75\" r=\"6\" class=\"pt\"/><text x=\"8\" y=\"112\" class=\"m\">Tuileries \u00b7 piquenique</text>\n      <circle cx=\"153\" cy=\"139\" r=\"6\" class=\"pt\"/><text x=\"150\" y=\"160\" class=\"m\">Pont des Arts</text>\n      <circle cx=\"286\" cy=\"203\" r=\"6\" class=\"pt\"/><text x=\"292\" y=\"208\" class=\"m\">Notre-Dame</text>\n      <circle cx=\"256\" cy=\"208\" r=\"5\" class=\"shop\"/><text x=\"196\" y=\"222\" class=\"ms\">Shakespeare &amp; Co.</text>\n      <circle cx=\"103\" cy=\"222\" r=\"5\" class=\"shop\"/><text x=\"20\" y=\"236\" class=\"ms\">Pierre Herm\u00e9 (macarons)</text>\n      <circle cx=\"35\" cy=\"161\" r=\"4\" class=\"shop\"/><text x=\"42\" y=\"176\" class=\"ms\">Deyrolle (fecha dom)</text>\n      <text x=\"283\" y=\"150\" class=\"ms\">Marais \u2192 20 min</text>\n    <g class=\"r-badge walk\" data-r=\"1\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: A p\u00e9 \u00b7 Ch\u00e2telet \u2192 Louvre (Pir\u00e2mide)\" transform=\"translate(201,123.5)\"><circle r=\"9\"/><text y=\".5\">1</text></g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A p\u00e9 \u00b7 Louvre \u2192 Tuileries\" transform=\"translate(88,84)\"><circle r=\"9\"/><text y=\".5\">2</text></g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A p\u00e9 \u00b7 Tuileries \u2192 Pont des Arts\" transform=\"translate(108,117)\"><circle r=\"9\"/><text y=\".5\">3</text></g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A p\u00e9 \u00b7 Pont des Arts \u2192 Notre-Dame\" transform=\"translate(203,171.5)\"><circle r=\"9\"/><text y=\".5\">4</text></g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A p\u00e9 \u00b7 Notre-Dame \u2192 Ch\u00e2telet (volta)\" transform=\"translate(271,207)\"><circle r=\"9\"/><text y=\".5\">5</text></g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A p\u00e9 (desvio opcional) \u00b7 Ch\u00e2telet \u2192 Marais\" transform=\"translate(186.2,220.5)\"><circle r=\"9\"/><text y=\".5\">6</text></g></svg>\n    <figcaption>Zoom do domingo. A margem esquerda (sul do Sena) tem Shakespeare &amp; Co. e Pierre Herm\u00e9; o resto \u00e9 margem direita.</figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"></i>ponto do roteiro</span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"></i>comer</span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"></i>loja</span>\n      <span><i style=\"background:var(--ok)\"></i>hospedagem</span>\n      <span>\u2014 \u2014 a p\u00e9</span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">\u2501</span> metr\u00f4/RER</span>\n      <span><span style=\"color:var(--azul);font-weight:900\">\u2501</span> t\u00e1xi</span>\n    </div>\n  <div class=\"rota-painel\" id=\"rp-paris-1\" aria-live=\"polite\"></div></figure>\n\n  <p>Mapa real do domingo: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Ch%C3%A2telet%2C+Paris&destination=Gare+du+Nord&waypoints=Mus%C3%A9e+du+Louvre%7CJardin+des+Tuileries%7CPont+des+Arts%7CCath%C3%A9drale+Notre-Dame+de+Paris%7CShakespeare+and+Company%7CPlace+des+Vosges&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir a rota no Google Maps</a>.</p>\n\n  <h3>Sobre os lugares</h3>\n  <div class=\"attractions\">\n    <h4>Louvre</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Foi fortaleza medieval a partir de 1190, virou pal\u00e1cio real no s\u00e9culo XIV, e museu s\u00f3 depois da Revolu\u00e7\u00e3o Francesa, em 1793 \u2014 a fam\u00edlia real tinha se mudado para Versalhes um s\u00e9culo antes, deixando o pr\u00e9dio livre. Napole\u00e3o o encheu de obras trazidas (ou saqueadas, dependendo de quem conta a hist\u00f3ria) de suas campanhas pela Europa e Egito; boa parte teve de ser devolvida depois de sua queda em 1815, mas nem tudo voltou.</div></details><details class=\"curio\"><summary>\ud83c\udfdb\ufe0f um pouco de arquitetura</summary><div class=\"in\">A Pir\u00e2mide de vidro na entrada, hoje s\u00edmbolo do museu, foi inaugurada em 1989, projetada pelo arquiteto sino-americano I. M. Pei \u2014 na \u00e9poca, gerou um esc\u00e2ndalo enorme: cr\u00edticos franceses a chamavam de \"arranh\u00e3o\" no pal\u00e1cio hist\u00f3rico. Hoje \u00e9 uma das imagens mais fotografadas de Paris.</div></details>\n    <h4>Notre-Dame</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">A constru\u00e7\u00e3o come\u00e7ou em 1163 e levou quase 200 anos para terminar. Em abril de 2019 um inc\u00eandio destruiu o telhado e a torre central (a fl\u00e8che); a reconstru\u00e7\u00e3o, usando t\u00e9cnicas e materiais o mais pr\u00f3ximos poss\u00edvel dos originais do s\u00e9culo XIX, foi conclu\u00edda e a catedral reabriu ao p\u00fablico em dezembro de 2024 \u2014 pouco menos de dois anos antes desta viagem.</div></details>\n    <h4>Sacr\u00e9-C\u0153ur</h4><details class=\"curio\"><summary>\ud83c\udfdb\ufe0f um pouco de arquitetura</summary><div class=\"in\">\u00c9 bem mais nova do que parece: come\u00e7ou a ser constru\u00edda s\u00f3 em 1875, como penit\u00eancia nacional depois da derrota francesa na guerra contra a Pr\u00fassia em 1870-71 e da Comuna de Paris. A pedra branca (travertino) reage com a chuva soltando calcita, o que faz a fachada clarear com o tempo em vez de escurecer \u2014 por isso permanece t\u00e3o branca mesmo depois de mais de um s\u00e9culo.</div></details>\n    <h4>Catacumbas</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">No fim do s\u00e9culo XVIII os cemit\u00e9rios de Paris, como o Cemit\u00e9rio dos Inocentes, estavam t\u00e3o lotados que paredes de casas vizinhas racharam com a press\u00e3o dos corpos. A solu\u00e7\u00e3o foi esvaziar os cemit\u00e9rios e empilhar os ossos \u2014 de mais de 6 milh\u00f5es de pessoas \u2014 nos t\u00faneis de antigas pedreiras subterr\u00e2neas. Boa parte da pedra usada para construir os pr\u00e9dios de Paris veio dessas mesmas minas.</div></details>\n    <h4>Pal\u00e1cio de Versalhes</h4><details class=\"curio\"><summary>\ud83c\udfdb\ufe0f um pouco de arquitetura</summary><div class=\"in\">Come\u00e7ou como um pavilh\u00e3o de ca\u00e7a do pai de Lu\u00eds XIV e virou a maior express\u00e3o de poder absoluto da Europa: o Rei Sol transferiu toda a corte e o governo franc\u00eas para l\u00e1 em 1682, mantendo a nobreza ocupada com etiqueta e cerim\u00f4nia em vez de conspirar em Paris. A Galeria dos Espelhos, com 357 espelhos, era luxo extremo numa \u00e9poca em que o vidro espelhado custava mais que ouro \u2014 a Fran\u00e7a teve at\u00e9 que contrabandear artes\u00e3os de Veneza, que detinha o monop\u00f3lio da t\u00e9cnica, para conseguir produzi-los.</div></details>\n  </div>\n</section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 op\u00e7\u00f5es por parada</h2>\n  <p class=\"lead\">Regra de ouro em Paris: cozinha fecha entre 14:30 e 19:00 em quase todo bistr\u00f4. Quem chega \u00e0s 15h come em caf\u00e9, brasserie ou bouillon. Hor\u00e1rios conferidos para o dia da semana em que voc\u00eas estar\u00e3o. Pre\u00e7os por pessoa, sem vinho.</p>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o tardio \u00b7 sex 25/09, ~14:30 \u00b7 Trocad\u00e9ro</h3>\n    <p class=\"when\">Os tr\u00eas ficam na pr\u00f3pria Place du Trocad\u00e9ro, 3 min do studio, e servem o dia inteiro. \u00c9 comida de caf\u00e9: quiche, croque, salada, omelete. A refei\u00e7\u00e3o de verdade \u00e9 \u00e0 noite.</p>\n\n    <div class=\"opt pick\"><h4>Carette <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>4 Place du Trocad\u00e9ro, o sal\u00e3o de ch\u00e1 art d\u00e9co de 1927.</span>\n        <b>Por qu\u00ea</b><span>\u00c9 o ritual parisiense de chegada: chocolate quente espesso e um mille-feuille, olhando a pra\u00e7a. A fila anda em 10\u201315 min.</span>\n        <b>Estrela</b><span>Chocolat chaud \u00e0 l'ancienne; sopa de cebola; mille-feuille.</span>\n        <b>Custo</b><span>\u20ac15\u201325.</span>\n        <b>Hor\u00e1rio</b><span>7h\u201323h30. Sem reserva.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Caf\u00e9 du Trocad\u00e9ro</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>8 Place du Trocad\u00e9ro, duas portas adiante.</span>\n        <b>Por qu\u00ea</b><span>Mesma vista, sem fila, terra\u00e7o de frente para a Torre. Comida de brasserie honesta.</span>\n        <b>Estrela</b><span>Ovos cremosos no caf\u00e9 da manh\u00e3; \u00e0 tarde, croque-monsieur e salada.</span>\n        <b>Custo</b><span>\u20ac15\u201325.</span>\n        <b>Hor\u00e1rio</b><span>7h\u20132h. Confira a conta: uma avalia\u00e7\u00e3o recente relata gorjeta adicionada sem pedir.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Le Wilson</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>2 Place du Trocad\u00e9ro, esquina com a Av. Wilson.</span>\n        <b>Por qu\u00ea</b><span>A brasserie de bairro entre as tr\u00eas: prato do dia com sobremesa inclu\u00edda, gar\u00e7ons de d\u00e9cadas.</span>\n        <b>Estrela</b><span>Entrec\u00f4te-frites do menu.</span>\n        <b>Custo</b><span>\u20ac18\u201328.</span>\n        <b>Hor\u00e1rio</b><span>6h30\u20131h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar \u00b7 sex 25/09, 19:30 \u00b7 Denfert-Rochereau</h3>\n    <p class=\"when\">Os tr\u00eas ficam a 2\u20135 min da sa\u00edda das Catacumbas, na Place Denfert ou na Rue Daguerre, a rua de com\u00e9rcio do bairro. Sexta \u00e0 noite: reservar o primeiro e o segundo.</p>\n\n    <div class=\"opt pick\"><h4>Maison P\u00e9ret <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>6 Rue Daguerre, 3 min das Catacumbas.</span>\n        <b>Por qu\u00ea</b><span>Bistr\u00f4 e bar de vinhos de bairro, sem turista em massa, com o prato que voc\u00eas vieram comer na Fran\u00e7a.</span>\n        <b>Estrela</b><span>Confit de pato; magret com vinho da casa.</span>\n        <b>Custo</b><span>\u20ac25\u201335.</span>\n        <b>Hor\u00e1rio</b><span>8h\u201323h30. +33 1 43 22 57 05.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Contre All\u00e9e</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>83 Av. Denfert-Rochereau, 5 min.</span>\n        <b>Por qu\u00ea</b><span>Cozinha de chef a pre\u00e7o de bistr\u00f4, mesas espa\u00e7adas (raro em Paris), nota 4,7. Para um jantar mais especial.</span>\n        <b>Estrela</b><span>Polvo; foie gras de entrada; profiteroles de chocolate.</span>\n        <b>Custo</b><span>\u20ac35\u201345.</span>\n        <b>Hor\u00e1rio</b><span>Sexta 19h30\u201323h30. Reservar: +33 1 43 54 99 86.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>I Grappoli</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>22 Place Denfert-Rochereau, na frente da sa\u00edda.</span>\n        <b>Por qu\u00ea</b><span>Se o jet lag pedir algo simples: italiano bom, r\u00e1pido, sem reserva.</span>\n        <b>Estrela</b><span>Ravioli de cogumelo com trufa; alm\u00f4ndegas.</span>\n        <b>Custo</b><span>\u20ac15\u201325.</span>\n        <b>Hor\u00e1rio</b><span>12h\u20130h.</span>\n      </div></div>\n\n    <div class=\"note\">Crepe de verdade, bret\u00e3: <b>Cr\u00eaperie de Josselin</b>, 67 Rue du Montparnasse, 15 min a p\u00e9 de Denfert (ou 1 parada de linha 6 at\u00e9 Edgar Quinet). Fila de 20 min, galette + crepe doce + sidra, \u20ac15\u201320. Sexta at\u00e9 23h.</div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 s\u00e1b 26/09, 13:00 \u00b7 Versalhes</h3>\n    <p class=\"when\">Os caf\u00e9s dentro do pal\u00e1cio s\u00e3o caros e cheios. A Rue de Satory fica a 5 min a p\u00e9 da sa\u00edda, entre o pal\u00e1cio e a esta\u00e7\u00e3o, e concentra o que presta. S\u00e1bado lota: reserva no primeiro.</p>\n\n    <div class=\"opt pick\"><h4>L'inspi <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>13 Rue de Satory.</span>\n        <b>Por qu\u00ea</b><span>Nota 4,9 em 540 avalia\u00e7\u00f5es, card\u00e1pio s\u00f3 em franc\u00eas, cheio de moradores. Bistr\u00f4 de chef com prato do dia que muda.</span>\n        <b>Estrela</b><span>O que estiver na lousa; cordeiro com molho; brookie de sobremesa.</span>\n        <b>Custo</b><span>\u20ac25\u201335.</span>\n        <b>Hor\u00e1rio</b><span>S\u00e1bado 12h\u201314h15. <b>Reservar: +33 6 07 50 13 37.</b> Sem reserva, n\u00e3o entra.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Maison Satory</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>22 Rue de Satory.</span>\n        <b>Por qu\u00ea</b><span>Por\u00e7\u00f5es grandes, comida francesa boa, banheiro limpo e cadeira confort\u00e1vel depois de 4 h em p\u00e9 no pal\u00e1cio. Nota 4,8.</span>\n        <b>Estrela</b><span>Pato; lula grelhada; caf\u00e9 gourmand no fim.</span>\n        <b>Custo</b><span>\u20ac20\u201330.</span>\n        <b>Hor\u00e1rio</b><span>12h\u201322h30, cozinha cont\u00ednua. +33 1 34 65 00 22.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>L'Amoroso</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>14 Rue de Satory.</span>\n        <b>Por qu\u00ea</b><span>R\u00e1pido e leve para n\u00e3o pesar antes dos jardins: focaccia e burrata de italiano com dono na porta. Nota 5,0.</span>\n        <b>Estrela</b><span>Focaccia recheada; burrata com tomate.</span>\n        <b>Custo</b><span>\u20ac12\u201318.</span>\n        <b>Hor\u00e1rio</b><span>S\u00e1bado 11h30\u201315h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar \u00b7 s\u00e1b 26/09, 20:15 \u00b7 Montmartre / Pigalle</h3>\n    <p class=\"when\">Descendo da Sacr\u00e9-C\u0153ur, a Rue des Abbesses \u00e9 a rua dos restaurantes de bairro, e o Boulevard de Clichy, no p\u00e9 do morro, tem o bouillon. S\u00e1bado \u00e0 noite \u00e9 o pior dia para fila: contem com espera.</p>\n\n    <div class=\"opt pick\"><h4>Bouillon Pigalle <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>22 Bd de Clichy, na sa\u00edda do metr\u00f4 Pigalle.</span>\n        <b>Por qu\u00ea</b><span>O bouillon moderno: entrada, prato e sobremesa cl\u00e1ssicos por menos de \u20ac25, sal\u00e3o barulhento e alegre. \u00c9 o lugar para provar carac\u00f3is, sopa de cebola e b\u0153uf bourguignon sem cerim\u00f4nia.</span>\n        <b>Estrela</b><span>Ovo com maionese (\u20ac2), sopa de cebola, confit de pato, profiteroles.</span>\n        <b>Custo</b><span>\u20ac18\u201325.</span>\n        <b>Hor\u00e1rio</b><span>12h\u20130h. Sem reserva, fila de 20\u201340 min; pe\u00e7am tudo de uma vez, o gar\u00e7om n\u00e3o volta f\u00e1cil.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Le Relais Gascon</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>6 Rue des Abbesses, em frente ao metr\u00f4 Abbesses.</span>\n        <b>Por qu\u00ea</b><span>Saladas gigantes com batata salteada e magret, a comida do sudoeste. Alternativa com mesa quando o bouillon estiver com 40 min de fila. Segundo andar tem ar-condicionado.</span>\n        <b>Estrela</b><span>Salade gasconne; magret com mel.</span>\n        <b>Custo</b><span>\u20ac18\u201325.</span>\n        <b>Hor\u00e1rio</b><span>11h\u20130h. +33 1 42 58 58 22.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>La Mascotte</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>52 Rue des Abbesses.</span>\n        <b>Por qu\u00ea</b><span>Para um jantar mais caprichado em Montmartre sem cair em armadilha.</span>\n        <b>Estrela</b><span>Meia d\u00fazia de ostras; carac\u00f3is; frutos do mar.</span>\n        <b>Custo</b><span>\u20ac30\u201345.</span>\n        <b>Hor\u00e1rio</b><span>7h\u20130h. +33 1 46 06 28 15.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Brasserie de 1889, com banca de ostras na porta desde sempre \u2014 uma tradi\u00e7\u00e3o parisiense que sobrevive em poucos endere\u00e7os.</div></details>\n    </div>\n\n    <div class=\"note\">Hamb\u00farguer: <b>Le Ruisseau</b>, 65 Rue du Ruisseau, fica do outro lado do morro (15 min a p\u00e9 da Sacr\u00e9-C\u0153ur, descendo para o norte), \u20ac15\u201320, at\u00e9 23h. S\u00f3 vale se j\u00e1 estiverem daquele lado.</div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Piquenique \u00b7 dom 27/09, 12:30 \u00b7 Tuileries</h3>\n    <p class=\"when\">Domingo muita padaria fecha; estas tr\u00eas abrem. Comprem antes de entrar no Louvre \u00e0s 9h (fica na mochila) ou na sa\u00edda, \u00e0s 12:30. Sentem nas cadeiras verdes de ferro do jardim, que s\u00e3o gr\u00e1tis.</p>\n\n    <div class=\"opt pick\"><h4>BO&amp;MIE Louvre-Rivoli <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>91 Rue de Rivoli, em frente ao Louvre, na sa\u00edda do metr\u00f4 Louvre-Rivoli.</span>\n        <b>Por qu\u00ea</b><span>Padaria moderna premiada, sandu\u00edche de baguete feito na hora, doces bonitos, aberta domingo 8h\u201320h.</span>\n        <b>Estrela</b><span>Sandu\u00edche de frango; croissant de framboesa; latte de pistache.</span>\n        <b>Custo</b><span>\u20ac8\u201314 por pessoa o piquenique.</span>\n        <b>Hor\u00e1rio</b><span>Dom 8h\u201320h. Pedido no totem; fiquem perto do balc\u00e3o para pegar.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Boulangerie Painorama</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>75 Rue Saint-Honor\u00e9, 5 min a p\u00e9, atr\u00e1s do Louvre.</span>\n        <b>Por qu\u00ea</b><span>Padaria de bairro de verdade, a que os vizinhos usam. Jambon-beurre cl\u00e1ssico.</span>\n        <b>Estrela</b><span>Jambon-beurre; croissant de presunto e queijo.</span>\n        <b>Custo</b><span>\u20ac6\u201310.</span>\n        <b>Hor\u00e1rio</b><span>Dom 8h\u201317h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Les Gourmandises de Saint-Honor\u00e9</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>123 Rue Saint-Honor\u00e9.</span>\n        <b>Por qu\u00ea</b><span>Tortas de fruta e \u00e9clairs de sobremesa para o piquenique; baguete boa.</span>\n        <b>Estrela</b><span>Tarte de framboesa; \u00e9clair de caf\u00e9.</span>\n        <b>Custo</b><span>\u20ac5\u20139.</span>\n        <b>Hor\u00e1rio</b><span>Dom 7h\u201320h.</span>\n      </div></div>\n\n    <div class=\"note\">Doce do dia: <b>Angelina</b> (226 Rue de Rivoli, ao lado das Tuileries) para o chocolate quente africain e o Mont-Blanc, com fila de 15\u201320 min, dom 8h\u201320h. Ou <b>Pierre Herm\u00e9</b> (72 Rue Bonaparte, 10 min de Notre-Dame, dom at\u00e9 19h) para os melhores macarons de Paris: Ispahan e Mogador.</div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar \u00b7 dom 27/09, 18:45\u201319:45 \u00b7 Gare du Nord</h3>\n    <p class=\"when\">Aqui a regra \u00e9 o rel\u00f3gio: port\u00e3o do Eurostar fecha \u00e0s 19:52. Comida para levar \u00e9 a escolha certa; jantar sentado s\u00f3 se chegarem \u00e0 esta\u00e7\u00e3o antes das 18:45.</p>\n\n    <div class=\"opt pick\"><h4>Plan B <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>3 Rue de Compi\u00e8gne, 2 min da entrada da Gare du Nord.</span>\n        <b>Por qu\u00ea</b><span>Sandu\u00edche tunisiano de baguete, enorme, embrulhado para viagem, \u20ac8\u201310. Nota 4,8 em 1.400 avalia\u00e7\u00f5es, cheio de gente indo pegar o Eurostar.</span>\n        <b>Estrela</b><span>Le Plan B com raclette; makloub de frango grelhado.</span>\n        <b>Custo</b><span>\u20ac8\u201312.</span>\n        <b>Hor\u00e1rio</b><span>Dom 11h\u201322h30.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Terminus Nord</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>23 Rue de Dunkerque, em frente \u00e0 esta\u00e7\u00e3o.</span>\n        <b>Por qu\u00ea</b><span>A cl\u00e1ssica \"\u00faltima refei\u00e7\u00e3o antes do trem\". S\u00f3 cabe no plano se sa\u00edrem de Ch\u00e2telet \u00e0s 18:15.</span>\n        <b>Estrela</b><span>Sopa de cebola gratinada; ostras; \u00eele flottante.</span>\n        <b>Custo</b><span>\u20ac30\u201345. Sentado, 60 min.</span>\n        <b>Hor\u00e1rio</b><span>Dom 7h30\u201323h. +33 1 42 85 05 15.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Brasserie art d\u00e9co de 1925, com o sal\u00e3o e a decora\u00e7\u00e3o quase intactos desde a inaugura\u00e7\u00e3o.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>Eattos</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>148 Rue du Faubourg Saint-Denis, 3 min.</span>\n        <b>Por qu\u00ea</b><span>Frango frito e wraps para levar, milkshake bom, r\u00e1pido.</span>\n        <b>Estrela</b><span>\"Magic wrap\" de frango.</span>\n        <b>Custo</b><span>\u20ac8\u201312.</span>\n        <b>Hor\u00e1rio</b><span>Dom 11h15\u201323h.</span>\n      </div></div>\n  </div>\n</section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Paris</h2>\n  <p class=\"lead\">A janela boa \u00e9 o domingo: Carrousel do Louvre, Shakespeare &amp; Co., Pierre Herm\u00e9 e o Marais abrem. As lojas tradicionais de Paris (Galignani, Deyrolle, Dehillerin, Maille) fecham domingo, e nos outros dois dias voc\u00eas est\u00e3o em Versalhes e Montmartre. S\u00e1bado \u00e0 noite, a Rue des Abbesses tem lojinhas abertas at\u00e9 tarde.</p>\n\n  <div class=\"warn\">Mala de 10 kg, lembrete: macarons s\u00e3o leves mas fr\u00e1geis (caixa r\u00edgida, comer em 3 dias, o que d\u00e1 at\u00e9 Amsterdam); mostarda e sal s\u00e3o pesados; perfume at\u00e9 100 ml passa na seguran\u00e7a.</div>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O qu\u00ea</th><th>Por qu\u00ea</th><th>Onde (na rota)</th><th>Pre\u00e7o</th></tr>\n    <tr><td>Macarons Pierre Herm\u00e9</td><td>O p\u00e2tissier que reinventou o macaron; Ispahan (rosa, lichia, framboesa) \u00e9 o mais famoso do mundo.</td><td>72 Rue Bonaparte, dom at\u00e9 19h, 10 min de Notre-Dame.</td><td>caixa de 7: ~\u20ac20</td></tr>\n    <tr><td>Sabonete e perfume Fragonard</td><td>Casa de Grasse de 1926; frascos pequenos de alum\u00ednio, leves, embalagem bonita.</td><td>Carrousel du Louvre (o shopping subterr\u00e2neo da Pir\u00e2mide), dom 10h\u201319h. Na sa\u00edda do museu.</td><td>\u20ac8\u201335</td></tr>\n    <tr><td>Livro carimbado + sacola</td><td>O carimbo \"Shakespeare and Company, Kilometer Zero Paris\" na p\u00e1gina de rosto \u00e9 a lembran\u00e7a de leitor.</td><td>37 Rue de la B\u00fbcherie, dom 12h\u201319h. Est\u00e1 no roteiro \u00e0s 15:30.</td><td>livro + sacola \u20ac15\u201330</td></tr>\n    <tr><td>Chocolate quente Angelina em lata</td><td>A mistura do chocolate mais famoso de Paris, para fazer em casa.</td><td>Boutique dentro do Angelina, Rue de Rivoli, dom at\u00e9 20h.</td><td>\u20ac15\u201320</td></tr>\n    <tr><td>Mostarda, flor de sal, biscoitos</td><td>O barato e leg\u00edtimo: Maille (a de Dijon), fleur de sel de Gu\u00e9rande, sabl\u00e9s bretons. Supermercado vende o mesmo que as lojas-conceito, por um ter\u00e7o.</td><td>Qualquer <b>Monoprix</b> ou <b>Franprix</b>: h\u00e1 um Monoprix na Rue de Passy, 10 min do studio, dom at\u00e9 19h45.</td><td>\u20ac2\u20136 cada</td></tr>\n    <tr><td>Lou\u00e7a e objetos de Versalhes</td><td>A loja do pal\u00e1cio tem coisas boas de Marie-Antoinette: leques, caixas de ch\u00e1, pratos.</td><td>Boutique do Ch\u00e2teau de Versailles, na sa\u00edda, s\u00e1bado.</td><td>\u20ac10\u201340</td></tr>\n    <tr><td>Cart\u00f5es e gravuras de rua</td><td>Na Place du Tertre os pintores vendem aquarelas pequenas de Montmartre; regateie, e recuse a caricatura n\u00e3o pedida.</td><td>Montmartre, s\u00e1bado \u00e0 noite.</td><td>\u20ac10\u201330</td></tr>\n  </table></div>\n</section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que s\u00f3 existem aqui</h2>\n\n  <div class=\"shop\"><b>Shakespeare and Company</b><small>37 Rue de la B\u00fbcherie \u00b7 dom 12h\u201319h \u00b7 fila de 10\u201320 min</small>\n    <p>Proibido fotografar dentro; suba ao andar de cima e sente no canto de leitura. J\u00e1 est\u00e1 no roteiro.</p>\n    <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Aberta em 1951, a livraria mant\u00e9m a tradi\u00e7\u00e3o de hospedar escritores de passagem entre as estantes, em troca de algumas horas de trabalho por dia \u2014 j\u00e1 passaram mais de 30 mil \"tumbleweeds\".</div></details></div>\n\n  <div class=\"shop\"><b>Merci</b><small>111 Bd Beaumarchais, Marais \u00b7 dom 10h\u201319h30</small>\n    <p>A loja-conceito parisiense: roupa, casa, papelaria e o Fiat 500 vermelho na entrada. Fica a 5 min da Place des Vosges, o trecho opcional das 17h do domingo. Se forem ao Marais, entrem.</p></div>\n\n  <div class=\"shop\"><b>Fragonard, Carrousel du Louvre</b><small>99 Rue de Rivoli (subsolo do Louvre) \u00b7 dom 10h\u201319h</small>\n    <p>A sa\u00edda do museu passa pelo Carrousel. Perfumaria de Grasse com atendimento paciente e frasco de viagem; fazem o Tax Free na hora.</p></div>\n\n  <div class=\"shop\"><b>Pierre Herm\u00e9</b><small>72 Rue Bonaparte, Saint-Germain \u00b7 dom 10h\u201319h</small>\n    <p>A loja original, sem mesas: s\u00f3 balc\u00e3o. Vale o desvio de 10 min a partir de Shakespeare &amp; Co. pela Rue Saint-Andr\u00e9-des-Arts.</p></div>\n\n  <div class=\"shop\"><b>Angelina</b><small>226 Rue de Rivoli \u00b7 dom 8h\u201320h</small>\n    <p>A fila \u00e9 para sentar; a boutique de presentes, na entrada, n\u00e3o tem fila.</p>\n    <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Sal\u00e3o de ch\u00e1 Belle \u00c9poque aberto em 1903 \u2014 a receita do chocolate quente \"L'Africain\" \u00e9 a mesma desde ent\u00e3o.</div></details></div>\n\n  <div class=\"shop\"><b>Fora do alcance neste roteiro (fecham domingo)</b><small>caso troquem alguma coisa de dia</small>\n    <p><b>Librairie Galignani</b> (224 Rue de Rivoli): a mais antiga livraria inglesa do continente, 1801, salas de madeira e livros de arte. <b>Deyrolle</b> (46 Rue du Bac): gabinete de curiosidades de 1831, taxidermia, gravuras de bot\u00e2nica e insetos, o lugar mais estranho e bonito de Paris para quem gosta de est\u00e9tica; a 15 min do Louvre. <b>E. Dehillerin</b> (18 Rue Coquilli\u00e8re): a loja de panelas de cobre de 1820 onde Julia Child comprava. <b>Boutique Maille</b> (Place de la Madeleine): mostarda servida na torneira, em pote de cer\u00e2mica.</p></div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">S\u00e1b \u00e0 noite: lojas da Rue des Abbesses \u00b7 loja do pal\u00e1cio de Versalhes</span>\n    <span class=\"chip\">Dom: Fragonard \u00b7 Angelina \u00b7 Shakespeare \u00b7 Pierre Herm\u00e9 \u00b7 Merci</span>\n    <span class=\"chip\">Qualquer dia: Monoprix para o leg\u00edtimo barato</span>\n  </div>\n</section>\n\n\n</div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"paris-1\": [{\"t\": \"A p\u00e9 \u00b7 Ch\u00e2telet \u2192 Louvre (Pir\u00e2mide)\", \"d\": \"Guarda-volumes em Ch\u00e2telet primeiro; entrada \u00e0s 09:00.\"}, {\"t\": \"A p\u00e9 \u00b7 Louvre \u2192 Tuileries\", \"d\": \"Pelo Carrousel du Louvre.\"}, {\"t\": \"A p\u00e9 \u00b7 Tuileries \u2192 Pont des Arts\", \"d\": \"Piquenique no caminho, comprado antes de entrar no Louvre ou na sa\u00edda.\"}, {\"t\": \"A p\u00e9 \u00b7 Pont des Arts \u2192 Notre-Dame\", \"d\": \"Atravessando a \u00cele de la Cit\u00e9.\"}, {\"t\": \"A p\u00e9 \u00b7 Notre-Dame \u2192 Ch\u00e2telet (volta)\", \"d\": \"Para pegar as malas antes do RER.\"}, {\"t\": \"A p\u00e9 (desvio opcional) \u00b7 Ch\u00e2telet \u2192 Marais\", \"d\": \"+20 min cada lado, se sobrar tempo antes do RER B/D \u00e0s 18:45.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">\u00d7</button><span class=\"num\">'+n+'</span><h4>'+item.t+'</h4><p>'+item.d+'</p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var zoropaUtterance = null;\n  function zoropaSpeak(text, lang, btn){\n    var w = window;\n    try{ if (window.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador n\u00e3o suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '\ud83d\udd08'; };\n      u.onend = function(){ btn.textContent = '\ud83d\udd0a'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '\ud83d\udd0a';\n      alert('N\u00e3o consegui tocar o \u00e1udio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n    if (e.data && typeof e.data.zoropaJump === 'string'){\n      var jt = document.getElementById(e.data.zoropaJump);\n      if (jt) sendScroll(jt);\n      return;\n    }\n    if (!e.data || typeof e.data.zoropaSearch !== 'string') return;\n    var q = e.data.zoropaSearch.toLowerCase();\n    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);\n    var node, target = null;\n    while ((node = walker.nextNode())){\n      var nv = node.nodeValue ? node.nodeValue.replace(/\\s+/g,' ') : '';\n      if (nv && nv.toLowerCase().indexOf(q) !== -1){\n        var p = node.parentElement;\n        if (p && p.closest('script,style')) continue;\n        target = p; break;\n      }\n    }\n    if (!target) return;\n    var det = target.closest('details');\n    if (det && !det.open) det.open = true;\n    sendScroll(target);\n    var prevBg = target.style.backgroundColor, prevTr = target.style.transition;\n    target.style.transition = 'background-color .3s';\n    target.style.backgroundColor = 'rgba(245,197,24,.55)';\n    setTimeout(function(){ target.style.backgroundColor = prevBg; setTimeout(function(){ target.style.transition = prevTr; }, 350); }, 1400);\n  });\nif (window.parent && window.parent !== window){\n    var nj = document.querySelector('nav.jump'); if (nj) nj.style.display = 'none';\n  }\n  document.querySelectorAll('nav.jump a[href^=\"#\"]').forEach(function(a){\n    a.addEventListener('click', function(ev){\n      var el = document.getElementById(a.getAttribute('href').slice(1));\n      if(!el) return;\n      ev.preventDefault();\n      if(!sendScroll(el)) el.scrollIntoView({behavior:'smooth', block:'start'});\n    });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var KEYP='zoropa-pend-', LOCKK='zoropa-pend-lock';\n  var boxes=Array.prototype.slice.call(document.querySelectorAll('.pend input[data-pend]'));\n  var lockBtn=document.getElementById('pendLock'), countEl=document.getElementById('pendCount');\n  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }\n  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }\n  function locked(){ return get(LOCKK)==='1'; }\n  function render(){\n    var done=0;\n    boxes.forEach(function(b){ b.disabled=locked(); if(b.checked) done++; });\n    if(countEl) countEl.textContent=done+' de '+boxes.length+' feitos';\n    if(lockBtn) lockBtn.textContent=locked()?'\ud83d\udd12 destravar lista':'\ud83d\udd13 travar lista';\n  }\n  boxes.forEach(function(b){\n    b.checked=get(KEYP+b.getAttribute('data-pend'))==='1';\n    b.addEventListener('change',function(){ set(KEYP+b.getAttribute('data-pend'), b.checked?'1':'0'); render(); });\n  });\n  if(lockBtn) lockBtn.addEventListener('click',function(){ set(LOCKK, locked()?'0':'1'); render(); });\n  render();\n})();\n<\/script>\n</body>\n</html>\n";
const HTML_AMSTERDAM = "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>zoropa \u00b7 Amsterdam \u2014 guia de bolso</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,600;9..144,700,100&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#FFFFFF; --ink:#101828; --muted:#5B6472; --line:#DCE1E8;\n  --azul:#B3261E; --azul-esc:#7A1712; --azul-tint:#FBEBE7;\n  --amarelo:#F28C28; --amarelo-tint:#FDEBD8;\n  --ok:#1B7F4C; --ok-tint:#E4F5EA; --alerta:#B54708; --alerta-tint:#FDF0E1;\n  --card:#F7F8FA;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;\n    --azul:#F08A80; --azul-esc:#F5B0A8; --azul-tint:#3A1A18;\n    --amarelo:#F28C28; --amarelo-tint:#3A2210;\n    --ok:#6CCB92; --ok-tint:#13301F; --alerta:#F0A25A; --alerta-tint:#3A2510;\n    --card:#141F33;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;\n  --azul:#F08A80; --azul-esc:#F5B0A8; --azul-tint:#3A1A18;\n  --amarelo:#F28C28; --amarelo-tint:#3A2210;\n  --ok:#6CCB92; --ok-tint:#13301F; --alerta:#F0A25A; --alerta-tint:#3A2510;\n  --card:#141F33;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Public Sans\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{font-family:\"Fraunces\",\"Georgia\",serif;font-variation-settings:\"SOFT\" 100;line-height:1.15;margin:0}\nh1{font-size:2.4rem;font-weight:700;letter-spacing:-.01em}\nh2{font-size:1.7rem;font-weight:600;margin:0 0 .4rem}\n
