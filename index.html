<style>

  --card:#F7F8FA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;

  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;
  --azul:#7FA6E0; --azul-esc:#0B1220; --azul-tint:#172A4A;
  --card:#141F33;
}
*{box-sizing:border-box}
html,body{margin:0;height:auto}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

header.shell{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--azul-esc);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08);transform:translateZ(0);will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
header.shell .top{display:flex;align-items:baseline;justify-content:space-between;padding:.7rem 1rem .1rem;max-width:760px;margin:0 auto}
header.shell h1{font-family:"Fraunces","Georgia",serif;font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em}
header.shell .dates{font-size:.78rem;opacity:.85}

nav.tabs{display:flex;gap:.4rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:.6rem 1rem .7rem;max-width:760px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:.4rem;font-family:inherit;font-size:.92rem;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.45rem .9rem;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.tab .flag{font-size:1rem}
.tab[aria-selected="true"]{background:#fff;color:var(--azul-esc);border-color:#fff}
.tab:focus-visible{outline:3px solid #F5C518;outline-offset:2px}

main{max-width:760px;margin:0 auto}
.panel{width:100%}
.panel iframe{display:block;width:100%;border:0;background:var(--bg)}

.loading{padding:3rem 1.2rem;text-align:center;color:var(--muted);font-size:.95rem}

footer.shell{max-width:760px;margin:0 auto;padding:1.4rem 1.2rem calc(3rem + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);margin-top:1rem}
footer.shell a{color:var(--azul)}

[hidden]{display:none !important}
.tools{max-width:760px;margin:0 auto;padding:0 1rem}
.tools:has([id="fxBody"]:not([hidden])),.tools:has([id="searchBody"]:not([hidden])){border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:.2rem}
header.shell .top-right{display:flex;align-items:center;gap:.4rem}
.tool-icon{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;width:1.9rem;height:1.9rem;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem;line-height:1;cursor:pointer;color:#fff;padding:0}
.tool-icon[aria-expanded="true"]{background:rgba(255,255,255,.28)}
.fx-body{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center;padding:.5rem 0 .3rem}
.fx-body label{display:flex;align-items:center;gap:.3rem;font-size:.82rem;color:#fff;opacity:.85}
.fx-body input{width:6.2rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;color:#fff;font-family:inherit;font-size:.95rem;padding:.35rem .5rem}
.fx-body input::placeholder{color:rgba(255,255,255,.5)}
.fx-rate{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:#fff;opacity:.75;width:100%}
.fx-rate input{width:4.2rem;font-size:.82rem;padding:.2rem .4rem}
.fx-rate .fx-date{opacity:.8}
.search-body{padding:.5rem 0 .3rem}
.search-body input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;color:#fff;font-family:inherit;font-size:.95rem;padding:.45rem .6rem}
.search-body input::placeholder{color:rgba(255,255,255,.55)}
.search-results{margin-top:.5rem;display:flex;flex-direction:column;gap:.4rem;max-height:14rem;overflow-y:auto}
.search-result{display:block;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:.45rem .6rem;color:#fff;font-family:inherit;cursor:pointer}
.search-result .sr-city{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;opacity:.75;display:block;margin-bottom:.15rem}
.search-result .sr-snip{font-size:.82rem;opacity:.92;line-height:1.35}
.search-result .sr-snip mark{background:var(--amarelo,#F5C518);color:#1a1a1a;border-radius:2px;padding:0 .1rem}
.search-empty{font-size:.8rem;opacity:.7;padding:.3rem 0}
.jump-outer{max-width:760px;margin:0 auto;padding:0 1rem;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.jump-outer::-webkit-scrollbar{display:none}
.jump-outer a{display:inline-block;padding:.55rem .1rem .5rem;margin-right:1rem;font-size:.85rem;font-weight:600;color:#fff;opacity:.85;text-decoration:none;border-bottom:3px solid transparent}
.jump-outer a:hover,.jump-outer a:active{border-bottom-color:var(--amarelo,#F5C518);opacity:1}
@media print{header.shell{position:static;background:#fff;color:#000}nav.tabs,.tools,.jump-outer,footer.shell{display:none !important}}
</style>
</head>
<body>

<header class="shell">
  <div class="top">
    <h1>zoropa 2026</h1>
    <span class="top-right">
      <span class="dates">23/09–06/10</span>

    </span>
  </div>

      <button class="tab" role="tab" id="tab-lisboa" aria-controls="panel-lisboa" aria-selected="true" tabindex="0" data-slug="lisboa"><span class="flag">🇵🇹</span>Lisboa</button>
      <button class="tab" role="tab" id="tab-paris" aria-controls="panel-paris" aria-selected="false" tabindex="-1" data-slug="paris"><span class="flag">🇫🇷</span>Paris</button>
      <button class="tab" role="tab" id="tab-amsterdam" aria-controls="panel-amsterdam" aria-selected="false" tabindex="-1" data-slug="amsterdam"><span class="flag">🇳🇱</span>Amsterdam</button>
      <button class="tab" role="tab" id="tab-berlim" aria-controls="panel-berlim" aria-selected="false" tabindex="-1" data-slug="berlim"><span class="flag">🇩🇪</span>Berlim</button>
      <button class="tab" role="tab" id="tab-potsdam" aria-controls="panel-potsdam" aria-selected="false" tabindex="-1" data-slug="potsdam"><span class="flag">🏰</span>Potsdam</button>
  </nav>
  <div class="tools">
    <div class="fx-body" id="fxBody" hidden>
      <label>€ <input type="number" id="fxEur" inputmode="decimal" placeholder="0"></label>
      <label>R$ <input type="number" id="fxBrl" inputmode="decimal" placeholder="0"></label>
      <div class="fx-rate">1 € = R$ <input type="number" id="fxRate" step="0.01" inputmode="decimal"> <span class="fx-date" id="fxDate"></span></div>
    </div>
    <div class="search-body" id="searchBody" hidden>
      <input type="text" id="searchInput" placeholder="Buscar em todas as cidades…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <nav class="jump-outer" id="jumpOuter" aria-label="Seções da cidade"></nav>
</header>

<main>
    <div class="panel" id="panel-lisboa" role="tabpanel" aria-labelledby="tab-lisboa" data-slug="lisboa"></div>
    <div class="panel" id="panel-paris" role="tabpanel" aria-labelledby="tab-paris" data-slug="paris" style="display:none"></div>
    <div class="panel" id="panel-amsterdam" role="tabpanel" aria-labelledby="tab-amsterdam" data-slug="amsterdam" style="display:none"></div>
    <div class="panel" id="panel-berlim" role="tabpanel" aria-labelledby="tab-berlim" data-slug="berlim" style="display:none"></div>
    <div class="panel" id="panel-potsdam" role="tabpanel" aria-labelledby="tab-potsdam" data-slug="potsdam" style="display:none"></div>
</main>

<footer class="shell">
  <p>Rolê Europeu | BeXorXe</p>
</footer>

otted var(--line)}\nol.steps li:last-child::after{display:none}\nol.steps b{display:block}\n\na.gl{color:inherit;text-decoration:underline dotted var(--azul);text-underline-offset:3px;text-decoration-thickness:1px}\na.gl:hover{background:var(--azul-tint)}\ndl.gloss div.hl{background:var(--azul-tint);border-radius:8px;transition:background .3s}\n.say{display:inline-flex;align-items:center;gap:.25rem}\n.say-btn{border:0;background:none;padding:0 .15rem;font-size:.95em;cursor:pointer;line-height:1}\n/* glossary */\ndl.gloss{margin:.6rem 0 0;padding:0;border-top:1px solid var(--line)}\ndl.gloss div{display:grid;grid-template-columns:7.5rem 1fr;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}\ndl.gloss dt{font-weight:700;color:var(--azul)}\ndl.gloss dd{margin:0}\n\n/* apps */\n.apps{display:grid;gap:.6rem;margin-top:.6rem}\n.app{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;padding:.75rem .9rem;background:var(--card);border-left:4px solid var(--azul)}\n.app .ic{font-size:1.4rem;line-height:1}\n.app b{display:block}\n.app span{color:var(--muted);font-size:.95rem}\n\n/* tables */\ntable{width:100%;border-collapse:collapse;font-size:.95rem;margin:.6rem 0}\nth,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-weight:700;color:var(--azul)}\n.scroll{overflow-x:auto}\n#transporte td:first-child{white-space:nowrap}\n#transporte table{font-size:.92rem}\n\n/* callouts */\n.note{padding:.8rem 1rem;border-left:4px solid var(--amarelo);background:var(--amarelo-tint);margin:.8rem 0}\n.warn{padding:.8rem 1rem;border-left:4px solid var(--alerta);background:var(--alerta-tint);margin:.8rem 0}\n.ok{padding:.8rem 1rem;border-left:4px solid var(--ok);background:var(--ok-tint);margin:.8rem 0}\n\n/* maps */\nfigure{margin:1rem 0}\nfigure svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line)}\nfigcaption{font-size:.9rem;color:var(--muted);margin-top:.4rem}\n.lege 2rem;color:var(--ok,#1B7F4C);font-weight:600;margin-top:.15rem}\n\n@media print{\n  body{background:#fff;color:#000;font-size:11pt}\n  header{background:#fff !important;background-image:none !important;color:#000;padding:.4rem 0}\n  header h1,header .kicker,header p.sub{color:#000}\n  nav.jump,.say-btn,.legend,figure,.rota-painel,#pendLock,.chips,details:not([open]) > div{display:none !important}\n  section{padding-top:1rem}\n  .opt,.meal,tr,ol.steps li,dl.gloss div{page-break-inside:avoid}\n  a{color:#000;text-decoration:none}\n  .note,.warn,.ok{border-left-width:3px;background:#fff}\n  table{font-size:10pt}\n}\n<\/style>\n<style>\n/* ---- rotas numeradas (injetado) ---- */\n.r-path{cursor:pointer}\n.r-hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:16px;cursor:pointer}\n.r-badge{cursor:pointer}\n.r-badge circle{stroke:var(--bg);stroke-width:1.6px}\n.r-badge text{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}\n.r-badge circle{stroke-dasharray:none}\n.r-badge text{stroke:none;stroke-dasharray:none}\n.r-badge.walk{stroke-dasharray:none}\n.r-badge.walk circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}\n.r-badge.walk text{fill:var(--ink)}\n.r-badge.transit circle{fill:var(--amarelo)}\n.r-badge.transit text{fill:#1a1a1a}\n.r-badge.taxi circle{fill:var(--azul)}\n.r-badge.taxi text{fill:#fff}\n.r-path.is-active,.r-hit.is-active + .r-path{stroke-width:5px !important}\n.r-badge.is-active circle{stroke:var(--amarelo);stroke-width:3px}\n.rota-painel{display:none;margin:.6rem 0 1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:2px;position:relative}\n.rota-painel.show{display:block}\n.rota-painel .num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;font-size:.85rem;margin-right:.5rem;vertical-align:middle}\n.rota-painel h4{display:inline;font-family:\"Public Sans\",sans-serif;font-size:1rem;font-weight:700}\n.rota-painel p{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}\n.rota-painel .fechar{position:absolute;top:.5rem;right:.6rem;background:none;border:0;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:.3rem}\n.mapa-dica{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <p class=\"kicker\">zoropa 2026 · bloco 1 de 5<\/p>\n    <h1>Lisboa<\/h1>\n    <p class=\"sub\">Quinta 24/09 (dia inteiro) · sexta 25/09 (só a saída) · segunda 05/10 (noite com a Patrícia) · terça 06/10 (voo às 10h).<\/p>\n  <\/div>\n<\/header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pendências<\/a>\n  <a href=\"#transporte\">Transporte<\/a>\n  <a href=\"#mapas\">Mapas<\/a>\n  <a href=\"#comer\">Onde comer<\/a>\n  <a href=\"#glossario\">Glossário<\/a>\n  <a href=\"#lembrancas\">Lembrancinhas<\/a>\n  <a href=\"#lojas\">Lojas<\/a>\n<\/div><\/nav>\n\n<div class=\"wrap\">\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pendências e reservas<\/h2>\n  <div class=\"note\"><b>Lista compartilhada:<\/b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📋 abrir a planilha “Pendências zoropa 2026”<\/a> — é a versão oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe têm edição). As caixinhas abaixo são só um espelho rápido neste aparelho.<\/div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"><\/span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">🔓 travar lista<\/button><\/div>\n  <h3>O que ainda falta<\/h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-0\"> <span class=\"pend-what\">Uber e Bolt logados, cartão internacional cadastrado, corrida-teste feita<\/span> <span class=\"pend-when\">até ter 22/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-1\"> <span class=\"pend-what\">eSIM comprado e instalado (ativar na fila da imigração)<\/span> <span class=\"pend-when\">até qua 23/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-2\"> <span class=\"pend-what\">Mapa offline de Lisboa no Google Maps<\/span> <span class=\"pend-when\">até qua 23/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-3\"> <span class=\"pend-what\">€10–15 em moedas / notas de €5 (<a class=\"gl\" href=\"#g-eletrico\">elétrico<\/a>, Ginjinha)<\/span> <span class=\"pend-when\">no aeroporto, 24/09 de manhã<\/span> <span class=\"pend-how\">caixa eletrônico do Terminal 1 antes de sair<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-4\"> <span class=\"pend-what\">Avisar a Patrícia da hora de chegada (pouso 20:05 + Uber, ~21h na casa dela)<\/span> <span class=\"pend-when\">seg 05/10, do aeroporto de Berlim<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-5\"> <span class=\"pend-what\">Tax Free do Mac mini: Alfândega + Global Blue no aeroporto<\/span> <span class=\"pend-when\">ter 06/10, 06:45, antes da segurança<\/span> <span class=\"pend-how\">Mac mini na mão, nota, passaporte<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-6\"> <span class=\"pend-what\">✅ Castelo de São Jorge: comprado, 2 ingressos (~€17/pessoa), sem horário marcado<\/span> <span class=\"pend-when\">feito · é só apresentar na entrada<\/span> <span class=\"pend-how\">castelodesaojorge.pt — chegada prevista entre 18h e 19h de quinta (fecha 21h, última entrada 20h30)<\/span><\/label><\/li>\n  <\/ul>\n  <h3>Reservas e documentos<\/h3>\n  <p class=\"lead\">Os PDFs estão no Drive da conta bexorxe (privados: quem não estiver logado nela vê “pedir acesso”). 📍 abre o lugar no Maps.<\/p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">TAP TP58 · Brasília → Lisboa<\/span> <span class=\"pend-when\">qua 23/09 18:15 → 07:25 (24/09)<\/span> <span class=\"pend-leave\">🕐 saída sugerida de casa: ~3h antes do voo (voo intercontinental) — ajustem pelo trânsito até o BSB, que não está no guia<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 bilhete Rebeca<\/a> · <a href=\"https://drive.google.com/file/d/1r-RpHkPsmiXf_VqSUOJzqA22bCt7SfzI/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 bilhete Jorge<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Aeroporto%20Internacional%20de%20Bras%C3%ADlia\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Famous Crows Lisbon Suites · Rua de Belém 70<\/span> <span class=\"pend-when\">qui 24/09, chegada ~08:30 (malas) · check-out sex 25/09<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1T-P_xIXcqLvqWSeiEmghofHrUoSLWViX/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 reserva<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Famous%20Crows%20Lisbon%20Suites%2C%20Rua%20de%20Bel%C3%A9m%2070%2C%20Lisboa\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Transavia TO7641 · Lisboa → Paris Orly<\/span> <span class=\"pend-when\">sex 25/09 09:40 → 13:10 · check-in online abre 30 h antes<\/span> <span class=\"pend-leave\">🕐 saída sugerida do Famous Crows: 07:30 (Uber ~20–25 min + voo dentro do Schengen, chegar 1h30 antes já é folgado)<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/18_4HgcDeDFhB4J6vylrSfdqxVikDgR1C/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 reserva<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Aeroporto%20Humberto%20Delgado%2C%20Lisboa\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">TAP TP533 · Berlim → Lisboa<\/span> <span class=\"pend-when\">seg 05/10 17:20 → 20:05<\/span> <span class=\"pend-leave\">🕐 saída sugerida do hotel: 14:30 (ver “Trecho a trecho” de Berlim)<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 bilhete<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Flughafen%20Berlin%20Brandenburg%20BER%20Terminal%201\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">TAP TP57 · Lisboa → Brasília<\/span> <span class=\"pend-when\">ter 06/10 10:00 → 15:40<\/span> <span class=\"pend-leave\">🕐 saída sugerida da casa da Patrícia: 06:15 (o roteiro achava 07:00 justo demais — voo intercontinental, controle biométrico de saída Schengen)<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 bilhete<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Aeroporto%20Humberto%20Delgado%2C%20Lisboa\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Seguro-viagem · duas apólices<\/span> <span class=\"pend-when\">toda a viagem<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1p7i3b9OIY74B0fFMLf0AZ2TVJ1ts0Cw7/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 apólice 1<\/a> · <a href=\"https://drive.google.com/file/d/1jRMFJK03pfFpwr4MoraSjlOioML3t5Rl/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 apólice 2<\/a><\/span><\/li>\n  <\/ul>\n<\/section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar<\/h2>\n  <p class=\"lead\">A decisão importante para Lisboa é simples: com só um dia, mala e ladeira, vocês <b>não precisam de cartão de transporte<\/b>. Uber/Bolt para os trechos longos e moedas para o <a class=\"gl\" href=\"#g-eletrico\">elétrico<\/a> resolvem tudo.<\/p>\n\n  <h3>Antes de sair do Brasil<\/h3>\n  <ol class=\"steps\">\n    <li><b>Instale e faça login no Uber e no Bolt.<\/b> Cadastre o cartão de crédito internacional nos dois. Faça uma corrida-teste em Brasília para confirmar que a conta está ativa (o Uber às vezes pede reverificação no exterior).<\/li>\n    <li><b>Baixe o mapa offline de Lisboa no Google Maps.<\/b> Maps › seu avatar › Mapas offline › Selecione o seu próprio mapa. Assim funciona mesmo se o eSIM demorar a conectar.<\/li>\n    <li><b>Separe €10–15 em moedas ou notas de €5<\/b> para o elétrico e a ginjinha (a A Ginjinha só aceita dinheiro).<\/li>\n  <\/ol>\n\n  <h3>Chegada, 24/09, 07:25<\/h3>\n  <ol class=\"steps\">\n    <li><b>Imigração.<\/b> Fila de “Todos os passaportes”. Desde 2025 há o registro biométrico EES (foto e digitais) na primeira entrada: conte 40–60 min. Tenham à mão a reserva do Famous Crows e o bilhete de volta; podem pedir.<\/li>\n    <li><b>Ligue o eSIM<\/b> ainda na fila da imigração (passos no slide 8 do roteiro).<\/li>\n    <li><b>Peça o Uber/Bolt.<\/b> Compare o preço nos dois apps. Coloque como destino “Famous Crows Lisbon Suites, Rua de Belém 70”. O app mostra o ponto de encontro: é a área \"Uber/Bolt/<a class=\"gl\" href=\"#g-tvde\">TVDE<\/a>\" na saída das Chegadas do Terminal 1, à direita. ~20 min, €15–20.<\/li>\n    <li><b>Deixe as malas na hospedagem<\/b> e comece Belém a pé: Pastéis (2 min), Jerónimos (3 min), Padrão e Torre pela beira-rio (15 min). Belém é plano; o resto de Lisboa não.<details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">O Mosteiro dos Jerónimos começou a ser erguido em 1501, sob D. Manuel I, pago com o “dinheiro da pimenta” — o imposto de 5% sobre as especiarias que Vasco da Gama abriu caminho para trazer do Oriente. Levou quase um século para ficar pronto e foi construído para hospedar monges hieronimitas, que rezavam pela alma dos navegadores antes de embarcarem em Belém. O túmulo de Vasco da Gama está logo à entrada da igreja. É Patrimônio Mundial da UNESCO desde 1983, junto com a Torre.<\/div><\/details><details class=\"curio\"><summary>🏛️ um pouco de arquitetura<\/summary><div class=\"in\">O estilo é o manuelino — o gótico tardio português cheio de cordas, esferas armilares e motivos marítimos esculpidos na pedra, uma assinatura visual do período dos Descobrimentos que não existe fora de Portugal. A Torre de Belém, erguida entre 1514 e 1520 por Francisco de Arruda, mistura esse manuelino com influências mouriscas nas torres de vigia — ele tinha trabalhado em fortalezas no Marrocos antes. Originalmente a Torre ficava no meio do rio Tejo, guardando a entrada do porto; o curso do rio mudou ao longo dos séculos e hoje ela parece estar na margem.<\/div><\/details><\/li>\n  <\/ol>\n\n  <h3>Belém → centro, 17:00<\/h3>\n  <ol class=\"steps\">\n    <li><b>Elétrico 15E.<\/b> Parada “Mosteiro dos Jerónimos”, do lado da rua oposto ao mosteiro, sentido Praça da Figueira. Pague ao motorista: <b>~€3 por pessoa, dinheiro<\/b>. Desça em “Praça do Comércio”, ~25 min. É um bonde moderno e comprido, não o amarelinho antigo.<\/li>\n    <li><b>Se estiver lotado<\/b> (comum às 17h): Uber até a Praça do Comércio, ~€8–10, 15 min. Não perca tempo esperando o próximo.<\/li>\n    <li><b>Praça do Comércio → Rossio<\/b>: a pé pela Rua Augusta, 10 min, plano. Aqui é a janela de compras (ver Lembrancinhas).<\/li>\n    <li><b>Rossio → Castelo.<\/b> Subida forte, 20 min. Para poupar: <b>ônibus 737<\/b> na Praça da Figueira, para na porta do castelo, pague a bordo em dinheiro (~€2–3). Ou tuk-tuk/Uber, €6–8.<details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">A colina já foi fortificada desde o século I a.C.; as muralhas que se veem hoje são principalmente do período mouro, dos séculos IX a XI. Em 1147, D. Afonso Henriques tomou o castelo dos mouros com a ajuda de cruzados que seguiam a caminho da Terra Santa e pararam em Lisboa a caminho — um dos episódios mais citados da Reconquista ibérica. Foi residência real até o século XVI, quando a corte se mudou para o que hoje é a Praça do Comércio, à beira-rio. O terramoto de 1755 arrasou boa parte da estrutura, e o castelo só ganhou a cara atual numa restauração pesada dos anos 1940, feita pelo Estado Novo — alguns historiadores discutem até hoje quanto daquilo é fiel ao original.<\/div><\/details><\/li>\n    <li><b>Castelo → Santa Luzia → A Baiuca<\/b>: só descida, a pé, 5–10 min cada trecho.<\/li>\n    <li><b>Volta para Belém, 22h.<\/b> Chame o Uber no <b>Largo das Portas do Sol<\/b> (as ruelas de Alfama não têm onde parar carro). ~€10–12, 15 min.<\/li>\n  <\/ol>\n\n  <h3>Saída para Paris, 25/09<\/h3>\n  <ol class=\"steps\">\n    <li><b>07:15 Uber Belém → Aeroporto<\/b>, 25 min. Peça às 07:05: de manhã os carros demoram um pouco mais em Belém.<\/li>\n    <li>Terminal 1. O check-in da Transavia é online (30 h antes); direto para a segurança.<\/li>\n  <\/ol>\n\n  <h3>Volta, 05 e 06/10<\/h3>\n  <ol class=\"steps\">\n    <li><b>20:05 pouso → Uber até a casa da Patrícia<\/b> (Estrela/São Bento), ~20 min, €12–18. Mandar mensagem à Patrícia ainda em Berlim, com a hora prevista na casa dela (~21h), e de novo ao pousar.<\/li>\n    <li><b>Casa → Café de São Bento<\/b>: a pé, ~10 min, é na mesma rua.<\/li>\n    <li><b>06/10, 06:15 Uber para o aeroporto.<\/b> Voo intercontinental às 10h: chegar 07:30 é o mínimo, e a saída de Schengen tem controle biométrico de novo. Sair às 06:15 dá folga real; o roteiro diz 07:00 e isso é justo demais.<\/li>\n  <\/ol>\n\n  <h3>E se…<\/h3>\n  <ol class=\"steps\">\n    <li><b>A imigração passar de 1h30.<\/b> Malas na hospedagem e direto ao Mosteiro, sem o café dos Pastéis: a fila deles anda o dia inteiro, o Jerónimos não. Pastel na saída, às 11h.<\/li>\n    <li><b>Chover em Belém.<\/b> Jerónimos por dentro (claustro, 1 h) em vez do passeio à beira-rio; o MAAT fica ao lado da Torre e o Museu dos Coches ao lado do Mosteiro. A tarde na Baixa e em Alfama é a mesma, com tênis de sola boa: a calçada molhada escorrega.<\/li>\n    <li><b>O 15E não aparecer ou vier lotado.<\/b> Uber, sem esperar o próximo: €8–10 e 15 min, e a tarde não atrasa.<\/li>\n    <li><b>O TP533 atrasar na volta, dia 05.<\/b> Até 2 h: avisar a Patrícia e seguir o plano. Acima de 3 h: o voo das 10h do dia seguinte não espera, e a saída às 06:15 precisa de sono; considerem hotel no aeroporto e avisar a Patrícia que não vão.<\/li>\n  <\/ol>\n\n  <h3 id=\"glossario\">Glossário<\/h3>\n  <dl class=\"gloss\">\n    <div id=\"g-eletrico\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Elétrico','pt-PT',this)\" aria-label=\"Ouvir Elétrico\">🔊<\/button> Elétrico<\/dt><dd>Bonde. O <b>15E<\/b> é moderno e vai a Belém; o <b>28<\/b> é o amarelo antigo, cheio e cheio de batedores de carteira.<\/dd><\/div>\n    <div id=\"g-carris\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Carris','pt-PT',this)\" aria-label=\"Ouvir Carris\">🔊<\/button> Carris<\/dt><dd>Empresa dos ônibus e elétricos. O Google Maps mostra os horários dela ao vivo.<\/dd><\/div>\n    <div id=\"g-metro\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Metro','pt-PT',this)\" aria-label=\"Ouvir Metro\">🔊<\/button> Metro<\/dt><dd>4 linhas por cor. A <b>vermelha<\/b> sai do aeroporto. Vocês não vão precisar dele neste roteiro.<\/dd><\/div>\n    <div id=\"g-navegante\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Navegante','pt-PT',this)\" aria-label=\"Ouvir Navegante\">🔊<\/button> Navegante<\/dt><dd>Cartão recarregável de transporte (€0,50). Só compensa a partir de 3–4 viagens. Não comprem.<\/dd><\/div>\n    <div id=\"g-zapping\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Zapping','pt-PT',this)\" aria-label=\"Ouvir Zapping\">🔊<\/button> Zapping<\/dt><dd>Modo do Navegante em que você carrega dinheiro e paga por viagem (~€1,85). Idem: não precisam.<\/dd><\/div>\n    <div id=\"g-validar\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Validar','pt-PT',this)\" aria-label=\"Ouvir Validar\">🔊<\/button> Validar<\/dt><dd>Encostar o cartão no leitor ao entrar. Só se aplica ao Navegante; pagando a bordo, não há o que validar.<\/dd><\/div>\n    <div id=\"g-paragem\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Paragem','pt-PT',this)\" aria-label=\"Ouvir Paragem\">🔊<\/button> Paragem<\/dt><dd>Ponto de ônibus/bonde.<\/dd><\/div>\n    <div id=\"g-tvde\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('TVDE','pt-PT',this)\" aria-label=\"Ouvir TVDE\">🔊<\/button> TVDE<\/dt><dd>Nome oficial em Portugal para Uber, Bolt etc. É o que está escrito nas placas do aeroporto.<\/dd><\/div>\n    <div id=\"g-miradouro\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Miradouro','pt-PT',this)\" aria-label=\"Ouvir Miradouro\">🔊<\/button> Miradouro<\/dt><dd>Mirante. Santa Luzia e Portas do Sol são os dois de Alfama, um ao lado do outro.<\/dd><\/div>\n    <div id=\"g-calcada\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Calçada','pt-PT',this)\" aria-label=\"Ouvir Calçada\">🔊<\/button> Calçada<\/dt><dd>O piso de pedrinhas brancas e pretas. Escorrega quando molhado: tênis.<\/dd><\/div>\n  <\/dl>\n\n  <h3>Apps: qual e por quê<\/h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">🚕<\/div><div><b>Uber e Bolt<\/b><span>Os dois, porque o preço varia muito na hora. Bolt costuma ser um pouco mais barato em Lisboa.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">🗺️<\/div><div><b>Google Maps<\/b><span>Horários da <a class=\"gl\" href=\"#g-carris\">Carris<\/a> em tempo real e o mapa offline. É o único app de transporte que vocês precisam em Lisboa.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">💬<\/div><div><b>WhatsApp<\/b><span>A Baiuca confirma reserva por Instagram/WhatsApp; a Patrícia é por aqui também.<\/span><\/div><\/div>\n  <\/div>\n\n  <h3>Quanto custa<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Trecho<\/th><th>Como<\/th><th>Os dois<\/th><\/tr>\n    <tr><td>Aeroporto → Belém<\/td><td>Uber/Bolt<\/td><td>€15–20<\/td><\/tr>\n    <tr><td>Belém → Praça do Comércio<\/td><td>15E, a bordo<\/td><td>€6<\/td><\/tr>\n    <tr><td>Rossio → Castelo<\/td><td>ônibus 737 ou tuk-tuk<\/td><td>€5–8<\/td><\/tr>\n    <tr><td>Alfama → Belém<\/td><td>Uber<\/td><td>€10–12<\/td><\/tr>\n    <tr><td>Belém → Aeroporto (25/09)<\/td><td>Uber<\/td><td>€15–20<\/td><\/tr>\n    <tr><td>Aeroporto ↔ Estrela (05–06/10)<\/td><td>Uber ×2<\/td><td>€25–35<\/td><\/tr>\n    <tr><td colspan=\"2\"><b>Total transporte em Lisboa<\/b><\/td><td><b>~€80–100<\/b><\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia<\/h2>\n  <p class=\"lead\">Os pontos estão nas posições reais (coordenadas), sobre um fundo simplificado: rio, praças e colinas. Distâncias dentro de cada quadro são proporcionais; entre quadros, não. Nos quadros do dia, toque no número de um trecho para ver como fazer.<\/p>\n\n  <style>\n    .m{font-family:\"Public Sans\",system-ui,sans-serif;font-size:10.5px;fill:var(--ink)}\n    .ms{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;fill:var(--muted)}\n    .mh{font-family:\"Fraunces\",Georgia,serif;font-size:13px;font-weight:600;fill:var(--azul)}\n    .mg{font-family:\"Fraunces\",Georgia,serif;font-size:11px;font-style:italic;fill:var(--muted);opacity:.7}\n    .water{fill:var(--azul-tint)}\n    .hill{fill:var(--line);opacity:.35}\n    .street{stroke:var(--line);stroke-width:5;fill:none;stroke-linecap:round}\n    .walk{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:3 4;stroke-linecap:round}\n    .tram{stroke:var(--amarelo);stroke-width:4;fill:none;stroke-linecap:round}\n    .uber{stroke:var(--azul);stroke-width:2.5;fill:none;stroke-linecap:round}\n    .pt{fill:var(--azul);stroke:var(--bg);stroke-width:1.5}\n    .eat{fill:var(--amarelo);stroke:var(--ink);stroke-width:1.2}\n    .shop{fill:var(--bg);stroke:var(--azul);stroke-width:2}\n    .bed{fill:var(--ok);stroke:var(--bg);stroke-width:1.5}\n    .num{font-family:\"Public Sans\",sans-serif;font-size:8px;font-weight:700;fill:#fff}\n  <\/style>\n\n  <!-- visão geral -->\n  <figure>\n    <svg viewBox=\"0 0 360 90\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Visão geral: Belém a oeste, Baixa e Alfama a leste, aeroporto a nordeste\">\n      <rect x=\"0\" y=\"66\" width=\"360\" height=\"24\" class=\"water\"/>\n      <text x=\"8\" y=\"82\" class=\"mg\">rio Tejo<\/text>\n      <circle cx=\"60\" cy=\"52\" r=\"7\" class=\"pt\"/><text x=\"30\" y=\"40\" class=\"m\">Belém<\/text>\n      <path d=\"M67 52 L253 52\" class=\"tram\"/><text x=\"118\" y=\"46\" class=\"ms\">elétrico 15E · 7 km · 25 min<\/text>\n      <circle cx=\"260\" cy=\"52\" r=\"7\" class=\"pt\"/><text x=\"234\" y=\"40\" class=\"m\">Baixa · Alfama<\/text>\n      <text x=\"294\" y=\"18\" class=\"m\">✈ aeroporto<\/text>\n      <path d=\"M318 22 C 250 30, 120 30, 66 46\" class=\"uber\"/>\n      <path d=\"M318 22 C 300 34, 280 40, 266 46\" class=\"uber\"/>\n      <text x=\"110\" y=\"26\" class=\"ms\">Uber 20 min<\/text>\n    <\/svg>\n    <figcaption>Onde cada quadro fica em relação aos outros.<\/figcaption>\n  <\/figure>\n\n  <!-- quadro A: Belém -->\n  <figure>\n    <svg viewBox=\"0 0 360 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Belém, manhã de 24 de setembro\">\n      <path d=\"M0 162 L60 162 Q100 150 200 156 T360 150 L360 215 L0 215 Z\" class=\"water\"/>\n      <text x=\"300\" y=\"200\" class=\"mg\">rio Tejo<\/text>\n      <path d=\"M120 78 L360 78\" class=\"street\"/><text x=\"295\" y=\"70\" class=\"ms\">Rua de Belém<\/text>\n      <path d=\"M0 118 L360 118\" class=\"street\" style=\"stroke-width:3;opacity:.6\"/><text x=\"8\" y=\"112\" class=\"ms\">Av. da Índia · linha do trem<\/text>\n      <rect x=\"192\" y=\"86\" width=\"52\" height=\"28\" class=\"hill\" rx=\"3\"/><text x=\"197\" y=\"103\" class=\"ms\">Praça do Império<\/text>\n      <text x=\"14\" y=\"26\" class=\"mh\">Belém · 09:00–17:00 · tudo a pé, plano<\/text>\n\n      <!-- chegada -->\n      <text x=\"249\" y=\"26\" class=\"m\">✈ Uber do aeroporto<\/text>\n      <path d=\"M340 30 C 330 45, 300 55, 262 64\" class=\"r-hit\" data-r=\"1\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M340 30 C 330 45, 300 55, 262 64\" class=\"uber r-path\" data-r=\"1\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n\n      <!-- caminhada -->\n      <path d=\"M213 69 L253 72\" class=\"r-hit\" data-r=\"2\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M213 69 L253 72\" class=\"walk r-path\" data-r=\"2\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n      <path d=\"M258 84 L228 132\" class=\"r-hit\" data-r=\"3\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M258 84 L228 132\" class=\"walk r-path\" data-r=\"3\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n      <path d=\"M220 140 C 180 158, 130 165, 94 168\" class=\"r-hit\" data-r=\"4\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M220 140 C 180 158, 130 165, 94 168\" class=\"walk r-path\" data-r=\"4\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n\n      <!-- pontos -->\n      <rect x=\"247\" y=\"64\" width=\"12\" height=\"12\" class=\"bed\"/><text x=\"239\" y=\"60\" class=\"m\">Famous Crows (malas)<\/text>\n      <circle cx=\"258\" cy=\"82\" r=\"6\" class=\"eat\"/><text x=\"266\" y=\"86\" class=\"m\">Pastéis de Belém<\/text>\n      <circle cx=\"292\" cy=\"96\" r=\"5\" class=\"eat\"/><text x=\"258\" y=\"100\" class=\"m\">Almoço: 3 opções<\/text>\n      <circle cx=\"213\" cy=\"69\" r=\"6\" class=\"pt\"/><text x=\"150\" y=\"60\" class=\"m\">Jerónimos<\/text>\n      <circle cx=\"235\" cy=\"78\" r=\"4\" class=\"tram\" style=\"fill:var(--amarelo);stroke:none\"/><text x=\"180\" y=\"130\" class=\"ms\">parada 15E \"Mosteiro dos Jerónimos\"<\/text>\n      <path d=\"M235 82 L235 122\" class=\"ms\" style=\"stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2\"/>\n      <circle cx=\"224\" cy=\"137\" r=\"6\" class=\"pt\"/><text x=\"211\" y=\"141\" class=\"m\">Padrão dos Descobrimentos<\/text>\n      <circle cx=\"87\" cy=\"169\" r=\"6\" class=\"pt\"/><text x=\"20\" y=\"150\" class=\"m\">Torre de Belém<\/text>\n      <text x=\"100\" y=\"188\" class=\"ms\">beira-rio 15 min<\/text>\n    <g class=\"r-badge taxi\" data-r=\"1\" data-map=\"lisboa-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: Uber/Bolt · aeroporto → Famous Crows\" transform=\"translate(303.6,52.2)\"><circle r=\"9\"/><text y=\".5\">1<\/text><\/g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"lisboa-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A pé · malas → Pastéis → Jerónimos\" transform=\"translate(233,70.5)\"><circle r=\"9\"/><text y=\".5\">2<\/text><\/g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"lisboa-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A pé · Jerónimos → Padrão dos Descobrimentos\" transform=\"translate(243,108)\"><circle r=\"9\"/><text y=\".5\">3<\/text><\/g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"lisboa-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A pé · Padrão → Torre de Belém, pela beira-rio\" transform=\"translate(158.2,159.1)\"><circle r=\"9\"/><text y=\".5\">4<\/text><\/g><\/svg>\n    <figcaption>Quadro A · Belém. Da Torre de volta à hospedagem são 15 min pela beira-rio.<\/figcaption>\n  <div class=\"rota-painel\" id=\"rp-lisboa-1\" aria-live=\"polite\"><\/div><\/figure>\n\n  <!-- quadro B: Baixa, Chiado, Alfama -->\n  <figure>\n    <svg viewBox=\"0 0 360 235\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Baixa, Chiado e Alfama, tarde e noite de 24 de setembro\">\n      <path d=\"M0 196 Q120 186 200 192 T360 188 L360 235 L0 235 Z\" class=\"water\"/>\n      <text x=\"8\" y=\"222\" class=\"mg\">rio Tejo<\/text>\n      <ellipse cx=\"250\" cy=\"82\" rx=\"62\" ry=\"48\" class=\"hill\"/><text x=\"215\" y=\"40\" class=\"mg\">colina do castelo<\/text>\n      <ellipse cx=\"102\" cy=\"112\" rx=\"52\" ry=\"42\" class=\"hill\"/><text x=\"70\" y=\"78\" class=\"mg\">Chiado (sobe)<\/text>\n      <rect x=\"168\" y=\"156\" width=\"34\" height=\"24\" class=\"hill\" style=\"opacity:.6\"/>\n      <path d=\"M185 156 L167 70\" class=\"street\"/><text x=\"192\" y=\"120\" class=\"ms\">Rua Augusta<\/text>\n      <text x=\"14\" y=\"26\" class=\"mh\">Baixa · Chiado · Alfama · 17:30–22:00<\/text>\n\n      <!-- chegada do 15E -->\n      <path d=\"M0 176 C 60 176, 130 180, 180 176\" class=\"r-hit\" data-r=\"1\" data-map=\"lisboa-2\" tabindex=\"-1\"/><path d=\"M0 176 C 60 176, 130 180, 180 176\" class=\"tram r-path\" data-r=\"1\" data-map=\"lisboa-2\" tabindex=\"-1\"/><text x=\"20\" y=\"170\" class=\"ms\">15E de Belém<\/text>\n\n      <!-- caminhadas -->\n      <path d=\"M185 160 L165 72\" class=\"r-hit\" data-r=\"2\" data-map=\"lisboa-2\" tabindex=\"-1\"/><path d=\"M185 160 L165 72\" class=\"walk r-path\" data-r=\"2\" data-map=\"lisboa-2\" tabindex=\"-1\"/>\n      <path d=\"M170 68 C 200 40, 230 60, 228 76\" class=\"r-hit\" data-r=\"3\" data-map=\"lisboa-2\" tabindex=\"-1\"/><path d=\"M170 68 C 200 40, 230 60, 228 76\" class=\"walk r-path\" data-r=\"3\" data-map=\"lisboa-2\" tabindex=\"-1\"/>\n      <path d=\"M232 74 C 255 90, 265 96, 270 100\" class=\"r-hit\" data-r=\"4\" data-map=\"lisboa-2\" tabindex=\"-1\"/><path d=\"M232 74 C 255 90, 265 96, 270 100\" class=\"walk r-path\" data-r=\"4\" data-map=\"lisboa-2\" tabindex=\"-1\"/>\n      <path d=\"M273 106 L281 114\" class=\"r-hit\" data-r=\"5\" data-map=\"lisboa-2\" tabindex=\"-1\"/><path d=\"M273 106 L281 114\" class=\"walk r-path\" data-r=\"5\" data-map=\"lisboa-2\" tabindex=\"-1\"/>\n text x=\"291\" y=\"84\" class=\"ms\">Tasca do Chico<\/text>\n      <!-- Chiado shops -->\n      <circle cx=\"125\" cy=\"120\" r=\"4\" class=\"shop\"/><text x=\"52\" y=\"123\" class=\"ms\">Bertrand<\/text>\n      <circle cx=\"150\" cy=\"129\" r=\"4\" class=\"shop\"/><text x=\"98\" y=\"142\" class=\"ms\">A Vida Portuguesa<\/text>\n      <circle cx=\"96\" cy=\"88\" r=\"4\" class=\"shop\"/><text x=\"30\" y=\"92\" class=\"ms\">Claus Porto<\/text>\n      <circle cx=\"86\" cy=\"118\" r=\"4\" class=\"shop\"/><text x=\"38\" y=\"108\" class=\"ms\">Manteigaria<\/text>\n      <circle cx=\"116\" cy=\"109\" r=\"4\" class=\"eat\"/><text x=\"20\" y=\"134\" class=\"ms\">Honorato (plano B)<\/text>\n      <circle cx=\"64\" cy=\"176\" r=\"5\" class=\"eat\"/><text x=\"30\" y=\"192\" class=\"ms\">Time Out Market (chuva)<\/text>\n    <g class=\"r-badge transit\" data-r=\"1\" data-map=\"lisboa-2\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: Elétrico 15E · Belém → Praça do Comércio\" transform=\"translate(90,177.4)\"><circle r=\"9\"/><text y=\".5\">1<\/text><\/g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"lisboa-2\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A pé · Comércio → Rossio, pela Rua Augusta\" transform=\"translate(175,116)\"><circle r=\"9\"/><text y=\".5\">2<\/text><\/g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"lisboa-2\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A pé ou ônibus · Rossio → Castelo\" transform=\"translate(203,54)\"><circle r=\"9\"/><text y=\".5\">3<\/text><\/g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"lisboa-2\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A pé · Castelo → Santa Luzia\" transform=\"translate(251,87)\"><circle r=\"9\"/><text y=\".5\">4<\/text><\/g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"lisboa-2\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A pé · Santa Luzia → A Baiuca\" transform=\"translate(277,110)\"><circle r=\"9\"/><text y=\".5\">5<\/text><\/g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"lisboa-2\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A pé (desvio opcional) · Baixa → Chiado\" transform=\"translate(151,145)\"><circle r=\"9\"/><text y=\".5\">6<\/text><\/g><g class=\"r-badge walk\" data-r=\"7\" data-map=\"lisboa-2\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 7: A pé (desvio opcional) · Chiado → Castelo\" transform=\"translate(140.7,93.4)\"><circle r=\"9\"/><text y=\".5\">7<\/text><\/g><\/svg>\n    <figcaption>Quadro B · Baixa e Alfama. Linha cinza: caminho do roteiro; linha clara: desvio opcional pelo Chiado.<\/figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"><\/i>ponto do roteiro<\/span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"><\/i>comer<\/span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"><\/i>loja<\/span>\n      <span><i style=\"background:var(--ok)\"><\/i>hospedagem<\/span>\n      <span>— — a pé<\/span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">━<\/span> <a class=\"gl\" href=\"#g-eletrico\">elétrico<\/a><\/span>\n      <span><span style=\"color:var(--azul);font-weight:900\">━<\/span> Uber<\/span>\n    <\/div>\n  <div class=\"rota-painel\" id=\"rp-lisboa-2\" aria-live=\"polite\"><\/div><\/figure>\n\n  <!-- quadro C: São Bento -->\n  <figure>\n    <svg viewBox=\"0 0 360 175\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"São Bento e Estrela, 5 e 6 de outubro\">\n      <path d=\"M40 40 L150 160\" class=\"street\"/><text x=\"150\" y=\"168\" class=\"ms\">Rua de São Bento<\/text>\n      <rect x=\"60\" y=\"128\" width=\"40\" height=\"22\" class=\"hill\"/><text x=\"8\" y=\"160\" class=\"ms\">Assembleia (Parlamento)<\/text>\n      <text x=\"14\" y=\"22\" class=\"mh\">São Bento · seg 05/10, noite<\/text>\n      <text x=\"270\" y=\"22\" class=\"m\">✈ aeroporto<\/text>\n      <path d=\"M300 26 C 260 50, 200 60, 140 78\" class=\"r-hit\" data-r=\"1\" data-map=\"lisboa-3\" tabindex=\"-1\"/><path d=\"M300 26 C 260 50, 200 60, 140 78\" class=\"uber r-path\" data-r=\"1\" data-map=\"lisboa-3\" tabindex=\"-1\"/><text x=\"200\" y=\"52\" class=\"ms\">Uber 20 min · €12–18<\/text>\n      <rect x=\"128\" y=\"76\" width=\"12\" height=\"12\" class=\"bed\"/><text x=\"146\" y=\"80\" class=\"m\">casa da Patrícia (Estrela)<\/text>\n      <text x=\"146\" y=\"92\" class=\"ms\">posição aproximada<\/text>\n      <path d=\"M134 90 L120 128\" class=\"r-hit\" data-r=\"2\" data-map=\"lisboa-3\" tabindex=\"-1\"/><path d=\"M134 90 L120 128\" class=\"walk r-path\" data-r=\"2\" data-map=\"lisboa-3\" tabindex=\"-1\"/><text x=\"150\" y=\"116\" class=\"ms\">a pé ~10 min<\/text>\n      <circle cx=\"118\" cy=\"131\" r=\"6\" class=\"eat\"/><text x=\"128\" y=\"135\" class=\"m\">Café de São Bento<\/text>\n      <circle cx=\"120\" cy=\"140\" r=\"4\" class=\"eat\"/><text x=\"128\" y=\"150\" class=\"ms\">O Jardim Sr. Lisboa (vizinho)<\/text>\n      <circle cx=\"108\" cy=\"116\" r=\"4\" class=\"eat\"/><text x=\"20\" y=\"112\" class=\"ms\">Madam Bo (fecha seg)<\/text>\n      <circle cx=\"48\" cy=\"46\" r=\"5\" class=\"eat\"/><text x=\"56\" y=\"42\" class=\"m\">Churrasqueira de São Bento<\/text>\n      <text x=\"56\" y=\"54\" class=\"ms\">10 min subindo a rua<\/text>\n      <path d=\"M140 80 C 200 70, 260 44, 300 28\" class=\"r-hit\" data-r=\"3\" data-map=\"lisboa-3\" tabindex=\"-1\"/><path d=\"M140 80 C 200 70, 260 44, 300 28\" class=\"uber r-path\" style=\"stroke-dasharray:6 4\" data-r=\"3\" data-map=\"lisboa-3\" tabindex=\"-1\"/>\n      <text x=\"196\" y=\"40\" class=\"ms\" style=\"fill:var(--azul)\">06/10 · 06:15<\/text>\n    <g class=\"r-badge taxi\" data-r=\"1\" data-map=\"lisboa-3\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: Uber · aeroporto → casa da Patrícia (Estrela)\" transform=\"translate(292,33)\"><circle r=\"9\"/><text y=\".5\">1<\/text><\/g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"lisboa-3\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A pé · casa da Patrícia → Café de São Bento\" transform=\"translate(127,109)\"><circle r=\"9\"/><text y=\".5\">2<\/text><\/g><g class=\"r-badge taxi\" data-r=\"3\" data-map=\"lisboa-3\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: Uber · casa → aeroporto, 06/10 06:15\" transform=\"translate(155,84)\"><circle r=\"9\"/><text y=\".5\">3<\/text><\/g><\/svg>\n    <figcaption>Quadro C · a noite com a Patrícia. Tudo a pé na mesma rua.<\/figcaption>\n  <div class=\"rota-painel\" id=\"rp-lisboa-3\" aria-live=\"polite\"><\/div><\/figure>\n\n  <p>Mapa real com os pontos do dia 24: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Aeroporto+de+Lisboa&destination=A+Baiuca%2C+Rua+de+S%C3%A3o+Miguel+20&waypoints=Famous+Crows+Lisbon+Suites%7CPast%C3%A9is+de+Bel%C3%A9m%7CTorre+de+Bel%C3%A9m%7CPra%C3%A7a+do+Com%C3%A9rcio%7CA+Ginjinha%2C+Largo+de+S%C3%A3o+Domingos%7CCastelo+de+S%C3%A3o+Jorge%7CMiradouro+de+Santa+Luzia&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir a rota no Google Maps<\/a>.<\/p>\n<\/section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 opções por parada<\/h2>\n  <p class=\"lead\">A primeira de cada trio é a escolha do roteiro ou a que eu escolheria. Horários conferidos para o dia da semana em que vocês estarão lá. Preços por pessoa, sem vinho.<\/p>\n\n  <div class=\"meal\">\n    <h3>Café da manhã · qui 24/09, 09:00 · Belém<\/h3>\n    <p class=\"when\">Aqui não há trio: é Pastéis de Belém. Fila do balcão anda rápido; para sentar, entre e procure os salões do fundo. ~€1,50 o pastel, ~€5 com café.<\/p>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · qui 24/09, 12:30 · Belém<\/h3>\n    <p class=\"when\">Os três ficam a menos de 5 min a pé da hospedagem. Belém tem muita armadilha turística na rua principal; estes três são as exceções que os moradores usam.<\/p>\n\n    <div class=\"opt pick\"><h4>Taberna dos Ferreiros <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Travessa dos Ferreiros a Belém 5, ruela de trás, 2 min da Rua de Belém.<\/span>\n        <b>Por quê<\/b><span>Cozinha portuguesa de verdade escondida numa travessa, sem cardápio com foto. Nota 4,6 em quase 2 mil avaliações.<\/span>\n        <b>Estrela<\/b><span>Polvo guisado em molho de tomate. O atum também é elogiado.<\/span>\n        <b>Custo<\/b><span>€18–25.<\/span>\n        <b>Horário<\/b><span>Quinta 12h–15h. Reservar é prudente: +351 21 587 3837.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Adega de Belém<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rua de Belém 40, a 100 m da hospedagem.<\/span>\n        <b>Por quê<\/b><span>Adega tradicional com azulejos azuis e brancos, mistura de moradores e turistas, porção generosa.<\/span>\n        <b>Estrela<\/b><span>Sardinhas grelhadas e arroz de marisco (a porção “para dois” serve quatro).<\/span>\n        <b>Custo<\/b><span>€15–22. Pão, manteiga e azeitonas na mesa são cobrados: recuse se não quiser.<\/span>\n        <b>Horário<\/b><span>Quinta 12h–16h30. Chega cheio às 13h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Miolo<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rua de Belém 36.<\/span>\n        <b>Por quê<\/b><span>Se estiverem sem fome de prato grande depois dos pastéis: café de brunch, leve, muitas opções vegetais, nota 4,8.<\/span>\n        <b>Estrela<\/b><span>Slider de bochecha de porco; salmão crocante.<\/span>\n        <b>Custo<\/b><span>€10–15.<\/span>\n        <b>Horário<\/b><span>9h–16h30.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Lanche · qui 24/09, ~17:45 · Rossio<\/h3>\n    <p class=\"when\">Ginjinha no balcão da <b>A Ginjinha<\/b> (Largo de São Domingos 8): ~€2 o copinho, “com” ou “sem” a cereja, só dinheiro. Toma-se de pé na <a class=\"gl\" href=\"#g-calcada\">calçada<\/a>. É o ritual, não a refeição.<\/p>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar com fado · qui 24/09, 20:00 · Alfama<\/h3>\n    <p class=\"when\">Regra das casas de fado: o jantar gira em torno da música. Quando a luz baixa, silêncio total; o garçom não vem. Nas três, reservar é obrigatório.<\/p>\n\n    <div class=\"opt pick\"><h4>A Baiuca <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rua de São Miguel 20, 5 min descendo de Santa Luzia.<\/span>\n        <b>Por quê<\/b><span>Sala de 30 lugares, a experiência mais íntima e menos encenada de Alfama.<\/span>\n        <b>Estrela<\/b><span>Carne de porco à alentejana; guisado de porco com batata.<\/span>\n        <b>Custo<\/b><span>Mínimo ~€25 por pessoa em comida; espere €30–40.<\/span>\n        <b>Horário<\/b><span>Abre às 20h. Reserva por telefone (+351 939 457 098) ou mensagem no Instagram; eles respondem melhor no Instagram. Diga se não quiser os petiscos que já vêm na mesa: são cobrados.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">Fado vadio: quem canta são amadores e vizinhos da casa — às vezes a própria dona. Nada de músicos contratados. O fado é Patrimônio Cultural Imaterial da Humanidade pela UNESCO desde 2011, reconhecido como a música urbana de Lisboa por excelência, nascida no século XIX nos bairros populares como Alfama e Mouraria — a tradição diz que surgiu entre marinheiros, prostitutas e a saudade de quem ficava no cais.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>Parreirinha de Alfama<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Largo do Chafariz de Dentro, no pé de Alfama, 8 min de Santa Luzia.<\/span>\n        <b>Por quê<\/b><span>Fadistas profissionais, três por noite. É a opção “fado de qualidade garantida”.<\/span>\n        <b>Estrela<\/b><span>Bochecha de porco. Menu fixo com entrada, prato e sobremesa.<\/span>\n        <b>Custo<\/b><span>€45–55 (menu fixo, bebidas à parte).<\/span>\n        <b>Horário<\/b><span>Quinta 19h30–00h30. Chegar às 20h para jantar antes de a música começar. +351 21 886 8209.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Fundada por Argentina Santos, cantora que virou uma das grandes referências do fado do século XX — ela começou a cantar ainda criança na taberna do pai, em Alfama, e nunca teve formação musical formal. A casa abriu em 1952 e continua na família; é uma das últimas do bairro a manter fadistas profissionais contratados todas as noites, em vez de sessões abertas a amadores.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>Tasca do Chico Alfama<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rua dos Remédios 83, 10 min de Santa Luzia.<\/span>\n        <b>Por quê<\/b><span>Fado amador num salão de família, com moradores entrando para cantar. A noite inteira dura 4 horas.<\/span>\n        <b>Estrela<\/b><span>Menu fixo de 4 pratos de petiscos partilhados.<\/span>\n        <b>Custo<\/b><span>~€35 fixo. <b>Só dinheiro.<\/b><\/span>\n        <b>Horário<\/b><span>Quinta 20h30–2h. +351 961 339 697.<\/span>\n      <\/div><\/div>\n\n    <div class=\"note\">Plano sem fado (chuva, cansaço ou reserva que não deu): <b>Honorato Chiado<\/b>, Largo Rafael Bordalo Pinheiro 12, hambúrguer artesanal, €15–20, quinta até 23h. Ou o <b>Time Out Market<\/b> (Cais do Sodré), coberto, 30 bancas dos melhores chefs da cidade, €15–25, até meia-noite.<\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar de despedida · seg 05/10, 21:30 · São Bento<\/h3>\n    <p class=\"when\">Os três estão na Rua de São Bento, a rua da casa da Patrícia. O primeiro e o segundo são vizinhos de porta.<\/p>\n\n    <div class=\"opt pick\"><h4>Café de São Bento <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rua de São Bento 212, em frente ao jardim do Parlamento. Toca-se a campainha para entrar.<\/span>\n        <b>Por quê<\/b><span>O bife de referência de Lisboa desde 1982, frequentado pelos deputados.<\/span>\n        <b>Estrela<\/b><span>Bife à Café de São Bento: filé com molho de natas e batata palha, ovo opcional. O steak tartare também é dos melhores da cidade.<\/span>\n        <b>Custo<\/b><span>€35–45 com uma taça.<\/span>\n        <b>Horário<\/b><span>Segunda 19h–1h. <b>Reservar: +351 913 658 343.<\/b><\/span>\n      <\/div>\n      <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">O salão é de veludo vermelho e madeira escura, decoração de século XIX que sobrevive quase intacta. A casa abriu em 1982 num prédio bem mais antigo, de frente para o jardim da Assembleia da República — daí o público fiel de deputados e jornalistas políticos, que fizeram do restaurante quase uma extensão informal do Parlamento.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>O Jardim Sr. Lisboa<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rua de São Bento 202, porta ao lado.<\/span>\n        <b>Por quê<\/b><span>Cozinha portuguesa com toque asiático, num salão com uma árvore no meio. Se a Patrícia já conhece o São Bento de cor, aqui é a alternativa mais leve e mais atual.<\/span>\n        <b>Estrela<\/b><span>Ceviche de corvina, peixinhos da horta, batata frita com parmesão.<\/span>\n        <b>Custo<\/b><span>€30–40 em pratos para partilhar.<\/span>\n        <b>Horário<\/b><span>Segunda 12h–0h. +351 21 396 1529.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Churrasqueira de São Bento<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Rua de São Bento 708, 10 min subindo a rua.<\/span>\n        <b>Por quê<\/b><span>Frango de churrasco português, o prato que os lisboetas comem de verdade numa segunda à noite. Fachada feia, comida ótima, conta de €12 por pessoa com vinho.<\/span>\n        <b>Estrela<\/b><span>Meio frango com piri-piri, arroz e batata.<\/span>\n        <b>Custo<\/b><span>€10–14.<\/span>\n        <b>Horário<\/b><span>Segunda 18h–0h. Sem reserva.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Café da manhã · ter 06/10 · aeroporto<\/h3>\n    <p class=\"when\">Saída às 06:15 não deixa tempo em casa. Depois da segurança, no Terminal 1, há uma <b>Manteigaria<\/b> e uma <b>Pastéis de Belém<\/b>: último pastel de nata da viagem, e é a comparação que todo mundo faz.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Lisboa<\/h2>\n  <p class=\"lead\">Ponto que o roteiro não resolvia: <b>a única janela de compras em Lisboa é 17:30–18:30 do dia 24, na Baixa.<\/b> No dia 05 vocês chegam às 21h e no dia 06 saem às 6h. O que não for comprado na quinta fica para o aeroporto ou para as outras cidades.<\/p>\n\n  <div class=\"warn\">Mala de mão de 10 kg: conservas pesam (~120 g a lata), azulejo pesa (~300 g), vinho não passa na segurança. Sabonete, cortiça e uma lata ou duas cabem.<\/div>\n\n  <h3>O que é típico e onde comprar<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>O quê<\/th><th>Por quê<\/th><th>Onde (na rota)<\/th><th>Preço<\/th><\/tr>\n    <tr><td>Conservas de peixe<\/td><td>Sardinha, atum, bacalhau em lata de design; o presente mais português que cabe na mala.<\/td><td>Conserveira de Lisboa (Rua dos Bacalhoeiros 34, 2 min da Praça do Comércio, até 19h). Mais barata e mais honesta que as lojas coloridas de “sardinha fantástica”.<\/td><td>€3–8 a lata<\/td><\/tr>\n    <tr><td>Sabonetes Claus Porto<\/td><td>Marca de 1887, embalagem art déco, cheiro que dura. Leve e bonito.<\/td><td>Loja Claus Porto no Chiado (Rua da Misericórdia 135) ou A Vida Portuguesa.<\/td><td>€8–15<\/td><\/tr>\n    <tr><td>Azulejo<\/td><td>Um azulejo antigo de verdade, de demolição, não a réplica de ímã.<\/td><td>Cortiço & Netos (Intendente, fora da rota, fecha 19h). Na rota: A Vida Portuguesa vende réplicas boas.<\/td><td>€5–25<\/td><\/tr>\n    <tr><td>Cerâmica Bordallo Pinheiro<\/td><td>Andorinhas, couves e sardinhas de louça, o kitsch elegante lisboeta.<\/td><td>A Vida Portuguesa (Chiado).<\/td><td>€10–40<\/td><\/tr>\n    <tr><td>Cortiça<\/td><td>Portugal produz metade da cortiça do mundo; carteiras, bolsas e porta-copos.<\/td><td>A Vida Portuguesa; lojinhas da Rua Augusta (conferir se é cortiça de verdade, não papel).<\/td><td>€5–30<\/td><\/tr>\n    <tr><td>Ginjinha em garrafa<\/td><td>O licor de ginja para levar. Compra-se no mesmo balcão onde se bebe.<\/td><td>A Ginjinha (Rossio). Só cabe na mala se for despachada: não é o caso de vocês. Comprar no free shop do aeroporto no dia 06.<\/td><td>€10–15<\/td><\/tr>\n    <tr><td>Livro carimbado<\/td><td>A Bertrand é a livraria mais antiga do mundo em funcionamento (1732) e carimba o livro comprado.<\/td><td>Livraria Bertrand, Rua Garrett 73, Chiado, até 22h.<\/td><td>preço do livro<\/td><\/tr>\n  <\/table><\/div>\n\n  <div class=\"ok\">Se quiserem fazer as compras de Lisboa, o desvio é: da Praça do Comércio, Conserveira (2 min) → Rua Augusta → subir ao Chiado pela Rua Garrett (8 min): Bertrand, A Vida Portuguesa, Claus Porto e Manteigaria estão num raio de 200 m. Depois, Chiado → Rossio são 5 min descendo. Custa uns 40 min a mais e adia o castelo para 19h — apertado para o pôr do sol (19h35). <b>Regra prática:<\/b> se estiverem na Praça do Comércio antes das 17h15, façam a versão curta (20 min): Rua Garrett até a Bertrand e a Manteigaria, e desçam ao Rossio. Depois disso, pulem o Chiado: o castelo e o pôr do sol no Santa Luzia valem mais.<\/div>\n<\/section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que só existem aqui<\/h2>\n\n  <div class=\"shop\"><b>A Vida Portuguesa<\/b><small>Rua Nova do Almada 72, Chiado · todos os dias até 19h30<\/small>\n    <p>A loja que reuniu as marcas portuguesas antigas (sabonete, lápis, pasta de dente, louça) com a embalagem original. É o resumo do país numa loja: se entrarem numa só, é esta.<\/p><\/div>\n\n  <div class=\"shop\"><b>Conserveira de Lisboa<\/b><small>Rua dos Bacalhoeiros 34, Baixa · seg–sáb até 19h<\/small>\n    <p>Só vende as três marcas da casa (Tricana, Minor, Prata do Mar). O dono explica as diferenças se perguntarem.<\/p>\n    <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Aberta em 1930, é uma das últimas lojas de Lisboa que ainda embrulha cada lata em papel à mão, no balcão, na frente do cliente. A indústria conserveira portuguesa viveu seu auge nas décadas de 1930–50, quando o país chegou a ter centenas de fábricas na região de Setúbal e Matosinhos; boa parte fechou com a concorrência asiática a partir dos anos 1970, e lojas como esta sobreviveram justamente por venderem direto ao consumidor, sem intermediário.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>Livraria Bertrand<\/b><small>Rua Garrett 73, Chiado · até 22h<\/small>\n    <p>Salas abobadadas, café no fundo, poucos títulos em inglês, e o carimbo “comprado na livraria mais antiga do mundo”.<\/p>\n    <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Aberta em 1732, está no Guinness como a livraria mais antiga do mundo ainda em funcionamento — sobreviveu ao terramoto de 1755, que destruiu o prédio original, e reabriu poucos <a class=\"gl\" href=\"#g-metro\">metros<\/a> dali. Fernando Pessoa, o maior poeta português do século XX, era cliente frequente e chegou a lançar livros por lá; as salas abobadadas onde hoje fica a seção de literatura eram, no século XVIII, parte de um antigo convento.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>Claus Porto<\/b><small>Rua da Misericórdia 135, Chiado · até 19h<\/small>\n    <p>Loja-museu da marca de sabonetes do Porto. Na quinta-feira da visita é só a loja — a barba à navalha é fim de semana.<\/p><\/div>\n\n  <div class=\"shop\"><b>Manteigaria<\/b><small>Rua do Loreto 2, Chiado · 8h–0h<\/small>\n    <p>Só de pé, com a fábrica à vista atrás do balcão. Vale por comparar: massa mais crocante e creme mais quente. Se o desvio ao Chiado acontecer, passem aqui.<\/p>\n    <details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">É a rival direta dos Pastéis de Belém — a disputa por qual pastel de nata é o melhor de Lisboa é um clássico de bar entre os lisboetas. A receita original do pastel de nata nasceu no Mosteiro dos Jerónimos, criada por freiras que usavam claras de ovo para engomar hábitos e sobravam gemas; a receita da Manteigaria é uma reinterpretação, não a fórmula secreta dos Pastéis de Belém, que continua guardada a sete chaves desde 1837.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>Casa Portuguesa do Pastel de Bacalhau<\/b><small>Rua Augusta 106 · até 23h<\/small>\n    <p>Está na rota, tem fila e vitrine bonita, e o pastel com queijo da Serra custa €8. Vale entrar para ver o salão; comer, só se a curiosidade for maior que o bolso. As avaliações concordam que é caro para o que é.<\/p><\/div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">Na rota de quinta: Conserveira · Casa do Bacalhau · A Ginjinha<\/span>\n    <span class=\"chip\">Com o desvio ao Chiado: Bertrand · A Vida Portuguesa · Claus Porto · Manteigaria<\/span>\n    <span class=\"chip\">Fora da rota: Cortiço &amp; Netos<\/span>\n  <\/div>\n<\/section>\n\n\n<\/div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"lisboa-1\": [{\"t\": \"Uber/Bolt · aeroporto → Famous Crows\", \"d\": \"~20 min · €15–20. Ponto de encontro: área \\\"Uber/Bolt/TVDE\\\" na saída das Chegadas do T1.\"}, {\"t\": \"A pé · malas → Pastéis → Jerónimos\", \"d\": \"~5 min ao todo, tudo plano.\"}, {\"t\": \"A pé · Jerónimos → Padrão dos Descobrimentos\", \"d\": \"~5 min.\"}, {\"t\": \"A pé · Padrão → Torre de Belém, pela beira-rio\", \"d\": \"~15 min. Volta à hospedagem: também 15 min pela beira-rio.\"}], \"lisboa-2\": [{\"t\": \"Elétrico 15E · Belém → Praça do Comércio\", \"d\": \"~25 min · pague ao motorista, ~€3/pessoa, dinheiro. Se lotado (comum às 17h): Uber, €8–10, 15 min.\"}, {\"t\": \"A pé · Comércio → Rossio, pela Rua Augusta\", \"d\": \"~10 min, plano — é a janela de compras de quinta.\"}, {\"t\": \"A pé ou ônibus · Rossio → Castelo\", \"d\": \"Subida forte, 20 min a pé; ou ônibus 737 na Figueira (~€2–3, a bordo); ou tuk-tuk/Uber €6–8.\"}, {\"t\": \"A pé · Castelo → Santa Luzia\", \"d\": \"Só descida, ~5 min.\"}, {\"t\": \"A pé · Santa Luzia → A Baiuca\", \"d\": \"~5–10 min, descida.\"}, {\"t\": \"A pé (desvio opcional) · Baixa → Chiado\", \"d\": \"+40 min: Bertrand, A Vida Portuguesa, Claus Porto e Manteigaria num raio de 200 m.\"}, {\"t\": \"A pé (desvio opcional) · Chiado → Castelo\", \"d\": \"Adia o castelo para 19h e aperta o pôr do sol (19h35). Só vale se chegaram à Praça do Comércio antes das 17h15 — e na versão curta (Bertrand + Manteigaria, 20 min).\"}], \"lisboa-3\": [{\"t\": \"Uber · aeroporto → casa da Patrícia (Estrela)\", \"d\": \"~20 min · €12–18. Avisar a Patrícia da chegada.\"}, {\"t\": \"A pé · casa da Patrícia → Café de São Bento\", \"d\": \"~10 min, mesma rua.\"}, {\"t\": \"Uber · casa → aeroporto, 06/10 06:15\", \"d\": \"Saída cedo por causa do controle biométrico de saída de Schengen.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n)
