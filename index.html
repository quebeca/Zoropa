bloco à parte) · sábado 03/10 (feriado: Muro, Tempelhof, Kreuzberg) · domingo 04/10 (Mauerpark) · segunda 05/10 (brunch e voo).<\/p>\n  <\/div>\n<\/header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pendências<\/a>\n  <a href=\"#transporte\">Transporte<\/a>\n  <a href=\"#mapas\">Mapas<\/a>\n  <a href=\"#comer\">Onde comer<\/a>\n  <a href=\"#notebook\">Mac mini<\/a>\n  <a href=\"#glossario\">Glossário<\/a>\n  <a href=\"#lembrancas\">Lembrancinhas<\/a>\n  <a href=\"#lojas\">Lojas<\/a>\n<\/div><\/nav>\n\n<div class=\"wrap\">\n\n<div class=\"warn\"><b>Quatro correções ao roteiro.<\/b> 1) O hotel não fica na Potsdamer Platz: fica na Luckenwalder Straße, em Kreuzberg, a 3 min da estação <b>Gleisdreieck (U1 e U2)<\/b>. A Potsdamer Platz é 15 min a pé. Isso é bom: o U2 leva direto ao centro, a Alexanderplatz e ao Mauerpark; o U1 leva direto à East Side Gallery. 2) <b>As lojas fecham no feriado de sábado 03/10 e no domingo 04/10.<\/b> Toda compra em Berlim, inclusive o Mac mini, cabe só em quinta 01/10, sexta 02/10 e segunda 05/10 até as 11h. 3) <b>O Jorge está na bitcoin++ (w3.hub, Möckernstraße 120) de qui 01 a sáb 03, durante o dia.<\/b> É a 5 min a pé do hotel; ele vai e volta a pé, sem bilhete. Os dois se encontram nas noites e no domingo inteiro. A ida à Apple (Rosenthaler Straße 44 <a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2044%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a>) é juntos, no horário em que ele sair do evento. 4) <b>A cúpula do Reichstag fica fechada para manutenção de 28/09 a 02/10<\/b> — cobre toda a estadia até sexta. A visita tá de volta pro plano original, mas no horário mais tarde que sobrou: <b>quinta 01/10, 19:30<\/b> (sábado 03/10 ficou sem vagas), antes do jantar em Potsdamer Platz — o jantar move pra depois, às 20:30. O sábado volta a ser só Tempelhof + jantar em Kreuzberg, sem desvio.<\/div>\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pendências e reservas<\/h2>\n  <div class=\"note\"><b>Lista compartilhada:<\/b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📋 abrir a planilha “Pendências zoropa 2026”<\/a> — é a versão oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe têm edição). As caixinhas abaixo são só um espelho rápido neste aparelho.<\/div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"><\/span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">🔓 travar lista<\/button><\/div>\n  <h3>O que ainda falta<\/h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-0\"> <span class=\"pend-what\">✅ Reichstag: cúpula reservada, qui 01/10 às 19:30 (grátis, nominal)<\/span> <span class=\"pend-when\">feito · levar o passaporte e a confirmação por e-mail<\/span> <span class=\"pend-how\">nome e nascimento dos dois como no passaporte<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-6\"> <span class=\"pend-what\">✅ Neues Museum (Nefertiti): comprado, 1 × €14, qui 01/10 — Tageskarte: entra a qualquer hora entre 10h e 18h<\/span> <span class=\"pend-when\">feito · 1 pessoa<\/span> <span class=\"pend-how\">entrada pela James-Simon-Galerie; Pergamon fechado até 2027. Não vale o cartão Ilha dos Museus (€24): a tarde já está tomada e não dá tempo de um segundo museu<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-1\"> <span class=\"pend-what\">Mac mini M4 Pro: reservar para retirada na Apple Rosenthaler Str., qui 01/10 às 10:00<\/span> <span class=\"pend-when\">agora · apple.com/de<\/span> <span class=\"pend-how\">os dois vão na abertura; o Jorge leva a caixa ao hotel e entra no evento às 11h<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-2\"> <span class=\"pend-what\">App BVG Fahrinfo com conta e cartão<\/span> <span class=\"pend-when\">até ter 29/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-3\"> <span class=\"pend-what\">Bilhete do dia no BVG antes de entrar no vagão<\/span> <span class=\"pend-when\">qui 01, sex 02 (24 h ABC), sáb 03, dom 04, seg 05<\/span> <span class=\"pend-how\">ver “Bilhete de cada dia”<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-4\"> <span class=\"pend-what\">Tax Free: pedir o formulário na Apple com o passaporte<\/span> <span class=\"pend-when\">qui 01/10, na loja<\/span> <span class=\"pend-how\">endereço do Brasil no formulário<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-5\"> <span class=\"pend-what\">Mapa offline de Berlim + Potsdam<\/span> <span class=\"pend-when\">até ter 29/09<\/span><\/label><\/li>\n  <\/ul>\n  <h3>Reservas e documentos<\/h3>\n  <p class=\"lead\">Os PDFs estão no Drive da conta bexorxe (privados: quem não estiver logado nela vê “pedir acesso”). 📍 abre o lugar no Maps.<\/p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">aletto Hotel Potsdamer Platz · Luckenwalder Straße<\/span> <span class=\"pend-when\">qua 30/09 check-in ~22:15 (24 h) → seg 05/10 · sala de malas no dia 05<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1TVwnqjGILtIvzs45M6TjQWvfWxpT8b1M/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 reserva (pt)<\/a> · <a href=\"https://drive.google.com/file/d/1SGo10Oe-mwDyJymjG59t0UHrvB5vZNwt/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 reserva (de)<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=aletto%20Hotel%20Potsdamer%20Platz%2C%20Luckenwalder%20Stra%C3%9Fe%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">bitcoin++ Berlin · w3.hub, Möckernstraße 120 (Jorge)<\/span> <span class=\"pend-when\">qui 01 → sáb 03/10 · portas 10–11h<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1eVwEeIboXzIe9LfrIarLV56CTxGgRyGr/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 ingresso<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=w3.hub%20M%C3%B6ckernstra%C3%9Fe%20120%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Apple Store Rosenthaler Straße 44<\/span> <span class=\"pend-when\">qui 01/10 às 10:00 (abertura), os dois<\/span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">TAP TP533 · Berlim → Lisboa<\/span> <span class=\"pend-when\">seg 05/10 17:20 · sair do hotel 14:30<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 bilhete<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Flughafen%20Berlin%20Brandenburg%20BER%20Terminal%201\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n  <\/ul>\n<\/section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar<\/h2>\n  <p class=\"lead\">Berlim não tem catraca. Você compra o bilhete, valida (ou compra já validado no app) e entra. A fiscalização é feita por gente à paisana dentro do vagão, e a multa é €60. O sistema é simples; o que confunde são as zonas: <b>AB<\/b> é a cidade, <b>ABC<\/b> inclui Potsdam e o aeroporto.<\/p>\n\n  <div class=\"note\"><b>Preços de 2026:<\/b> viagem única AB €4 (vale 2 h, só ida); <b>cartão de 4 viagens AB €12,40<\/b> (€3,10 cada, pode ser dividido entre os dois); 24 h AB €11,20; 24 h ABC €12,90; única ABC €5; trecho curto (3 estações) €2,80. O passe mensal Deutschlandticket (€63) não compensa para 5 dias.<\/div>\n\n  <h3>Antes de sair do Brasil<\/h3>\n  <ol class=\"steps\">\n    <li><b>Instalem o app BVG Fahrinfo<\/b> e criem conta com o cartão de crédito. Ele mostra rotas em tempo real (com as obras de fim de semana, frequentes) e vende o bilhete, que já vem validado com hora de compra: comprem sempre <b>antes<\/b> de entrar no vagão.<\/li>\n    <li><b>DB Navigator<\/b> já está instalado para o ICE; serve também para os trens regionais a Potsdam e ao aeroporto.<\/li>\n    <li><b>Cúpula do Reichstag reservada<\/b> para <b>qui 01/10 às 19:30<\/b> (bundestag.de → “Visit the Bundestag” → “Online registration”): grátis, nominal, com nome e data de nascimento dos dois como no passaporte. Era o horário mais tarde disponível; sábado 03/10 ficou sem vagas. Fica antes do jantar em Potsdamer Platz, que passou pra ~20:30. Sem a confirmação (e-mail) não entra; leve o passaporte e chegue com margem pro controle de segurança.<\/li>\n    <li><b>Ingresso do Neues Museum<\/b> para qui 01/10 (smb.museum, €14): é <b>Tageskarte<\/b> — vale o dia todo, entrada a qualquer hora dentro do funcionamento (ter–dom, 10h–18h, última entrada 17h30). Não há horário travado: se a retirada na Apple atrasar, você entra mais tarde sem perder nada. É a manhã inteira de Rebeca na Ilha dos Museus, e o Pergamon está fechado até 2027. <b>Só o Neues, não o cartão da Ilha<\/b> (€24): os outros museus (Alte Nationalgalerie, Altes, Bode) não cabem antes do almoço das 13h30, e a tarde é a única janela boa de compras da viagem.<\/li>\n    <li><b>Mapa offline<\/b> de Berlim e Potsdam no Google Maps. As estações de <a class=\"gl\" href=\"#g-u-bahn\">U-Bahn<\/a> têm sinal, mas os túneis entre elas não.<\/li>\n  <\/ol>\n\n  <h3>Chegada, qua 30/09, 21:43, Hauptbahnhof<\/h3>\n  <ol class=\"steps\">\n    <li><b>Táxi é a escolha certa às 21h45 com mala:<\/b> ponto na saída “Europaplatz” (nível da rua, lado norte) ou “Washingtonplatz” (lado do rio). Diga “aletto Hotel, Luckenwalder Straße”. ~€15–18, 15 min. Cartão aceito; confirme antes de entrar.<\/li>\n    <li><b>Alternativa com bilhete (AB €4 cada):<\/b> <b>ônibus M41<\/b> da saída Washingtonplatz, direto, descer em “Möckernbrücke” (~15 min) e 5 min a pé até a Luckenwalder Straße. Vale só sem pressa e com pouca mala.<\/li>\n    <li><b>Check-in 24 h.<\/b> O hotel tem bar e restaurante italiano no térreo até tarde, Starbucks de manhã e sala de malas para o dia 05.<\/li>\n  <\/ol>\n\n  <h3>Como funciona na prática<\/h3>\n  <ol class=\"steps\">\n    <li><b>Comprar no app:<\/b> escolher \"<a class=\"gl\" href=\"#g-einzelfahrschein\">Einzelfahrschein<\/a> AB“ ou ”<a class=\"gl\" href=\"#g-4-fahrten-karte\">4-Fahrten-Karte<\/a> AB“ ou ”24-Stunden-Karte\". O bilhete aparece na tela com QR e hora; mostre ao fiscal. Cada pessoa precisa do próprio bilhete no próprio celular (ou um celular com dois bilhetes comprados juntos).<\/li>\n    <li><b>Comprar na máquina:<\/b> há uma em toda plataforma de U/<a class=\"gl\" href=\"#g-s-bahn\">S-Bahn<\/a>, em inglês, cartão ou moedas. Bilhete de papel precisa ser <b>carimbado na caixinha amarela ou vermelha<\/b> (\"Hier <a class=\"gl\" href=\"#g-entwerten\">entwerten<\/a>\") na plataforma antes da primeira viagem. Sem carimbo = sem bilhete, para o fiscal.<\/li>\n    <li><b>Sentido:<\/b> nas placas, o número da linha e a última estação: “U2 Pankow” vai para o norte (Alexanderplatz, Eberswalder); “U2 Ruhleben” vai para o oeste (Potsdamer Platz é a primeira parada).<\/li>\n    <li><b>Baldeação:<\/b> livre dentro das 2 h, na mesma direção. Ida e volta não cabem num bilhete único.<\/li>\n    <li><b>Ônibus:<\/b> entra pela porta da frente e mostra o bilhete ao motorista; vende também a bordo, em dinheiro.<\/li>\n    <li><b>Fim de semana e feriado:<\/b> U-Bahn roda a noite toda (sexta e sábado); no domingo e no feriado o intervalo é maior. Conferir obras no app na manhã do dia.<\/li>\n  <\/ol>\n\n  <h3>Bilhete de cada dia<\/h3>\n  <p class=\"lead\">Qui, sex e sáb o Jorge vai a pé ao evento; os bilhetes são só da Rebeca (mais a ida dele à Apple na quinta e ao Reichstag no sábado). Domingo é dos dois.<\/p>\n  <div class=\"scroll\"><table>\n    <tr><th>Dia<\/th><th>Viagens<\/th><th>Compra certa<\/th><th>Custo<\/th><\/tr>\n    <tr><td>qui 01/10<\/td><td>Os dois: U2 Gleisdreieck → Alexanderplatz (Apple). Jorge: volta Alexanderplatz → Gleisdreieck com a caixa. Rebeca: volta a pé ou 1 parada de U2 no fim da tarde. À noite, Reichstag ida e volta (os dois).<\/td><td>1 cartão de 4 viagens AB (Apple) + 1 × 4 viagens AB à noite<\/td><td>€24,80<\/td><\/tr>\n    <tr><td>sex 02/10<\/td><td>Rebeca em Potsdam o dia todo: RE1, ônibus 695, 603 e bonde 93 = zona C<\/td><td>1 × 24 h ABC<\/td><td>€12,90<\/td><\/tr>\n    <tr><td>sáb 03/10<\/td><td>Rebeca: U6 a Mehringdamm; U6 a Paradestraße; volta; hotel → Kreuzberg. Jorge: evento → Kreuzberg (a pé)<\/td><td>1 × 24 h AB (ela) + 1 × única AB (ele, se não for a pé)<\/td><td>€11,20 + €0–4<\/td><\/tr>\n    <tr><td>dom 04/10<\/td><td>Os dois: hotel → Mauerpark → East Side → Prater → hotel (4 trechos cada)<\/td><td>2 × 24 h AB<\/td><td>€22,40<\/td><\/tr>\n    <tr><td>seg 05/10<\/td><td>Hotel → BER<\/td><td>2 × única ABC<\/td><td>€10<\/td><\/tr>\n    <tr><td colspan=\"3\"><b>Total transporte em Berlim<\/b> (+ táxi da chegada €15–18)<\/td><td><b>~€81–85<\/b><\/td><\/tr>\n  <\/table><\/div>\n\n  <h3>Trecho a trecho<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Quando<\/th><th>Trecho<\/th><th>Como<\/th><th>Tempo<\/th><\/tr>\n    <tr><td>qui 09:30<\/td><td>Hotel → Apple Rosenthaler Str. 44 <a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2044%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a> <b>(os dois)<\/b><\/td><td>U2 Gleisdreieck sentido Pankow → Alexanderplatz (6 paradas) + 8 min a pé. Retirada do Mac mini às 10:00, na abertura; formulário Tax Free com o passaporte.<\/td><td>25 min<\/td><\/tr>\n    <tr><td>qui 10:30<\/td><td>Apple → hotel → w3.hub <b>(Jorge, com a caixa)<\/b><\/td><td>U2 Alexanderplatz → Gleisdreieck (15 min), deixa a caixa no quarto, 5 min a pé até o evento. Chega dentro da janela das portas (10–11h).<\/td><td>25 min<\/td><\/tr>\n    <tr><td>qui 10:30<\/td><td>Apple → Ilha dos Museus <b>(Rebeca)<\/b><\/td><td>a pé, 10 min. Entrada no <b>Neues Museum<\/b> pela James-Simon-Galerie (Nefertiti, Egito, pré-história); ~2h. O ingresso vale o dia todo, então atraso na Apple não queima a entrada. Depois, Berliner Dom por fora e o Lustgarten. O Pergamon está fechado até 2027.<\/td><td>10 min<\/td><\/tr>\n    <tr><td>qui 13:30<\/td><td>Ilha dos Museus → Hackesche Höfe<\/td><td>a pé, 10 min de volta. Almoço no Curry 61; Ampelmann no pátio 5; Bonbonmacherei a 8 min.<\/td><td>10 min<\/td><\/tr>\n    <tr><td>qui 15:00<\/td><td>Höfe → Friedrichstraße → Unter den Linden → Portão<\/td><td>a pé, ~30 min: Dussmann e Ritter Sport na Friedrichstraße, depois a avenida até o Portão. Ou ônibus 100 na parada Lustgarten.<\/td><td>30 min<\/td><\/tr>\n    <tr><td>qui 16:30<\/td><td>Portão → Reichstag (fachada) → Memorial → Tiergarten → Potsdamer Platz → hotel<\/td><td>a pé pelo parque (30 min) até a Potsdamer Platz; de lá 15 min a pé ou U2 (1 parada) até Gleisdreieck<\/td><td>45 min<\/td><\/tr>\n    <tr><td>qui 18:45<\/td><td>Hotel → Reichstag (cúpula às 19:30) <b>(os dois)<\/b><\/td><td>U2 Gleisdreieck → Potsdamer Platz (1 parada) + 12 min a pé pela Ebertstraße, ou ~30 min a pé direto. Passaporte na mão; entrada nominal; chegar com folga pro controle de segurança.<\/td><td>~25 min<\/td><\/tr>\n    <tr><td>qui ~20:15<\/td><td>Reichstag → jantar (Potsdamer Platz) <b>(os dois)<\/b><\/td><td>12 min a pé pela Ebertstraße.<\/td><td>~12 min<\/td><\/tr>\n    <tr><td>qui ~22:00<\/td><td>Jantar → hotel<\/td><td>15 min a pé, ou U2 (1 parada) até Gleisdreieck. Noite livre depois.<\/td><td>~15 min<\/td><\/tr>\n    <tr><td>sáb 10:00<\/td><td>Hotel → Checkpoint Charlie<\/td><td>a pé 18 min (Möckernstraße → Wilhelmstraße) ou U1 Gleisdreieck → Hallesches Tor + U6 → Kochstraße<\/td><td>18 min<\/td><\/tr>\n    <tr><td>sáb 11:30<\/td><td>Checkpoint → Mehringdamm (Curry 36)<\/td><td>U6 Kochstraße → Mehringdamm, 2 paradas. O Curry 36 fica a 10 min a pé do w3.hub: se o almoço do evento for fraco, o Jorge encontra você aqui.<\/td><td>8 min<\/td><\/tr>\n    <tr><td>sáb 13:30<\/td><td>Mehringdamm → Tempelhofer Feld<\/td><td>U6 Mehringdamm → Paradestraße, 3 paradas, direto (entrada sul). De dia é tranquilo; à noite não.<\/td><td>6 min<\/td><\/tr>\n    <tr><td>sáb 17:00<\/td><td>Tempelhof → hotel<\/td><td>U6 Paradestraße → Hallesches Tor + U1 → Gleisdreieck<\/td><td>20 min<\/td><\/tr>\n    <tr><td>sáb 19:15<\/td><td>Hotel → Kreuzberg (jantar) <b>(os dois)<\/b><\/td><td>o Jorge vem direto do evento (w3.hub é a 5 min do hotel); 20 min a pé juntos, ou U1 Möckernbrücke → Kottbusser Tor, ~10 min.<\/td><td>~20 min<\/td><\/tr>\n    <tr><td>sáb 20:00<\/td><td>Jantar em Kreuzberg <b>(os dois)<\/b><\/td><td>direto do Reichstag (ver “Onde comer”); volta ao hotel a pé, 15–20 min<\/td><td>—<\/td><\/tr>\n    <tr><td>dom 11:00<\/td><td>Hotel → Mauerpark <b>(os dois)<\/b><\/td><td>U2 Gleisdreieck → Eberswalder Straße, direto, + 8 min a pé<\/td><td>25 min<\/td><\/tr>\n    <tr><td>dom 15:30<\/td><td>Mauerpark → East Side Gallery<\/td><td>Tram M10 na Eberswalder Straße, sentido Warschauer Straße, direto até o fim da linha; o muro começa a 5 min a pé<\/td><td>25 min<\/td><\/tr>\n    <tr><td>dom 18:30<\/td><td>East Side → Prater (Kastanienallee)<\/td><td>Tram M10 de volta até Eberswalder Straße + 5 min a pé<\/td><td>25 min<\/td><\/tr>\n    <tr><td>dom 21:00<\/td><td>Prater → hotel<\/td><td>U2 Eberswalder Straße → Gleisdreieck, direto<\/td><td>20 min<\/td><\/tr>\n    <tr><td>seg 14:30<\/td><td>Hotel → BER Terminal 1<\/td><td>U2 → Potsdamer Platz + S2 sentido Blankenfelde → Südkreuz + trem regional/FEX → Flughafen BER; conferir no app a combinação mais rápida na hora. Bilhete ABC.<\/td><td>45–50 min<\/td><\/tr>\n  <\/table><\/div>\n\n  <h3>E se…<\/h3>\n  <ol class=\"steps\">\n    <li><b>Obra no U2 no fim de semana.<\/b> Comum; o app BVG mostra “Ersatzverkehr”. O ônibus substituto (SEV) segue o mesmo trajeto, mais lento; alternativa para o norte é U1 até Warschauer Straße + tram M10 até Eberswalder. Conferir no domingo de manhã antes de sair.<\/li>\n    <li><b>Chover no domingo.<\/b> A feira do Mauerpark acontece, menor; a East Side é a céu aberto — invertam: East Side de manhã, Mauerpark depois do almoço, quando costuma abrir. O Prater tem salão.<\/li>\n    <li><b>A Apple não ter o Mac mini na quinta.<\/b> Sexta à noite na volta de Potsdam (RE1 até Friedrichstraße) ou segunda 10h, sem margem; as duas janelas estão em “O Mac mini”. Não comprem em outra loja: o Tax Free foi combinado com esta.<\/li>\n    <li><b>A reserva do Reichstag não sair para sábado 18h.<\/b> Balcão de serviço na Scheidemannstraße (em frente ao prédio): emite entrada para o mesmo dia até 2 h antes, com nome e nascimento, se houver vaga. Chegar às 15h30 para tentar.<\/li>\n  <\/ol>\n\n  <h3 id=\"glossario\">Glossário<\/h3>\n  <dl class=\"gloss\">\n    <div id=\"g-u-bahn\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('U-Bahn','de-DE',this)\" aria-label=\"Ouvir U-Bahn\">🔊<\/button> U-Bahn<\/dt><dd>Metrô. Letras U + número, placas azuis com U branco.<\/dd><\/div>\n    <div id=\"g-s-bahn\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('S-Bahn','de-DE',this)\" aria-label=\"Ouvir S-Bahn\">🔊<\/button> S-Bahn<\/dt><dd>Trem urbano, placas verdes com S branco. Mesmo bilhete.<\/dd><\/div>\n    <div id=\"g-ab-abc\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('AB / ABC','de-DE',this)\" aria-label=\"Ouvir AB / ABC\">🔊<\/button> AB / ABC<\/dt><dd>Zonas. AB é Berlim; C é Potsdam e o aeroporto. Bilhete AB em Potsdam = multa.<\/dd><\/div>\n    <div id=\"g-entwerten\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Entwerten','de-DE',this)\" aria-label=\"Ouvir Entwerten\">🔊<\/button> Entwerten<span class=\"tl\">ent-VER-ten<\/span><\/dt><dd>Validar, carimbar o bilhete de papel na caixinha. Só na primeira viagem.<\/dd><\/div>\n    <div id=\"g-einzelfahrschein\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Einzelfahrschein','de-DE',this)\" aria-label=\"Ouvir Einzelfahrschein\">🔊<\/button> Einzelfahrschein<\/dt><dd>Bilhete único, 2 h, uma direção.<\/dd><\/div>\n    <div id=\"g-4-fahrten-karte\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('4-Fahrten-Karte','de-DE',this)\" aria-label=\"Ouvir 4-Fahrten-Karte\">🔊<\/button> 4-Fahrten-Karte<\/dt><dd>Cartão de 4 viagens, mais barato por viagem, pode dividir entre pessoas.<\/dd><\/div>\n    <div id=\"g-kurzstrecke\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Kurzstrecke','de-DE',this)\" aria-label=\"Ouvir Kurzstrecke\">🔊<\/button> Kurzstrecke<span class=\"tl\">KURTS-shtre-ke<\/span><\/dt><dd>Trecho curto: 3 estações de metrô, 6 de ônibus. €2,80.<\/dd><\/div>\n    <div id=\"g-fahrkartenkontrolle\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Fahrkartenkontrolle','de-DE',this)\" aria-label=\"Ouvir Fahrkartenkontrolle\">🔊<\/button> Fahrkartenkontrolle<span class=\"tl\">FAR-kar-ten-kon-tro-le<\/span><\/dt><dd>Fiscalização. Gente comum que mostra um crachá e diz “Fahrscheine, bitte”.<\/dd><\/div>\n    <div id=\"g-richtung\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Richtung','de-DE',this)\" aria-label=\"Ouvir Richtung\">🔊<\/button> Richtung<\/dt><dd>Sentido, dado pela última estação.<\/dd><\/div>\n    <div id=\"g-spati\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Späti','de-DE',this)\" aria-label=\"Ouvir Späti\">🔊<\/button> Späti<span class=\"tl\">SHPÉ-ti<\/span><\/dt><dd>Lojinha de conveniência aberta até tarde e no domingo. Cerveja, água, chips. Cultura de Berlim: beber na porta.<\/dd><\/div>\n    <div id=\"g-pfand\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Pfand','de-DE',this)\" aria-label=\"Ouvir Pfand\">🔊<\/button> Pfand<\/dt><dd>Depósito de €0,08–0,25 na garrafa; devolve-se na máquina do supermercado ou deixa-se ao lado do lixo para quem cata.<\/dd><\/div>\n    <div id=\"g-imbiss\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Imbiss','de-DE',this)\" aria-label=\"Ouvir Imbiss\">🔊<\/button> Imbiss<\/dt><dd>Quiosque de comida rápida: currywurst, döner.<\/dd><\/div>\n    <div id=\"g-ruhetag\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Ruhetag','de-DE',this)\" aria-label=\"Ouvir Ruhetag\">🔊<\/button> Ruhetag<span class=\"tl\">RU-e-tak<\/span><\/dt><dd>Dia de folga do restaurante, geralmente segunda ou terça.<\/dd><\/div>\n    <div id=\"g-tag-der-deutschen-einheit\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Tag der Deutschen Einheit','de-DE',this)\" aria-label=\"Ouvir Tag der Deutschen Einheit\">🔊<\/button> Tag der Deutschen Einheit<\/dt><dd>Feriado de 03/10, Dia da Unidade. Comércio fechado; museus, restaurantes, transporte funcionam.<\/dd><\/div>\n    <div id=\"g-currywurst\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Currywurst','de-DE',this)\" aria-label=\"Ouvir Currywurst\">🔊<\/button> Currywurst<span class=\"tl\">KÖ-ri-vurst<\/span><\/dt><dd>Salsicha fatiada com molho de ketchup e curry em pó, o lanche de rua de Berlim. Pede-se “mit Pommes”.<\/dd><\/div>\n  <\/dl>\n\n    <h3>Frases úteis<\/h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hallo','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Hallo<\/b> — <i>HA-lô (olá)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Morgen','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Guten Morgen<\/b> — <i>GU-ten MÓR-guen (bom dia)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Abend','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Guten Abend<\/b> — <i>GU-ten Á-bent (boa noite, ao chegar)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Danke schön','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Danke schön<\/b> — <i>DAN-ke shön (muito obrigada)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bitte','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Bitte<\/b> — <i>BI-te (por favor / de nada / pois não)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Entschuldigung','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Entschuldigung<\/b> — <i>ent-SHUL-di-gung (desculpe / com licença)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Sprechen Sie Englisch?','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Sprechen Sie Englisch?<\/b> — <i>SHPRÉ-rren zi ÉN-glish (fala inglês?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ich verstehe nicht','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Ich verstehe nicht<\/b> — <i>irr fer-SHTÊ-e nirrt (não entendo)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Wo ist die Toilette?','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Wo ist die Toilette?<\/b> — <i>vô ist di tua-LÉ-te (onde é o banheiro?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Was kostet das?','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Was kostet das?<\/b> — <i>vas KÓS-tet das (quanto custa isso?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Die Rechnung, bitte','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Die Rechnung, bitte<\/b> — <i>di RÉRR-nung BI-te (a conta, por favor)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ein Tisch für zwei','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Ein Tisch für zwei<\/b> — <i>ain TISH für TSVAI (mesa para dois)<\/i><\/li>\n  <\/ul>\n\n  <h3>Apps: qual e por quê<\/h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">🎫<\/div><div><b>BVG Fahrinfo<\/b><span>Bilhete e rota, com as obras. Obrigatório.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">🚄<\/div><div><b>DB Navigator<\/b><span>O ICE de quarta e os regionais para Potsdam e para o BER. Mostra a plataforma.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">🚕<\/div><div><b>Uber, Bolt e Free Now<\/b><span>Free Now chama táxi de verdade, útil na chegada. Uber e Bolt para a volta tarde do Tempelhof ou do Prater.<\/span><\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia<\/h2>\n  <p class=\"lead\">Um mapa geral com os cinco dias (o Spree cruza a cidade de leste a oeste; o Landwehrkanal, ao sul, passa na porta do hotel) e um zoom do centro para quinta. Nos quadros do dia, toque no número de um trecho para ver como fazer.<\/p>\n\n  <figure>\n    <svg viewBox=\"0 0 360 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Berlim, visão geral dos cinco dias\">\n      <path d=\"M40 150 C 90 158, 120 160, 150 152 C 175 148, 190 160, 197 167 C 220 190, 260 220, 300 236 C 320 244, 340 255, 360 262\" class=\"water\"/>\n      <text x=\"230\" y=\"200\" class=\"mg\">Spree<\/text>\n      <path d=\"M100 262 L150 262 C 190 275, 230 296, 270 300 C 300 302, 330 292, 360 285\" class=\"water\" style=\"stroke-width:6\"/>\n      <text x=\"180\" y=\"272\" class=\"mg\">Landwehrkanal<\/text>\n      <rect x=\"30\" y=\"158\" width=\"90\" height=\"56\" class=\"hill\" rx=\"20\"/><text x=\"46\" y=\"190\" class=\"mg\">Tiergarten<\/text>\n      <ellipse cx=\"200\" cy=\"386\" rx=\"60\" ry=\"22\" class=\"hill\"/>\n      <text x=\"14\" y=\"26\" class=\"mh\">Berlim · 30/09 a 05/10<\/text>\n\n      <!-- U2 -->\n      <path d=\"M119 262 L124 212 C 140 190, 200 170, 233 153 C 240 130, 230 90, 227 62\" class=\"u\"/>\n      <text x=\"245\" y=\"120\" class=\"ms\" style=\"fill:var(--amarelo)\">U2<\/text>\n      <!-- U1 -->\n      <path d=\"M119 262 L145 265 C 200 268, 260 262, 318 252\" class=\"u\" style=\"opacity:.6\"/>\n      <text x=\"230\" y=\"262\" class=\"ms\" style=\"fill:var(--amarelo)\">U1<\/text>\n      <!-- U6 -->\n      <path d=\"M167 222 L159 288 L200 386\" class=\"u\" style=\"opacity:.4\"/>\n      <text x=\"176\" y=\"340\" class=\"ms\" style=\"fill:var(--amarelo)\">U6<\/text>\n      <!-- taxi -->\n      <path d=\"M106 138 C 100 190, 110 230, 122 254\" class=\"taxi\"/>\n      <text x=\"60\" y=\"230\" class=\"ms\" style=\"fill:var(--az =\"eat\"/>\n      <circle cx=\"141\" cy=\"142\" r=\"4\" class=\"shop\"/><text x=\"100\" y=\"134\" class=\"ms\">Dussmann<\/text>\n      <circle cx=\"143\" cy=\"166\" r=\"4\" class=\"shop\"/><text x=\"148\" y=\"170\" class=\"ms\">Ritter Sport<\/text>\n      <circle cx=\"218\" cy=\"134\" r=\"6\" class=\"pt\"/><text x=\"222\" y=\"152\" class=\"ms\">Berliner Dom<\/text>\n      <circle cx=\"227\" cy=\"73\" r=\"7\" class=\"pt\"/><text x=\"120\" y=\"62\" class=\"m\">Hackesche Höfe · Ampelmann<\/text>\n      <circle cx=\"232\" cy=\"80\" r=\"5\" class=\"shop\"/><text x=\"240\" y=\"84\" class=\"m\">Apple Store<\/text>\n      <circle cx=\"216\" cy=\"85\" r=\"4\" class=\"eat\"/><text x=\"222\" y=\"96\" class=\"ms\">Curry 61<\/text>\n      <circle cx=\"172\" cy=\"71\" r=\"4\" class=\"shop\"/><text x=\"110\" y=\"82\" class=\"ms\">Bonbonmacherei<\/text>\n      <circle cx=\"297\" cy=\"104\" r=\"6\" class=\"pt\"/><text x=\"290\" y=\"122\" class=\"ms\">Alexanderplatz<\/text>\n      <circle cx=\"62\" cy=\"218\" r=\"4\" class=\"eat\"/><text x=\"68\" y=\"222\" class=\"ms\">Midtown Grill<\/text>\n      <circle cx=\"39\" cy=\"226\" r=\"4\" class=\"eat\"/><text x=\"10\" y=\"216\" class=\"ms\">Lindenbräu<\/text>\n      <circle cx=\"151\" cy=\"254\" r=\"5\" class=\"pt\"/><text x=\"158\" y=\"258\" class=\"ms\">Checkpoint Charlie (sáb)<\/text>\n    <g class=\"r-badge walk\" data-r=\"7\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 7: A pé · Tiergarten → Potsdamer Platz → hotel\" transform=\"translate(62,197)\"><circle r=\"9\"/><text y=\".5\">7<\/text><\/g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A pé · Portão → Memorial do Holocausto\" transform=\"translate(74,175)\"><circle r=\"9\"/><text y=\".5\">6<\/text><\/g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A pé · Portão → Reichstag (fachada)\" transform=\"translate(67,152)\"><circle r=\"9\"/><text y=\".5\">5<\/text><\/g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A pé (ou ônibus 100) · Höfe → Friedrichstraße → Unter den Linden → Portão\" transform=\"translate(141.7,146.9)\"><circle r=\"9\"/><text y=\".5\">4<\/text><\/g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A pé · Ilha dos Museus → Hackesche Höfe (13h30, almoço e compras)\" transform=\"translate(224.5,105)\"><circle r=\"9\"/><text y=\".5\">3<\/text><\/g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A pé · Apple → Neues Museum (~11h)\" transform=\"translate(263,89)\"><circle r=\"9\"/><text y=\".5\">2<\/text><\/g><g class=\"r-badge transit\" data-r=\"1\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: U2 · hotel (Gleisdreieck) → Alexanderplatz → Apple\" transform=\"translate(187.9,185.1)\"><circle r=\"9\"/><text y=\".5\">1<\/text><\/g><\/svg>\n    <figcaption>Zoom de quinta. Apple às 10h, Neues Museum por volta das 11h, volta aos Höfe às 13h30 (almoço e compras), Friedrichstraße (Dussmann, Ritter Sport), Portão e Tiergarten até o hotel.<\/figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"><\/i>ponto do roteiro<\/span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"><\/i>comer<\/span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"><\/i>loja<\/span>\n      <span><i style=\"background:var(--ok)\"><\/i>hotel<\/span>\n      <span>— — a pé<\/span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">━<\/span> <a class=\"gl\" href=\"#g-u-bahn\">U-Bahn<\/a><\/span>\n      <span><span style=\"color:var(--azul);font-weight:900\">━<\/span> táxi<\/span>\n    <\/div>\n  <div class=\"rota-painel\" id=\"rp-berlim-1\" aria-live=\"polite\"><\/div><\/figure>\n\n  <p>Mapa real de quinta: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Apple+Rosenthaler+Stra%C3%9Fe&destination=aletto+Hotel+Potsdamer+Platz&waypoints=Berliner+Dom%7CHackesche+H%C3%B6fe%7CDussmann+Friedrichstra%C3%9Fe%7CBrandenburger+Tor%7CReichstag%7CPotsdamer+Platz&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir no Google Maps<\/a>.<\/p>\n\n  <h3>Sobre os lugares<\/h3>\n  <div class=\"attractions\">\n    <h4>Portão de Brandemburgo<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Erguido entre 1788 e 1791 como portal de entrada cerimonial na cidade, foi inspirado nos Propileus da Acrópole de Atenas — daí as colunas gregas. Ficou preso bem no meio do Muro de Berlim entre 1961 e 1989, numa faixa de ninguém inacessível dos dois lados; a queda do Muro em novembro de 1989 e a reunificação em 1990 transformaram o portão no símbolo maior da cidade reunida.<\/div><\/details><details class=\"curio\"><summary>🏛️ um pouco de arquitetura<\/summary><div class=\"in\">A quadriga de bronze no topo — a deusa da vitória guiando quatro cavalos — foi roubada por Napoleão em 1806 e levada para Paris como troféu de guerra; as tropas prussianas a recuperaram em 1814, depois da derrota dele.<\/div><\/details>\n    <h4>Reichstag<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Sede do parlamento alemão desde 1894, foi incendiado em 1933 num episódio nunca totalmente esclarecido — Hitler usou o incêndio como pretexto para suspender direitos civis e consolidar poder, um dos pontos de virada para o regime nazista. Ficou em ruínas boa parte da Guerra Fria, praticamente abandonado perto do Muro, e só voltou a sediar o Parlamento depois da reunificação, em 1999.<\/div><\/details><details class=\"curio\"><summary>🏛️ um pouco de arquitetura<\/summary><div class=\"in\">A cúpula de vidro que hoje é cartão-postal foi acrescentada nessa reforma dos anos 1990, projetada pelo arquiteto britânico Norman Foster — uma escada em espiral leva o visitante ao topo, de onde se vê literalmente por cima da sala onde os deputados trabalham, um simbolismo deliberado de transparência do governo diante do povo.<\/div><\/details>\n    <h4>Neues Museum<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Construído em 1855 e bombardeado na guerra, ficou 60 anos em ruína no meio da Ilha dos Museus. A reconstrução de David Chipperfield (2009) deixou as cicatrizes à vista — tijolo cru, reboco faltando, afrescos pela metade — e virou referência mundial de restauro. A peça central é o busto de Nefertiti, achado em 1912 na oficina do escultor Tutmés, em Amarna; o Egito pede a devolução até hoje.<\/div><\/details><details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">A sala da Nefertiti é a única do museu onde fotografar é proibido. O Pergamonmuseum, ao lado, está fechado para reforma até junho de 2027; o que sobra dele é o “Pergamonmuseum. Das Panorama”, em prédio à parte.<\/div><\/details>\n    <h4>East Side Gallery<\/h4><details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">É o maior trecho remanescente do Muro de Berlim ainda de pé, 1,3 km, pintado por mais de cem artistas de dezenas de países logo depois da queda em 1989–90. O mural mais famoso, o “beijo fraterno” entre Brezhnev e Honecker, é baseado numa foto real de 1979 — o aperto de mão socialista que virou beijo na boca era um cumprimento genuíno entre líderes comunistas da época.<\/div><\/details>\n    <h4>Aeroporto de Tempelhof<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Foi um dos maiores prédios do mundo quando os nazistas o ampliaram nos anos 1930 como vitrine de propaganda do regime. Ficou mundialmente famoso pela Ponte Aérea de Berlim de 1948–49: quando a União Soviética bloqueou todas as estradas e ferrovias para Berlim Ocidental, aviões americanos e britânicos pousavam em Tempelhof a cada poucos minutos, dia e noite, abastecendo a cidade inteira só pelo ar por quase um ano. O aeroporto fechou em 2008; hoje as pistas viraram o maior parque urbano de Berlim, e os prédios às vezes abrigam abrigos e eventos.<\/div><\/details>\n  <\/div>\n<\/section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 opções por parada<\/h2>\n  <div class=\"note\"><b>Com o evento do Jorge:<\/b> os almoços de qui e sáb são da Rebeca (ele almoça no w3.hub, incluído no ingresso); os jantares de qui, sex e sáb e o domingo inteiro são dos dois.<\/div>\n  <p class=\"lead\">Berlim come na rua (<a class=\"gl\" href=\"#g-currywurst\">currywurst<\/a>, döner) e janta cedo e farto (schnitzel, Eisbein, Klopse). Muitos restaurantes têm um dia de folga na semana; horários abaixo conferidos para o dia exato. Preços por pessoa, sem bebida.<\/p>\n\n  <div class=\"meal\">\n    <h3>Jantar tardio · qua 30/09, ~22:15 · perto do hotel<\/h3>\n    <p class=\"when\">Depois de 5h43 de trem. Os três funcionam até tarde e ficam a menos de 15 min a pé do aletto.<\/p>\n\n    <div class=\"opt pick\"><h4>Curry 36 <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Mehringdamm 36, 15 min a pé do hotel (ou U7 de Möckernbrücke, 1 parada).<\/span>\n        <b>Por quê<\/b><span>A currywurst mais famosa da cidade, aberta até 5h da manhã. Chegar às 22h de trem e comer currywurst de pé na calçada é a inauguração certa de Berlim. Está no roteiro de sábado, mas funciona melhor hoje, sem fila.<\/span>\n        <b>Estrela<\/b><span>Currywurst “ohne Darm” (sem pele, a de Berlim Oriental) com Pommes rot-weiß (ketchup e maionese).<\/span>\n        <b>Custo<\/b><span>€6–9.<\/span>\n        <b>Horário<\/b><span>9h–5h. Só balcão.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Lindenbräu am Potsdamer Platz<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Sony Center, Bellevuestraße 3-5, 12 min a pé.<\/span>\n        <b>Por quê<\/b><span>Cervejaria bávara em 3 andares, cozinha até tarde, mesa garantida. Para quem quer sentar com um chope depois do trem.<\/span>\n        <b>Estrela<\/b><span>Schnitzel com salada de batata; Apfelstrudel; suco de ruibarbo.<\/span>\n        <b>Custo<\/b><span>€18–28.<\/span>\n        <b>Horário<\/b><span>11h30–1h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>O restaurante e o bar do aletto<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Térreo do hotel.<\/span>\n        <b>Por quê<\/b><span>Se o trem atrasar ou a energia acabar: italiano simples e bar com petiscos, sem sair.<\/span>\n        <b>Estrela<\/b><span>Pizza; tábua.<\/span>\n        <b>Custo<\/b><span>€12–20.<\/span>\n        <b>Horário<\/b><span>Conferir na recepção o horário da cozinha.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · qui 01/10, 13:30 · Hackesche Höfe<\/h3>\n    <p class=\"when\">Currywurst de rua, como o roteiro pede. A primeira fica na esquina dos Höfe; as outras duas, a 100 m do Portão, servem de lanche à tarde.<\/p>\n\n    <div class=\"opt pick\"><h4>Curry 61 <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Oranienburger Str. 6, esquina dos Hackesche Höfe.<\/span>\n        <b>Por quê<\/b><span>Nota 4,6 em 8 mil avaliações, a rival de Mitte da Curry 36: molho generoso, salsicha grelhada crocante opcional, rock no rádio. É o almoço de quinta: 13h30, na saída do Neues Museum, antes da Bonbonmacherei.<\/span>\n        <b>Estrela<\/b><span>Currywurst “geröstet” (torrada), pimenta a gosto.<\/span>\n        <b>Custo<\/b><span>€6–9.<\/span>\n        <b>Horário<\/b><span>11h–23h.<\/span>\n      <\/div><\/div>\n      <div class=\"opt\"><h4>Curry Wolf<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Unter den Linden 77, no Hotel Adlon, esquina do Portão.<\/span>\n        <b>Por quê<\/b><span>Currywurst decente com mesas ao ar livre na avenida mais nobre da cidade; tem opção vegetariana e vegana da salsicha. Mais caro que a média pelo lugar, ainda barato.<\/span>\n        <b>Estrela<\/b><span>Currywurst com batata; a versão vegana surpreende.<\/span>\n        <b>Custo<\/b><span>€7–10.<\/span>\n        <b>Horário<\/b><span>10h–22h30.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Wurst am Brandenburger Tor<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Quiosque na Ebertstraße esquina Scheidemannstraße, entre o Portão e o Reichstag.<\/span>\n        <b>Por quê<\/b><span>O quiosque simpático do gramado do Reichstag, com bancos. Cai exatamente no caminho entre o Portão e o Reichstag, na passada de quinta à tarde.<\/span>\n        <b>Estrela<\/b><span>Currywurst com pão; Bratwurst.<\/span>\n        <b>Custo<\/b><span>€5–8.<\/span>\n        <b>Horário<\/b><span>11h–19h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar · qui 01/10, ~20:30 · Potsdamer Platz<\/h3>\n    <p class=\"when\">Tudo a 10–15 min a pé do hotel, entre a Potsdamer Platz e o Sony Center. A primeira era a do roteiro; as duas outras custam metade. Horário moveu de 19:00 pra ~20:30 porque a cúpula do Reichstag ficou marcada pras 19:30 — ajustar a reserva do Midtown Grill.<\/p>\n\n    <div class=\"opt pick\"><h4>Midtown Grill <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Ebertstraße 3, no Marriott.<\/span>\n        <b>Por quê<\/b><span>Carne na brasa com cozinha aberta e serviço de hotel americano, o jantar “de comemoração” dos cinco dias. Reservar.<\/span>\n        <b>Estrela<\/b><span>Tartare de carne; costela ou bone-in sirloin.<\/span>\n        <b>Custo<\/b><span>€40–60.<\/span>\n        <b>Horário<\/b><span>Qui 17h–23h. +49 30 220005411.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Monte Mente<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Bellevuestraße 5, ao lado do Sony Center.<\/span>\n        <b>Por quê<\/b><span>Mediterrâneo e turco elegante, nota 4,6, preço de bairro num endereço de hotel. Para um jantar bonito sem os €60.<\/span>\n        <b>Estrela<\/b><span>Massas; salmão; pizza no forno.<\/span>\n        <b>Custo<\/b><span>€18–28.<\/span>\n        <b>Horário<\/b><span>10h–0h. +49 30 26101705.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Lindenbräu<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Sony Center.<\/span>\n        <b>Por quê<\/b><span>A alemã barulhenta do Sony Center, se na quarta escolheram a currywurst.<\/span>\n        <b>Estrela<\/b><span>Schweinshaxe (joelho de porco); Kaiserschmarrn de sobremesa.<\/span>\n        <b>Custo<\/b><span>€18–28.<\/span>\n        <b>Horário<\/b><span>11h30–1h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · sáb 03/10, 11:30 · Mehringdamm<\/h3>\n    <p class=\"when\">O trio do roteiro está certo; aqui vai o que a verificação acrescenta. Feriado: fila maior que o normal.<\/p>\n\n    <div class=\"opt pick\"><h4>Curry 36 <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Mehringdamm 36, saída do U6.<\/span>\n        <b>Por quê<\/b><span>Fila rápida mesmo cheia. Se já foram na quarta, provem a Bockwurst ou a Krakauer.<\/span>\n        <b>Estrela<\/b><span>Currywurst com Pommes; garrafa do curry ketchup deles para levar (€4).<\/span>\n        <b>Custo<\/b><span>€6–9.<\/span>\n        <b>Horário<\/b><span>9h–5h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Mustafa’s Gemüse Kebap<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Mehringdamm 33, na frente.<\/span>\n        <b>Por quê<\/b><span>A fila passa de 1 h em dia normal; no feriado, mais. Regra das avaliações: mais de 30 pessoas na fila, desista.<\/span>\n        <b>Estrela<\/b><span>Gemüse Kebap de frango.<\/span>\n        <b>Custo<\/b><span>€8–10.<\/span>\n        <b>Horário<\/b><span>Sáb 11h–2h30.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">O döner com legumes grelhados e queijo de cabra virou lenda em Berlim: gente atravessa a cidade só por causa dele.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>Burgermeister Schlesisches Tor<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Oberbaumstraße 8, dentro do antigo banheiro público sob o viaduto do U1.<\/span>\n        <b>Por quê<\/b><span>Nota 4,7 em 17 mil avaliações. Sob o viaduto do U1 em Schlesisches Tor: se a fila da Mehringdamm assustar, almoçar aqui; a Oberbaumbrücke é 3 min a pé, prévia do domingo.<\/span>\n        <b>Estrela<\/b><span>Meisterburger; cheese fries.<\/span>\n        <b>Custo<\/b><span>€9–13.<\/span>\n        <b>Horário<\/b><span>Sáb 11h–4h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar · sáb 03/10, ~20:00 · Kreuzberg<\/h3>\n    <p class=\"when\">O roteiro não tinha jantar de sábado. Depois do Tempelhof, Kreuzberg fica perto do hotel e do w3.hub, fácil pro Jorge encontrar você direto do evento. No feriado os restaurantes abrem normalmente.<\/p>\n\n    <div class=\"opt pick\"><h4>Max und Moritz <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Oranienstraße 162. Do hotel/evento: 20 min a pé, ou U1 Möckernbrücke → Kottbusser Tor, ~10 min; ou táxi, ~10 min.<\/span>\n        <b>Por quê<\/b><span>A comida prussiana de verdade — é o jantar “Berlim antiga” que faltava.<\/span>\n        <b>Estrela<\/b><span>Eisbein (joelho de porco cozido) com chucrute e purê de ervilha; Königsberger Klopse.<\/span>\n        <b>Custo<\/b><span>€16–24. Porções enormes: um Eisbein serve dois.<\/span>\n        <b>Horário<\/b><span>Sáb 18h–23h. +49 30 69515911.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Taberna berlinense de 1902, com azulejos e ilustrações do livro infantil que dá nome à casa — o salão mudou pouco desde então.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>Hasir<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Adalbertstraße 12, Kottbusser Tor.<\/span>\n        <b>Por quê<\/b><span>Restaurante turco de mesa, no coração do Kreuzberg turco.<\/span>\n        <b>Estrela<\/b><span>Beyti; kebab de berinjela.<\/span>\n        <b>Custo<\/b><span>€18–26. Confira a gorjeta na maquininha: uma avaliação relata 10% pré-marcados.<\/span>\n        <b>Horário<\/b><span>Sáb 12h–1h.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">A família Hasir reivindica ter inventado o döner kebab tal como se conhece hoje, em Berlim, em 1971 — uma disputa de origem que os berlinenses adoram discutir.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>Markthalle Neun<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Eisenbahnstraße 42, 10 min a pé da Oberbaumbrücke.<\/span>\n        <b>Por quê<\/b><span>Mercado coberto de 1891 com bancas de comida do mundo. Era o plano B de chuva do roteiro; serve de jantar cedo se a cúpula terminar antes das 19h.<\/span>\n        <b>Estrela<\/b><span>Sisters Thai; churrasco defumado; gyoza.<\/span>\n        <b>Custo<\/b><span>€10–18.<\/span>\n        <b>Horário<\/b><span>Sábado normal 9h–20h; <b>no feriado, conferir no Instagram do mercado na véspera.<\/b><\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · dom 04/10, 12:00 · Mauerpark<\/h3>\n    <p class=\"when\">Nas barracas da feira: bratwurst, döner, comida etíope, tailandesa, limonada; €6–10, quase tudo em dinheiro. Não há trio aqui: a feira é o lugar. O Konnopke’s (o quiosque de 1930 sob o viaduto da Eberswalder) fecha domingo.<\/p>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar · dom 04/10, 19:00 · Prenzlauer Berg<\/h3>\n    <p class=\"when\">Os três a 10 min do Mauerpark, ao redor da estação Eberswalder Straße.<\/p>\n\n    <div class=\"opt pick\"><h4>Prater Gaststätte <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Kastanienallee 7-9.<\/span>\n        <b>Por quê<\/b><span>Em outubro o jardim pode estar fechado pelo frio, mas o salão (Gaststätte) abre domingo o dia inteiro e tem a cozinha boa.<\/span>\n        <b>Estrela<\/b><span>Wiener Schnitzel; Königsberger Klopse; a cerveja da casa.<\/span>\n        <b>Custo<\/b><span>€20–30.<\/span>\n        <b>Horário<\/b><span>Dom 12h–23h. Reservar pelo site: uma avaliação recente relata garçonete recusando walk-in com o salão vazio.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">O beer garden mais antigo de Berlim, aberto em 1837 — passou por guerras, divisão e reunificação da cidade no mesmo endereço.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>Zum Schusterjungen<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Danziger Straße 9, 5 min do Prater.<\/span>\n        <b>Por quê<\/b><span>A Kneipe berlinense de verdade: madeira escura, cerveja de pressão, comida farta e barata, nota 4,5 em 2.800 avaliações. Se o Prater estiver lotado ou caro, aqui é melhor.<\/span>\n        <b>Estrela<\/b><span>Schnitzel; Eisbein; Blutwurst para os corajosos.<\/span>\n        <b>Custo<\/b><span>€14–22.<\/span>\n        <b>Horário<\/b><span>Dom 12h–0h. +49 30 4427654.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>The Bird<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Am Falkplatz 5, na esquina norte do Mauerpark.<\/span>\n        <b>Por quê<\/b><span>Steakhouse nova-iorquino de expatriados, hambúrguer grosso mal passado, fritas dupla fritura. Avaliações recentes reclamam de queda de qualidade: era a alternativa do roteiro, hoje fica em terceiro.<\/span>\n        <b>Estrela<\/b><span>Burger ao ponto “medium”; bife de 250 g.<\/span>\n        <b>Custo<\/b><span>€18–28.<\/span>\n        <b>Horário<\/b><span>Dom 12h–0h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Brunch · seg 05/10, 09:30 · Landwehrkanal<\/h3>\n    <p class=\"when\">O canal passa a 5 min do hotel (Hallesches Ufer / Tempelhofer Ufer). Os três abrem segunda; check-out às 11h.<\/p>\n\n    <div class=\"opt pick\"><h4>Kaffeekreis <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Möckernstraße 91, 5 min do hotel, na esquina do canal.<\/span>\n        <b>Por quê<\/b><span>Brunch moldavo-romeno com nota 4,8: papanași (bolinho de queijo frito com geleia) doce ou salgado, ovos benedict elogiados, café bom. Diferente de tudo na viagem.<\/span>\n        <b>Estrela<\/b><span>Papanași; omelete.<\/span>\n        <b>Custo<\/b><span>€12–18.<\/span>\n        <b>Horário<\/b><span>Seg 9h–18h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Café Dura<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Wilhelmstraße 10, 12 min a pé pelo canal.<\/span>\n        <b>Por quê<\/b><span>Café de bairro com pátio, omelete com dois pães, torrada de abacate. Sem inglês no balcão; apontar funciona.<\/span>\n        <b>Estrela<\/b><span>Omelete de cheddar.<\/span>\n        <b>Custo<\/b><span>€10–16.<\/span>\n        <b>Horário<\/b><span>Seg 8h–20h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Maracay Coffee<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Stresemannstraße 72, 10 min.<\/span>\n        <b>Por quê<\/b><span>Café de especialidade, croissant de pistache, decoração retrô. <b>Só dinheiro.<\/b><\/span>\n        <b>Estrela<\/b><span>Café da manhã escandinavo; chai latte.<\/span>\n        <b>Custo<\/b><span>€8–14.<\/span>\n        <b>Horário<\/b><span>Seg 8h–18h.<\/span>\n      <\/div><\/div>\n    <div class=\"note\">Se quiserem a caminhada de verdade pelo canal: 25 min pelo Tempelhofer Ufer até o Urbanhafen, e brunch no <b>Cafe Brick<\/b> (Körtestraße 32, seg 9h–16h, nota 4,8). Volta de U7 Südstern → Möckernbrücke, 3 paradas.<\/div>\n  <\/div>\n<\/section>\n\n<!-- ====================== NOTEBOOK ====================== -->\n<section id=\"notebook\">\n  <h2>O Mac mini: onde e quando<\/h2>\n  <p class=\"lead\">A Apple Store da Rosenthaler Straße 44 <a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2044%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a> é <b>a porta ao lado dos Hackesche Höfe<\/b>, aonde a Rebeca volta às 13h30 para o almoço e as compras. Abre seg–sáb 10h–20h e fecha domingo. <b>Vocês vão juntos na abertura, às 10:00 de quinta, antes do evento:<\/b> retirada reservada, Tax Free na hora, e o Jorge leva a caixa ao hotel a caminho do w3.hub. Assim ninguém carrega o Mac mini pela cidade e ele não precisa sair no meio do evento. Com o feriado de sábado, as janelas são só estas:<\/p>\n  <div class=\"scroll\"><table>\n    <tr><th>Janela<\/th><th>Prós<\/th><th>Contras<\/th><\/tr>\n    <tr><td><b>Qui 01/10, 10:00 (abertura)<\/b><\/td><td>Os dois vão juntos antes do evento; o Jorge leva a caixa ao hotel (15 min de U2 + 5 a pé) e entra no w3.hub dentro da janela das portas. Rebeca segue a pé para os Höfe e a Ilha dos Museus, sem carregar nada. Sobram sexta e segunda como reserva.<\/td><td>Exige reservar a retirada no site da Apple (senão a loja não garante estoque na hora). Acordar cedo.<\/td><\/tr>\n    <tr><td>Sex 02/10, 18:00–20:00<\/td><td>Rebeca volta de Potsdam pelo RE1 até Friedrichstraße (10 min a pé); o Jorge vem do evento no fim do dia.<\/td><td>Dia longo de caminhada; loja mais cheia à noite.<\/td><\/tr>\n    <tr><td>Seg 05/10, 10:00–11:00<\/td><td>Última chance.<\/td><td>Sem margem para erro; check-out às 11h e trem às 14h30.<\/td><\/tr>\n  <\/table><\/div>\n  <ol class=\"steps\">\n    <li><b>Na loja:<\/b> pedir o formulário Tax Free (Global Blue) com o passaporte. Conferir que o endereço no formulário é o do Brasil.<\/li>\n    <li><b>Onde carimbar:<\/b> a validação é no <b>último aeroporto de saída da UE, que é Lisboa, 06/10<\/b>, não em Berlim (BER→LIS é voo interno da UE). No aeroporto de Lisboa: balcão da Alfândega (Customs), antes da segurança, com o Mac mini na mão, a nota e o passaporte. Depois, o balcão Global Blue para o reembolso. É por isso que sair da casa da Patrícia às 06:15 importa.<\/li>\n    <li><b>Pesar a mala:<\/b> 10 kg de mala de mão na TAP. O Mac mini pesa ~0,7 kg; com caixa, ~1,3 kg num cubo de 20 cm que deita no fundo da mala de mão. O Tax Free e a Receita brasileira preferem a caixa lacrada, e aqui ela custa pouco espaço: levar a caixa.<\/li>\n    <li><b>O checklist completo<\/b> das cinco fases (contato com a loja, preparação, loja, Tax Free, declaração no Brasil) está no arquivo do projeto.<\/li>\n  <\/ol>\n<\/section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Berlim<\/h2>\n  <p class=\"lead\">Janelas: quinta (Hackesche Höfe, Friedrichstraße), sexta à noite (KaDeWe, opcional) e o domingo na feira do Mauerpark. Sábado 03/10 é feriado e as lojas estão fechadas; só <a class=\"gl\" href=\"#g-spati\">Spätis<\/a> e a feira dominical escapam.<\/p>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O quê<\/th><th>Por quê<\/th><th>Onde (na rota)<\/th><th>Preço<\/th><\/tr>\n    <tr><td>Ampelmännchen<\/td><td>O boneco do semáforo da Alemanha Oriental, que sobreviveu à reunificação por campanha popular. Ímã, caneca, camiseta, gomas.<\/td><td>Loja Ampelmann dentro dos Hackesche Höfe (qui, até 21h).<\/td><td>€3–25<\/td><\/tr>\n    <tr><td>Balas da Bonbonmacherei<\/td><td>Feitas à mão numa máquina de antes da guerra, num porão de pátio. Saquinho de sabores (folha de maio, cola, framboesa).<\/td><td>Oranienburger Str. 32, nos Heckmann-Höfe, 8 min dos Hackesche Höfe. <b>Só qua–sáb 12h–19h<\/b>: quinta.<\/td><td>€4–8<\/td><\/tr>\n    <tr><td>Barra Ritter Sport personalizada<\/td><td>Vocês escolhem o chocolate e três recheios; fica pronta em 30 min. Sabores só de Berlim.<\/td><td>Ritter Sport Bunte Schokowelt, Friedrichstraße 83: desvio de 5 min da Unter den Linden na quinta. Fecha domingo; feriado, fechada.<\/td><td>€6–12<\/td><\/tr>\n    <tr><td>Fotos do Photoautomat<\/td><td>Tira de 4 fotos preto e branco, química de verdade, 5 min para revelar. A lembrança mais barata e mais Berlim.<\/td><td>Cabines na Warschauer Straße e na Kastanienallee (as duas no domingo). <b>Só moedas<\/b>: €2–4.<\/td><td>€2–4<\/td><\/tr>\n    <tr><td>Curry ketchup<\/td><td>A garrafa do molho da Curry 36.<\/td><td>No balcão da Curry 36.<\/td><td>€4<\/td><\/tr>\n    <tr><td>Vinil e livro<\/td><td>Berlim é a capital do vinil de segunda mão da Europa.<\/td><td>Feira do Mauerpark (dom, pechinchar); Dussmann (Friedrichstraße 90, qui até 0h) para novos e uma seção de livros em inglês de 4 andares.<\/td><td>€5–30<\/td><\/tr>\n    <tr><td>Achados de feira<\/td><td>Ex-RDA: canecas, câmeras, broches, pôsteres, roupas. Quase tudo em dinheiro.<\/td><td>Feira do Mauerpark, dom 10h–18h. Chegar antes das 12h para os bons.<\/td><td>€2–40<\/td><\/tr>\n    <tr><td>Comida do KaDeWe<\/td><td>O 6º andar do KaDeWe é a maior seção de comida da Europa: mostarda, chocolate, biscoito, chá, em embalagem de presente.<\/td><td>Tauentzienstraße 21, seg–sáb até 20h. Fora da rota; encaixa na volta de Potsdam na sexta (S7 até Zoologischer Garten, 5 min a pé). Fechado sáb 03 e dom 04.<\/td><td>€5–30<\/td><\/tr>\n  <\/table><\/div>\n  <div class=\"warn\">“Pedaço do Muro” em lojinha de souvenir: quase sempre concreto pintado. Se quiserem um, só na loja do Mauermuseum (Checkpoint Charlie) ou do Memorial do Muro, com certificado; ainda assim, é fé.<\/div>\n<\/section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que só existem aqui<\/h2>\n\n  <div class=\"shop\"><b>Loja Ampelmann, Hackesche Höfe<\/b><small>Rosenthaler Str. 40-41 · qui até 21h · dom 13h–18h<\/small>\n    <p>Dentro do pátio 5 dos Höfe, atrás de um túnel com semáforos pequenos. A única marca de souvenir de Berlim que os berlinenses acham engraçada.<\/p><\/div>\n\n  <div class=\"shop\"><b>Bonbonmacherei<\/b><small>Oranienburger Str. 32, no porão dos Heckmann-Höfe · qua–sáb 12h–19h<\/small>\n    <p>Um casal fazendo bala na frente de vocês, com prova grátis. Na quinta, é a parada logo depois do almoço no Curry 61, a 8 min dos Höfe.<\/p>\n    <details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">As balas são feitas ao vivo numa máquina de cobre de 1900, a mesma técnica artesanal desde então.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>Dussmann das KulturKaufhaus<\/b><small>Friedrichstraße 90 · seg–sáb até meia-noite<\/small>\n    <p>Livraria de 4 andares aberta até meia-noite, com instrumentos, vinis, partituras, papelaria e uma sala de escuta audiófila. Um andar inteiro em inglês. Nota 4,8 em 22 mil avaliações.<\/p><\/div>\n\n  <div class=\"shop\"><b>Ritter Sport Bunte Schokowelt<\/b><small>Friedrichstraße 83 · seg–sáb 10h–18h30<\/small>\n    <p>A loja da marca dos quadradinhos: parede com todos os sabores, fonte de chocolate e a bancada de montar a barra.<\/p><\/div>\n\n  <div class=\"shop\"><b>KaDeWe<\/b><small>Tauentzienstraße 21-24 · seg–sáb 10h–20h<\/small>\n    <p>Vale por um andar: o 6º, de comida, com bar de ostras e champanhe no meio. Só na sexta, se sobrar energia depois de Potsdam.<\/p>\n    <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Aberta em 1907, é a maior loja de departamentos da Europa continental — sobreviveu a dois incêndios na Segunda Guerra e foi reconstruída peça por peça.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>Feira do Mauerpark<\/b><small>Bernauer Str. 63 · domingo 10h–18h<\/small>\n    <p>O maior flohmarkt da cidade sobre a antiga faixa da morte do Muro: velharias da RDA, vinil, roupa, artesanato e comida de rua. Dinheiro, notas pequenas, e pechincha esperada.<\/p><\/div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">Qui: Ampelmann · Bonbonmacherei · Apple · Dussmann/Ritter (desvio 5 min)<\/span>\n    <span class=\"chip\">Sex à noite: KaDeWe (opcional)<\/span>\n    <span class=\"chip\">Sáb feriado: só Photoautomat e <a class=\"gl\" href=\"#g-spati\">Spätis<\/a><\/span>\n    <span class=\"chip\">Dom: feira do Mauerpark<\/span>\n  <\/div>\n<\/section>\n\n\n<\/div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"berlim-1\": [{\"t\": \"U2 · hotel (Gleisdreieck) → Alexanderplatz → Apple\", \"d\": \"Sentido Pankow, 6 paradas, ~15 min; depois 8 min a pé até a Rosenthaler Str. 44. Retirada às 10:00, na abertura.\"}, {\"t\": \"A pé · Apple → Ilha dos Museus\", \"d\": \"10 min. Neues Museum por volta das 11:00 (entrada pela James-Simon-Galerie; ingresso vale o dia todo), ~2h; Berliner Dom por fora e Lustgarten até 13h30.\"}, {\"t\": \"A pé · Ilha dos Museus → Hackesche Höfe\", \"d\": \"10 min de volta, 13h30. Almoço no Curry 61 (esquina dos Höfe), Ampelmann no pátio 5, Bonbonmacherei a 8 min.\"}, {\"t\": \"A pé (ou ônibus 100) · Höfe → Friedrichstraße → Unter den Linden → Portão\", \"d\": \"~30 min: Dussmann e Ritter Sport na Friedrichstraße, depois a avenida até o Portão. Ou ônibus 100 na parada Lustgarten.\"}, {\"t\": \"A pé · Portão → Reichstag (fachada)\", \"d\": \"Poucos minutos — só a fachada e o gramado por fora. A cúpula é hoje mesmo, às 19:30, na volta depois do jantar. Lanche no quiosque.\"}, {\"t\": \"A pé · Portão → Memorial do Holocausto\", \"d\": \"Poucos passos, ao sul do Portão.\"}, {\"t\": \"A pé · Tiergarten → Potsdamer Platz → hotel\", \"d\": \"~30 min pelo parque até a Potsdamer Platz; de lá 15 min a pé ou U2 (1 parada) até Gleisdreieck.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">×<\/button><span class=\"num\">'+n+'<\/span><h4>'+item.t+'<\/h4><p>'+item.d+'<\/p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var zoropaUtterance = null;\n  function zoropaSpeak(text, lang, btn){\n    var w = window;\n    try{ if (window.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador não suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '🔈'; };\n      u.onend = function(){ btn.textContent = '🔊'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '🔊';\n      alert('Não consegui tocar o áudio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n    if (e.data && typeof e.data.zoropaJump === 'string'){\n      var jt = document.getElementById(e.data.zoropaJump);\n      if (jt) sendScroll(jt);\n      return;\n    }\n    if (!e.data || typeof e.data.zoropaSearch !== 'string') return;\n    var q = e.data.zoropaSearch.toLowerCase();\n    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);\n    var node, target = null;\n    while ((node = walker.nextNode())){\n      var nv = node.nodeValue ? node.nodeValue.replace(/\\s+/g,' ') : '';\n      if (nv && nv.toLowerCase().indexOf(q) !== -1){\n        var p = node.parentElement;\n        if (p && p.closest('script,style')) continue;\n        target = p; break;\n      }\n    }\n    if (!target) return;\n    var det = target.closest('details');\n    if (det && !det.open) det.open = true;\n    sendScroll(target);\n    var prevBg = target.style.backgroundColor, prevTr = target.style.transition;\n    target.style.transition = 'background-color .3s';\n    target.style.backgroundColor = 'rgba(245,197,24,.55)';\n    setTimeout(function(){ target.style.backgroundColor = prevBg; setTimeout(function(){ target.style.transition = prevTr; }, 350); }, 1400);\n  });\nif (window.parent && window.parent !== window){\n    var nj = document.querySelector('nav.jump'); if (nj) nj.style.display = 'none';\n  }\n  document.querySelectorAll('nav.jump a[href^=\"#\"], a.gl').forEach(function(a){\n    a.addEventListener('click', function(ev){\n      var el = document.getElementById(a.getAttribute('href').slice(1));\n      if(!el) return;\n      ev.preventDefault();\n      if(!sendScroll(el)) el.scrollIntoView({behavior:'smooth', block:'start'});\n      if(a.classList.contains('gl')){ el.classList.add('hl'); setTimeout(function(){ el.classList.remove('hl'); }, 2500); }\n    });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var KEYP='zoropa-pend-', LOCKK='zoropa-pend-lock';\n  var boxes=Array.prototype.slice.call(document.querySelectorAll('.pend input[data-pend]'));\n  var lockBtn=document.getElementById('pendLock'), countEl=document.getElementById('pendCount');\n  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }\n  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }\n  function locked(){ return get(LOCKK)==='1'; }\n  function render(){\n    var done=0;\n    boxes.forEach(function(b){ b.disabled=locked(); if(b.checked) done++; });\n    if(c
