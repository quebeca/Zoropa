olta a Berlim às 17h.<\/p>\n  <\/div>\n<\/header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pendências<\/a>\n  <a href=\"#transporte\">Transporte<\/a>\n  <a href=\"#mapas\">Mapa<\/a>\n  <a href=\"#comer\">Onde comer<\/a>\n  <a href=\"#glossario\">Glossário<\/a>\n  <a href=\"#lembrancas\">Lembrancinhas e lojas<\/a>\n<\/div><\/nav>\n\n<div class=\"wrap\">\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pendências e reservas<\/h2>\n  <div class=\"note\"><b>Lista compartilhada:<\/b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📋 abrir a planilha “Pendências zoropa 2026”<\/a> — é a versão oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe têm edição). As caixinhas abaixo são só um espelho rápido neste aparelho.<\/div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"><\/span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">🔓 travar lista<\/button><\/div>\n  <h3>O que ainda falta<\/h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"potsdam-0\"> <span class=\"pend-what\">✅ <a class=\"gl\" href=\"#g-sanssouci\">Sanssouci<\/a>: <b>sanssouci+<\/b> comprado, €22, sex 02/10 às 10:00<\/span> <span class=\"pend-when\">feito · horário garantido no Palácio de Sanssouci<\/span> <span class=\"pend-how\">cobre também o <a class=\"gl\" href=\"#g-marmorpalais\">Palácio de Mármore<\/a> e os outros palácios abertos do parque — entrar neles não custa nada a mais, decida na hora<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"potsdam-1\"> <span class=\"pend-what\">Bilhete 24 h ABC no BVG<\/span> <span class=\"pend-when\">sex 02/10 de manhã, antes do RE1<\/span> <span class=\"pend-how\"><a class=\"gl\" href=\"#g-zona-c\">zona C<\/a> = Potsdam<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"potsdam-2\"> <span class=\"pend-what\">Conferir horário do RE1 de volta (~17h) no DB Navigator<\/span> <span class=\"pend-when\">sex 02/10 à tarde<\/span><\/label><\/li>\n  <\/ul>\n  <h3>Reservas e documentos<\/h3>\n  <p class=\"lead\">Os PDFs estão no Drive da conta bexorxe (privados: quem não estiver logado nela vê “pedir acesso”). 📍 abre o lugar no Maps.<\/p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">Palácio de Sanssouci<\/span> <span class=\"pend-when\">sex 02/10 manhã · ônibus 695 até \"<a class=\"gl\" href=\"#g-schloss\">Schloss<\/a> Sanssouci\"<\/span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Schloss%20Sanssouci%2C%20Potsdam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Palácio de Mármore (opcional, decidir na hora)<\/span> <span class=\"pend-when\">sex 02/10 tarde · fica no caminho; só entrar se a próxima visita guiada estiver saindo em minutos<\/span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Marmorpalais%2C%20Potsdam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Ponte Glienicke<\/span> <span class=\"pend-when\">sex 02/10 fim da tarde · ~30 min a pé pelo Neuer Garten<\/span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Glienicker%20Br%C3%BCcke\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n  <\/ul>\n<\/section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar<\/h2>\n  <p class=\"lead\">Potsdam é <a class=\"gl\" href=\"#g-zona-c\">zona C<\/a>: um único bilhete <b>24 h ABC (€12,90 por pessoa)<\/b>, comprado no app BVG de manhã, cobre tudo o dia inteiro, inclusive os bondes e ônibus de Potsdam. Com o hotel na Gleisdreieck, o caminho mais rápido não é o do roteiro (S1 a Wannsee): é <b>U2 até Zoologischer Garten e o trem regional RE1<\/b>.<\/p>\n\n  <div class=\"warn\"><b>Saída antecipada.<\/b> O ingresso sanssouci+ tem <b>horário travado às 10:00<\/b> no Palácio de Sanssouci, e a entrada por horário da SPSG tem pouca tolerância. Saindo às 08:15, a chegada ao palácio fica por volta das 09:40 — com folga para o 695, que passa a cada 20 min. Saindo às 09:00, como estava antes, a chegada seria 10:15 e o horário já teria passado.<\/div>\\n\\n  <h3>Ida, 08:15<\/h3>\n  <ol class=\"steps\">\n    <li><b>Compre o bilhete 24 h ABC no app<\/b> antes de entrar na Gleisdreieck. Valem até as 8h de sábado.<\/li>\n    <li><b>U2 sentido Ruhleben<\/b>, 7 paradas até Zoologischer Garten, ~12 min. Siga as placas “DB / Regionalbahn”.<\/li>\n    <li><b>RE1 sentido Brandenburg ou Magdeburg<\/b>, plataforma indicada no painel, 22 min até Potsdam Hauptbahnhof. Passa a cada 20–30 min. O S7, na mesma estação, também vai a Potsdam, mas leva 35 min.<\/li>\n    <li><b>Em Potsdam Hbf: ônibus 695<\/b> na saída norte (“Ausgang Innenstadt”), até a parada \"<a class=\"gl\" href=\"#g-schloss\">Schloss<\/a> <a class=\"gl\" href=\"#g-sanssouci\">Sanssouci<\/a>“, 15 min. O 695 passa a cada 20 min; a alternativa é o bonde 91 até ”Luisenplatz-Süd/Park Sanssouci\" e 10 min a pé pela entrada principal, com a vista dos terraços.<\/li>\n  <\/ol>\n\n  <h3>Dentro de Potsdam<\/h3>\n  <ol class=\"steps\">\n    <li><b>Parque Sanssouci:<\/b> grátis; entrar nos palácios é pago. O parque tem 2,5 km de ponta a ponta: Palácio de Sanssouci (leste) → Casa Chinesa (10 min) → Orangerie (10 min, fechada em obras: só por fora) → Neues Palais (25 min). Se for até o Neues Palais, o 695 também para lá e volta pelo mesmo caminho.<\/li>\n    <li><b>Sanssouci → Bairro Holandês:<\/b> a pé, 20 min, descendo pela Brandenburger Straße (rua de pedestres, com lojas) até o Portão de Brandemburgo de Potsdam e seguindo até a Mittelstraße. Ou bonde 91/94 da Luisenplatz até \"<a class=\"gl\" href=\"#g-nauener-tor\">Nauener Tor<\/a>\".<\/li>\n    <li><b>Bairro Holandês → Neuer Garten:<\/b> ônibus 603 da parada “Nauener Tor” até “Birkenstraße/Alleestraße”, ~10 min. Dali entra-se no parque a pé.<\/li>\\n    <li><b>Neuer Garten → Ponte Glienicke:<\/b> ~45 min a pé para o norte, pela margem do Heiliger See, passando pelo <a class=\"gl\" href=\"#g-marmorpalais\">Palácio de Mármore<\/a> e pelo <a class=\"gl\" href=\"#g-cecilienhof\">Cecilienhof<\/a>, os dois por fora. É a parte bonita da tarde e não depende de horário de ninguém. Para encurtar: 603 até “Schloss Cecilienhof” e o resto a pé, ou 603 + bonde 93 até “Glienicker Brücke”.<\/li>\\n    <li><b>Ponte → Hbf:<\/b> bonde 93 direto, 20 min.<\/li>\n  <\/ol>\n\n  <h3>Volta, ~17:00, com uma escolha<\/h3>\n  <ol class=\"steps\">\n    <li><b>Direto ao hotel:<\/b> RE1 sentido Berlin/Frankfurt (Oder) até Zoologischer Garten, U2 sentido Pankow até Gleisdreieck. 45 min no total.<\/li>\n    <li><b>Com o desvio do KaDeWe:<\/b> descer do RE1 no Zoo, 5 min a pé até o KaDeWe (Tauentzienstraße, aberto até 20h), e depois U2 de Wittenbergplatz (a estação em frente ao KaDeWe) até Gleisdreieck, 4 paradas, direto. O bilhete ABC cobre.<\/li>\n    <li><b>Com a Apple Store:<\/b> RE1 até Friedrichstraße, 10 min a pé até a Rosenthaler Straße 44 (até 20h), depois U8 Weinmeisterstraße → Alexanderplatz + U2. É a janela reserva do Mac mini, só se a retirada de quinta não tiver acontecido (com o Jorge, que vem do evento).<\/li>\n  <\/ol>\n\n  <h3>E se…<\/h3>\n  <ol class=\"steps\">\n    <li><b>Chover forte.<\/b> O dia é quase todo a céu aberto. Versão coberta: Sanssouci por dentro (10h) → Neues Palais por dentro (o mesmo sanssouci+ vale; 695 até lá) → almoço no Bairro Holandês → Palácio de Mármore por dentro (aí sim vale a visita guiada: é abrigo). Corte a Ponte Glienicke e a caminhada pelo Neuer Garten; volta de 603 + bonde 93 ao Hbf. Nesse caso o sanssouci+ passa a valer, porque entra o Neues Palais.<\/li>\n    <li><b>O RE1 falhar.<\/b> S7 do Zoologischer Garten até Potsdam Hbf, 35 min, mesmo bilhete ABC.<\/li>\n    <li><b>Perder o 695.<\/b> Bonde 91 até Luisenplatz-Süd/Park Sanssouci e 10 min a pé pela entrada principal, com a vista dos terraços — na prática é a chegada mais bonita.<\/li>\n  <\/ol>\n\n  <h3 id=\"glossario\">Glossário<\/h3>\n  <dl class=\"gloss\">\n    <div id=\"g-zona-c\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Zona C','de-DE',this)\" aria-label=\"Ouvir Zona C\">🔊<\/button> Zona C<\/dt><dd>Potsdam. Bilhete AB de Berlim não vale: multa de €60.<\/dd><\/div>\n    <div id=\"g-re-rb\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('RE / RB','de-DE',this)\" aria-label=\"Ouvir RE / RB\">🔊<\/button> RE / RB<\/dt><dd>Trem regional (Regional-Express / Regionalbahn). Vermelho, da Deutsche Bahn, coberto pelo bilhete ABC.<\/dd><\/div>\n    <div id=\"g-vip\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('ViP','de-DE',this)\" aria-label=\"Ouvir ViP\">🔊<\/button> ViP<\/dt><dd>A empresa de bondes e ônibus de Potsdam. Mesmo bilhete.<\/dd><\/div>\n    <div id=\"g-schloss\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Schloss','de-DE',this)\" aria-label=\"Ouvir Schloss\">🔊<\/button> Schloss<span class=\"tl\">shlós<\/span><\/dt><dd>Palácio. Sans souci = “sem preocupações”, em francês, o nome que Frederico II deu à casa de verão.<\/dd><\/div>\n    <div id=\"g-nauener-tor\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Nauener Tor','de-DE',this)\" aria-label=\"Ouvir Nauener Tor\">🔊<\/button> Nauener Tor<\/dt><dd>O portão neogótico na ponta do Bairro Holandês; é a parada de ônibus e bonde de referência.<\/dd><\/div>\n    <div id=\"g-hollandisches-viertel\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Holländisches Viertel','de-DE',this)\" aria-label=\"Ouvir Holländisches Viertel\">🔊<\/button> Holländisches Viertel<span class=\"tl\">ho-LEN-di-shes FIR-tel<\/span><\/dt><dd>Bairro Holandês: 134 casas de tijolo vermelho construídas para artesãos holandeses entre 1733 e 1742.<\/dd><\/div>\n    <div id=\"g-havel\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Havel','de-DE',this)\" aria-label=\"Ouvir Havel\">🔊<\/button> Havel<span class=\"tl\">HÁ-fel<\/span><\/dt><dd>O rio, que aqui vira uma sequência de lagos; a Ponte Glienicke cruza um deles.<\/dd><\/div>\n    <div id=\"g-as-batatas-no-tumulo\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('As batatas no túmulo','de-DE',this)\" aria-label=\"Ouvir As batatas no túmulo\">🔊<\/button> As batatas no túmulo<\/dt><dd>Frederico II está enterrado no terraço de Sanssouci, e os visitantes costumam deixar batatas sobre a lápide.<details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">Frederico II impôs o cultivo da batata à Prússia no século XVIII, num momento em que os camponeses desconfiavam do tubérculo (achavam venenoso, por ser da família da beladona). Reza a lenda que ele mandou plantar um campo de batatas guardado por soldados só de dia, para despertar a curiosidade dos camponeses, que roubavam as mudas à noite achando que era algo valioso — e assim a batata se espalhou pela Prússia. Deixar batatas na lápide dele, ao lado dos túmulos dos cães que ele amava, virou tradição de visitantes gratos.<\/div><\/details><\/dd><\/div>\n    <div id=\"g-sanssouci\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Sanssouci','de-DE',this)\" aria-label=\"Ouvir Sanssouci\">🔊<\/button> Sanssouci<span class=\"tl\">sã(n)-su-SI (é francês, não alemão)<\/span><\/dt><dd>O palácio de verão de Frederico II e o parque em volta. A manhã inteira de sexta.<\/dd><\/div>\n    <div id=\"g-cecilienhof\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Cecilienhof','de-DE',this)\" aria-label=\"Ouvir Cecilienhof\">🔊<\/button> Cecilienhof<span class=\"tl\">tsê-TSI-li-en-hôf<\/span><\/dt><dd>O palácio-chalé de 1917 no Neuer Garten onde se assinou o Acordo de Potsdam em 1945. <b>Fechado em obras desde nov/2024, reabertura prevista para 2027<\/b> — dá para ver só por fora, no caminho para a ponte.<\/dd><\/div>\n     <div id=\"g-marmorpalais\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Marmorpalais','de-DE',this)\" aria-label=\"Ouvir Marmorpalais\">🔊<\/button> Palácio de Mármore<span class=\"tl\">MAR-mor-pa-lais<\/span><\/dt><dd>O Marmorpalais, de 1787–1793, na beira do Heiliger See, no Neuer Garten. Primeiro classicismo prussiano. É onde o casal príncipe herdeiro morava antes de se mudar para o Cecilienhof. Fica no caminho da caminhada de sexta; entrar é opcional — <b>a visita por dentro é guiada e só em alemão<\/b> (€8, ter–dom 10h–17h30, última entrada 17h, bilheteria no local), com o áudio do app SANSSOUCI em inglês como alternativa, e pode haver espera pela próxima saída.<\/dd><\/div>\n  <\/dl>\n\n    <h3>Frases úteis<\/h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hallo','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Hallo<\/b> — <i>HA-lô (olá)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Morgen','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Guten Morgen<\/b> — <i>GU-ten MÓR-guen (bom dia)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Abend','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Guten Abend<\/b> — <i>GU-ten Á-bent (boa noite, ao chegar)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Danke schön','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Danke schön<\/b> — <i>DAN-ke shön (muito obrigada)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bitte','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Bitte<\/b> — <i>BI-te (por favor / de nada / pois não)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Entschuldigung','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Entschuldigung<\/b> — <i>ent-SHUL-di-gung (desculpe / com licença)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Sprechen Sie Englisch?','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Sprechen Sie Englisch?<\/b> — <i>SHPRÉ-rren zi ÉN-glish (fala inglês?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ich verstehe nicht','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Ich verstehe nicht<\/b> — <i>irr fer-SHTÊ-e nirrt (não entendo)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Die Rechnung, bitte','de-DE',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Die Rechnung, bitte<\/b> — <i>di RÉRR-nung BI-te (a conta, por favor)<\/i><\/li>\n  <\/ul>\n\n  <h3>Quanto custa<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Item<\/th><th>1 pessoa<\/th><\/tr>\n    <tr><td>24 h ABC (Rebeca)<\/td><td>€12,90<\/td><\/tr>\n    <tr><td>sanssouci+ (já comprado) — Sanssouci com horário + Palácio de Mármore e demais palácios abertos<\/td><td>€22<\/td><\/tr>\\n    <tr><td>Comida<\/td><td>€25–35<\/td><\/tr>\n    <tr><td><b>Total do dia<\/b><\/td><td><b>~€60–70<\/b><\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<!-- ====================== MAPA ====================== -->\n<section id=\"mapas\">\n  <h2>Mapa do dia<\/h2>\n  <p class=\"lead\">Pontos nas coordenadas reais. O parque ocupa o oeste; o Bairro Holandês fica no centro, ao norte da estação; o Neuer Garten e a ponte, no nordeste, junto aos lagos.<\/p>\n\n  <figure>\n    <svg viewBox=\"0 0 360 255\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Potsdam, sexta 2 de outubro\">\n      <path d=\"M340 40 C 320 90, 300 130, 270 175 C 250 205, 235 230, 225 255 L360 255 L360 40 Z\" class=\"water\"/>\n      <ellipse cx=\"252\" cy=\"72\" rx=\"22\" ry=\"34\" class=\"water\"/>\n      <text x=\"300\" y=\"150\" class=\"mg\">Havel<\/text>\n      <text x=\"228\" y=\"30\" class=\"mg\">Heiliger See<\/text>\n      <rect x=\"28\" y=\"98\" width=\"130\" height=\"72\" class=\"park\" rx=\"24\"/><text x=\"46\" y=\"94\" class=\"mg\">Park Sanssouci (2,5 km)<\/text>\n      <ellipse cx=\"222\" cy=\"90\" rx=\"30\" ry=\"26\" class=\"park\" style=\"opacity:.5\"/><text x=\"196\" y=\"112\" class=\"mg\">Neuer Garten<\/text>\n      <path d=\"M159 161 L192 150\" class=\"street\"/><text x=\"150\" y=\"176\" class=\"ms\">Brandenburger Str. (pedestres)<\/text>\n      <text x=\"14\" y=\"22\" class=\"mh\">Potsdam · sex 02/10<\/text>\n\n      <path d=\"M223 208 C 190 200, 150 180, 128 142\" class=\"r-hit\" data-r=\"1\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M223 208 C 190 200, 150 180, 128 142\" class=\"bus r-path\" data-r=\"1\" data-map=\"potsdam-0\" tabindex=\"-1\"/><text x=\"172\" y=\"192\" class=\"ms\" style=\"fill:var(--amarelo)\">ônibus 695 · 15 min<\/text>\n      <path d=\"M121 136 L104 150\" class=\"r-hit\" data-r=\"2\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M121 136 L104 150\" class=\"walk r-path\" data-r=\"2\" data-map=\"potsdam-0\" tabindex=\"-1\"/>\n      <path d=\"M104 150 L102 126\" class=\"r-hit\" data-r=\"3\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M104 150 L102 126\" class=\"walk r-path\" data-r=\"3\" data-map=\"potsdam-0\" tabindex=\"-1\"/>\n      <path d=\"M100 124 L46 150\" class=\"r-hit\" data-r=\"4\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M100 124 L46 150\" class=\"walk r-path\" style=\"opacity:.5\" data-r=\"4\" data-map=\"potsdam-0\" tabindex=\"-1\"/>\n      <path d=\"M126 140 L156 158\" class=\"r-hit\" data-r=\"5\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M126 140 L156 158\" class=\"walk r-path\" data-r=\"5\" data-map=\"potsdam-0\" tabindex=\"-1\"/>\n      <path d=\"M162 160 L190 147\" class=\"r-hit\" data-r=\"6\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M162 160 L190 147\" class=\"walk r-path\" data-r=\"6\" data-map=\"potsdam-0\" tabindex=\"-1\"/>\n      <path d=\"M194 136 C 210 110, 225 80, 235 52\" class=\"r-hit\" data-r=\"7\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M194 136 C 210 110, 225 80, 235 52\" class=\"bus r-path\" style=\"opacity:.6\" data-r=\"7\" data-map=\"potsdam-0\" tabindex=\"-1\"/><text x=\"200\" y=\"60\" class=\"ms\" style=\"fill:var(--amarelo)\">603<\/text>\n      <path d=\"M240 52 C 265 60, 290 70, 300 80\" class=\"r-hit\" data-r=\"8\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M240 52 C 265 60, 290 70, 300 80\" class=\"walk r-path\" style=\"opacity:.6\" data-r=\"8\" data-map=\"potsdam-0\" tabindex=\"-1\"/>\n      <path d=\"M304 84 C 280 130, 250 180, 226 206\" class=\"r-hit\" data-r=\"9\" data-map=\"potsdam-0\" tabindex=\"-1\"/><path d=\"M304 84 C 280 130, 250 180, 226 206\" class=\"bus r-path\" style=\"opacity:.6\" data-r=\"9\" data-map=\"potsdam-0\" tabindex=\"-1\"/><text x=\"268\" y=\"160\" class=\"ms\" style=\"fill:var(--amarelo)\">bonde 93<\/text>\n\n      <circle cx=\"223\" cy=\"208\" r=\"7\" class=\"pt\"/><text x=\"232\" y=\"212\" class=\"m\">Potsdam Hbf<\/text>\n      <text x=\"232\" y=\"224\" class=\"ms\">RE1 → Berlim Zoo 22 min<\/text>\n      <circle cx=\"121\" cy=\"136\" r=\"7\" class=\"pt\"/><text x=\"60\" y=\"130\" class=\"m\">Sanssouci 10:00<\/text>\n      <circle cx=\"127\" cy=\"128\" r=\"3\" class=\"eat\"/><text x=\"132\" y=\"126\" class=\"ms\">Mühle (evitar)<\/text>\n      <circle cx=\"103\" cy=\"152\" r=\"5\" class=\"pt\"/><text x=\"60\" y=\"166\" class=\"ms\">Casa Chinesa<\/text>\n      <circle cx=\"102\" cy=\"124\" r=\"5\" class=\"pt\"/><text x=\"106\" y=\"118\" class=\"ms\">Orangerie<\/text>\n      <circle cx=\"104\" cy=\"112\" r=\"4\" class=\"eat\"/><text x=\"40\" y=\"112\" class=\"ms\">Drachenhaus<\/text>\n      <circle cx=\"41\" cy=\"152\" r=\"5\" class=\"pt\"/><text x=\"8\" y=\"182\" class=\"ms\">Neues Palais (opcional)<\/text>\n      <circle cx=\"159\" cy=\"161\" r=\"5\" class=\"pt\"/><text x=\"120\" y=\"148\" class=\"ms\" style=\"text-anchor:end\"><\/text>\n      <circle cx=\"194\" cy=\"145\" r=\"7\" class=\"pt\"/><text x=\"200\" y=\"140\" class=\"m\">Bairro Holandês 13:30<\/text>\n      <circle cx=\"200\" cy=\"152\" r=\"4\" class=\"eat\"/><text x=\"206\" y=\"156\" class=\"ms\">Charlotte · Holländer · Augustiner<\/text>\n      <circle cx=\"191\" cy=\"137\" r=\"3\" class=\"pt\"/><text x=\"150\" y=\"134\" class=\"ms\" style=\"text-anchor:end\">Nauener Tor<\/text>\n      <circle cx=\"237\" cy=\"48\" r=\"6\" class=\"pt\"/><text x=\"245\" y=\"46\" class=\"m\">Cecilienhof (só por fora)<\/text>\n       <circle cx=\"231\" cy=\"72\" r=\"4\" class=\"pt\"/><text x=\"239\" y=\"76\" class=\"ms\">Pal. de Mármore (opcional)<\/text>\n      <circle cx=\"304\" cy=\"81\" r=\"6\" class=\"pt\"/><text x=\"276\" y=\"98\" class=\"m\">Ponte Glienicke<\/text>\n      <circle cx=\"135\" cy=\"139\" r=\"3\" class=\"shop\"/><text x=\"138\" y=\"146\" class=\"ms\">Museum Shop<\/text>\n    <g class=\"r-badge transit\" data-r=\"1\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: Ônibus 695 · Potsdam Hbf → Schloss Sanssouci\" transform=\"translate(168.7,184.5)\"><circle r=\"9\"/><text y=\".5\">1<\/text><\/g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A pé · Sanssouci → Casa Chinesa\" transform=\"translate(119,138)\"><circle r=\"9\"/><text y=\".5\">2<\/text><\/g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A pé · Casa Chinesa → Orangerie\" transform=\"translate(96,128)\"><circle r=\"9\"/><text y=\".5\">3<\/text><\/g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A pé (opcional) · Orangerie → Neues Palais\" transform=\"translate(73,137)\"><circle r=\"9\"/><text y=\".5\">4<\/text><\/g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A pé · Parque → Brandenburger Straße\" transform=\"translate(141,149)\"><circle r=\"9\"/><text y=\".5\">5<\/text><\/g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A pé · Brandenburger Straße → Bairro Holandês\" transform=\"translate(176,153.5)\"><circle r=\"9\"/><text y=\".5\">6<\/text><\/g><g class=\"r-badge transit\" data-r=\"7\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 7: Ônibus 603 · Nauener Tor → Birkenstraße/Alleestraße (Neuer Garten)\" transform=\"translate(216.6,95)\"><circle r=\"9\"/><text y=\".5\">7<\/text><\/g><g class=\"r-badge walk\" data-r=\"8\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 8: A pé · Neuer Garten → Ponte Glienicke\" transform=\"translate(271.3,63.4)\"><circle r=\"9\"/><text y=\".5\">8<\/text><\/g><g class=\"r-badge transit\" data-r=\"9\" data-map=\"potsdam-0\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 9: Bonde 93 · Ponte Glienicke → Potsdam Hbf\" transform=\"translate(268.3,147.2)\"><circle r=\"9\"/><text y=\".5\">9<\/text><\/g><\/svg>\n    <figcaption>O dia em anel: ônibus até o parque, a pé até o Bairro Holandês, ônibus até o Neuer Garten, a pé pela margem do lago até a ponte, bonde de volta à estação.<\/figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"><\/i>ponto do roteiro<\/span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"><\/i>comer<\/span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"><\/i>loja<\/span>\n      <span>— — a pé<\/span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">━<\/span> ônibus/bonde<\/span>\n    <\/div>\n  <div class=\"rota-painel\" id=\"rp-potsdam-0\" aria-live=\"polite\"><\/div><\/figure>\n\n  <p>Mapa real: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Potsdam+Hauptbahnhof&destination=Glienicker+Br%C3%BCcke&waypoints=Schloss+Sanssouci%7CChinesisches+Haus+Potsdam%7CHoll%C3%A4ndisches+Viertel+Potsdam%7CMarmorpalais&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir no Google Maps<\/a>.<\/p>\n\n  <h3>Sobre os lugares<\/h3>\n  <div class=\"attractions\">\n    <h4>Palácio de Sanssouci<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Frederico II, o Grande, mandou construir o palácio em 1745 como refúgio pessoal, longe da etiqueta rígida da corte em Berlim — o nome, do francês “sans souci” (sem preocupações), resume bem a intenção. Ele mesmo participou do projeto ao lado do arquiteto Knobelsdorff, e é ali que está enterrado, por vontade própria, ao lado dos cães que teve ao longo da vida (não no imponente mausoléu que construiu para si em Berlim).<\/div><\/details><details class=\"curio\"><summary>🏛️ um pouco de arquitetura<\/summary><div class=\"in\">É um dos maiores exemplos de rococó na Alemanha: linhas curvas, dourado, decoração botânica exuberante — um estilo bem mais leve e íntimo que o barroco grandioso de Versalhes, que serviu de inspiração distante. O terraço em degraus com videiras, na frente do palácio, foi ideia do próprio Frederico, fascinado por cultivar figos e uvas num clima que não ajudava muito.<\/div><\/details>\n    <h4>Palácio de Mármore<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Construído em 1792 para Frederico Guilherme II, à beira do Heiliger See, é o marco inicial do classicismo na Prússia — tijolo vermelho com detalhes em mármore de Silésia, num registro sóbrio e íntimo, o oposto do rococó de Sanssouci. Foi ali que o casal príncipe herdeiro Wilhelm e Cecilie morou antes de se mudar para o Cecilienhof, a poucos minutos ao norte, no mesmo parque.<\/div><\/details>\n     <h4>Palácio de Cecilienhof <span style=\"font-weight:400;color:var(--muted)\">(fechado)<\/span><\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\"><b>Em obras desde novembro de 2024; reabertura prevista para 2027<\/b> — estão renovando a ala do hotel, a recepção de visitantes e a infraestrutura. Nem a sala da mesa de negociação está visitável. Dá para ver o conjunto por fora, no caminho do Neuer Garten para a ponte. Construído entre 1914 e 1917 no estilo de uma mansão de campo inglesa (Tudor Revival), foi o último palácio erguido pela dinastia Hohenzollern antes do fim da monarquia alemã em 1918. Ficou mundialmente conhecido por outro motivo: foi ali, em julho e agosto de 1945, que Truman, Churchill (substituído por Attlee na metade) e Stálin se reuniram na Conferência de Potsdam para decidir o destino da Alemanha derrotada e redesenhar as fronteiras do pós-guerra — as salas onde eles se sentaram estão preservadas e podem ser visitadas.<\/div><\/details>\n    <h4>Ponte Glienicke<\/h4><details class=\"curio\"><summary>🔖 detalhe curioso<\/summary><div class=\"in\">Ficou conhecida como a “Ponte dos Espiões” durante a Guerra Fria: era o ponto de troca de agentes capturados entre os EUA e a União Soviética, porque cruzava exatamente a fronteira entre Berlim Ocidental e a Alemanha Oriental (Potsdam). A troca mais famosa aconteceu em 1962, quando o piloto americano Gary Powers foi trocado pelo espião soviético Rudolf Abel — o episódio que inspirou o filme “Ponte dos Espiões”, de Steven Spielberg.<\/div><\/details>\n  <\/div>\n<\/section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 opções por parada<\/h2>\n\n  <div class=\"meal\">\n    <h3>Café no parque · 11:30 · Sanssouci<\/h3>\n    <p class=\"when\">Um lugar a evitar e um a usar. O <b>Gasthaus Zur Historischen Mühle<\/b>, ao lado do palácio, é o único restaurante da entrada e as avaliações são unânimes: espera de 20 min para ser atendido, nota 3,8. Já o <b>Drachenhaus<\/b>, a casa-pagode de 1770 no meio do parque (Maulbeerallee 4, 11h–19h), serve café, bolo e Glühwein em terraço com vista, e um schnitzel decente para quem quiser almoçar ali; serviço lento também, mas é a pausa entre a Orangerie e a Casa Chinesa.<\/p>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · 13:30 · Bairro Holandês<\/h3>\n    <p class=\"when\">Os três ficam na Mittelstraße e na Benkertstraße, as duas ruas principais do bairro, a 30 m uma da outra. Sexta lota entre 13h e 14h; a primeira aceita reserva.<\/p>\n\n    <div class=\"opt pick\"><h4>Maison Charlotte <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Mittelstraße 20, numa casa holandesa com jardim de inverno nos fundos.<\/span>\n        <b>Por quê<\/b><span>Um bistrô francês que os alsacianos elogiam como melhor que muitos da Alsácia. Menus fixos de almoço, vinho por taça, o lugar bonito do bairro.<\/span>\n        <b>Estrela<\/b><span>Steak tartare; sopa de peixe; tarte flambée.<\/span>\n        <b>Custo<\/b><span>€22–35.<\/span>\n        <b>Horário<\/b><span>Sex 12h–15h e 16h–23h. Reservar: +49 331 2805450.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Zum Fliegenden Holländer<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Benkertstraße 5, esquina da Mittelstraße.<\/span>\n        <b>Por quê<\/b><span>A taberna alemã do bairro, decoração de navio, schnitzel elogiado como o melhor de muita gente, porção grande, sem reserva.<\/span>\n        <b>Estrela<\/b><span>Wiener Schnitzel; sopa de tomate com pão nos dias frios.<\/span>\n        <b>Custo<\/b><span>€16–24.<\/span>\n        <b>Horário<\/b><span>Sex 12h–23h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Augustiner Potsdam<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Mittelstraße 18, com jardim de cerveja nos fundos.<\/span>\n        <b>Por quê<\/b><span>Bávaro de rede, mas com mesa quando os outros lotam, chope Augustiner de Munique e jardim se o dia estiver bonito.<\/span>\n        <b>Estrela<\/b><span>Salsichas brancas com pretzel; Schweinsbraten.<\/span>\n        <b>Custo<\/b><span>€15–22. Serviço lento nas avaliações.<\/span>\n        <b>Horário<\/b><span>Sex 12h–22h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"note\">Doce: <b>Café Guam<\/b>, Mittelstraße 39, o café de cheesecake de Potsdam, 20 sabores a ~€3,50 a fatia, nota 4,6. <b>Só dinheiro.<\/b> Sexta 11h–19h; fecha no fim de semana, então é hoje ou nunca.<\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar leve · 18:30–20:00 · onde a volta terminar<\/h3>\n    <p class=\"when\">O roteiro dizia “perto do hotel”. Depende do desvio que escolherem no trem de volta.<\/p>\n\n    <div class=\"opt pick\"><h4>Sem desvio: Monte Mente ou Lindenbräu <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Sony Center, 12 min do hotel. Fichas completas no guia de Berlim, jantar de quinta.<\/span>\n        <b>Por quê<\/b><span>Se na quinta foram ao Midtown Grill, sexta é a vez do jantar barato e bom ali do lado.<\/span>\n        <b>Custo<\/b><span>€18–28.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Com o KaDeWe: o 6º andar<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Tauentzienstraße 21, até 20h.<\/span>\n        <b>Por quê<\/b><span>A seção de comida tem balcões onde se janta sentado: ostras e champanhe, currywurst chique no SchniekeWurst, sopas, sushi. Compras de comida e jantar no mesmo lugar.<\/span>\n        <b>Custo<\/b><span>€15–40, depende do balcão.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Ficando em Potsdam: Zum Fliegenden Holländer<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>Bairro Holandês, até 23h.<\/span>\n        <b>Por quê<\/b><span>Se o dia atrasar e a Ponte Glienicke ficar para as 18h, jantar no bairro e pegar o RE1 às 20h30 é mais gostoso do que correr. Trens até depois da meia-noite.<\/span>\n        <b>Custo<\/b><span>€16–24.<\/span>\n      <\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas e lojas<\/h2>\n  <p class=\"lead\">Sexta é dia útil e as lojas do bairro abrem; é a melhor janela de compras “de design” da viagem inteira depois de Amsterdam, e a última antes do fim de semana fechado em Berlim.<\/p>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O quê<\/th><th>Por quê<\/th><th>Onde<\/th><th>Preço<\/th><\/tr>\n    <tr><td>Porcelana e papelaria de <a class=\"gl\" href=\"#g-sanssouci\">Sanssouci<\/a><\/td><td>A loja da fundação dos palácios prussianos: reproduções dos vasos, cadernos com os desenhos do jardim, o Frederico de bolso.<\/td><td>Museum Shop Sanssouci, na Maulbeerallee ao lado do palácio, sex 10h–18h.<\/td><td>€5–40<\/td><\/tr>\n    <tr><td>Cerâmica, joia e objetos de casa de Brandemburgo<\/td><td>Loja-conceito de produtores locais, nota 4,9, atendimento que ajuda a escolher presente.<\/td><td>Stilbude, Mittelstraße 37, sex 11h–18h.<\/td><td>€8–60<\/td><\/tr>\n    <tr><td>Decoração e roupa sustentável<\/td><td>“Nada que você precise, tudo que você quer”, nas palavras de uma avaliação. Coisas pequenas de casa que cabem na mala.<\/td><td>Tante Paula, Benkertstraße 11, sex 11h–18h.<\/td><td>€10–50<\/td><\/tr>\n    <tr><td>Chaveiro feito na hora e miudezas musicais<\/td><td>Lojinha nova de presentes com piano no meio e bancada de montar o próprio chaveiro.<\/td><td>Menuett, Hebbelstraße 43, sex 10h–15h: só até as 15h.<\/td><td>€5–20<\/td><\/tr>\n    <tr><td>Cheesecake para o trem<\/td><td>Uma fatia embrulhada do Guam para as 17h.<\/td><td>Café Guam, Mittelstraße 39, dinheiro.<\/td><td>€3,50<\/td><\/tr>\n  <\/table><\/div>\n\n  <div class=\"ok\">Ordem prática: Stilbude e Tante Paula antes do almoço (12h45), Menuett logo depois (até 15h), Guam na saída para o 603. Tudo num raio de 150 m.<\/div>\n<\/section>\n\n\n<\/div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"potsdam-0\": [{\"t\": \"Ônibus 695 · Potsdam Hbf → Schloss Sanssouci\", \"d\": \"~15 min, saída norte \\\"Ausgang Innenstadt\\\". Alternativa: bonde 91 até Luisenplatz-Süd + 10 min a pé.\"}, {\"t\": \"A pé · Sanssouci → Casa Chinesa\", \"d\": \"Dentro do parque.\"}, {\"t\": \"A pé · Casa Chinesa → Orangerie\", \"d\": \"~10 min.\"}, {\"t\": \"A pé (opcional) · Orangerie → Neues Palais\", \"d\": \"~25 min a mais; o ônibus 695 também para lá e volta pelo mesmo caminho.\"}, {\"t\": \"A pé · Parque → Brandenburger Straße\", \"d\": \"Rua de pedestres, com lojas.\"}, {\"t\": \"A pé · Brandenburger Straße → Bairro Holandês\", \"d\": \"~20 min ao todo desde Sanssouci, até o Nauener Tor.\"}, {\"t\": \"Ônibus 603 · Nauener Tor → Birkenstraße/Alleestraße\", \"d\": \"~10 min. Entrada no Neuer Garten a pé.\"}, {\"t\": \"A pé · Neuer Garten → Ponte Glienicke\", \"d\": \"~45 min pela margem do Heiliger See, passando pelo Palácio de Mármore e pelo Cecilienhof, os dois por fora.\"}, {\"t\": \"Bonde 93 · Ponte Glienicke → Potsdam Hbf\", \"d\": \"~20 min, direto.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">×<\/button><span class=\"num\">'+n+'<\/span><h4>'+item.t+'<\/h4><p>'+item.d+'<\/p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var zoropaUtterance = null;\n  function zoropaSpeak(text, lang, btn){\n    var w = window;\n    try{ if (window.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador não suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '🔈'; };\n      u.onend = function(){ btn.textContent = '🔊'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '🔊';\n      alert('Não consegui tocar o áudio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n    if (e.data && typeof e.data.zoropaJump === 'string'){\n      var jt = document.getElementById(e.data.zoropaJump);\n      if (jt) sendScroll(jt);\n      return;\n    }\n    if (!e.data || typeof e.data.zoropaSearch !== 'string') return;\n    var q = e.data.zoropaSearch.toLowerCase();\n    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);\n    var node, target = null;\n    while ((node = walker.nextNode())){\n      var nv = node.nodeValue ? node.nodeValue.replace(/\\s+/g,' ') : '';\n      if (nv && nv.toLowerCase().indexOf(q) !== -1){\n        var p = node.parentElement;\n        if (p && p.closest('script,style')) continue;\n        target = p; break;\n      }\n    }\n    if (!target) return;\n    var det = target.closest('details');\n    if (det && !det.open) det.open = true;\n    sendScroll(target);\n    var prevBg = target.style.backgroundColor, prevTr = target.style.transition;\n    target.style.transition = 'background-color .3s';\n    target.style.backgroundColor = 'rgba(245,197,24,.55)';\n    setTimeout(function(){ target.style.backgroundColor = prevBg; setTimeout(function(){ target.style.transition = prevTr; }, 350); }, 1400);\n  });\nif (window.parent && window.parent !== window){\n    var nj = document.querySelector('nav.jump'); if (nj) nj.style.display = 'none';\n  }\n  document.querySelectorAll('nav.jump a[href^=\"#\"], a.gl').forEach(function(a){\n    a.addEventListener('click', function(ev){\n      var el = document.getElementById(a.getAttribute('href').slice(1));\n      if(!el) return;\n      ev.preventDefault();\n      if(!sendScroll(el)) el.scrollIntoView({behavior:'smooth', block:'start'});\n      if(a.classList.contains('gl')){ el.classList.add('hl'); setTimeout(function(){ el.classList.remove('hl'); }, 2500); }\n    });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var KEYP='zoropa-pend-', LOCKK='zoropa-pend-lock';\n  var boxes=Array.prototype.slice.call(document.querySelectorAll('.pend input[data-pend]'));\n  var lockBtn=document.getElementById('pendLock'), countEl=document.getElementById('pendCount');\n  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }\n  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }\n  function locked(){ return get(LOCKK)==='1'; }\n  function render(){\n    var done=0;\n    boxes.forEach(function(b){ b.disabled=locked(); if(b.checked) done++; });\n    if(countEl) countEl.textContent=done+' de '+boxes.length+' feitos';\n    if(lockBtn) lockBtn.textContent=locked()?'🔒 destravar lista':'🔓 travar lista';\n  }\n  boxes.forEach(function(b){\n    b.checked=get(KEYP+b.getAttribute('data-pend'))==='1';\n    b.addEventListener('change',function(){ set(KEYP+b.getAttribute('data-pend'), b.checked?'1':'0'); render(); });\n  });\n  if(lockBtn) lockBtn.addEventListener('click',function(){ set(LOCKK, locked()?'0':'1'); render(); });\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n";

(function(){
  var FX_DEFAULT_RATE = 5.91;
  var FX_DEFAULT_DATE = "17/09/2026";
  var fxToggle = document.getElementById("fxToggle");
  var fxBody = document.getElementById("fxBody");
  var fxEur = document.getElementById("fxEur");
  var fxBrl = document.getElementById("fxBrl");
  var fxRate = document.getElementById("fxRate");
  var fxDate = document.getElementById("fxDate");
  var fxRateStored = null;
  try{ fxRateStored = localStorage.getItem("zoropa-fx-rate"); }catch(e){}
  fxRate.value = fxRateStored || FX_DEFAULT_RATE;
  fxDate.textContent = fxRateStored ? "(taxa ajustada por você)" : "(PTAX/BCB " + FX_DEFAULT_DATE + " — cole a de hoje se preferir)";
  fxToggle.addEventListener("click", function(){
    var open = fxBody.hasAttribute("hidden");
    if (open){ fxBody.removeAttribute("hidden"); fxToggle.setAttribute("aria-expanded","true"); fxEur.focus();
      var sb = document.getElementById("searchBody"), st = document.getElementById("searchToggle");
      if (sb && !sb.hasAttribute("hidden")){ sb.setAttribute("hidden",""); st.setAttribute("aria-expanded","false"); } }
    else { fxBody.setAttribute("hidden",""); fxToggle.setAttribute("aria-expanded","false"); }
  });
  function rate(){ var r = parseFloat(fxRate.value); return (r > 0) ? r : FX_DEFAULT_RATE; }
  fxEur.addEventListener("input", function(){
    var v = parseFloat(fxEur.value);
    fxBrl.value = isNaN(v) ? "" : (v * rate()).toFixed(2);
  });
  fxBrl.addEventListener("input", function(){
    var v = parseFloat(fxBrl.value);
    fxEur.value = isNaN(v) ? "" : (v / rate()).toFixed(2);
  });
  fxRate.addEventListener("input", function(){
    try{ localStorage.setItem("zoropa-fx-rate", fxRate.value); }catch(e){}
    fxDate.textContent = "(taxa ajustada por você)";
    if (fxEur.value) fxBrl.value = (parseFloat(fxEur.value) * rate()).toFixed(2);
    else if (fxBrl.value) fxEur.value = (parseFloat(fxBrl.value) / rate()).toFixed(2);
  });

  var SLUGS = ["lisboa","paris","amsterdam","berlim","potsdam"];
  var HTML_MAP = {
    lisboa: HTML_LISBOA,
    paris: HTML_PARIS,
    amsterdam: HTML_AMSTERDAM,
    berlim: HTML_BERLIM,
    potsdam: HTML_POTSDAM
  };
  var loaded = {};

  var CITY_NAMES = {lisboa:"Lisboa", paris:"Paris", amsterdam:"Amsterdam", berlim:"Berlim", potsdam:"Potsdam"};
  var SEARCH_INDEX = null;
  function buildSearchIndex(){
    if (SEARCH_INDEX) return SEARCH_INDEX;
    SEARCH_INDEX = [];
    SLUGS.forEach(function(slug){
      var raw = HTML_MAP[slug];
      var noTags = raw
        .replace(/<script[\s\S]*?<\/script>/gi, " ")
        .replace(/<style[\s\S]*?<\/style>/gi, " ")
        .replace(/<[^>]+>/g, "\n")
        .replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g," ");
      var lines = noTags.split("\n").map(function(l){ return l.replace(/\s+/g," ").trim(); }).filter(function(l){ return l.length > 3; });
      lines.forEach(function(l){ SEARCH_INDEX.push({slug: slug, text: l}); });
    });
    return SEARCH_INDEX;
  }
  function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function runSearch(q){
    var results = document.getElementById("searchResults");
    results.innerHTML = "";
    q = q.trim();
    if (q.length < 2){ return; }
    var idx = buildSearchIndex();
    var ql = q.toLowerCase();
    var matches = [];
    for (var i = 0; i < idx.length && matches.length < 8; i++){
      var pos = idx[i].text.toLowerCase().indexOf(ql);
      if (pos !== -1) matches.push({item: idx[i], pos: pos});
    }
    if (!matches.length){
      results.innerHTML = '<div class="search-empty">Nada encontrado para "' + escapeHtml(q) + '".</div>';
      return;
    }
    matches.forEach(function(m){
      var text = m.item.text, pos = m.pos;
      var start = Math.max(0, pos - 35);
      var end = Math.min(text.length, pos + q.length + 45);
      var snippet = (start > 0 ? "…" : "") + escapeHtml(text.slice(start, pos)) + "<mark>" + escapeHtml(text.slice(pos, pos+q.length)) + "</mark>" + escapeHtml(text.slice(pos+q.length, end)) + (end < text.length ? "…" : "");
      var btn = document.createElement("button");
      btn.className = "search-result";
      btn.innerHTML = '<span class="sr-city">' + CITY_NAMES[m.item.slug] + '</span><span class="sr-snip">' + snippet + '</span>';
      btn.addEventListener("click", function(){ goToSearchResult(m.item.slug, q); });
      results.appendChild(btn);
    });
  }
  function goToSearchResult(slug, q){
    selectTab(slug);
    var tries = 0;
    (function trySend(){
      var iframe = document.querySelector('#panel-' + slug + ' iframe');
      if (iframe && iframe.contentWindow){
        try{ iframe.contentWindow.postMessage({zoropaSearch:q}, "*"); }catch(e){}
      }
      if (tries++ < 8) setTimeout(trySend, 200);
    })();
  }

  function resizeIframe(iframe){
    try{
      var doc = iframe.contentWindow.document;
      var sx = window.pageXOffset || 0, sy = window.pageYOffset || 0;
      iframe.style.height = "0px";
      var h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      iframe.style.height = h + "px";
      // colapsar o iframe a 0 faz o navegador prender a rolagem no topo; restaura a posição
      if ((window.pageYOffset || 0) !== sy) window.scrollTo({left: sx, top: sy, behavior: "instant"});
    }catch(e){}
  }

  function loadPanel(slug){
    if (loaded[slug]) return;
    loaded[slug] = true;
    var panel = document.getElementById("panel-" + slug);
    if (!panel) return;
    panel.innerHTML = '<div class="loading">Carregando ' + slug + '…</div>';
    var iframe = document.createElement("iframe");
    iframe.setAttribute("title", "Guia — " + slug);
    iframe.setAttribute("loading", "eager");
    iframe.addEventListener("load", function(){
      resizeIframe(iframe);
      try{
        var ro = new ResizeObserver(function(){ resizeIframe(iframe); });
        ro.observe(iframe.contentDocument.documentElement);
      }catch(e){}
      // fonts podem trocar a altura depois do primeiro load
      setTimeout(function(){ resizeIframe(iframe); }, 400);
      setTimeout(function(){ resizeIframe(iframe); }, 1200);
    });
    panel.innerHTML = "";
    panel.appendChild(iframe);
    iframe.srcdoc = HTML_MAP[slug];
  }

  var JUMP_MAP = {
    lisboa: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    paris: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    amsterdam: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["coffeeshops","Coffee shops"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    berlim: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapas"],["comer","Onde comer"],["notebook","Mac mini"],["glossario","Glossário"],["lembrancas","Lembrancinhas"],["lojas","Lojas"]],
    potsdam: [["pendencias","Pendências"],["transporte","Transporte"],["mapas","Mapa"],["comer","Onde comer"],["glossario","Glossário"],["lembrancas","Lembrancinhas e lojas"]]
  };
  function jumpTo(slug, id){
    var tries = 0;
    (function trySend(){
      var iframe = document.querySelector('#panel-' + slug + ' iframe');
      if (iframe && iframe.contentWindow){ try{ iframe.contentWindow.postMessage({zoropaJump:id}, "*"); }catch(e){} }
      if (tries++ < 6) setTimeout(trySend, 200);
    })();
  }
  function renderJump(slug){
    var nav = document.getElementById("jumpOuter");
    if (!nav) return;
    nav.innerHTML = "";
    (JUMP_MAP[slug] || []).forEach(function(pair){
      var a = document.createElement("a");
      a.href = "#" + pair[0]; a.textContent = pair[1];
      a.addEventListener("click", function(ev){ ev.preventDefault(); jumpTo(slug, pair[0]); });
      nav.appendChild(a);
    });
  }

  function selectTab(slug){
    if (SLUGS.indexOf(slug) === -1) slug = "lisboa";
    renderJump(slug);
    SLUGS.forEach(function(s){
      var tab = document.getElementById("tab-" + s);
      var panel = document.getElementById("panel-" + s);
      var active = (s === slug);
      if (tab){
        tab.setAttribute("aria-selected", active ? "true" : "false");
        tab.setAttribute("tabindex", active ? "0" : "-1");
      }
      if (panel){
        panel.style.display = active ? "" : "none";
      }
    });
    loadPanel(slug);
    try{ localStorage.setItem("zoropa-tab", slug); }catch(e){}
    var activeIframe = document.querySelector('#panel-' + slug + ' iframe');
    if (activeIframe) resizeIframe(activeIframe);
  }

  document.querySelectorAll(".tab").forEach(function(tab){
    tab.addEventListener("click", function(){ selectTab(tab.dataset.slug); });
  });

  document.querySelector("nav.tabs").addEventListener("keydown", function(ev){
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var current = document.querySelector('.tab[aria-selected="true"]');
    if (!current) return;
    var idx = SLUGS.indexOf(current.dataset.slug);
    idx = ev.key === "ArrowRight" ? (idx + 1) % SLUGS.length : (idx - 1 + SLUGS.length) % SLUGS.length;
    var next = document.getElementById("tab-" + SLUGS[idx]);
    if (next){ next.focus(); selectTab(SLUGS[idx]); }
  });

  window.addEventListener("message", function(e){
    if (!e.data || typeof e.data.zoropaScroll !== "number") return;
    var iframe = null;
    document.querySelectorAll(".panel iframe").forEach(function(f){ if (f.contentWindow === e.source) iframe = f; });
    if (!iframe) return;
    var hdr = document.querySelector("header.shell");
    var hh = hdr ? hdr.offsetHeight : 0;
    var top = iframe.getBoundingClientRect().top + (window.pageYOffset||0) + e.data.zoropaScroll - hh - 6;
    window.scrollTo({top: Math.max(0, top), behavior: "smooth"});
  });

  var searchToggle = document.getElementById("searchToggle");
  var searchBody = document.getElementById("searchBody");
  var searchInput = document.getElementById("searchInput");
  searchToggle.addEventListener("click", function(){
    var open = searchBody.hasAttribute("hidden");
    if (open){ searchBody.removeAttribute("hidden"); searchToggle.setAttribute("aria-expanded","true"); searchInput.focus();
      if (!fxBody.hasAttribute("hidden")){ fxBody.setAttribute("hidden",""); fxToggle.setAttribute("aria-expanded","false"); } }
    else { searchBody.setAttribute("hidden",""); searchToggle.setAttribute("aria-expanded","false"); }
  });
  var searchTimer = null;
  searchInput.addEventListener("input", function(){
    clearTimeout(searchTimer);
    var v = searchInput.value;
    searchTimer = setTimeout(function(){ runSearch(v); }, 150);
  });

  var initial = "lisboa";
  try{
    var saved = localStorage.getItem("zoropa-tab");
    if (saved && SLUGS.indexOf(saved) !== -1) initial = saved;
  }catch(e){}
  selectTab(initial);
})();

</script>
