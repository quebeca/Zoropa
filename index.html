d{fill:var(--ok);stroke:var(--bg);stroke-width:1.5}\n<\/style>\n<style>\n/* ---- rotas numeradas (injetado) ---- */\n.r-path{cursor:pointer}\n.r-hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:16px;cursor:pointer}\n.r-badge{cursor:pointer}\n.r-badge circle{stroke:var(--bg);stroke-width:1.6px}\n.r-badge text{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}\n.r-badge circle{stroke-dasharray:none}\n.r-badge text{stroke:none;stroke-dasharray:none}\n.r-badge.walk{stroke-dasharray:none}\n.r-badge.walk circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}\n.r-badge.walk text{fill:var(--ink)}\n.r-badge.transit circle{fill:var(--amarelo)}\n.r-badge.transit text{fill:#1a1a1a}\n.r-badge.taxi circle{fill:var(--azul)}\n.r-badge.taxi text{fill:#fff}\n.r-path.is-active,.r-hit.is-active + .r-path{stroke-width:5px !important}\n.r-badge.is-active circle{stroke:var(--amarelo);stroke-width:3px}\n.rota-painel{display:none;margin:.6rem 0 1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:2px;position:relative}\n.rota-painel.show{display:block}\n.rota-painel .num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;font-size:.85rem;margin-right:.5rem;vertical-align:middle}\n.rota-painel h4{display:inline;font-family:\"Public Sans\",sans-serif;font-size:1rem;font-weight:700}\n.rota-painel p{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}\n.rota-painel .fechar{position:absolute;top:.5rem;right:.6rem;background:none;border:0;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:.3rem}\n.mapa-dica{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <p class=\"kicker\">zoropa 2026 · bloco 2 de 5<\/p>\n    <h1>Paris<\/h1>\n    <p class=\"sub\">Sexta 25/09 (chegada, Catacumbas) · sábado 26/09 (Versalhes, <a class=\"gl\" href=\"#g-montmartre\">Montmartre<\/a>) · domingo 27/09 (Louvre, Notre-Dame, Eurostar às 20:22).<\/p>\n  <\/div>\n<\/header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pendências<\/a>\n  <a href=\"#transporte\">Transporte<\/a>\n  <a href=\"#mapas\">Mapas<\/a>\n  <a href=\"#comer\">Onde comer<\/a>\n  <a href=\"#glossario\">Glossário<\/a>\n  <a href=\"#lembrancas\">Lembrancinhas<\/a>\n  <a href=\"#lojas\">Lojas<\/a>\n<\/div><\/nav>\n\n<div class=\"wrap\">\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pendências e reservas<\/h2>\n  <div class=\"note\"><b>Lista compartilhada:<\/b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📋 abrir a planilha “Pendências zoropa 2026”<\/a> — é a versão oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe têm edição). As caixinhas abaixo são só um espelho rápido neste aparelho.<\/div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"><\/span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">🔓 travar lista<\/button><\/div>\n  <h3>O que ainda falta<\/h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"paris-0\"> <span class=\"pend-what\">✅ Catacumbas: comprado, 2 × €31, sex 25/09 às 18:00<\/span> <span class=\"pend-when\">feito · chegar 15 min antes, a fila de conferência é na calçada<\/span> <span class=\"pend-how\">catacombes.paris.fr<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-1\"> <span class=\"pend-what\">✅ Versalhes: “Passeport” comprado, 2 × €35, sáb 26/09 às 13:00<\/span> <span class=\"pend-when\">feito · inclui as Grandes Eaux Musicales da manhã<\/span> <span class=\"pend-how\">chateauversailles.fr<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-5\"> <span class=\"pend-what\">Consigne para as malas de domingo (Nannybag/Bounce, perto do Louvre ou Châtelet) — o Louvre não aceita mala maior que cabine<\/span> <span class=\"pend-when\">reservar sáb 26/09 à noite<\/span> <span class=\"pend-how\">ponto que abra dom às 8h · ~€6/volume<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-2\"> <span class=\"pend-what\">App Île-de-France Mobilités: conta criada e 10 bilhetes por pessoa<\/span> <span class=\"pend-when\">até qua 23/09<\/span> <span class=\"pend-how\">se o cartão recusar: <a class=\"gl\" href=\"#g-navigo-easy\">Navigo Easy<\/a> na chegada<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-3\"> <span class=\"pend-what\">Citymapper instalado + mapa offline de Paris<\/span> <span class=\"pend-when\">até qua 23/09<\/span><\/label><\/li>\n    <li><label><input type=\"checkbox\" data-pend=\"paris-4\"> <span class=\"pend-what\">Avisar o apartamento da hora de chegada (~15h)<\/span> <span class=\"pend-when\">até qui 24/09<\/span> <span class=\"pend-how\">+33 6 61 09 60 11<\/span><\/label><\/li>\n  <\/ul>\n  <h3>Reservas e documentos<\/h3>\n  <p class=\"lead\">Os PDFs estão no Drive da conta bexorxe (privados: quem não estiver logado nela vê “pedir acesso”). 📍 abre o lugar no Maps.<\/p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">Trocadéro Studio · 9 bis Rue de Magdebourg, 16e<\/span> <span class=\"pend-when\">sex 25/09 check-in 14–23h · check-out dom 27/09 até 11h<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1B-7ggPM5NdWeXZcVnqGGEuBWk_L3IH7o/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 reserva<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=9%20bis%20Rue%20de%20Magdebourg%2C%2075116%20Paris\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Louvre · entrada pela Pirâmide<\/span> <span class=\"pend-when\">dom 27/09 09:00 · nominal, passaporte na mão<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1M0l5-InJcWhUmMfcaaYj3zbTa-WRvV-r/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 ingressos<\/a> · <a href=\"https://drive.google.com/file/d/1EqXMUinFdvFSDxtmE4eP5WeWWGjf3AxM/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 áudio-guia 1<\/a> · <a href=\"https://drive.google.com/file/d/1ZlfQAPd5thmb54gOBwxeRzsE1pZJaGQI/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 áudio-guia 2<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Pyramide%20du%20Louvre%2C%20Paris\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n    <li><span class=\"pend-what\">Eurostar 9387 · Gare du Nord → Amsterdam Centraal<\/span> <span class=\"pend-when\">dom 27/09 20:22 → 23:50 · chegar 19:52 · carro 18, lugares 91/92<\/span> <span class=\"pend-leave\">🕐 saída sugerida de <a class=\"gl\" href=\"#g-chatelet\">Châtelet<\/a>–Les Halles: 18:45 (<a class=\"gl\" href=\"#g-rer\">RER<\/a> B ou D, 1 parada, 5 min) — ou Uber ~25 min se estiverem mais longe<\/span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/17Qr2icmqLoRJDHkYzJzCxlgyw9qjyOvv/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📄 bilhetes<\/a> · <a href=\"https://www.google.com/maps/search/?api=1&query=Gare%20du%20Nord%2C%20Paris\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">📍<\/a><\/span><\/li>\n  <\/ul>\n<\/section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar<\/h2>\n  <p class=\"lead\">Paris mudou tudo em 2025–2026: acabou o bilhete de papel, acabaram as zonas. Hoje existe <b>um preço único de €2,55<\/b> para metrô, <a class=\"gl\" href=\"#g-rer\">RER<\/a> e trem em toda a região, inclusive Versalhes, carregado num cartão de €2 ou no próprio celular. Isso simplifica muito o que vocês precisam fazer.<\/p>\n\n  <div class=\"note\"><b>A conta do que vocês vão usar:<\/b> 2 viagens na sexta, 4 no sábado, 2 no domingo = 8 por pessoa = €20,40. O passe diário (€12,30) nunca compensa, porque nenhum dia passa de 4 viagens. Táxi de Orly em vez de metrô: com mala, cansaço e um trajeto de 60 min com baldeação, o táxi de tarifa fixa vale os €44.<\/div>\n\n  <h3>Antes de sair do Brasil<\/h3>\n  <ol class=\"steps\">\n    <li><b>Instale o app Île-de-France Mobilités<\/b> (é o oficial) e crie uma conta. Ele faz duas coisas: vende o bilhete e vira o bilhete, encostando o celular na catraca. Funciona em iPhone e Android com NFC.<\/li>\n    <li><b>Tente comprar 1 bilhete Métro-Train-RER pelo app ainda em Brasília.<\/b> Se a compra passar, comprem 10 cada um (8 previstos + 2 de folga) e o assunto está resolvido antes de pousar. Se o cartão brasileiro for recusado, o plano B é o cartão físico <a class=\"gl\" href=\"#g-navigo-easy\">Navigo Easy<\/a> no passo 5.<\/li>\n    <li><b>Instale o Citymapper.<\/b> É o melhor para “como vou daqui até ali agora”, com os avisos de obra de fim de semana. O Google Maps também funciona em Paris, mas erra mais nas obras.<\/li>\n    <li><b>Baixe o mapa offline de Paris<\/b> no Google Maps, como em Lisboa. As estações de metrô não têm sinal em muitos trechos.<\/li>\n  <\/ol>\n\n  <h3>Chegada em Orly, sex 25/09, 13:10<\/h3>\n  <ol class=\"steps\">\n    <li><b>Siga as placas “Taxis”.<\/b> A fila oficial fica na saída do terminal. Ignore quem oferecer “taxi?” dentro do terminal: é irregular e cobra o triplo.<\/li>\n    <li><b>Tarifa fixa Orly → margem direita de Paris: ~€44<\/b> (o Trocadéro é margem direita). O valor está na placa dentro do carro; confirme antes de sair: “forfait rive droite?”. Aceitam cartão. 40 min.<\/li>\n    <li><b>Se preferirem o metrô:<\/b> linha 14 direto de Orly até Bercy (bilhete “Paris Région ↔ Aéroports”, €14 cada, comprado à parte no app ou na máquina), depois linha 6 até Trocadéro. 60 min, escadas com mala. Não recomendo hoje.<\/li>\n    <li><b>Se ainda não têm bilhetes no celular:<\/b> na primeira estação de metrô que usarem (Bir-Hakeim, 17:30), na máquina: idioma → “Passe Navigo Easy” (€2) → carregar \"<a class=\"gl\" href=\"#g-ticket-metro-train-rer\">Ticket Métro-Train-RER<\/a>\" ×10. Um cartão por pessoa; dois não podem passar com o mesmo cartão na mesma catraca. A máquina aceita cartão bancário com chip.<\/li>\n  <\/ol>\n\n  <h3>Como funciona na prática<\/h3>\n  <ol class=\"steps\">\n    <li><b>Entrar:<\/b> encoste o celular ou o Navigo Easy no leitor roxo da catraca. Um bilhete é descontado.<\/li>\n    <li><b>Baldeação (<a class=\"gl\" href=\"#g-correspondance\">correspondance<\/a>):<\/b> dentro da estação, sem sair, não gasta bilhete novo. Siga as placas laranja “Correspondance” com o número da linha e o nome do fim da linha (é assim que se sabe o sentido: “direction Nation”, “direction Charles de Gaulle–Étoile”).<\/li>\n    <li><b>Sair:<\/b> no metrô, empurre a porta. No RER, há catraca de saída também: encoste de novo. Por isso o bilhete tem de ficar “com vocês” até a rua.<\/li>\n    <li><b>Fiscalização:<\/b> equipes param passageiros na saída. Multa de €50+ sem bilhete válido. Com o app, mostre a tela; com o cartão, eles leem.<\/li>\n    <li><b>Ônibus:<\/b> é outro bilhete (€2,05) e não vale a baldeação com o metrô. Não usem ônibus neste roteiro.<\/li>\n    <li><b>Funicular de <a class=\"gl\" href=\"#g-montmartre\">Montmartre<\/a>:<\/b> conta como uma viagem de metrô, mesmo bilhete. Fica ao lado da estação Anvers.<\/li>\n  <\/ol>\n\n  <h3>Trecho a trecho<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Quando<\/th><th>Trecho<\/th><th>Como<\/th><th>Tempo<\/th><\/tr>\n    <tr><td>sex 13:10<\/td><td>Orly → studio<\/td><td>táxi tarifa fixa<\/td><td>40 min<\/td><\/tr>\n    <tr><td>sex 16:30<\/td><td>studio → Champ de Mars<\/td><td>a pé pela Pont d’Iéna<\/td><td>15 min<\/td><\/tr>\n    <tr><td>sex 17:30<\/td><td>Bir-Hakeim → Denfert-Rochereau<\/td><td>linha 6, direção Nation, sem baldeação<\/td><td>20 min<\/td><\/tr>\n    <tr><td>sex 21:00<\/td><td>Denfert → Trocadéro<\/td><td>linha 6, direção Étoile<\/td><td>22 min<\/td><\/tr>\n    <tr><td>sáb 09:15<\/td><td>studio → est. Champ de Mars–Tour Eiffel<\/td><td>a pé, 15 min<\/td><td><\/td><\/tr>\n    <tr><td>sáb 09:30<\/td><td>→ Versailles Château Rive Gauche<\/td><td>RER C: confira no painel que o trem vai a “Versailles Château”; nem todos vão<\/td><td>40 min<\/td><\/tr>\n    <tr><td>sáb 16:30<\/td><td>Versalhes → Champ de Mars<\/td><td>RER C sentido Paris<\/td><td>40 min<\/td><\/tr>\n    <tr><td>sáb 18:30<\/td><td>Trocadéro → Anvers<\/td><td>linha 6 até Étoile + linha 2 direção Nation<\/td><td>35 min<\/td><\/tr>\n    <tr><td>sáb 22:00<\/td><td>Pigalle → Trocadéro<\/td><td>linha 2 até Étoile + linha 6<\/td><td>35 min<\/td><\/tr>\n    <tr><td>dom 08:05<\/td><td>Trocadéro → <a class=\"gl\" href=\"#g-chatelet\">Châtelet<\/a>, com malas<\/td><td>linha 6 até Étoile + linha 1 direção Vincennes. Escadas. Uber ~€22 é a alternativa sã<\/td><td>25 min<\/td><\/tr>\n    <tr><td>dom 18:45<\/td><td>Châtelet–Les Halles → Gare du Nord<\/td><td>RER B ou D, sentido norte, 1 parada<\/td><td>5 min<\/td><\/tr>\n  <\/table><\/div>\n\n  <h3>Domingo com malas<\/h3>\n  <ol class=\"steps\">\n    <li><b>O Louvre não guarda mala grande.<\/b> Os armários gratuitos do vestiário aceitam só até 55 × 35 × 20 cm (tamanho de cabine); acima disso, a entrada é recusada. Não contem com o museu para as malas.<\/li>\n    <li><b>Deixem as malas numa consigne particular antes das 9h:<\/b> Nannybag ou Bounce (apps), ~€6 por volume por dia, em lojas e hotéis a poucos minutos do Louvre e de Châtelet. Reservem no app na noite de sábado e escolham um ponto que abra domingo às 8h; o app mostra o horário. Saindo do studio às 08:05, dá tempo de deixar as malas e estar na Pirâmide às 9h.<\/li>\n    <li><b>Alternativa:<\/b> consigne da Gare du Nord (nível −1, armários de €5,50 a €9,50 por 24 h, cartão). Fica fora do caminho de manhã, mas resolve tudo num lugar só se preferirem passar lá primeiro (linha 4 de Châtelet, 10 min).<\/li>\n  <\/ol>\n\n  <h3>Gare du Nord e o Eurostar<\/h3>\n  <ol class=\"steps\">\n    <li>O Eurostar para Amsterdam sai do <b>terminal próprio, no andar de cima<\/b> (placas “Eurostar”). Não é a plataforma dos trens normais.<\/li>\n    <li>Há <b>raio-X de bagagem e leitura do bilhete<\/b>, como num aeroporto pequeno. O portão fecha 30 min antes; o bilhete pede 19:52 para as 20:22, e é isso mesmo. Não há controle de passaporte (França–Holanda é Schengen).<\/li>\n    <li>Vagão 18 fica numa das pontas: veja no painel de que lado do trem ele está e caminhe pela plataforma antes de embarcar.<\/li>\n    <li>Comida: há bar a bordo, caro. Melhor comprar antes (ver Onde comer, domingo à noite).<\/li>\n  <\/ol>\n\n  <h3>E se…<\/h3>\n  <ol class=\"steps\">\n    <li><b>Greve de metrô.<\/b> Frequente, e avisada 48 h antes no app Île-de-France Mobilités e no Citymapper. A linha 6 é a que mais sofre; Uber/Bolt Trocadéro → Denfert custa ~€20. Para Versalhes o RER C costuma manter serviço mínimo; se não, Uber ~€50 cada trecho.<\/li>\n    <li><b>Chover.<\/b> Catacumbas e Louvre são cobertos. Versalhes tem 2 h de jardins: capa, não guarda-chuva (o vento do Grand Canal vira tudo). Montmartre na chuva vale menos; troquem por um bouillon mais cedo e o jantar vira o programa.<\/li>\n    <li><b>O ponto da consigne não abrir domingo às 8h.<\/b> Plano B é a consigne da Gare du Nord (ver acima); custa 40 min a mais e o Louvre das 9h vira 9h40 — a entrada nominal tolera até 30 min de atraso, então avisem o balcão.<\/li>\n  <\/ol>\n\n  <h3 id=\"glossario\">Glossário<\/h3>\n  <dl class=\"gloss\">\n    <div id=\"g-metro\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Métro','fr-FR',this)\" aria-label=\"Ouvir Métro\">🔊<\/button> Métro<\/dt><dd>16 linhas numeradas. O sentido é indicado pelo nome da última estação (“direction Nation”).<\/dd><\/div>\n    <div id=\"g-rer\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('RER','fr-FR',this)\" aria-label=\"Ouvir RER\">🔊<\/button> RER<\/dt><dd>Trem expresso que cruza a cidade e vai para os subúrbios (Versalhes, aeroportos). Letras A a E. Tem catraca na saída.<\/dd><\/div>\n    <div id=\"g-correspondance\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Correspondance','fr-FR',this)\" aria-label=\"Ouvir Correspondance\">🔊<\/button> Correspondance<\/dt><dd>Baldeação. Placa laranja. Dentro da estação não gasta bilhete.<\/dd><\/div>\n    <div id=\"g-sortie\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Sortie','fr-FR',this)\" aria-label=\"Ouvir Sortie\">🔊<\/button> Sortie<\/dt><dd>Saída. Placa azul, numerada; o Citymapper diz qual sortie usar.<\/dd><\/div>\n    <div id=\"g-navigo-easy\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Navigo Easy','fr-FR',this)\" aria-label=\"Ouvir Navigo Easy\">🔊<\/button> Navigo Easy<\/dt><dd>Cartão recarregável de €2 onde se carregam os bilhetes. Não tem nome, pode ser emprestado, não pode ser compartilhado na mesma viagem.<\/dd><\/div>\n    <div id=\"g-ticket-metro-train-rer\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Ticket Métro-Train-RER','fr-FR',this)\" aria-label=\"Ouvir Ticket Métro-Train-RER\">🔊<\/button> Ticket Métro-Train-RER<\/dt><dd>O bilhete de €2,55. Vale em toda a região menos nas estações dos aeroportos.<\/dd><\/div>\n    <div id=\"g-valider\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Valider','fr-FR',this)\" aria-label=\"Ouvir Valider\">🔊<\/button> Valider<\/dt><dd>Encostar o cartão/celular no leitor. Sempre, na entrada e (no RER) na saída.<\/dd><\/div>\n    <div id=\"g-rive-droite-gauche\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Rive droite / gauche','fr-FR',this)\" aria-label=\"Ouvir Rive droite / gauche\">🔊<\/button> Rive droite / gauche<\/dt><dd>Margem direita (norte do Sena: Trocadéro, Louvre, Montmartre) e esquerda (sul: Catacumbas, Quartier Latin). Define a tarifa do táxi do aeroporto.<\/dd><\/div>\n    <div id=\"g-arrondissement\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Arrondissement','fr-FR',this)\" aria-label=\"Ouvir Arrondissement\">🔊<\/button> Arrondissement<span class=\"tl\">a-rrõ(n)-diss-MÃ(N)<\/span><\/dt><dd>Os 20 bairros, numerados em espiral a partir do Louvre. O CEP termina com o número: 75016 = 16º, o do studio.<\/dd><\/div>\n    <div id=\"g-bouillon\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Bouillon','fr-FR',this)\" aria-label=\"Ouvir Bouillon\">🔊<\/button> Bouillon<span class=\"tl\">bu-i-IÕ(N)<\/span><\/dt><dd>Restaurante popular de comida francesa clássica, barato e rápido, tradição de 1896. Não aceita reserva.<\/dd><\/div>\n    <div id=\"g-formule-menu\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Formule / menu','fr-FR',this)\" aria-label=\"Ouvir Formule / menu\">🔊<\/button> Formule / menu<\/dt><dd>Combo de entrada + prato ou prato + sobremesa, sempre mais barato que à la carte. No almoço, quase todo bistrô tem.<\/dd><\/div>\n    <div id=\"g-carafe-d-eau\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Carafe d\\'eau','fr-FR',this)\" aria-label=\"Ouvir Carafe d'eau\">🔊<\/button> Carafe d’eau<span class=\"tl\">ca-RAF dô<\/span><\/dt><dd>Jarra de água da torneira, grátis por lei. Peça assim; “eau” solta vem garrafa a €5.<\/dd><\/div>\n    <div id=\"g-service-compris\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Service compris','fr-FR',this)\" aria-label=\"Ouvir Service compris\">🔊<\/button> Service compris<\/dt><dd>Gorjeta já incluída na conta, sempre. Deixar €1–2 em moeda é gentileza, não obrigação.<\/dd><\/div>\n    <div id=\"g-l-addition\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('L\\'addition','fr-FR',this)\" aria-label=\"Ouvir L'addition\">🔊<\/button> L’addition<\/dt><dd>A conta. O garçom não traz sem pedir: é considerado apressar o cliente.<\/dd><\/div>\n    <div id=\"g-chatelet\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Châtelet','fr-FR',this)\" aria-label=\"Ouvir Châtelet\">🔊<\/button> Châtelet<span class=\"tl\">sha-tê-LÊ<\/span><\/dt><dd>A estação-baldeação central (linhas 1, 4, 7, 11, 14 e RER A/B/D). É de onde saem para a Gare du Nord no domingo.<\/dd><\/div>\n    <div id=\"g-sacre-cur\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Sacré-Cœur','fr-FR',this)\" aria-label=\"Ouvir Sacré-Cœur\">🔊<\/button> Sacré-Cœur<span class=\"tl\">sa-crê CÊR<\/span><\/dt><dd>A basílica branca no alto de Montmartre; o funicular sobe ao lado, mesmo bilhete do metrô.<\/dd><\/div>\n    <div id=\"g-montmartre\"><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Montmartre','fr-FR',this)\" aria-label=\"Ouvir Montmartre\">🔊<\/button> Montmartre<span class=\"tl\">mõ(n)-MAR-tr<\/span><\/dt><dd>A colina do sábado à noite: o bairro de vilarejo ao redor da basílica, com a praça dos pintores.<\/dd><\/div>\n  <\/dl>\n\n    <h3>Frases úteis<\/h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bonjour','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Bonjour<\/b> — <i>bõ-JUR (bom dia / olá, até o fim da tarde)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bonsoir','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Bonsoir<\/b> — <i>bõ-SUÁR (boa noite, ao chegar)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('S\\'il vous plaît','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>S’il vous plaît<\/b> — <i>sil vu PLÊ (por favor)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Merci beaucoup','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Merci beaucoup<\/b> — <i>mer-SI bô-CU (muito obrigada)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Excusez-moi','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Excusez-moi<\/b> — <i>eks-kü-ZÊ muá (com licença / desculpe)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Parlez-vous anglais ?','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Parlez-vous anglais ?<\/b> — <i>par-lê VU ã-GLÊ (fala inglês?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Je ne comprends pas','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Je ne comprends pas<\/b> — <i>je ne cõ-PRÃ pa (não entendo)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Où sont les toilettes ?','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Où sont les toilettes ?<\/b> — <i>u sõ lê tua-LÉT (onde é o banheiro?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Combien ça coûte ?','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Combien ça coûte ?<\/b> — <i>cõ-BIÃ sa CUT (quanto custa?)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('L\\'addition, s\\'il vous plaît','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b><a class=\"gl\" href=\"#g-l-addition\">L’addition<\/a>, s’il vous plaît<\/b> — <i>la-di-SIÕ sil vu PLÊ (a conta, por favor)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Une table pour deux','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Une table pour deux<\/b> — <i>ün TABL pur DÊ (mesa para dois)<\/i><\/li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Une carafe d\\'eau, s\\'il vous plaît','fr-FR',this)\" aria-label=\"Ouvir\">🔊<\/button> <b>Une <a class=\"gl\" href=\"#g-carafe-d-eau\">carafe d’eau<\/a>, s’il vous plaît<\/b> — <i>ün ca-RAF dô (uma jarra de água da torneira, grátis)<\/i><\/li>\n  <\/ul>\n\n  <h3>Apps: qual e por quê<\/h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">🎫<\/div><div><b>Île-de-France Mobilités<\/b><span>Compra o bilhete e serve de bilhete. O único obrigatório.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">🧭<\/div><div><b>Citymapper<\/b><span>Rota em tempo real, com qual saída usar e avisos de obra. Melhor que o Maps aqui.<\/span><\/div><\/div>\n    <div class=\"app\"><div class=\"ic\">🚕<\/div><div><b>Uber e Bolt<\/b><span>Para o domingo com malas e para qualquer noite em que a linha 6 estiver fechada por obra. Bolt costuma ser mais barato.<\/span><\/div><\/div>\n  <\/div>\n\n  <h3>Quanto custa<\/h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Item<\/th><th>Os dois<\/th><\/tr>\n    <tr><td>Táxi Orly → Trocadéro<\/td><td>€44<\/td><\/tr>\n    <tr><td>2 Navigo Easy (se precisarem)<\/td><td>€4<\/td><\/tr>\n    <tr><td>16 bilhetes Métro-Train-RER<\/td><td>€41<\/td><\/tr>\n    <tr><td>Uber Trocadéro → Châtelet (opcional)<\/td><td>€22<\/td><\/tr>\n    <tr><td><b>Total transporte em Paris<\/b><\/td><td><b>~€90–110<\/b><\/td><\/tr>\\n    <tr><td>Ingressos já comprados, fora do transporte (Catacumbas €62 + Versalhes €70)<\/td><td>€132<\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia<\/h2>\n  <p class=\"lead\">Um mapa geral com os três dias e um zoom no centro, para o domingo a pé. Pontos nas coordenadas reais; o Sena está desenhado no traçado real, simplificado. Nos quadros do dia, toque no número de um trecho para ver como fazer.<\/p>\n\n  <figure>\n    <svg viewBox=\"0 0 360 385\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Paris, visão geral dos três dias\">\n      <!-- Sena -->\n      <path d=\"M0 260 C 30 250, 60 240, 95 205 C 130 185, 160 180, 190 195 C 215 210, 240 232, 268 246 C 290 258, 320 268, 360 272\" class=\"water\" style=\"fill:none;stroke:var(--azul-tint);stroke-width:14;stroke-linecap:round\"/>\n      <ellipse cx=\"262\" cy=\"246\" rx=\"18\" ry=\"6\" class=\"hill\"/>\n      <text x=\"300\" y=\"290\" class=\"mg\">Sena<\/text>\n      <!-- colinas -->\n      <ellipse cx=\"244\" cy=\"80\" rx=\"50\" ry=\"36\" class=\"hill\"/><text x=\"270\" y=\"50\" class=\"mg\">Montmartre<\/text>\n      <!-- Étoile / Champs-Élysées -->\n      <path d=\"M73 147 L168 187\" class=\"street\"/><text x=\"96\" y=\"160\" class=\"ms\">Champs-Élysées<\/text>\n      <!-- linha 6 arc -->\n      <path d=\"M46 201 C 44 230, 60 250, 100 262 C 150 280, 190 320, 206 341\" class=\"metro\" style=\"opacity:.55\"/>\n      <text x=\"90\" y=\"300\" class=\"ms\" style=\"fill:var(--amarelo)\">linha 6<\/text>\n      <path d=\"M46 201 C 50 175, 60 150, 73 147\" class=\"metro\" style=\"opacity:.55\"/>\n      <path d=\"M73 147 C 110 110, 170 105, 224 105\" class=\"metro\" style=\"opacity:.35\"/>\n      <text x=\"130\" y=\"98\" class=\"ms\" style=\"fill:var(--amarelo)\">linha 2<\/text>\n\n      <!-- SEXTA -->\n      <rect x=\"40\" y=\"195\" width=\"12\" height=\"12\" class=\"bed\"/><text x=\"14\" y=\"188\" class=\"m\">Studio Trocadéro<\/text>\n      <circle cx=\"86\" cy=\"236\" r=\"6\" class=\"pt\"/><text x=\"94\" y=\"240\" class=\"m\">Champ de Mars · Torre<\/text>\n      <circle cx=\"54\" cy=\"244\" r=\"4\" class=\"pt\"/><text x=\"8\" y=\"256\" class=\"ms\">Bir-Hakeim (linha 6)<\/text>\n      <path d=\"M52 205 L82 232\" class=\"walk\"/>\n      <circle cx=\"206\" cy=\"341\" r=\"7\" class=\"pt\"/><text x=\"214\" y=\"338\" class=\"m\">Catacumbas · Denfert<\/text>\n      <circle cx=\"222\" cy=\"352\" r=\"5\" class=\"eat\"/><text x=\"218\" y=\"356\" class=\"ms\">Péret · Contre Allée · I Grappoli<\/text>\n      <text x=\"150\" y=\"372\" class=\"ms\">✈ Orly: táxi 40 min, ao sul ↓<\/text>\n      <path d=\"M200 362 L60 210\" class=\"taxi\" style=\"opacity:.5\"/>\n\n      <!-- SÁBADO -->\n      <text x=\"8\" y=\"130\" class=\"m\">← Versalhes: RER C, 40 min a oeste<\/text>\n      <circle cx=\"73\" cy=\"147\" r=\"4\" class=\"pt\"/><text x=\"30\" y=\"150\" class=\"ms\" style=\"text-anchor:end\">Étoile<\/text>\n      <circle cx=\"244\" cy=\"85\" r=\"7\" class=\"pt\"/><text x=\"252\" y=\"82\" class=\"m\">Sacré-Cœur<\/text>\n      <circle cx=\"224\" cy=\"105\" r=\"6\" class=\"eat\"/><text x=\"150\" y=\"118\" class=\"ms\">Bouillon Pigalle · Anvers<\/text>\n      <circle cx=\"232\" cy=\"98\" r=\"4\" class=\"eat\"/><text x=\"196\" y=\"98\" class=\"ms\">Abbesses: Relais Gascon · Mascotte<\/text>\n      <circle cx=\"235\" cy=\"47\" r=\"4\" class=\"eat\"/><text x=\"242\" y=\"44\" class=\"ms\">Le Ruisseau (burger)<\/text>\n\n      <!-- DOMINGO -->\n      <circle cx=\"221\" cy=\"209\" r=\"7\" class=\"pt\"/><text x=\"200\" y=\"200\" class=\"m\">Louvre<\/text>\n      <circle cx=\"260\" cy=\"223\" r=\"5\" class=\"pt\"/><text x=\"268\" y=\"220\" class=\"ms\">Châtelet (malas)<\/text>\n      <circle cx=\"187\" cy=\"197\" r=\"4\" class=\"pt\"/><text x=\"140\" y=\"192\" class=\"ms\">Tuileries<\/text>\n      <circle cx=\"268\" cy=\"248\" r=\"6\" class=\"pt\"/><text x=\"276\" y=\"252\" class=\"m\">Notre-Dame<\/text>\n      <circle cx=\"259\" cy=\"256\" r=\"4\" class=\"shop\"/><text x=\"200\" y=\"266\" class=\"ms\">Shakespeare &amp; Co.<\/text>\n      <circle cx=\"324\" cy=\"235\" r=\"4\" class=\"pt\"/><text x=\"290\" y=\"228\" class=\"ms\">Pl. des Vosges<\/text>\n      <circle cx=\"288\" cy=\"113\" r=\"7\" class=\"pt\"/><text x=\"287\" y=\"110\" class=\"m\">Gare du Nord<\/text>\n      <circle cx=\"292\" cy=\"122\" r=\"4\" class=\"eat\"/><text x=\"256\" y=\"126\" class=\"ms\">Terminus Nord · Plan B<\/text>\n      <path d=\"M262 218 L286 120\" class=\"metro\" style=\"opacity:.55\"/><text x=\"240\" y=\"170\" class=\"ms\" style=\"fill:var(--amarelo)\">RER B/D<\/text>\n      <text x=\"14\" y=\"26\" class=\"mh\">Paris · sex 25 a dom 27/09<\/text>\n    <\/svg>\n    <figcaption>Visão geral. Amarelo: as linhas de metrô/RER do roteiro. O studio fica no oeste; Denfert no sul; Montmartre no norte; Louvre e Gare du Nord no centro-norte.<\/figcaption>\n  <\/figure>\n\n  <figure>\n    <svg viewBox=\"0 0 360 245\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Centro de Paris, domingo 27 de setembro\">\n      <path d=\"M20 150 C 80 145, 120 142, 153 139 C 190 145, 215 160, 232 172 C 260 190, 300 205, 340 215\" style=\"fill:none;stroke:var(--azul-tint);stroke-width:18;stroke-linecap:round\"/>\n      <ellipse cx=\"268\" cy=\"200\" rx=\"46\" ry=\"15\" class=\"hill\"/><text x=\"240\" y=\"186\" class=\"mg\">Île de la Cité<\/text>\n      <text x=\"300\" y=\"238\" class=\"mg\">Sena<\/text>\n      <rect x=\"120\" y=\"92\" width=\"60\" height=\"26\" class=\"hill\" rx=\"2\"/><text x=\"100\" y=\"128\" class=\"mg\">Louvre (o prédio)<\/text>\n      <rect x=\"30\" y=\"60\" width=\"70\" height=\"40\" class=\"hill\" rx=\"20\"/><text x=\"36\" y=\"56\" class=\"mg\">Tuileries<\/text>\n      <path d=\"M40 48 L240 48\" class=\"street\"/><text x=\"150\" y=\"42\" class=\"ms\">Rue de Rivoli<\/text>\n      <text x=\"14\" y=\"22\" class=\"mh\">Centro · dom 27/09, a pé (~3 km)<\/text>\n\n      <path d=\"M256 139 L146 108\" class=\"r-hit\" data-r=\"1\" data-map=\"paris-1\" tabindex=\"-1\"/><path d=\"M256 139 L146 108\" class=\"walk r-path\" data-r=\"1\" data-map=\"paris-1\" tabindex=\"-1\"/>\n      <path d=\"M138 106 L52 78\" class=\"r-hit\" data-r=\"2\" data-map=\"paris-1\" tabindex=\"-1\"/><path d=\"M138 106 L52 78\" class=\"walk r-path\" data-r=\"2\" data-map=\"paris-1\" tabindex=\"-1\"/>\n      <path d=\"M52 82 L150 136\" class=\"r-hit\" data-r=\"3\" data-map=\"paris-1\" tabindex=\"-1\"/><path d=\"M52 82 L150 136\" class=\"walk r-path\" data-r=\"3\" data-map=\"paris-1\" tabindex=\"-1\"/>\n      <path d=\"M156 143 L250 200\" class=\"r-hit\" data-r=\"4\" data-map=\"paris-1\" tabindex=\"-1\"/><path d=\"M156 143 L250 200\" class=\"walk r-path\" data-r=\"4\" data-map=\"paris-1\" tabindex=\"-1\"/>\n      <path d=\"M262 208 L280 206\" class=\"r-hit\" data-r=\"5\" data-map=\"paris-1\" tabindex=\"-1\"/><path d=\"M262 208 L280 206\" class=\"walk r-path\" data-r=\"5\" data-map=\"paris-1\" tabindex=\"-1\"/>\n      <path d=\"M262 212 C 200 220, 150 225, 110 222\" class=\"r-hit\" data-r=\"6\" data-map=\"paris-1\" tabindex=\"-1\"/><path d=\"M262 212 C 200 220, 150 225, 110 222\" class=\"walk r-path\" style=\"opacity:.5\" data-r=\"6\" data-map=\"paris-1\" tabindex=\"-1\"/>\n\n      <circle cx=\"260\" cy=\"139\" r=\"7\" class=\"pt\"/><text x=\"218\" y=\"135\" class=\"m\">Châtelet · guarda-volumes<\/text>\n      <circle cx=\"141\" cy=\"106\" r=\"7\" class=\"pt\"/><text x=\"148\" y=\"100\" class=\"m\">Louvre · Pirâmide 09:00<\/text>\n      <circle cx=\"123\" cy=\"84\" r=\"4\" class=\"shop\"/><text x=\"101\" y=\"80\" class=\"ms\" style=\"text-anchor:end\">Fragonard (Carrousel)<\/text>\n      <circle cx=\"191\" cy=\"109\" r=\"5\" class=\"eat\"/><text x=\"197\" y=\"121\" class=\"ms\">BO&amp;MIE<\/text>\n      <circle cx=\"224\" cy=\"106\" r=\"5\" class=\"eat\"/><text x=\"228\" y=\"98\" class=\"ms\">Painorama<\/text>\n      <circle cx=\"209\" cy=\"71\" r=\"4\" class=\"shop\"/><text x=\"215\" y=\"68\" class=\"ms\">Dehillerin (fecha dom)<\/text>\n      <circle cx=\"56\" cy=\"55\" r=\"5\" class=\"eat\"/><text x=\"62\" y=\"35\" class=\"ms\">Angelina · Galignani<\/text>\n      <circle cx=\"41\" cy=\"75\" r=\"6\" class=\"pt\"/><text x=\"8\" y=\"112\" class=\"m\">Tuileries · piquenique<\/text>\n      <circle cx=\"153\" cy=\"139\" r=\"6\" class=\"pt\"/><text x=\"150\" y=\"160\" class=\"m\">Pont des Arts<\/text>\n      <circle cx=\"286\" cy=\"203\" r=\"6\" class=\"pt\"/><text x=\"292\" y=\"208\" class=\"m\">Notre-Dame<\/text>\n      <circle cx=\"256\" cy=\"208\" r=\"5\" class=\"shop\"/><text x=\"196\" y=\"222\" class=\"ms\">Shakespeare &amp; Co.<\/text>\n      <circle cx=\"103\" cy=\"222\" r=\"5\" class=\"shop\"/><text x=\"20\" y=\"236\" class=\"ms\">Pierre Hermé (macarons)<\/text>\n      <circle cx=\"35\" cy=\"161\" r=\"4\" class=\"shop\"/><text x=\"42\" y=\"176\" class=\"ms\">Deyrolle (fecha dom)<\/text>\n      <text x=\"283\" y=\"150\" class=\"ms\">Marais → 20 min<\/text>\n    <g class=\"r-badge walk\" data-r=\"1\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: A pé · Châtelet → Louvre (Pirâmide)\" transform=\"translate(201,123.5)\"><circle r=\"9\"/><text y=\".5\">1<\/text><\/g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A pé · Louvre → Tuileries\" transform=\"translate(88,84)\"><circle r=\"9\"/><text y=\".5\">2<\/text><\/g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A pé · Tuileries → Pont des Arts\" transform=\"translate(108,117)\"><circle r=\"9\"/><text y=\".5\">3<\/text><\/g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A pé · Pont des Arts → Notre-Dame\" transform=\"translate(203,171.5)\"><circle r=\"9\"/><text y=\".5\">4<\/text><\/g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A pé · Notre-Dame → Châtelet (volta)\" transform=\"translate(271,207)\"><circle r=\"9\"/><text y=\".5\">5<\/text><\/g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"paris-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A pé (desvio opcional) · Châtelet → Marais\" transform=\"translate(186.2,220.5)\"><circle r=\"9\"/><text y=\".5\">6<\/text><\/g><\/svg>\n    <figcaption>Zoom do domingo. A margem esquerda (sul do Sena) tem Shakespeare &amp; Co. e Pierre Hermé; o resto é margem direita.<\/figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"><\/i>ponto do roteiro<\/span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"><\/i>comer<\/span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"><\/i>loja<\/span>\n      <span><i style=\"background:var(--ok)\"><\/i>hospedagem<\/span>\n      <span>— — a pé<\/span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">━<\/span> metrô/<a class=\"gl\" href=\"#g-rer\">RER<\/a><\/span>\n      <span><span style=\"color:var(--azul);font-weight:900\">━<\/span> táxi<\/span>\n    <\/div>\n  <div class=\"rota-painel\" id=\"rp-paris-1\" aria-live=\"polite\"><\/div><\/figure>\n\n  <p>Mapa real do domingo: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Ch%C3%A2telet%2C+Paris&destination=Gare+du+Nord&waypoints=Mus%C3%A9e+du+Louvre%7CJardin+des+Tuileries%7CPont+des+Arts%7CCath%C3%A9drale+Notre-Dame+de+Paris%7CShakespeare+and+Company%7CPlace+des+Vosges&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir a rota no Google Maps<\/a>.<\/p>\n\n  <h3>Sobre os lugares<\/h3>\n  <div class=\"attractions\">\n    <h4>Louvre<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Foi fortaleza medieval a partir de 1190, virou palácio real no século XIV, e museu só depois da Revolução Francesa, em 1793 — a família real tinha se mudado para Versalhes um século antes, deixando o prédio livre. Napoleão o encheu de obras trazidas (ou saqueadas, dependendo de quem conta a história) de suas campanhas pela Europa e Egito; boa parte teve de ser devolvida depois de sua queda em 1815, mas nem tudo voltou.<\/div><\/details><details class=\"curio\"><summary>🏛️ um pouco de arquitetura<\/summary><div class=\"in\">A Pirâmide de vidro na entrada, hoje símbolo do museu, foi inaugurada em 1989, projetada pelo arquiteto sino-americano I. M. Pei — na época, gerou um escândalo enorme: críticos franceses a chamavam de “arranhão” no palácio histórico. Hoje é uma das imagens mais fotografadas de Paris.<\/div><\/details>\n    <h4>Notre-Dame<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">A construção começou em 1163 e levou quase 200 anos para terminar. Em abril de 2019 um incêndio destruiu o telhado e a torre central (a flèche); a reconstrução, usando técnicas e materiais o mais próximos possível dos originais do século XIX, foi concluída e a catedral reabriu ao público em dezembro de 2024 — pouco menos de dois anos antes desta viagem.<\/div><\/details>\n    <h4>Sacré-Cœur<\/h4><details class=\"curio\"><summary>🏛️ um pouco de arquitetura<\/summary><div class=\"in\">É bem mais nova do que parece: começou a ser construída só em 1875, como penitência nacional depois da derrota francesa na guerra contra a Prússia em 1870–71 e da Comuna de Paris. A pedra branca (travertino) reage com a chuva soltando calcita, o que faz a fachada clarear com o tempo em vez de escurecer — por isso permanece tão branca mesmo depois de mais de um século.<\/div><\/details>\n    <h4>Catacumbas<\/h4><details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">No fim do século XVIII os cemitérios de Paris, como o Cemitério dos Inocentes, estavam tão lotados que paredes de casas vizinhas racharam com a pressão dos corpos. A solução foi esvaziar os cemitérios e empilhar os ossos — de mais de 6 milhões de pessoas — nos túneis de antigas pedreiras subterrâneas. Boa parte da pedra usada para construir os prédios de Paris veio dessas mesmas minas.<\/div><\/details>\n    <h4>Palácio de Versalhes<\/h4><details class=\"curio\"><summary>🏛️ um pouco de arquitetura<\/summary><div class=\"in\">Começou como um pavilhão de caça do pai de Luís XIV e virou a maior expressão de poder absoluto da Europa: o Rei Sol transferiu toda a corte e o governo francês para lá em 1682, mantendo a nobreza ocupada com etiqueta e cerimônia em vez de conspirar em Paris. A Galeria dos Espelhos, com 357 espelhos, era luxo extremo numa época em que o vidro espelhado custava mais que ouro — a França teve até que contrabandear artesãos de Veneza, que detinha o monopólio da técnica, para conseguir produzi-los.<\/div><\/details>\n  <\/div>\n<\/section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 opções por parada<\/h2>\n  <p class=\"lead\">Regra de ouro em Paris: cozinha fecha entre 14:30 e 19:00 em quase todo bistrô. Quem chega às 15h come em café, brasserie ou <a class=\"gl\" href=\"#g-bouillon\">bouillon<\/a>. Horários conferidos para o dia da semana em que vocês estarão. Preços por pessoa, sem vinho.<\/p>\n\n  <div class=\"meal\">\n    <h3>Almoço tardio · sex 25/09, ~14:30 · Trocadéro<\/h3>\n    <p class=\"when\">Os três ficam na própria Place du Trocadéro, 3 min do studio, e servem o dia inteiro. É comida de café: quiche, croque, salada, omelete. A refeição de verdade é à noite.<\/p>\n\n    <div class=\"opt pick\"><h4>Carette <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>4 Place du Trocadéro, o salão de chá art déco de 1927.<\/span>\n        <b>Por quê<\/b><span>É o ritual parisiense de chegada: chocolate quente espesso e um mille-feuille, olhando a praça. A fila anda em 10–15 min.<\/span>\n        <b>Estrela<\/b><span>Chocolat chaud à l’ancienne; sopa de cebola; mille-feuille.<\/span>\n        <b>Custo<\/b><span>€15–25.<\/span>\n        <b>Horário<\/b><span>7h–23h30. Sem reserva.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Café du Trocadéro<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>8 Place du Trocadéro, duas portas adiante.<\/span>\n        <b>Por quê<\/b><span>Mesma vista, sem fila, terraço de frente para a Torre. Comida de brasserie honesta.<\/span>\n        <b>Estrela<\/b><span>Ovos cremosos no café da manhã; à tarde, croque-monsieur e salada.<\/span>\n        <b>Custo<\/b><span>€15–25.<\/span>\n        <b>Horário<\/b><span>7h–2h. Confira a conta: uma avaliação recente relata gorjeta adicionada sem pedir.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Le Wilson<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>2 Place du Trocadéro, esquina com a Av. Wilson.<\/span>\n        <b>Por quê<\/b><span>A brasserie de bairro entre as três: prato do dia com sobremesa incluída, garçons de décadas.<\/span>\n        <b>Estrela<\/b><span>Entrecôte-frites do menu.<\/span>\n        <b>Custo<\/b><span>€18–28.<\/span>\n        <b>Horário<\/b><span>6h30–1h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar · sex 25/09, 19:30 · Denfert-Rochereau<\/h3>\n    <p class=\"when\">Os três ficam a 2–5 min da saída das Catacumbas, na Place Denfert ou na Rue Daguerre, a rua de comércio do bairro. Sexta à noite: reservar o primeiro e o segundo.<\/p>\n\n    <div class=\"opt pick\"><h4>Maison Péret <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>6 Rue Daguerre, 3 min das Catacumbas.<\/span>\n        <b>Por quê<\/b><span>Bistrô e bar de vinhos de bairro, sem turista em massa, com o prato que vocês vieram comer na França.<\/span>\n        <b>Estrela<\/b><span>Confit de pato; magret com vinho da casa.<\/span>\n        <b>Custo<\/b><span>€25–35.<\/span>\n        <b>Horário<\/b><span>8h–23h30. +33 1 43 22 57 05.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Contre Allée<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>83 Av. Denfert-Rochereau, 5 min.<\/span>\n        <b>Por quê<\/b><span>Cozinha de chef a preço de bistrô, mesas espaçadas (raro em Paris), nota 4,7. Para um jantar mais especial.<\/span>\n        <b>Estrela<\/b><span>Polvo; foie gras de entrada; profiteroles de chocolate.<\/span>\n        <b>Custo<\/b><span>€35–45.<\/span>\n        <b>Horário<\/b><span>Sexta 19h30–23h30. Reservar: +33 1 43 54 99 86.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>I Grappoli<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>22 Place Denfert-Rochereau, na frente da saída.<\/span>\n        <b>Por quê<\/b><span>Se o jet lag pedir algo simples: italiano bom, rápido, sem reserva.<\/span>\n        <b>Estrela<\/b><span>Ravioli de cogumelo com trufa; almôndegas.<\/span>\n        <b>Custo<\/b><span>€15–25.<\/span>\n        <b>Horário<\/b><span>12h–0h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"note\">Crepe de verdade, bretã: <b>Crêperie de Josselin<\/b>, 67 Rue du Montparnasse, 15 min a pé de Denfert (ou 1 parada de linha 6 até Edgar Quinet). Fila de 20 min, galette + crepe doce + sidra, €15–20. Sexta até 23h.<\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Almoço · sáb 26/09, 12:00 · Versalhes<\/h3>\n    <div class=\"warn\"><b>Mudança:<\/b> as vagas de entrada do Palácio para 26/09 só abriram a partir das 13:00 (as da manhã esgotaram). Novo plano: a manhã vira jardins e Grandes Eaux Musicales (chafarizes ligam às 10h, sábados até 31/10, já incluídas no Passeport), o almoço adianta para 12:00, e a entrada no Palácio é às 13:00 em ponto. Como a entrada no Palácio só é às 13h, não há motivo para madrugar: saindo do studio às 09:15, vocês chegam em Versalhes por volta das 10:30, com os chafarizes já ligados e ~1h30 de jardim antes do almoço. Comprem o ingresso com esse horário assim que possível: as vagas de 13h de um sábado também esgotam rápido.<\/div>\n    <p class=\"when\">Os cafés dentro do palácio são caros e cheios. A Rue de Satory fica a 5 min a pé da saída, entre o palácio e a estação, e concentra o que presta. Sábado lota: reserva no primeiro — o L’inspi já abre às 12h, então peçam mesa logo na abertura.<\/p>\n\n    <div class=\"opt pick\"><h4>L’inspi <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>13 Rue de Satory.<\/span>\n        <b>Por quê<\/b><span>Nota 4,9 em 540 avaliações, cardápio só em francês, cheio de moradores. Bistrô de chef com prato do dia que muda.<\/span>\n        <b>Estrela<\/b><span>O que estiver na lousa; cordeiro com molho; brookie de sobremesa.<\/span>\n        <b>Custo<\/b><span>€25–35.<\/span>\n        <b>Horário<\/b><span>Sábado 12h–14h15. <b>Reservar: +33 6 07 50 13 37.<\/b> Sem reserva, não entra.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Maison Satory<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>22 Rue de Satory.<\/span>\n        <b>Por quê<\/b><span>Porções grandes, comida francesa boa, banheiro limpo e cadeira confortável depois de 4 h em pé no palácio. Nota 4,8.<\/span>\n        <b>Estrela<\/b><span>Pato; lula grelhada; café gourmand no fim.<\/span>\n        <b>Custo<\/b><span>€20–30.<\/span>\n        <b>Horário<\/b><span>12h–22h30, cozinha contínua. +33 1 34 65 00 22.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>L’Amoroso<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>14 Rue de Satory.<\/span>\n        <b>Por quê<\/b><span>Rápido e leve para não pesar antes dos jardins: focaccia e burrata de italiano com dono na porta. Nota 5,0.<\/span>\n        <b>Estrela<\/b><span>Focaccia recheada; burrata com tomate.<\/span>\n        <b>Custo<\/b><span>€12–18.<\/span>\n        <b>Horário<\/b><span>Sábado 11h30–15h.<\/span>\n      <\/div><\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar · sáb 26/09, 20:15 · Montmartre / Pigalle<\/h3>\n    <p class=\"when\">Descendo da <a class=\"gl\" href=\"#g-sacre-cur\">Sacré-Cœur<\/a>, a Rue des Abbesses é a rua dos restaurantes de bairro, e o Boulevard de Clichy, no pé do morro, tem o bouillon. Sábado à noite é o pior dia para fila: contem com espera.<\/p>\n\n    <div class=\"opt pick\"><h4>Bouillon Pigalle <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>22 Bd de Clichy, na saída do metrô Pigalle.<\/span>\n        <b>Por quê<\/b><span>O bouillon moderno: entrada, prato e sobremesa clássicos por menos de €25, salão barulhento e alegre. É o lugar para provar caracóis, sopa de cebola e bœuf bourguignon sem cerimônia.<\/span>\n        <b>Estrela<\/b><span>Ovo com maionese (€2), sopa de cebola, confit de pato, profiteroles.<\/span>\n        <b>Custo<\/b><span>€18–25.<\/span>\n        <b>Horário<\/b><span>12h–0h. Sem reserva, fila de 20–40 min; peçam tudo de uma vez, o garçom não volta fácil.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Le Relais Gascon<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>6 Rue des Abbesses, em frente ao metrô Abbesses.<\/span>\n        <b>Por quê<\/b><span>Saladas gigantes com batata salteada e magret, a comida do sudoeste. Alternativa com mesa quando o bouillon estiver com 40 min de fila. Segundo andar tem ar-condicionado.<\/span>\n        <b>Estrela<\/b><span>Salade gasconne; magret com mel.<\/span>\n        <b>Custo<\/b><span>€18–25.<\/span>\n        <b>Horário<\/b><span>11h–0h. +33 1 42 58 58 22.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>La Mascotte<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>52 Rue des Abbesses.<\/span>\n        <b>Por quê<\/b><span>Para um jantar mais caprichado em <a class=\"gl\" href=\"#g-montmartre\">Montmartre<\/a> sem cair em armadilha.<\/span>\n        <b>Estrela<\/b><span>Meia dúzia de ostras; caracóis; frutos do mar.<\/span>\n        <b>Custo<\/b><span>€30–45.<\/span>\n        <b>Horário<\/b><span>7h–0h. +33 1 46 06 28 15.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Brasserie de 1889, com banca de ostras na porta desde sempre — uma tradição parisiense que sobrevive em poucos endereços.<\/div><\/details>\n    <\/div>\n\n    <div class=\"note\">Hambúrguer: <b>Le Ruisseau<\/b>, 65 Rue du Ruisseau, fica do outro lado do morro (15 min a pé da Sacré-Cœur, descendo para o norte), €15–20, até 23h. Só vale se já estiverem daquele lado.<\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Piquenique · dom 27/09, 12:30 · Tuileries<\/h3>\n    <p class=\"when\">Domingo muita padaria fecha; estas três abrem. Comprem antes de entrar no Louvre às 9h (fica na mochila) ou na saída, às 12:30. Sentem nas cadeiras verdes de ferro do jardim, que são grátis.<\/p>\n\n    <div class=\"opt pick\"><h4>BO&amp;MIE Louvre-Rivoli <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>91 Rue de Rivoli, em frente ao Louvre, na saída do metrô Louvre-Rivoli.<\/span>\n        <b>Por quê<\/b><span>Padaria moderna premiada, sanduíche de baguete feito na hora, doces bonitos, aberta domingo 8h–20h.<\/span>\n        <b>Estrela<\/b><span>Sanduíche de frango; croissant de framboesa; latte de pistache.<\/span>\n        <b>Custo<\/b><span>€8–14 por pessoa o piquenique.<\/span>\n        <b>Horário<\/b><span>Dom 8h–20h. Pedido no totem; fiquem perto do balcão para pegar.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Boulangerie Painorama<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>75 Rue Saint-Honoré, 5 min a pé, atrás do Louvre.<\/span>\n        <b>Por quê<\/b><span>Padaria de bairro de verdade, a que os vizinhos usam. Jambon-beurre clássico.<\/span>\n        <b>Estrela<\/b><span>Jambon-beurre; croissant de presunto e queijo.<\/span>\n        <b>Custo<\/b><span>€6–10.<\/span>\n        <b>Horário<\/b><span>Dom 8h–17h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Les Gourmandises de Saint-Honoré<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>123 Rue Saint-Honoré.<\/span>\n        <b>Por quê<\/b><span>Tortas de fruta e éclairs de sobremesa para o piquenique; baguete boa.<\/span>\n        <b>Estrela<\/b><span>Tarte de framboesa; éclair de café.<\/span>\n        <b>Custo<\/b><span>€5–9.<\/span>\n        <b>Horário<\/b><span>Dom 7h–20h.<\/span>\n      <\/div><\/div>\n\n    <div class=\"note\">Doce do dia: <b>Angelina<\/b> (226 Rue de Rivoli, ao lado das Tuileries) para o chocolate quente africain e o Mont-Blanc, com fila de 15–20 min, dom 8h–20h. Ou <b>Pierre Hermé<\/b> (72 Rue Bonaparte, 10 min de Notre-Dame, dom até 19h) para os melhores macarons de Paris: Ispahan e Mogador.<\/div>\n  <\/div>\n\n  <div class=\"meal\">\n    <h3>Jantar · dom 27/09, 18:45–19:45 · Gare du Nord<\/h3>\n    <p class=\"when\">Aqui a regra é o relógio: portão do Eurostar fecha às 19:52. Comida para levar é a escolha certa; jantar sentado só se chegarem à estação antes das 18:45.<\/p>\n\n    <div class=\"opt pick\"><h4>Plan B <span class=\"tag\">escolha<\/span><\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>3 Rue de Compiègne, 2 min da entrada da Gare du Nord.<\/span>\n        <b>Por quê<\/b><span>Sanduíche tunisiano de baguete, enorme, embrulhado para viagem, €8–10. Nota 4,8 em 1.400 avaliações, cheio de gente indo pegar o Eurostar.<\/span>\n        <b>Estrela<\/b><span>Le Plan B com raclette; makloub de frango grelhado.<\/span>\n        <b>Custo<\/b><span>€8–12.<\/span>\n        <b>Horário<\/b><span>Dom 11h–22h30.<\/span>\n      <\/div><\/div>\n\n    <div class=\"opt\"><h4>Terminus Nord<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>23 Rue de Dunkerque, em frente à estação.<\/span>\n        <b>Por quê<\/b><span>A clássica “última refeição antes do trem”. Só cabe no plano se saírem de <a class=\"gl\" href=\"#g-chatelet\">Châtelet<\/a> às 18:15.<\/span>\n        <b>Estrela<\/b><span>Sopa de cebola gratinada; ostras; île flottante.<\/span>\n        <b>Custo<\/b><span>€30–45. Sentado, 60 min.<\/span>\n        <b>Horário<\/b><span>Dom 7h30–23h. +33 1 42 85 05 15.<\/span>\n      <\/div>\n      <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Brasserie art déco de 1925, com o salão e a decoração quase intactos desde a inauguração.<\/div><\/details>\n    <\/div>\n\n    <div class=\"opt\"><h4>Eattos<\/h4>\n      <div class=\"grid\">\n        <b>Onde<\/b><span>148 Rue du Faubourg Saint-Denis, 3 min.<\/span>\n        <b>Por quê<\/b><span>Frango frito e wraps para levar, milkshake bom, rápido.<\/span>\n        <b>Estrela<\/b><span>“Magic wrap” de frango.<\/span>\n        <b>Custo<\/b><span>€8–12.<\/span>\n        <b>Horário<\/b><span>Dom 11h15–23h.<\/span>\n      <\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Paris<\/h2>\n  <p class=\"lead\">A janela boa é o domingo: Carrousel do Louvre, Shakespeare &amp; Co., Pierre Hermé e o Marais abrem. As lojas tradicionais de Paris (Galignani, Deyrolle, Dehillerin, Maille) fecham domingo, e nos outros dois dias vocês estão em Versalhes e <a class=\"gl\" href=\"#g-montmartre\">Montmartre<\/a>. Sábado à noite, a Rue des Abbesses tem lojinhas abertas até tarde.<\/p>\n\n  <div class=\"warn\">Mala de 10 kg, lembrete: macarons são leves mas frágeis (caixa rígida, comer em 3 dias, o que dá até Amsterdam); mostarda e sal são pesados; perfume até 100 ml passa na segurança.<\/div>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O quê<\/th><th>Por quê<\/th><th>Onde (na rota)<\/th><th>Preço<\/th><\/tr>\n    <tr><td>Macarons Pierre Hermé<\/td><td>O pâtissier que reinventou o macaron; Ispahan (rosa, lichia, framboesa) é o mais famoso do mundo.<\/td><td>72 Rue Bonaparte, dom até 19h, 10 min de Notre-Dame.<\/td><td>caixa de 7: ~€20<\/td><\/tr>\n    <tr><td>Sabonete e perfume Fragonard<\/td><td>Casa de Grasse de 1926; frascos pequenos de alumínio, leves, embalagem bonita.<\/td><td>Carrousel du Louvre (o shopping subterrâneo da Pirâmide), dom 10h–19h. Na saída do museu.<\/td><td>€8–35<\/td><\/tr>\n    <tr><td>Livro carimbado + sacola<\/td><td>O carimbo “Shakespeare and Company, Kilometer Zero Paris” na página de rosto é a lembrança de leitor.<\/td><td>37 Rue de la Bûcherie, dom 12h–19h. Está no roteiro às 15:30.<\/td><td>livro + sacola €15–30<\/td><\/tr>\n    <tr><td>Chocolate quente Angelina em lata<\/td><td>A mistura do chocolate mais famoso de Paris, para fazer em casa.<\/td><td>Boutique dentro do Angelina, Rue de Rivoli, dom até 20h.<\/td><td>€15–20<\/td><\/tr>\n    <tr><td>Mostarda, flor de sal, biscoitos<\/td><td>O barato e legítimo: Maille (a de Dijon), fleur de sel de Guérande, sablés bretons. Supermercado vende o mesmo que as lojas-conceito, por um terço.<\/td><td>Qualquer <b>Monoprix<\/b> ou <b>Franprix<\/b>: há um Monoprix na Rue de Passy, 10 min do studio, dom até 19h45.<\/td><td>€2–6 cada<\/td><\/tr>\n    <tr><td>Louça e objetos de Versalhes<\/td><td>A loja do palácio tem coisas boas de Marie-Antoinette: leques, caixas de chá, pratos.<\/td><td>Boutique do Château de Versailles, na saída, sábado.<\/td><td>€10–40<\/td><\/tr>\n    <tr><td>Cartões e gravuras de rua<\/td><td>Na Place du Tertre os pintores vendem aquarelas pequenas de Montmartre; regateie, e recuse a caricatura não pedida.<\/td><td>Montmartre, sábado à noite.<\/td><td>€10–30<\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que só existem aqui<\/h2>\n\n  <div class=\"shop\"><b>Shakespeare and Company<\/b><small>37 Rue de la Bûcherie · dom 12h–19h · fila de 10–20 min<\/small>\n    <p>Proibido fotografar dentro; suba ao andar de cima e sente no canto de leitura. Já está no roteiro.<\/p>\n    <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Aberta em 1951, a livraria mantém a tradição de hospedar escritores de passagem entre as estantes, em troca de algumas horas de trabalho por dia — já passaram mais de 30 mil “tumbleweeds”.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>Merci<\/b><small>111 Bd Beaumarchais, Marais · dom 10h–19h30<\/small>\n    <p>A loja-conceito parisiense: roupa, casa, papelaria e o Fiat 500 vermelho na entrada. Fica a 5 min da Place des Vosges, o trecho opcional das 17h do domingo. Se forem ao Marais, entrem.<\/p><\/div>\n\n  <div class=\"shop\"><b>Fragonard, Carrousel du Louvre<\/b><small>99 Rue de Rivoli (subsolo do Louvre) · dom 10h–19h<\/small>\n    <p>A saída do museu passa pelo Carrousel. Perfumaria de Grasse com atendimento paciente e frasco de viagem; fazem o Tax Free na hora.<\/p><\/div>\n\n  <div class=\"shop\"><b>Pierre Hermé<\/b><small>72 Rue Bonaparte, Saint-Germain · dom 10h–19h<\/small>\n    <p>A loja original, sem mesas: só balcão. Vale o desvio de 10 min a partir de Shakespeare &amp; Co. pela Rue Saint-André-des-Arts.<\/p><\/div>\n\n  <div class=\"shop\"><b>Angelina<\/b><small>226 Rue de Rivoli · dom 8h–20h<\/small>\n    <p>A fila é para sentar; a boutique de presentes, na entrada, não tem fila.<\/p>\n    <details class=\"curio\"><summary>📖 a história por trás<\/summary><div class=\"in\">Salão de chá Belle Époque aberto em 1903 — a receita do chocolate quente “L’Africain” é a mesma desde então.<\/div><\/details><\/div>\n\n  <div class=\"shop\"><b>Fora do alcance neste roteiro (fecham domingo)<\/b><small>caso troquem alguma coisa de dia<\/small>\n    <p><b>Librairie Galignani<\/b> (224 Rue de Rivoli): a mais antiga livraria inglesa do continente, 1801, salas de madeira e livros de arte. <b>Deyrolle<\/b> (46 Rue du Bac): gabinete de curiosidades de 1831, taxidermia, gravuras de botânica e insetos, o lugar mais estranho e bonito de Paris para quem gosta de estética; a 15 min do Louvre. <b>E. Dehillerin<\/b> (18 Rue Coquillière): a loja de panelas de cobre de 1820 onde Julia Child comprava. <b>Boutique Maille<\/b> (Place de la Madeleine): mostarda servida na torneira, em pote de cerâmica.<\/p><\/div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">Sáb à noite: lojas da Rue des Abbesses · loja do palácio de Versalhes<\/span>\n    <span class=\"chip\">Dom: Fragonard · Angelina · Shakespeare · Pierre Hermé · Merci<\/span>\n    <span class=\"chip\">Qualquer dia: Monoprix para o legítimo barato<\/span>\n  <\/div>\n<\/section>\n\n\n<\/div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"paris-1\": [{\"t\": \"A pé · Châtelet → Louvre (Pirâmide)\", \"d\": \"Guarda-volumes em Châtelet primeiro; entrada às 09:00.\"}, {\"t\": \"A pé · Louvre → Tuileries\", \"d\": \"Pelo Carrousel du Louvre.\"}, {\"t\": \"A pé · Tuileries → Pont des Arts\", \"d\": \"Piquenique no caminho, comprado antes de entrar no Louvre ou na saída.\"}, {\"t\": \"A pé · Pont des Arts → Notre-Dame\", \"d\": \"Atravessando a Île de la Cité.\"}, {\"t\": \"A pé · Notre-Dame → Châtelet (volta)\", \"d\": \"Para pegar as malas antes do RER.\"}, {\"t\": \"A pé (desvio opcional) · Châtelet → Marais\", \"d\": \"+20 min cada lado, se sobrar tempo antes do RER B/D às 18:45.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">×<\/button><span class=\"num\">'+n+'<\/span><h4>'+item.t+'<\/h4><p>'+item.d+'<\/p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var zoropaUtterance = null;\n  function zoropaSpeak(text, lang, btn){\n    var w = window;\n    try{ if (window.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador não suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '🔈'; };\n      u.onend = function(){ btn.textContent = '🔊'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '🔊';\n      alert('Não consegui tocar o áudio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n    if (e.data && typeof e.data.zoropaJump === 'string'){\n      var jt = document.getElementById(e.data.zoropaJump);\n      if (jt) sendScroll(jt);\n      return;\n    }\n    if (!e.data || typeof e.data.zoropaSearch !== 'string') return;\n    var q = e.data.zoropaSearch.toLowerCase();\n    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);\n    var node, target = null;\n    while ((node = walker.nextNode())){\n      var nv = node.nodeValue ? node.nodeValue.replace(/\\s+/g,' ') : '';\n      if (nv && nv.toLowerCase().indexOf(q) !== -1){\n        var p = node.parentElement;\n        if (p && p.closest('script,style')) continue;\n        target = p; break;\n      }\n    }\n    if (!target) return;\n    var det = target.closest('details');\n    if (det && !det.open) det.open = true;\n    sendScroll(target);\n    var prevBg = target.style.backgroundColor, prevTr = target.style.transition;\n    target.style.transition = 'background-color .3s';\n    target.style.backgroundColor = 'rgba(245,197,24,.55)';\n    setTimeout(function(){ target.style.backgroundColor = prevBg; setTimeout(function(){ target.style.transition = prevTr; }
