ock;font-size:.78rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;background:var(--amarelo);color:#1a1a1a;margin-left:.4rem;vertical-align:middle}\n.opt h4{font-size:1.05rem}\n.opt .grid{display:grid;grid-template-columns:5.6rem 1fr;gap:.25rem .6rem;font-size:.95rem;margin-top:.4rem}\n.opt .grid b{color:var(--muted);font-weight:600}\n.opt .grid span{min-width:0}\n\n/* shops */\n.shop{padding:.8rem 0;border-bottom:1px solid var(--line)}\n.shop b{display:block}\n.shop small{color:var(--muted)}\n.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}\n.chip{font-size:.88rem;padding:.25rem .65rem;border:1px solid var(--line);border-radius:999px;background:var(--card)}\n\ndetails{border:1px solid var(--line);margin:.6rem 0;background:var(--card)}\nsummary{cursor:pointer;padding:.7rem .9rem;font-weight:700;list-style:none}\nsummary::-webkit-details-marker{display:none}\nsummary::before{content:\"+\";display:inline-block;width:1.2rem;color:var(--azul);font-weight:700}\ndetails[open] summary::before{content:\"\u2013\"}\ndetails .in{padding:0 .9rem .9rem}\n\n/* curiosidades: post-it dobrado */\n.curio{margin:.6rem 0 0;border:none;background:none}\n.curio summary{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;list-style:none;font-size:.85rem;font-weight:700;color:var(--azul-esc);padding:.35rem .7rem;background:var(--amarelo-tint);border:1px solid var(--amarelo);border-radius:2px;position:relative;box-shadow:1px 2px 3px rgba(0,0,0,.1)}\n.curio summary::-webkit-details-marker{display:none}\n.curio summary::after{content:\"\";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 9px 9px;border-color:transparent transparent var(--bg) transparent}\n.curio[open] summary{border-radius:2px 2px 0 0}\n.curio .in{padding:.65rem .85rem;background:var(--amarelo-tint);border:1px solid var(--amarelo);border-top:none;font-size:.92rem;margin-top:-1px}\n\nfooter{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}\n@media (max-width:420px){\n  h1{font-size:2rem}\n  dl.gloss div{grid-template-columns:6.2rem 1fr}\n  .opt .grid{grid-template-columns:5rem 1fr}\n}\n.say{display:inline-flex;align-items:center;gap:.25rem}\n.say-btn{border:0;background:none;padding:0 .15rem;font-size:.95em;cursor:pointer;line-height:1}\n.phrases{list-style:none;padding:0;margin:.4rem 0 0}\n.phrases li{padding:.35rem 0;border-bottom:1px dashed var(--line);font-size:.92rem}\n.phrases li:last-child{border-bottom:none}\n.pend{list-style:none;padding:0;margin:.4rem 0 1rem}\n.pend li{padding:.5rem 0;border-bottom:1px dashed var(--line);font-size:.92rem;line-height:1.45}\n.pend li:last-child{border-bottom:none}\n.pend label{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}\n.pend input[type=checkbox]{width:1.15rem;height:1.15rem;margin:.15rem 0 0;flex:none;accent-color:var(--azul)}\n.pend label{flex-wrap:wrap}\n.pend label > .pend-what{flex:1 1 auto}\n.pend input:checked ~ .pend-what{text-decoration:line-through;color:var(--muted)}\n.pend input:disabled{opacity:.5}\n.pend-what{font-weight:600}\n.pend-when{display:block;flex-basis:100%;font-size:.82rem;color:var(--azul-esc);margin:.1rem 0 0 1.7rem}\n.pend-how{display:block;flex-basis:100%;font-size:.82rem;color:var(--muted);margin-left:1.7rem}\n.docs .pend-when,.docs .pend-how{margin-left:0}\n.pend-links{display:block;margin-top:.15rem;font-size:.88rem}\n.pend-links a{color:var(--azul);text-decoration:none;font-weight:600}\n.pend-bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.2rem 0 .4rem;font-size:.85rem;color:var(--muted)}\n.pend-lock{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:.8rem;border-radius:999px;padding:.25rem .7rem;cursor:pointer}\n.pend-leave{display:block;font-size:.82rem;color:var(--ok,#1B7F4C);font-weight:600;margin-top:.15rem}\n</style>\n<style>\nheader{background-image:linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);background-size:22px 22px}\n.m{font-family:\"Public Sans\",system-ui,sans-serif;font-size:10.5px;fill:var(--ink)}\n.ms{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;fill:var(--muted)}\n.mh{font-family:\"Fraunces\",Georgia,serif;font-size:13px;font-weight:600;fill:var(--azul)}\n.mg{font-family:\"Fraunces\",Georgia,serif;font-size:11px;font-style:italic;fill:var(--muted);opacity:.7}\n.water{fill:none;stroke:var(--azul-tint);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}\n.hill{fill:var(--line);opacity:.35}\n.street{stroke:var(--line);stroke-width:5;fill:none;stroke-linecap:round}\n.walk{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:3 4;stroke-linecap:round}\n.u{stroke:var(--amarelo);stroke-width:4;fill:none;stroke-linecap:round}\n.taxi{stroke:var(--azul);stroke-width:2.5;fill:none;stroke-linecap:round}\n.pt{fill:var(--azul);stroke:var(--bg);stroke-width:1.5}\n.eat{fill:var(--amarelo);stroke:var(--ink);stroke-width:1.2}\n.shop{fill:var(--bg);stroke:var(--azul);stroke-width:2}\n.bed{fill:var(--ok);stroke:var(--bg);stroke-width:1.5}\n</style>\n<style>\n/* ---- rotas numeradas (injetado) ---- */\n.r-path{cursor:pointer}\n.r-hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:16px;cursor:pointer}\n.r-badge{cursor:pointer}\n.r-badge circle{stroke:var(--bg);stroke-width:1.6px}\n.r-badge text{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}\n.r-badge circle{stroke-dasharray:none}\n.r-badge text{stroke:none;stroke-dasharray:none}\n.r-badge.walk{stroke-dasharray:none}\n.r-badge.walk circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}\n.r-badge.walk text{fill:var(--ink)}\n.r-badge.transit circle{fill:var(--amarelo)}\n.r-badge.transit text{fill:#1a1a1a}\n.r-badge.taxi circle{fill:var(--azul)}\n.r-badge.taxi text{fill:#fff}\n.r-path.is-active,.r-hit.is-active + .r-path{stroke-width:5px !important}\n.r-badge.is-active circle{stroke:var(--amarelo);stroke-width:3px}\n.rota-painel{display:none;margin:.6rem 0 1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:2px;position:relative}\n.rota-painel.show{display:block}\n.rota-painel .num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;font-size:.85rem;margin-right:.5rem;vertical-align:middle}\n.rota-painel h4{display:inline;font-family:\"Public Sans\",sans-serif;font-size:1rem;font-weight:700}\n.rota-painel p{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}\n.rota-painel .fechar{position:absolute;top:.5rem;right:.6rem;background:none;border:0;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:.3rem}\n.mapa-dica{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <p class=\"kicker\">zoropa 2026 \u00b7 bloco 4 de 5</p>\n    <h1>Berlim</h1>\n    <p class=\"sub\">Quarta 30/09 (chegada 21:43) \u00b7 quinta 01/10 (centro hist\u00f3rico + Mac mini) \u00b7 sexta 02/10 (Potsdam, bloco \u00e0 parte) \u00b7 s\u00e1bado 03/10 (feriado: Muro e Kreuzberg) \u00b7 domingo 04/10 (Mauerpark) \u00b7 segunda 05/10 (brunch e voo).</p>\n  </div>\n</header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pend\u00eancias</a>\n  <a href=\"#transporte\">Transporte</a>\n  <a href=\"#mapas\">Mapas</a>\n  <a href=\"#comer\">Onde comer</a>\n  <a href=\"#notebook\">Mac mini</a>\n  <a href=\"#glossario\">Gloss\u00e1rio</a>\n  <a href=\"#lembrancas\">Lembrancinhas</a>\n  <a href=\"#lojas\">Lojas</a>\n</div></nav>\n\n<div class=\"wrap\">\n\n<div class=\"warn\"><b>Duas corre\u00e7\u00f5es ao roteiro.</b> 1) O hotel n\u00e3o fica na Potsdamer Platz: fica na Luckenwalder Stra\u00dfe, em Kreuzberg, a 3 min da esta\u00e7\u00e3o <b>Gleisdreieck (U1 e U2)</b>. A Potsdamer Platz \u00e9 15 min a p\u00e9. Isso \u00e9 bom: o U2 leva direto ao centro, a Alexanderplatz e ao Mauerpark; o U1 leva direto \u00e0 East Side Gallery. 2) <b>As lojas fecham no feriado de s\u00e1bado 03/10 e no domingo 04/10.</b> Toda compra em Berlim, inclusive o Mac mini, cabe s\u00f3 em quinta 01/10, sexta 02/10 e segunda 05/10 at\u00e9 as 11h. 3) <b>O Jorge est\u00e1 na bitcoin++ (w3.hub, M\u00f6ckernstra\u00dfe 120) de qui 01 a s\u00e1b 03, durante o dia.</b> \u00c9 a 5 min a p\u00e9 do hotel; ele vai e volta a p\u00e9, sem bilhete. Rebeca faz os dias sozinha; os dois se encontram nas noites e no domingo inteiro. A ida \u00e0 Apple (Rosenthaler Stra\u00dfe 44 <a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2044%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a>) \u00e9 juntos, no hor\u00e1rio em que ele sair do evento.</div>\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pend\u00eancias e reservas</h2>\n  <div class=\"note\"><b>Lista compartilhada:</b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccb abrir a planilha \"Pend\u00eancias zoropa 2026\"</a> \u2014 \u00e9 a vers\u00e3o oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe t\u00eam edi\u00e7\u00e3o). As caixinhas abaixo s\u00e3o s\u00f3 um espelho r\u00e1pido neste aparelho.</div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"></span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">\ud83d\udd13 travar lista</button></div>\n  <h3>O que ainda falta</h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-0\"> <span class=\"pend-what\">Reichstag: reservar a c\u00fapula para qui 01/10 \u00e0s 21:00 (gr\u00e1tis, nominal)</span> <span class=\"pend-when\">agora \u00b7 bundestag.de</span> <span class=\"pend-how\">nome e nascimento dos dois como no passaporte</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-1\"> <span class=\"pend-what\">Mac mini M4 Pro: reservar para retirada na Apple Rosenthaler Str., qui 01/10 \u00e0s 10:00</span> <span class=\"pend-when\">agora \u00b7 apple.com/de</span> <span class=\"pend-how\">os dois v\u00e3o na abertura; o Jorge leva a caixa ao hotel e entra no evento \u00e0s 11h</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-2\"> <span class=\"pend-what\">App BVG Fahrinfo com conta e cart\u00e3o</span> <span class=\"pend-when\">at\u00e9 ter 29/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-3\"> <span class=\"pend-what\">Bilhete do dia no BVG antes de entrar no vag\u00e3o</span> <span class=\"pend-when\">qui 01, sex 02 (24 h ABC), s\u00e1b 03, dom 04, seg 05</span> <span class=\"pend-how\">ver \"Bilhete de cada dia\"</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-4\"> <span class=\"pend-what\">Tax Free: pedir o formul\u00e1rio na Apple com o passaporte</span> <span class=\"pend-when\">qui 01/10, na loja</span> <span class=\"pend-how\">endere\u00e7o do Brasil no formul\u00e1rio</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"berlim-5\"> <span class=\"pend-what\">Mapa offline de Berlim + Potsdam</span> <span class=\"pend-when\">at\u00e9 ter 29/09</span></label></li>\n  </ul>\n  <h3>Reservas e documentos</h3>\n  <p class=\"lead\">Os PDFs est\u00e3o no Drive da conta bexorxe (privados: quem n\u00e3o estiver logado nela v\u00ea \"pedir acesso\"). \ud83d\udccd abre o lugar no Maps.</p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">aletto Hotel Potsdamer Platz \u00b7 Luckenwalder Stra\u00dfe</span> <span class=\"pend-when\">qua 30/09 check-in ~22:15 (24 h) \u2192 seg 05/10 \u00b7 sala de malas no dia 05</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1TVwnqjGILtIvzs45M6TjQWvfWxpT8b1M/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 reserva (pt)</a> \u00b7 <a href=\"https://drive.google.com/file/d/1SGo10Oe-mwDyJymjG59t0UHrvB5vZNwt/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 reserva (de)</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=aletto%20Hotel%20Potsdamer%20Platz%2C%20Luckenwalder%20Stra%C3%9Fe%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">bitcoin++ Berlin \u00b7 w3.hub, M\u00f6ckernstra\u00dfe 120 (Jorge)</span> <span class=\"pend-when\">qui 01 \u2192 s\u00e1b 03/10 \u00b7 portas 10\u201311h</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1eVwEeIboXzIe9LfrIarLV56CTxGgRyGr/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 ingresso</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=w3.hub%20M%C3%B6ckernstra%C3%9Fe%20120%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Apple Store Rosenthaler Stra\u00dfe 44</span> <span class=\"pend-when\">qui 01/10 \u00e0s 10:00 (abertura), os dois</span> <span class=\"pend-links\"><a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">TAP TP533 \u00b7 Berlim \u2192 Lisboa</span> <span class=\"pend-when\">seg 05/10 17:20 \u00b7 sair do hotel 14:30</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 bilhete</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Flughafen%20Berlin%20Brandenburg%20BER%20Terminal%201\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n  </ul>\n</section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar</h2>\n  <p class=\"lead\">Berlim n\u00e3o tem catraca. Voc\u00ea compra o bilhete, valida (ou compra j\u00e1 validado no app) e entra. A fiscaliza\u00e7\u00e3o \u00e9 feita por gente \u00e0 paisana dentro do vag\u00e3o, e a multa \u00e9 \u20ac60. O sistema \u00e9 simples; o que confunde s\u00e3o as zonas: <b>AB</b> \u00e9 a cidade, <b>ABC</b> inclui Potsdam e o aeroporto.</p>\n\n  <div class=\"note\"><b>Pre\u00e7os de 2026:</b> viagem \u00fanica AB \u20ac4 (vale 2 h, s\u00f3 ida); <b>cart\u00e3o de 4 viagens AB \u20ac12,40</b> (\u20ac3,10 cada, pode ser dividido entre os dois); 24 h AB \u20ac11,20; 24 h ABC \u20ac12,90; \u00fanica ABC \u20ac5; trecho curto (3 esta\u00e7\u00f5es) \u20ac2,80. O passe mensal Deutschlandticket (\u20ac63) n\u00e3o compensa para 5 dias.</div>\n\n  <h3>Antes de sair do Brasil</h3>\n  <ol class=\"steps\">\n    <li><b>Instalem o app BVG Fahrinfo</b> e criem conta com o cart\u00e3o de cr\u00e9dito. Ele mostra rotas em tempo real (com as obras de fim de semana, frequentes) e vende o bilhete, que j\u00e1 vem validado com hora de compra: comprem sempre <b>antes</b> de entrar no vag\u00e3o.</li>\n    <li><b>DB Navigator</b> j\u00e1 est\u00e1 instalado para o ICE; serve tamb\u00e9m para os trens regionais a Potsdam e ao aeroporto.</li>\n    <li><b>Reservar a c\u00fapula do Reichstag</b> para <b>qui 01/10 \u00e0s 21:00</b> (bundestag.de \u2192 \"Visit the Bundestag\" \u2192 \"Online registration\"): \u00e9 gr\u00e1tis, exige nome e data de nascimento dos dois como no passaporte, e o hor\u00e1rio noturno \u00e9 o \u00fanico que cabe com o Jorge no evento. \u00daltima entrada 21:45; sem reserva n\u00e3o entra.</li>\n    <li><b>Mapa offline</b> de Berlim e Potsdam no Google Maps. As esta\u00e7\u00f5es de U-Bahn t\u00eam sinal, mas os t\u00faneis entre elas n\u00e3o.</li>\n  </ol>\n\n  <h3>Chegada, qua 30/09, 21:43, Hauptbahnhof</h3>\n  <ol class=\"steps\">\n    <li><b>T\u00e1xi \u00e9 a escolha certa \u00e0s 21h45 com mala:</b> ponto na sa\u00edda \"Europaplatz\" (n\u00edvel da rua, lado norte) ou \"Washingtonplatz\" (lado do rio). Diga \"aletto Hotel, Luckenwalder Stra\u00dfe\". ~\u20ac15\u201318, 15 min. Cart\u00e3o aceito; confirme antes de entrar.</li>\n    <li><b>Alternativa com bilhete (AB \u20ac4 cada):</b> <b>\u00f4nibus M41</b> da sa\u00edda Washingtonplatz, direto, descer em \"M\u00f6ckernbr\u00fccke\" (~15 min) e 5 min a p\u00e9 at\u00e9 a Luckenwalder Stra\u00dfe. Vale s\u00f3 sem pressa e com pouca mala.</li>\n    <li><b>Check-in 24 h.</b> O hotel tem bar e restaurante italiano no t\u00e9rreo at\u00e9 tarde, Starbucks de manh\u00e3 e sala de malas para o dia 05.</li>\n  </ol>\n\n  <h3>Como funciona na pr\u00e1tica</h3>\n  <ol class=\"steps\">\n    <li><b>Comprar no app:</b> escolher \"Einzelfahrschein AB\" ou \"4-Fahrten-Karte AB\" ou \"24-Stunden-Karte\". O bilhete aparece na tela com QR e hora; mostre ao fiscal. Cada pessoa precisa do pr\u00f3prio bilhete no pr\u00f3prio celular (ou um celular com dois bilhetes comprados juntos).</li>\n    <li><b>Comprar na m\u00e1quina:</b> h\u00e1 uma em toda plataforma de U/S-Bahn, em ingl\u00eas, cart\u00e3o ou moedas. Bilhete de papel precisa ser <b>carimbado na caixinha amarela ou vermelha</b> (\"Hier entwerten\") na plataforma antes da primeira viagem. Sem carimbo = sem bilhete, para o fiscal.</li>\n    <li><b>Sentido:</b> nas placas, o n\u00famero da linha e a \u00faltima esta\u00e7\u00e3o: \"U2 Pankow\" vai para o norte (Alexanderplatz, Eberswalder); \"U2 Ruhleben\" vai para o oeste (Potsdamer Platz \u00e9 a primeira parada).</li>\n    <li><b>Baldea\u00e7\u00e3o:</b> livre dentro das 2 h, na mesma dire\u00e7\u00e3o. Ida e volta n\u00e3o cabem num bilhete \u00fanico.</li>\n    <li><b>\u00d4nibus:</b> entra pela porta da frente e mostra o bilhete ao motorista; vende tamb\u00e9m a bordo, em dinheiro.</li>\n    <li><b>Fim de semana e feriado:</b> U-Bahn roda a noite toda (sexta e s\u00e1bado); no domingo e no feriado o intervalo \u00e9 maior. Conferir obras no app na manh\u00e3 do dia.</li>\n  </ol>\n\n  <h3>Bilhete de cada dia</h3>\n  <p class=\"lead\">Qui, sex e s\u00e1b o Jorge vai a p\u00e9 ao evento; os bilhetes s\u00e3o s\u00f3 da Rebeca (mais a ida dele \u00e0 Apple na quinta). Domingo \u00e9 dos dois.</p>\n  <div class=\"scroll\"><table>\n    <tr><th>Dia</th><th>Viagens</th><th>Compra certa</th><th>Custo</th></tr>\n    <tr><td>qui 01/10</td><td>Os dois: U2 Gleisdreieck \u2192 Alexanderplatz (Apple). Jorge: volta Alexanderplatz \u2192 Gleisdreieck com a caixa. Rebeca: volta a p\u00e9 ou 1 parada de U2 no fim da tarde.</td><td>1 cart\u00e3o de 4 viagens AB, dividido (2 dele, 2 dela)</td><td>\u20ac12,40</td></tr>\n    <tr><td>sex 02/10</td><td>Rebeca em Potsdam: ida, \u00f4nibus 695, volta = zona C</td><td>1 \u00d7 24 h ABC</td><td>\u20ac12,90</td></tr>\n    <tr><td>s\u00e1b 03/10</td><td>Rebeca: U6 a Mehringdamm; U6 a Paradestra\u00dfe; volta</td><td>1 \u00d7 24 h AB</td><td>\u20ac11,20</td></tr>\n    <tr><td>dom 04/10</td><td>Os dois: hotel \u2192 Mauerpark \u2192 East Side \u2192 Prater \u2192 hotel (4 trechos cada)</td><td>2 \u00d7 24 h AB</td><td>\u20ac22,40</td></tr>\n    <tr><td>seg 05/10</td><td>Hotel \u2192 BER</td><td>2 \u00d7 \u00fanica ABC</td><td>\u20ac10</td></tr>\n    <tr><td colspan=\"3\"><b>Total transporte em Berlim</b> (+ t\u00e1xi da chegada \u20ac15\u201318)</td><td><b>~\u20ac70</b></td></tr>\n  </table></div>\n\n  <h3>Trecho a trecho</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Quando</th><th>Trecho</th><th>Como</th><th>Tempo</th></tr>\n    <tr><td>qui 09:30</td><td>Hotel \u2192 Apple Rosenthaler Str. 44 <a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2044%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a> <b>(os dois)</b></td><td>U2 Gleisdreieck sentido Pankow \u2192 Alexanderplatz (6 paradas) + 8 min a p\u00e9. Retirada do Mac mini \u00e0s 10:00, na abertura; formul\u00e1rio Tax Free com o passaporte.</td><td>25 min</td></tr>\n    <tr><td>qui 10:30</td><td>Apple \u2192 hotel \u2192 w3.hub <b>(Jorge, com a caixa)</b></td><td>U2 Alexanderplatz \u2192 Gleisdreieck (15 min), deixa a caixa no quarto, 5 min a p\u00e9 at\u00e9 o evento. Chega dentro da janela das portas (10\u201311h).</td><td>25 min</td></tr>\n    <tr><td>qui 10:30</td><td>Apple \u2192 Hackesche H\u00f6fe \u2192 Ilha dos Museus <b>(Rebeca)</b></td><td>a p\u00e9: os H\u00f6fe s\u00e3o a porta ao lado; de l\u00e1, 10 min at\u00e9 a Ilha dos Museus</td><td>10 min</td></tr>\n    <tr><td>qui 12:00</td><td>Ilha dos Museus \u2192 Unter den Linden \u2192 Port\u00e3o de Brandemburgo</td><td>a p\u00e9 (25 min) ou \u00f4nibus 100 na parada Lustgarten, que \u00e9 passeio panor\u00e2mico; almo\u00e7o 12:30 no Port\u00e3o</td><td>15\u201325 min</td></tr>\n    <tr><td>qui 15:00</td><td>Brandemburgo \u2192 Tiergarten \u2192 Potsdamer Platz \u2192 hotel</td><td>a p\u00e9 pelo parque (30 min) at\u00e9 a Potsdamer Platz; de l\u00e1 15 min a p\u00e9 ou U2 (1 parada) at\u00e9 Gleisdreieck</td><td>45 min</td></tr>\n    <tr><td>qui 20:30</td><td>Jantar (Potsdamer Platz) \u2192 Reichstag <b>(os dois)</b></td><td>a p\u00e9 pela Ebertstra\u00dfe, 15 min; entrada com a reserva das 21:00, passaporte na m\u00e3o. Volta: U2 Potsdamer Platz \u2192 Gleisdreieck ou 25 min a p\u00e9.</td><td>15 min</td></tr>\n    <tr><td>s\u00e1b 10:00</td><td>Hotel \u2192 Checkpoint Charlie</td><td>a p\u00e9 18 min (M\u00f6ckernstra\u00dfe \u2192 Wilhelmstra\u00dfe) ou U1 Gleisdreieck \u2192 Hallesches Tor + U6 \u2192 Kochstra\u00dfe</td><td>18 min</td></tr>\n    <tr><td>s\u00e1b 11:30</td><td>Checkpoint \u2192 Mehringdamm (Curry 36)</td><td>U6 Kochstra\u00dfe \u2192 Mehringdamm, 2 paradas. O Curry 36 fica a 10 min a p\u00e9 do w3.hub: se o almo\u00e7o do evento for fraco, o Jorge encontra voc\u00ea aqui.</td><td>8 min</td></tr>\n    <tr><td>s\u00e1b 13:30</td><td>Mehringdamm \u2192 Tempelhofer Feld</td><td>U6 Mehringdamm \u2192 Paradestra\u00dfe, 3 paradas, direto (entrada sul). De dia, sozinha, \u00e9 tranquilo; \u00e0 noite n\u00e3o.</td><td>6 min</td></tr>\n    <tr><td>s\u00e1b 17:00</td><td>Tempelhof \u2192 hotel</td><td>U6 Paradestra\u00dfe \u2192 Hallesches Tor + U1 \u2192 Gleisdreieck</td><td>20 min</td></tr>\n    <tr><td>s\u00e1b 20:00</td><td>Jantar em Kreuzberg <b>(os dois)</b></td><td>a p\u00e9 do hotel; o Jorge chega do evento \u00e0s ~19h</td><td>\u2014</td></tr>\n    <tr><td>dom 11:00</td><td>Hotel \u2192 Mauerpark <b>(os dois)</b></td><td>U2 Gleisdreieck \u2192 Eberswalder Stra\u00dfe, direto, + 8 min a p\u00e9</td><td>25 min</td></tr>\n    <tr><td>dom 15:30</td><td>Mauerpark \u2192 East Side Gallery</td><td>Tram M10 na Eberswalder Stra\u00dfe, sentido Warschauer Stra\u00dfe, direto at\u00e9 o fim da linha; o muro come\u00e7a a 5 min a p\u00e9</td><td>25 min</td></tr>\n    <tr><td>dom 18:30</td><td>East Side \u2192 Prater (Kastanienallee)</td><td>Tram M10 de volta at\u00e9 Eberswalder Stra\u00dfe + 5 min a p\u00e9</td><td>25 min</td></tr>\n    <tr><td>dom 21:00</td><td>Prater \u2192 hotel</td><td>U2 Eberswalder Stra\u00dfe \u2192 Gleisdreieck, direto</td><td>20 min</td></tr>\n    <tr><td>seg 14:30</td><td>Hotel \u2192 BER Terminal 1</td><td>U2 \u2192 Potsdamer Platz + S2 sentido Blankenfelde \u2192 S\u00fcdkreuz + trem regional/FEX \u2192 Flughafen BER; conferir no app a combina\u00e7\u00e3o mais r\u00e1pida na hora. Bilhete ABC.</td><td>45\u201350 min</td></tr>\n  </table></div>\n\n  <h3 id=\"glossario\">Gloss\u00e1rio</h3>\n  <dl class=\"gloss\">\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('U-Bahn','de-DE',this)\" aria-label=\"Ouvir U-Bahn\">\ud83d\udd0a</button> U-Bahn</dt><dd>Metr\u00f4. Letras U + n\u00famero, placas azuis com U branco.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('S-Bahn','de-DE',this)\" aria-label=\"Ouvir S-Bahn\">\ud83d\udd0a</button> S-Bahn</dt><dd>Trem urbano, placas verdes com S branco. Mesmo bilhete.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('AB / ABC','de-DE',this)\" aria-label=\"Ouvir AB / ABC\">\ud83d\udd0a</button> AB / ABC</dt><dd>Zonas. AB \u00e9 Berlim; C \u00e9 Potsdam e o aeroporto. Bilhete AB em Potsdam = multa.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Entwerten','de-DE',this)\" aria-label=\"Ouvir Entwerten\">\ud83d\udd0a</button> Entwerten</dt><dd>Validar, carimbar o bilhete de papel na caixinha. S\u00f3 na primeira viagem.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Einzelfahrschein','de-DE',this)\" aria-label=\"Ouvir Einzelfahrschein\">\ud83d\udd0a</button> Einzelfahrschein</dt><dd>Bilhete \u00fanico, 2 h, uma dire\u00e7\u00e3o.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('4-Fahrten-Karte','de-DE',this)\" aria-label=\"Ouvir 4-Fahrten-Karte\">\ud83d\udd0a</button> 4-Fahrten-Karte</dt><dd>Cart\u00e3o de 4 viagens, mais barato por viagem, pode dividir entre pessoas.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Kurzstrecke','de-DE',this)\" aria-label=\"Ouvir Kurzstrecke\">\ud83d\udd0a</button> Kurzstrecke</dt><dd>Trecho curto: 3 esta\u00e7\u00f5es de metr\u00f4, 6 de \u00f4nibus. \u20ac2,80.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Fahrkartenkontrolle','de-DE',this)\" aria-label=\"Ouvir Fahrkartenkontrolle\">\ud83d\udd0a</button> Fahrkartenkontrolle</dt><dd>Fiscaliza\u00e7\u00e3o. Gente comum que mostra um crach\u00e1 e diz \"Fahrscheine, bitte\".</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Richtung','de-DE',this)\" aria-label=\"Ouvir Richtung\">\ud83d\udd0a</button> Richtung</dt><dd>Sentido, dado pela \u00faltima esta\u00e7\u00e3o.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Sp\u00e4ti','de-DE',this)\" aria-label=\"Ouvir Sp\u00e4ti\">\ud83d\udd0a</button> Sp\u00e4ti</dt><dd>Lojinha de conveni\u00eancia aberta at\u00e9 tarde e no domingo. Cerveja, \u00e1gua, chips. Cultura de Berlim: beber na porta.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Pfand','de-DE',this)\" aria-label=\"Ouvir Pfand\">\ud83d\udd0a</button> Pfand</dt><dd>Dep\u00f3sito de \u20ac0,08\u20130,25 na garrafa; devolve-se na m\u00e1quina do supermercado ou deixa-se ao lado do lixo para quem cata.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Imbiss','de-DE',this)\" aria-label=\"Ouvir Imbiss\">\ud83d\udd0a</button> Imbiss</dt><dd>Quiosque de comida r\u00e1pida: currywurst, d\u00f6ner.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Ruhetag','de-DE',this)\" aria-label=\"Ouvir Ruhetag\">\ud83d\udd0a</button> Ruhetag</dt><dd>Dia de folga do restaurante, geralmente segunda ou ter\u00e7a.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Tag der Deutschen Einheit','de-DE',this)\" aria-label=\"Ouvir Tag der Deutschen Einheit\">\ud83d\udd0a</button> Tag der Deutschen Einheit</dt><dd>Feriado de 03/10, Dia da Unidade. Com\u00e9rcio fechado; museus, restaurantes, transporte funcionam.</dd></div>\n  </dl>\n\n  <h3>Como se fala</h3>\n  <div class=\"note\"><span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Entwerten','de-DE',this)\" aria-label=\"Ouvir Entwerten\">\ud83d\udd0a</button> <b>Entwerten</b> \u2014 <i>ent-VER-ten</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Fahrkartenkontrolle','de-DE',this)\" aria-label=\"Ouvir Fahrkartenkontrolle\">\ud83d\udd0a</button> <b>Fahrkartenkontrolle</b> \u2014 <i>FAR-kar-ten-kon-tro-le</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Sp\u00e4ti','de-DE',this)\" aria-label=\"Ouvir Sp\u00e4ti\">\ud83d\udd0a</button> <b>Sp\u00e4ti</b> \u2014 <i>SHP\u00c9-ti</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Kurzstrecke','de-DE',this)\" aria-label=\"Ouvir Kurzstrecke\">\ud83d\udd0a</button> <b>Kurzstrecke</b> \u2014 <i>KURTS-shtre-ke</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Ruhetag','de-DE',this)\" aria-label=\"Ouvir Ruhetag\">\ud83d\udd0a</button> <b>Ruhetag</b> \u2014 <i>RU-e-tak</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Currywurst','de-DE',this)\" aria-label=\"Ouvir Currywurst\">\ud83d\udd0a</button> <b>Currywurst</b> \u2014 <i>K\u00d6-ri-vurst</i></span></div>\n\n  <h3>Frases \u00fateis</h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hallo','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Hallo</b> \u2014 <i>HA-l\u00f4 (ol\u00e1)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Morgen','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Guten Morgen</b> \u2014 <i>GU-ten M\u00d3R-guen (bom dia)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Guten Abend','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Guten Abend</b> \u2014 <i>GU-ten \u00c1-bent (boa noite, ao chegar)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Danke sch\u00f6n','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Danke sch\u00f6n</b> \u2014 <i>DAN-ke sh\u00f6n (muito obrigada)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Bitte','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Bitte</b> \u2014 <i>BI-te (por favor / de nada / pois n\u00e3o)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Entschuldigung','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Entschuldigung</b> \u2014 <i>ent-SHUL-di-gung (desculpe / com licen\u00e7a)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Sprechen Sie Englisch?','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Sprechen Sie Englisch?</b> \u2014 <i>SHPR\u00c9-rren zi \u00c9N-glish (fala ingl\u00eas?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ich verstehe nicht','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Ich verstehe nicht</b> \u2014 <i>irr fer-SHT\u00ca-e nirrt (n\u00e3o entendo)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Wo ist die Toilette?','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Wo ist die Toilette?</b> \u2014 <i>v\u00f4 ist di tua-L\u00c9-te (onde \u00e9 o banheiro?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Was kostet das?','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Was kostet das?</b> \u2014 <i>vas K\u00d3S-tet das (quanto custa isso?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Die Rechnung, bitte','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Die Rechnung, bitte</b> \u2014 <i>di R\u00c9RR-nung BI-te (a conta, por favor)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ein Tisch f\u00fcr zwei','de-DE',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Ein Tisch f\u00fcr zwei</b> \u2014 <i>ain TISH f\u00fcr TSVAI (mesa para dois)</i></li>\n  </ul>\n\n  <h3>Apps: qual e por qu\u00ea</h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">\ud83c\udfab</div><div><b>BVG Fahrinfo</b><span>Bilhete e rota, com as obras. Obrigat\u00f3rio.</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83d\ude84</div><div><b>DB Navigator</b><span>O ICE de quarta e os regionais para Potsdam e para o BER. Mostra a plataforma.</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83d\ude95</div><div><b>Uber, Bolt e Free Now</b><span>Free Now chama t\u00e1xi de verdade, \u00fatil na chegada. Uber e Bolt para a volta tarde do Tempelhof ou do Prater.</span></div></div>\n  </div>\n</section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia</h2>\n  <p class=\"lead\">Um mapa geral com os cinco dias (o Spree cruza a cidade de leste a oeste; o Landwehrkanal, ao sul, ext x=\"148\" y=\"170\" class=\"ms\">Ritter Sport</text>\n      <circle cx=\"218\" cy=\"134\" r=\"6\" class=\"pt\"/><text x=\"222\" y=\"152\" class=\"ms\">Berliner Dom</text>\n      <circle cx=\"227\" cy=\"73\" r=\"7\" class=\"pt\"/><text x=\"120\" y=\"62\" class=\"m\">Hackesche H\u00f6fe \u00b7 Ampelmann</text>\n      <circle cx=\"232\" cy=\"80\" r=\"5\" class=\"shop\"/><text x=\"240\" y=\"84\" class=\"m\">Apple Store</text>\n      <circle cx=\"216\" cy=\"85\" r=\"4\" class=\"eat\"/><text x=\"222\" y=\"96\" class=\"ms\">Curry 61</text>\n      <circle cx=\"172\" cy=\"71\" r=\"4\" class=\"shop\"/><text x=\"110\" y=\"82\" class=\"ms\">Bonbonmacherei</text>\n      <circle cx=\"297\" cy=\"104\" r=\"6\" class=\"pt\"/><text x=\"290\" y=\"122\" class=\"ms\">Alexanderplatz</text>\n      <circle cx=\"62\" cy=\"218\" r=\"4\" class=\"eat\"/><text x=\"68\" y=\"222\" class=\"ms\">Midtown Grill</text>\n      <circle cx=\"39\" cy=\"226\" r=\"4\" class=\"eat\"/><text x=\"10\" y=\"216\" class=\"ms\">Lindenbr\u00e4u</text>\n      <circle cx=\"151\" cy=\"254\" r=\"5\" class=\"pt\"/><text x=\"158\" y=\"258\" class=\"ms\">Checkpoint Charlie (s\u00e1b)</text>\n    <g class=\"r-badge walk\" data-r=\"1\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: A p\u00e9 \u00b7 Potsdamer Platz \u2192 Port\u00e3o de Brandemburgo\" transform=\"translate(62,197)\"><circle r=\"9\"/><text y=\".5\">1</text></g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A p\u00e9 \u00b7 Port\u00e3o \u2192 Memorial do Holocausto\" transform=\"translate(74,175)\"><circle r=\"9\"/><text y=\".5\">2</text></g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A p\u00e9 \u00b7 Port\u00e3o \u2192 Reichstag\" transform=\"translate(67,152)\"><circle r=\"9\"/><text y=\".5\">3</text></g><g class=\"r-badge walk\" data-r=\"4\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: A p\u00e9 (ou \u00f4nibus 100) \u00b7 Unter den Linden \u2192 Ilha dos Museus\" transform=\"translate(141.7,146.9)\"><circle r=\"9\"/><text y=\".5\">4</text></g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A p\u00e9 \u00b7 Ilha dos Museus \u2192 Hackesche H\u00f6fe\" transform=\"translate(224.5,105)\"><circle r=\"9\"/><text y=\".5\">5</text></g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A p\u00e9 \u00b7 Hackesche H\u00f6fe \u2192 Alexanderplatz\" transform=\"translate(263,89)\"><circle r=\"9\"/><text y=\".5\">6</text></g><g class=\"r-badge transit\" data-r=\"7\" data-map=\"berlim-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 7: U2 \u00b7 Alexanderplatz \u2192 hotel (Gleisdreieck)\" transform=\"translate(187.9,185.1)\"><circle r=\"9\"/><text y=\".5\">7</text></g></svg>\n    <figcaption>Zoom de quinta. A Apple Store \u00e9 a porta ao lado dos Hackesche H\u00f6fe; Dussmann e Ritter Sport s\u00e3o um desvio de 5 min pela Friedrichstra\u00dfe a partir da Unter den Linden.</figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"></i>ponto do roteiro</span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"></i>comer</span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"></i>loja</span>\n      <span><i style=\"background:var(--ok)\"></i>hotel</span>\n      <span>\u2014 \u2014 a p\u00e9</span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">\u2501</span> U-Bahn</span>\n      <span><span style=\"color:var(--azul);font-weight:900\">\u2501</span> t\u00e1xi</span>\n    </div>\n  <div class=\"rota-painel\" id=\"rp-berlim-1\" aria-live=\"polite\"></div></figure>\n\n  <p>Mapa real de quinta: <a href=\"https://www.google.com/maps/dir/?api=1&origin=aletto+Hotel+Potsdamer+Platz&destination=Alexanderplatz&waypoints=Brandenburger+Tor%7CReichstag%7CBerliner+Dom%7CHackesche+H%C3%B6fe%7CApple+Rosenthaler+Stra%C3%9Fe&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir no Google Maps</a>.</p>\n\n  <h3>Sobre os lugares</h3>\n  <div class=\"attractions\">\n    <h4>Port\u00e3o de Brandemburgo</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Erguido entre 1788 e 1791 como portal de entrada cerimonial na cidade, foi inspirado nos Propileus da Acr\u00f3pole de Atenas \u2014 da\u00ed as colunas gregas. Ficou preso bem no meio do Muro de Berlim entre 1961 e 1989, numa faixa de ningu\u00e9m inacess\u00edvel dos dois lados; a queda do Muro em novembro de 1989 e a reunifica\u00e7\u00e3o em 1990 transformaram o port\u00e3o no s\u00edmbolo maior da cidade reunida.</div></details><details class=\"curio\"><summary>\ud83c\udfdb\ufe0f um pouco de arquitetura</summary><div class=\"in\">A quadriga de bronze no topo \u2014 a deusa da vit\u00f3ria guiando quatro cavalos \u2014 foi roubada por Napole\u00e3o em 1806 e levada para Paris como trof\u00e9u de guerra; as tropas prussianas a recuperaram em 1814, depois da derrota dele.</div></details>\n    <h4>Reichstag</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Sede do parlamento alem\u00e3o desde 1894, foi incendiado em 1933 num epis\u00f3dio nunca totalmente esclarecido \u2014 Hitler usou o inc\u00eandio como pretexto para suspender direitos civis e consolidar poder, um dos pontos de virada para o regime nazista. Ficou em ru\u00ednas boa parte da Guerra Fria, praticamente abandonado perto do Muro, e s\u00f3 voltou a sediar o Parlamento depois da reunifica\u00e7\u00e3o, em 1999.</div></details><details class=\"curio\"><summary>\ud83c\udfdb\ufe0f um pouco de arquitetura</summary><div class=\"in\">A c\u00fapula de vidro que hoje \u00e9 cart\u00e3o-postal foi acrescentada nessa reforma dos anos 1990, projetada pelo arquiteto brit\u00e2nico Norman Foster \u2014 uma escada em espiral leva o visitante ao topo, de onde se v\u00ea literalmente por cima da sala onde os deputados trabalham, um simbolismo deliberado de transpar\u00eancia do governo diante do povo.</div></details>\n    <h4>East Side Gallery</h4><details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">\u00c9 o maior trecho remanescente do Muro de Berlim ainda de p\u00e9, 1,3 km, pintado por mais de cem artistas de dezenas de pa\u00edses logo depois da queda em 1989-90. O mural mais famoso, o \"beijo fraterno\" entre Brezhnev e Honecker, \u00e9 baseado numa foto real de 1979 \u2014 o aperto de m\u00e3o socialista que virou beijo na boca era um cumprimento genu\u00edno entre l\u00edderes comunistas da \u00e9poca.</div></details>\n    <h4>Aeroporto de Tempelhof</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Foi um dos maiores pr\u00e9dios do mundo quando os nazistas o ampliaram nos anos 1930 como vitrine de propaganda do regime. Ficou mundialmente famoso pela Ponte A\u00e9rea de Berlim de 1948-49: quando a Uni\u00e3o Sovi\u00e9tica bloqueou todas as estradas e ferrovias para Berlim Ocidental, avi\u00f5es americanos e brit\u00e2nicos pousavam em Tempelhof a cada poucos minutos, dia e noite, abastecendo a cidade inteira s\u00f3 pelo ar por quase um ano. O aeroporto fechou em 2008; hoje as pistas viraram o maior parque urbano de Berlim, e os pr\u00e9dios \u00e0s vezes abrigam abrigos e eventos.</div></details>\n  </div>\n</section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 op\u00e7\u00f5es por parada</h2>\n  <div class=\"note\"><b>Com o evento do Jorge:</b> os almo\u00e7os de qui e s\u00e1b s\u00e3o da Rebeca (ele almo\u00e7a no w3.hub, inclu\u00eddo no ingresso); os jantares de qui, sex e s\u00e1b e o domingo inteiro s\u00e3o dos dois.</div>\n  <p class=\"lead\">Berlim come na rua (currywurst, d\u00f6ner) e janta cedo e farto (schnitzel, Eisbein, Klopse). Muitos restaurantes t\u00eam um dia de folga na semana; hor\u00e1rios abaixo conferidos para o dia exato. Pre\u00e7os por pessoa, sem bebida.</p>\n\n  <div class=\"meal\">\n    <h3>Jantar tardio \u00b7 qua 30/09, ~22:15 \u00b7 perto do hotel</h3>\n    <p class=\"when\">Depois de 5h43 de trem. Os tr\u00eas funcionam at\u00e9 tarde e ficam a menos de 15 min a p\u00e9 do aletto.</p>\n\n    <div class=\"opt pick\"><h4>Curry 36 <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Mehringdamm 36, 15 min a p\u00e9 do hotel (ou U7 de M\u00f6ckernbr\u00fccke, 1 parada).</span>\n        <b>Por qu\u00ea</b><span>A currywurst mais famosa da cidade, aberta at\u00e9 5h da manh\u00e3. Chegar \u00e0s 22h de trem e comer currywurst de p\u00e9 na cal\u00e7ada \u00e9 a inaugura\u00e7\u00e3o certa de Berlim. Est\u00e1 no roteiro de s\u00e1bado, mas funciona melhor hoje, sem fila.</span>\n        <b>Estrela</b><span>Currywurst \"ohne Darm\" (sem pele, a de Berlim Oriental) com Pommes rot-wei\u00df (ketchup e maionese).</span>\n        <b>Custo</b><span>\u20ac6\u20139.</span>\n        <b>Hor\u00e1rio</b><span>9h\u20135h. S\u00f3 balc\u00e3o.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Lindenbr\u00e4u am Potsdamer Platz</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Sony Center, Bellevuestra\u00dfe 3-5, 12 min a p\u00e9.</span>\n        <b>Por qu\u00ea</b><span>Cervejaria b\u00e1vara em 3 andares, cozinha at\u00e9 tarde, mesa garantida. Para quem quer sentar com um chope depois do trem.</span>\n        <b>Estrela</b><span>Schnitzel com salada de batata; Apfelstrudel; suco de ruibarbo.</span>\n        <b>Custo</b><span>\u20ac18\u201328.</span>\n        <b>Hor\u00e1rio</b><span>11h30\u20131h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>O restaurante e o bar do aletto</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>T\u00e9rreo do hotel.</span>\n        <b>Por qu\u00ea</b><span>Se o trem atrasar ou a energia acabar: italiano simples e bar com petiscos, sem sair.</span>\n        <b>Estrela</b><span>Pizza; t\u00e1bua.</span>\n        <b>Custo</b><span>\u20ac12\u201320.</span>\n        <b>Hor\u00e1rio</b><span>Conferir na recep\u00e7\u00e3o o hor\u00e1rio da cozinha.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 qui 01/10, 12:30 \u00b7 Port\u00e3o de Brandemburgo</h3>\n    <p class=\"when\">Currywurst de rua, como o roteiro pede. Os dois primeiros ficam a 100 m do Port\u00e3o; o terceiro, no fim da tarde, ao lado dos Hackesche H\u00f6fe.</p>\n\n    <div class=\"opt pick\"><h4>Curry Wolf <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Unter den Linden 77, no Hotel Adlon, esquina do Port\u00e3o.</span>\n        <b>Por qu\u00ea</b><span>Currywurst decente com mesas ao ar livre na avenida mais nobre da cidade; tem op\u00e7\u00e3o vegetariana e vegana da salsicha. Mais caro que a m\u00e9dia pelo lugar, ainda barato.</span>\n        <b>Estrela</b><span>Currywurst com batata; a vers\u00e3o vegana surpreende.</span>\n        <b>Custo</b><span>\u20ac7\u201310.</span>\n        <b>Hor\u00e1rio</b><span>10h\u201322h30.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Wurst am Brandenburger Tor</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Quiosque na Ebertstra\u00dfe esquina Scheidemannstra\u00dfe, entre o Port\u00e3o e o Reichstag.</span>\n        <b>Por qu\u00ea</b><span>O quiosque simp\u00e1tico do gramado do Reichstag, com bancos. Cai exatamente no caminho da C\u00fapula (11h) para o Port\u00e3o.</span>\n        <b>Estrela</b><span>Currywurst com p\u00e3o; Bratwurst.</span>\n        <b>Custo</b><span>\u20ac5\u20138.</span>\n        <b>Hor\u00e1rio</b><span>11h\u201319h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Curry 61</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Oranienburger Str. 6, esquina dos Hackesche H\u00f6fe.</span>\n        <b>Por qu\u00ea</b><span>Nota 4,6 em 8 mil avalia\u00e7\u00f5es, a rival de Mitte da Curry 36: molho generoso, salsicha grelhada crocante opcional, rock no r\u00e1dio. Se o almo\u00e7o no Port\u00e3o foi leve, aqui \u00e9 o lanche das 15h30.</span>\n        <b>Estrela</b><span>Currywurst \"ger\u00f6stet\" (torrada), pimenta a gosto.</span>\n        <b>Custo</b><span>\u20ac6\u20139.</span>\n        <b>Hor\u00e1rio</b><span>11h\u201323h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar \u00b7 qui 01/10, 19:00 \u00b7 Potsdamer Platz</h3>\n    <p class=\"when\">Tudo a 10\u201315 min a p\u00e9 do hotel, entre a Potsdamer Platz e o Sony Center. A primeira era a do roteiro; as duas outras custam metade.</p>\n\n    <div class=\"opt pick\"><h4>Midtown Grill <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Ebertstra\u00dfe 3, no Marriott.</span>\n        <b>Por qu\u00ea</b><span>Carne na brasa com cozinha aberta e servi\u00e7o de hotel americano, o jantar \"de comemora\u00e7\u00e3o\" dos cinco dias. Reservar.</span>\n        <b>Estrela</b><span>Tartare de carne; costela ou bone-in sirloin.</span>\n        <b>Custo</b><span>\u20ac40\u201360.</span>\n        <b>Hor\u00e1rio</b><span>Qui 17h\u201323h. +49 30 220005411.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Monte Mente</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Bellevuestra\u00dfe 5, ao lado do Sony Center.</span>\n        <b>Por qu\u00ea</b><span>Mediterr\u00e2neo e turco elegante, nota 4,6, pre\u00e7o de bairro num endere\u00e7o de hotel. Para um jantar bonito sem os \u20ac60.</span>\n        <b>Estrela</b><span>Massas; salm\u00e3o; pizza no forno.</span>\n        <b>Custo</b><span>\u20ac18\u201328.</span>\n        <b>Hor\u00e1rio</b><span>10h\u20130h. +49 30 26101705.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Lindenbr\u00e4u</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Sony Center.</span>\n        <b>Por qu\u00ea</b><span>A alem\u00e3 barulhenta do Sony Center, se na quarta escolheram a currywurst.</span>\n        <b>Estrela</b><span>Schweinshaxe (joelho de porco); Kaiserschmarrn de sobremesa.</span>\n        <b>Custo</b><span>\u20ac18\u201328.</span>\n        <b>Hor\u00e1rio</b><span>11h30\u20131h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 s\u00e1b 03/10, 11:30 \u00b7 Mehringdamm</h3>\n    <p class=\"when\">O trio do roteiro est\u00e1 certo; aqui vai o que a verifica\u00e7\u00e3o acrescenta. Feriado: fila maior que o normal.</p>\n\n    <div class=\"opt pick\"><h4>Curry 36 <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Mehringdamm 36, sa\u00edda do U6.</span>\n        <b>Por qu\u00ea</b><span>Fila r\u00e1pida mesmo cheia. Se j\u00e1 foram na quarta, provem a Bockwurst ou a Krakauer.</span>\n        <b>Estrela</b><span>Currywurst com Pommes; garrafa do curry ketchup deles para levar (\u20ac4).</span>\n        <b>Custo</b><span>\u20ac6\u20139.</span>\n        <b>Hor\u00e1rio</b><span>9h\u20135h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Mustafa's Gem\u00fcse Kebap</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Mehringdamm 33, na frente.</span>\n        <b>Por qu\u00ea</b><span>A fila passa de 1 h em dia normal; no feriado, mais. Regra das avalia\u00e7\u00f5es: mais de 30 pessoas na fila, desista.</span>\n        <b>Estrela</b><span>Gem\u00fcse Kebap de frango.</span>\n        <b>Custo</b><span>\u20ac8\u201310.</span>\n        <b>Hor\u00e1rio</b><span>S\u00e1b 11h\u20132h30.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">O d\u00f6ner com legumes grelhados e queijo de cabra virou lenda em Berlim: gente atravessa a cidade s\u00f3 por causa dele.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>Burgermeister Schlesisches Tor</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Oberbaumstra\u00dfe 8, dentro do antigo banheiro p\u00fablico sob o viaduto do U1.</span>\n        <b>Por qu\u00ea</b><span>Nota 4,7 em 17 mil avalia\u00e7\u00f5es. Fica na parada seguinte do roteiro (13h): se a fila da Mehringdamm assustar, almo\u00e7ar aqui e seguir a p\u00e9 para a Oberbaumbr\u00fccke, 3 min.</span>\n        <b>Estrela</b><span>Meisterburger; cheese fries.</span>\n        <b>Custo</b><span>\u20ac9\u201313.</span>\n        <b>Hor\u00e1rio</b><span>S\u00e1b 11h\u20134h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar \u00b7 s\u00e1b 03/10, ~20:00 \u00b7 Kreuzberg</h3>\n    <p class=\"when\">O roteiro n\u00e3o tinha jantar de s\u00e1bado. Depois do p\u00f4r do sol no Tempelhof (19h), Kreuzberg fica no caminho de volta ao hotel. No feriado os restaurantes abrem normalmente.</p>\n\n    <div class=\"opt pick\"><h4>Max und Moritz <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Oranienstra\u00dfe 162. U8 Boddinstra\u00dfe \u2192 Moritzplatz (do Tempelhof), 5 min a p\u00e9.</span>\n        <b>Por qu\u00ea</b><span>A comida prussiana de verdade \u2014 \u00e9 o jantar \"Berlim antiga\" que faltava.</span>\n        <b>Estrela</b><span>Eisbein (joelho de porco cozido) com chucrute e pur\u00ea de ervilha; K\u00f6nigsberger Klopse.</span>\n        <b>Custo</b><span>\u20ac16\u201324. Por\u00e7\u00f5es enormes: um Eisbein serve dois.</span>\n        <b>Hor\u00e1rio</b><span>S\u00e1b 18h\u201323h. +49 30 69515911.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Taberna berlinense de 1902, com azulejos e ilustra\u00e7\u00f5es do livro infantil que d\u00e1 nome \u00e0 casa \u2014 o sal\u00e3o mudou pouco desde ent\u00e3o.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>Hasir</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Adalbertstra\u00dfe 12, Kottbusser Tor.</span>\n        <b>Por qu\u00ea</b><span>Restaurante turco de mesa, no cora\u00e7\u00e3o do Kreuzberg turco.</span>\n        <b>Estrela</b><span>Beyti; kebab de berinjela.</span>\n        <b>Custo</b><span>\u20ac18\u201326. Confira a gorjeta na maquininha: uma avalia\u00e7\u00e3o relata 10% pr\u00e9-marcados.</span>\n        <b>Hor\u00e1rio</b><span>S\u00e1b 12h\u20131h.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">A fam\u00edlia Hasir reivindica ter inventado o d\u00f6ner kebab tal como se conhece hoje, em Berlim, em 1971 \u2014 uma disputa de origem que os berlinenses adoram discutir.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>Markthalle Neun</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Eisenbahnstra\u00dfe 42, 10 min a p\u00e9 da Oberbaumbr\u00fccke.</span>\n        <b>Por qu\u00ea</b><span>Mercado coberto de 1891 com bancas de comida do mundo. Era o plano B de chuva do roteiro; serve de jantar cedo se sa\u00edrem da East Side \u00e0s 17h e quiserem pular o Tempelhof.</span>\n        <b>Estrela</b><span>Sisters Thai; churrasco defumado; gyoza.</span>\n        <b>Custo</b><span>\u20ac10\u201318.</span>\n        <b>Hor\u00e1rio</b><span>S\u00e1bado normal 9h\u201320h; <b>no feriado, conferir no Instagram do mercado na v\u00e9spera.</b></span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 dom 04/10, 12:00 \u00b7 Mauerpark</h3>\n    <p class=\"when\">Nas barracas da feira: bratwurst, d\u00f6ner, comida et\u00edope, tailandesa, limonada; \u20ac6\u201310, quase tudo em dinheiro. N\u00e3o h\u00e1 trio aqui: a feira \u00e9 o lugar. O Konnopke's (o quiosque de 1930 sob o viaduto da Eberswalder) fecha domingo.</p>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar \u00b7 dom 04/10, 19:00 \u00b7 Prenzlauer Berg</h3>\n    <p class=\"when\">Os tr\u00eas a 10 min do Mauerpark, ao redor da esta\u00e7\u00e3o Eberswalder Stra\u00dfe.</p>\n\n    <div class=\"opt pick\"><h4>Prater Gastst\u00e4tte <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Kastanienallee 7-9.</span>\n        <b>Por qu\u00ea</b><span>Em outubro o jardim pode estar fechado pelo frio, mas o sal\u00e3o (Gastst\u00e4tte) abre domingo o dia inteiro e tem a cozinha boa.</span>\n        <b>Estrela</b><span>Wiener Schnitzel; K\u00f6nigsberger Klopse; a cerveja da casa.</span>\n        <b>Custo</b><span>\u20ac20\u201330.</span>\n        <b>Hor\u00e1rio</b><span>Dom 12h\u201323h. Reservar pelo site: uma avalia\u00e7\u00e3o recente relata gar\u00e7onete recusando walk-in com o sal\u00e3o vazio.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">O beer garden mais antigo de Berlim, aberto em 1837 \u2014 passou por guerras, divis\u00e3o e reunifica\u00e7\u00e3o da cidade no mesmo endere\u00e7o.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>Zum Schusterjungen</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Danziger Stra\u00dfe 9, 5 min do Prater.</span>\n        <b>Por qu\u00ea</b><span>A Kneipe berlinense de verdade: madeira escura, cerveja de press\u00e3o, comida farta e barata, nota 4,5 em 2.800 avalia\u00e7\u00f5es. Se o Prater estiver lotado ou caro, aqui \u00e9 melhor.</span>\n        <b>Estrela</b><span>Schnitzel; Eisbein; Blutwurst para os corajosos.</span>\n        <b>Custo</b><span>\u20ac14\u201322.</span>\n        <b>Hor\u00e1rio</b><span>Dom 12h\u20130h. +49 30 4427654.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>The Bird</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Am Falkplatz 5, na esquina norte do Mauerpark.</span>\n        <b>Por qu\u00ea</b><span>Steakhouse nova-iorquino de expatriados, hamb\u00farguer grosso mal passado, fritas dupla fritura. Avalia\u00e7\u00f5es recentes reclamam de queda de qualidade: era a alternativa do roteiro, hoje fica em terceiro.</span>\n        <b>Estrela</b><span>Burger ao ponto \"medium\"; bife de 250 g.</span>\n        <b>Custo</b><span>\u20ac18\u201328.</span>\n        <b>Hor\u00e1rio</b><span>Dom 12h\u20130h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Brunch \u00b7 seg 05/10, 09:30 \u00b7 Landwehrkanal</h3>\n    <p class=\"when\">O canal passa a 5 min do hotel (Hallesches Ufer / Tempelhofer Ufer). Os tr\u00eas abrem segunda; check-out \u00e0s 11h.</p>\n\n    <div class=\"opt pick\"><h4>Kaffeekreis <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>M\u00f6ckernstra\u00dfe 91, 5 min do hotel, na esquina do canal.</span>\n        <b>Por qu\u00ea</b><span>Brunch moldavo-romeno com nota 4,8: papana\u0219i (bolinho de queijo frito com geleia) doce ou salgado, ovos benedict elogiados, caf\u00e9 bom. Diferente de tudo na viagem.</span>\n        <b>Estrela</b><span>Papana\u0219i; omelete.</span>\n        <b>Custo</b><span>\u20ac12\u201318.</span>\n        <b>Hor\u00e1rio</b><span>Seg 9h\u201318h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Caf\u00e9 Dura</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Wilhelmstra\u00dfe 10, 12 min a p\u00e9 pelo canal.</span>\n        <b>Por qu\u00ea</b><span>Caf\u00e9 de bairro com p\u00e1tio, omelete com dois p\u00e3es, torrada de abacate. Sem ingl\u00eas no balc\u00e3o; apontar funciona.</span>\n        <b>Estrela</b><span>Omelete de cheddar.</span>\n        <b>Custo</b><span>\u20ac10\u201316.</span>\n        <b>Hor\u00e1rio</b><span>Seg 8h\u201320h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Maracay Coffee</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Stresemannstra\u00dfe 72, 10 min.</span>\n        <b>Por qu\u00ea</b><span>Caf\u00e9 de especialidade, croissant de pistache, decora\u00e7\u00e3o retr\u00f4. <b>S\u00f3 dinheiro.</b></span>\n        <b>Estrela</b><span>Caf\u00e9 da manh\u00e3 escandinavo; chai latte.</span>\n        <b>Custo</b><span>\u20ac8\u201314.</span>\n        <b>Hor\u00e1rio</b><span>Seg 8h\u201318h.</span>\n      </div></div>\n    <div class=\"note\">Se quiserem a caminhada de verdade pelo canal: 25 min pelo Tempelhofer Ufer at\u00e9 o Urbanhafen, e brunch no <b>Cafe Brick</b> (K\u00f6rtestra\u00dfe 32, seg 9h\u201316h, nota 4,8). Volta de U7 S\u00fcdstern \u2192 M\u00f6ckernbr\u00fccke, 3 paradas.</div>\n  </div>\n</section>\n\n<!-- ====================== NOTEBOOK ====================== -->\n<section id=\"notebook\">\n  <h2>O Mac mini: onde e quando</h2>\n  <p class=\"lead\">A Apple Store da Rosenthaler Stra\u00dfe 44 <a href=\"https://www.google.com/maps/search/?api=1&query=Apple%20Rosenthaler%20Stra%C3%9Fe%2044%2C%20Berlin\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a> \u00e9 <b>a porta ao lado dos Hackesche H\u00f6fe</b>, que est\u00e3o no roteiro de quinta \u00e0s 15h30. Abre seg\u2013s\u00e1b 10h\u201320h e fecha domingo. <b>Voc\u00eas v\u00e3o juntos na abertura, \u00e0s 10:00 de quinta, antes do evento:</b> retirada reservada, Tax Free na hora, e o Jorge leva a caixa ao hotel a caminho do w3.hub. Assim ningu\u00e9m carrega o Mac mini pela cidade e ele n\u00e3o precisa sair no meio do evento. Com o feriado de s\u00e1bado, as janelas s\u00e3o s\u00f3 estas:</p>\n  <div class=\"scroll\"><table>\n    <tr><th>Janela</th><th>Pr\u00f3s</th><th>Contras</th></tr>\n    <tr><td><b>Qui 01/10, 10:00 (abertura)</b></td><td>Os dois v\u00e3o juntos antes do evento; o Jorge leva a caixa ao hotel (15 min de U2 + 5 a p\u00e9) e entra no w3.hub dentro da janela das portas. Rebeca segue a p\u00e9 para os H\u00f6fe e a Ilha dos Museus, sem carregar nada. Sobram sexta e segunda como reserva.</td><td>Exige reservar a retirada no site da Apple (sen\u00e3o a loja n\u00e3o garante estoque na hora). Acordar cedo.</td></tr>\n    <tr><td>Sex 02/10, 18:00\u201320:00</td><td>Rebeca volta de Potsdam pelo RE1 at\u00e9 Friedrichstra\u00dfe (10 min a p\u00e9); o Jorge vem do evento no fim do dia.</td><td>Dia longo de caminhada; loja mais cheia \u00e0 noite.</td></tr>\n    <tr><td>Seg 05/10, 10:00\u201311:00</td><td>\u00daltima chance.</td><td>Sem margem para erro; check-out \u00e0s 11h e trem \u00e0s 14h30.</td></tr>\n  </table></div>\n  <ol class=\"steps\">\n    <li><b>Na loja:</b> pedir o formul\u00e1rio Tax Free (Global Blue) com o passaporte. Conferir que o endere\u00e7o no formul\u00e1rio \u00e9 o do Brasil.</li>\n    <li><b>Onde carimbar:</b> a valida\u00e7\u00e3o \u00e9 no <b>\u00faltimo aeroporto de sa\u00edda da UE, que \u00e9 Lisboa, 06/10</b>, n\u00e3o em Berlim (BER\u2192LIS \u00e9 voo interno da UE). No aeroporto de Lisboa: balc\u00e3o da Alf\u00e2ndega (Customs), antes da seguran\u00e7a, com o Mac mini na m\u00e3o, a nota e o passaporte. Depois, o balc\u00e3o Global Blue para o reembolso. \u00c9 por isso que sair da casa da Patr\u00edcia \u00e0s 06:15 importa.</li>\n    <li><b>Pesar a mala:</b> 10 kg de mala de m\u00e3o na TAP. O Mac mini pesa ~0,7 kg; com caixa, ~1,3 kg num cubo de 20 cm que deita no fundo da mala de m\u00e3o. O Tax Free e a Receita brasileira preferem a caixa lacrada, e aqui ela custa pouco espa\u00e7o: levar a caixa.</li>\n    <li><b>O checklist completo</b> das cinco fases (contato com a loja, prepara\u00e7\u00e3o, loja, Tax Free, declara\u00e7\u00e3o no Brasil) est\u00e1 no arquivo do projeto.</li>\n  </ol>\n</section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Berlim</h2>\n  <p class=\"lead\">Janelas: quinta (Hackesche H\u00f6fe, Friedrichstra\u00dfe), sexta \u00e0 noite (KaDeWe, opcional) e o domingo na feira do Mauerpark. S\u00e1bado 03/10 \u00e9 feriado e as lojas est\u00e3o fechadas; s\u00f3 Sp\u00e4tis e a feira dominical escapam.</p>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O qu\u00ea</th><th>Por qu\u00ea</th><th>Onde (na rota)</th><th>Pre\u00e7o</th></tr>\n    <tr><td>Ampelm\u00e4nnchen</td><td>O boneco do sem\u00e1foro da Alemanha Oriental, que sobreviveu \u00e0 reunifica\u00e7\u00e3o por campanha popular. \u00cdm\u00e3, caneca, camiseta, gomas.</td><td>Loja Ampelmann dentro dos Hackesche H\u00f6fe (qui, at\u00e9 21h).</td><td>\u20ac3\u201325</td></tr>\n    <tr><td>Balas da Bonbonmacherei</td><td>Feitas \u00e0 m\u00e3o numa m\u00e1quina de antes da guerra, num por\u00e3o de p\u00e1tio. Saquinho de sabores (folha de maio, cola, framboesa).</td><td>Oranienburger Str. 32, nos Heckmann-H\u00f6fe, 8 min dos Hackesche H\u00f6fe. <b>S\u00f3 qua\u2013s\u00e1b 12h\u201319h</b>: quinta.</td><td>\u20ac4\u20138</td></tr>\n    <tr><td>Barra Ritter Sport personalizada</td><td>Voc\u00eas escolhem o chocolate e tr\u00eas recheios; fica pronta em 30 min. Sabores s\u00f3 de Berlim.</td><td>Ritter Sport Bunte Schokowelt, Friedrichstra\u00dfe 83: desvio de 5 min da Unter den Linden na quinta. Fecha domingo; feriado, fechada.</td><td>\u20ac6\u201312</td></tr>\n    <tr><td>Fotos do Photoautomat</td><td>Tira de 4 fotos preto e branco, qu\u00edmica de verdade, 5 min para revelar. A lembran\u00e7a mais barata e mais Berlim.</td><td>Cabines na Warschauer Stra\u00dfe (s\u00e1b) e na Kastanienallee (dom). <b>S\u00f3 moedas</b>: \u20ac2\u20134.</td><td>\u20ac2\u20134</td></tr>\n    <tr><td>Curry ketchup</td><td>A garrafa do molho da Curry 36.</td><td>No balc\u00e3o da Curry 36.</td><td>\u20ac4</td></tr>\n    <tr><td>Vinil e livro</td><td>Berlim \u00e9 a capital do vinil de segunda m\u00e3o da Europa.</td><td>Feira do Mauerpark (dom, pechinchar); Dussmann (Friedrichstra\u00dfe 90, qui at\u00e9 0h) para novos e uma se\u00e7\u00e3o de livros em ingl\u00eas de 4 andares.</td><td>\u20ac5\u201330</td></tr>\n    <tr><td>Achados de feira</td><td>Ex-RDA: canecas, c\u00e2meras, broches, p\u00f4steres, roupas. Quase tudo em dinheiro.</td><td>Feira do Mauerpark, dom 10h\u201318h. Chegar antes das 12h para os bons.</td><td>\u20ac2\u201340</td></tr>\n    <tr><td>Comida do KaDeWe</td><td>O 6\u00ba andar do KaDeWe \u00e9 a maior se\u00e7\u00e3o de comida da Europa: mostarda, chocolate, biscoito, ch\u00e1, em embalagem de presente.</td><td>Tauentzienstra\u00dfe 21, seg\u2013s\u00e1b at\u00e9 20h. Fora da rota; encaixa na volta de Potsdam na sexta (S7 at\u00e9 Zoologischer Garten, 5 min a p\u00e9). Fechado s\u00e1b 03 e dom 04.</td><td>\u20ac5\u201330</td></tr>\n  </table></div>\n  <div class=\"warn\">\"Peda\u00e7o do Muro\" em lojinha de souvenir: quase sempre concreto pintado. Se quiserem um, s\u00f3 na loja do Mauermuseum (Checkpoint Charlie) ou do Memorial do Muro, com certificado; ainda assim, \u00e9 f\u00e9.</div>\n</section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que s\u00f3 existem aqui</h2>\n\n  <div class=\"shop\"><b>Loja Ampelmann, Hackesche H\u00f6fe</b><small>Rosenthaler Str. 40-41 \u00b7 qui at\u00e9 21h \u00b7 dom 13h\u201318h</small>\n    <p>Dentro do p\u00e1tio 5 dos H\u00f6fe, atr\u00e1s de um t\u00fanel com sem\u00e1foros pequenos. A \u00fanica marca de souvenir de Berlim que os berlinenses acham engra\u00e7ada.</p></div>\n\n  <div class=\"shop\"><b>Bonbonmacherei</b><small>Oranienburger Str. 32, no por\u00e3o dos Heckmann-H\u00f6fe \u00b7 qua\u2013s\u00e1b 12h\u201319h</small>\n    <p>Um casal fazendo bala na frente de voc\u00eas, com prova gr\u00e1tis. Quinta, no fim da tarde.</p>\n    <details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">As balas s\u00e3o feitas ao vivo numa m\u00e1quina de cobre de 1900, a mesma t\u00e9cnica artesanal desde ent\u00e3o.</div></details></div>\n\n  <div class=\"shop\"><b>Dussmann das KulturKaufhaus</b><small>Friedrichstra\u00dfe 90 \u00b7 seg\u2013s\u00e1b at\u00e9 meia-noite</small>\n    <p>Livraria de 4 andares aberta at\u00e9 meia-noite, com instrumentos, vinis, partituras, papelaria e uma sala de escuta audi\u00f3fila. Um andar inteiro em ingl\u00eas. Nota 4,8 em 22 mil avalia\u00e7\u00f5es.</p></div>\n\n  <div class=\"shop\"><b>Ritter Sport Bunte Schokowelt</b><small>Friedrichstra\u00dfe 83 \u00b7 seg\u2013s\u00e1b 10h\u201318h30</small>\n    <p>A loja da marca dos quadradinhos: parede com todos os sabores, fonte de chocolate e a bancada de montar a barra.</p></div>\n\n  <div class=\"shop\"><b>KaDeWe</b><small>Tauentzienstra\u00dfe 21-24 \u00b7 seg\u2013s\u00e1b 10h\u201320h</small>\n    <p>Vale por um andar: o 6\u00ba, de comida, com bar de ostras e champanhe no meio. S\u00f3 na sexta, se sobrar energia depois de Potsdam.</p>\n    <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Aberta em 1907, \u00e9 a maior loja de departamentos da Europa continental \u2014 sobreviveu a dois inc\u00eandios na Segunda Guerra e foi reconstru\u00edda pe\u00e7a por pe\u00e7a.</div></details></div>\n\n  <div class=\"shop\"><b>Feira do Mauerpark</b><small>Bernauer Str. 63 \u00b7 domingo 10h\u201318h</small>\n    <p>O maior flohmarkt da cidade sobre a antiga faixa da morte do Muro: velharias da RDA, vinil, roupa, artesanato e comida de rua. Dinheiro, notas pequenas, e pechincha esperada.</p></div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">Qui: Ampelmann \u00b7 Bonbonmacherei \u00b7 Apple \u00b7 Dussmann/Ritter (desvio 5 min)</span>\n    <span class=\"chip\">Sex \u00e0 noite: KaDeWe (opcional)</span>\n    <span class=\"chip\">S\u00e1b feriado: s\u00f3 Photoautomat e Sp\u00e4tis</span>\n    <span class=\"chip\">Dom: feira do Mauerpark</span>\n  </div>\n</section>\n\n\n</div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"berlim-1\": [{\"t\": \"A p\u00e9 \u00b7 Potsdamer Platz \u2192 Port\u00e3o de Brandemburgo\", \"d\": \"~10 min pela Ebertstra\u00dfe (antes: U2 Gleisdreieck \u2192 Potsdamer Platz, 1 parada).\"}, {\"t\": \"A p\u00e9 \u00b7 Port\u00e3o \u2192 Memorial do Holocausto\", \"d\": \"Poucos passos.\"}, {\"t\": \"A p\u00e9 \u00b7 Port\u00e3o \u2192 Reichstag\", \"d\": \"Poucos minutos. C\u00fapula \u00e0s 11h.\"}, {\"t\": \"A p\u00e9 (ou \u00f4nibus 100) \u00b7 Unter den Linden \u2192 Ilha dos Museus\", \"d\": \"~25 min a p\u00e9; ou \u00f4nibus 100 na parada Reichstag/Bundestag, passeio panor\u00e2mico.\"}, {\"t\": \"A p\u00e9 \u00b7 Ilha dos Museus \u2192 Hackesche H\u00f6fe\", \"d\": \"~10 min. A Apple Store \u00e9 a porta ao lado.\"}, {\"t\": \"A p\u00e9 \u00b7 Hackesche H\u00f6fe \u2192 Alexanderplatz\", \"d\": \"Poucos minutos.\"}, {\"t\": \"U2 \u00b7 Alexanderplatz \u2192 hotel (Gleisdreieck)\", \"d\": \"Sentido Ruhleben, 6 paradas, ~15 min, direto.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">\u00d7</button><span class=\"num\">'+n+'</span><h4>'+item.t+'</h4><p>'+item.d+'</p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var zoropaUtterance = null;\n  function zoropaSpeak(text, lang, btn){\n    var w = window;\n    try{ if (window.parent && window.parent !== window && window.parent.speechSynthesis) w = window.parent; }catch(e){ w = window; }\n    var synth = w.speechSynthesis;\n    if (!synth){ alert('Seu navegador n\u00e3o suporta leitura em voz alta.'); return; }\n    try{ if (synth.speaking || synth.pending) synth.cancel(); }catch(e){}\n    var U = w.SpeechSynthesisUtterance || window.SpeechSynthesisUtterance;\n    var u = new U(text);\n    zoropaUtterance = u;\n    try{ w.__zoropaUtterance = u; }catch(e){}\n    u.lang = lang; u.rate = 0.85; u.volume = 1; u.pitch = 1;\n    try{\n      var voices = synth.getVoices() || [];\n      var pref = lang.split('-')[0].toLowerCase();\n      var v = null;\n      for (var i = 0; i < voices.length; i++){ if ((voices[i].lang||'').toLowerCase() === lang.toLowerCase()){ v = voices[i]; break; } }\n      if (!v){ for (var j = 0; j < voices.length; j++){ if ((voices[j].lang||'').toLowerCase().indexOf(pref) === 0){ v = voices[j]; break; } } }\n      if (v) u.voice = v;\n    }catch(e){}\n    if (btn){\n      u.onstart = function(){ btn.textContent = '\ud83d\udd08'; };\n      u.onend = function(){ btn.textContent = '\ud83d\udd0a'; };\n    }\n    u.onerror = function(ev){\n      if (btn) btn.textContent = '\ud83d\udd0a';\n      alert('N\u00e3o consegui tocar o \u00e1udio (erro: ' + (ev && ev.error ? ev.error : 'desconhecido') + ').');\n    };\n    synth.speak(u);\n  }\n  window.zoropaSpeak = zoropaSpeak;\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n    if (e.data && typeof e.data.zoropaJump === 'string'){\n      var jt = document.getElementById(e.data.zoropaJump);\n      if (jt) sendScroll(jt);\n      return;\n    }\n    if (!e.data || typeof e.data.zoropaSearch !== 'string') return;\n    var q = e.data.zoropaSearch.toLowerCase();\n    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);\n    var node, target = null;\n    while ((node = walker.nextNode())){\n      var nv = node.nodeValue ? node.nodeValue.replace(/\\s+/g,' ') : '';\n      if (nv && nv.toLowerCase().indexOf(q) !== -1){\n        var p = node.parentElement;\n        if (p && p.closest('script,style')) continue;\n        target = p; break;\n      }\n    }\n    if (!target) return;\n    var det = target.closest('details');\n    if (det && !det.open) det.open = true;\n    sendScroll(target);\n    var prevBg = target.style.backgroundColor, prevTr = target.style.transition;\n    target.style.transition = 'background-color .3s';\n    target.style.backgroundColor = 'rgba(245,197,24,.55)';\n    setTimeout(function(){ target.style.backgroundColor = prevBg; setTimeout(function(){ target.style.transition = prevTr; }, 350); }, 1400);\n  });\nif (window.parent && window.parent !== window){\n    var nj = document.querySelector('nav.jump'); if (nj) nj.style.display = 'none';\n  }\n  document.querySelectorAll('nav.jump a[href^=\"#\"]').forEach(function(a){\n    a.addEventListener('click', function(ev){\n      var el = document.getElementById(a.getAttribute('href').slice(1));\n      if(!el) return;\n      ev.preventDefault();\n      if(!sendScroll(el)) el.scrollIntoView({behavior:'smooth', block:'start'});\n    });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  var KEYP='zoropa-pend-', LOCKK='zoropa-pend-lock';\n  var boxes=Array.prototype.slice.call(document.querySelectorAll('.pend input[data-pend]'));\n  var lockBtn=document.getElementById('pendLock'), countEl=document.getElementById('pendCount');\n  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }\n  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }\n  function locked(){ return get(LOCKK)==='1'; }\n  function render(){\n    var done=0;\n    boxes.forEach(function(b){ b.disabled=locked(); if(b.checked) done++; });\n    if(countEl) countEl.textContent=done+' de '+boxes.length+' feitos';\n    if(lockBtn) lockBtn.textContent=locked()?'\ud83d\udd12 destravar lista':'\ud83d\udd13 travar lista';\n  }\n  boxes.forEach(function(b){\n    b.checked=get(KEYP+b.getAttribute('data-pend'))==='1';\n    b.addEventListener('change',function(){ set(KEYP+b.getAttribute('data-pend'), b.checked?'1':'0'); render(); });\n  });\n  if(lockBtn) lockBtn.addEventListener('click',function(){ set(LOCKK, locked()?'0':'1'); render(); });\n  render();\n})();\n<\/script>\n</body>\n</html>\n";
const HTML_POTSDAM = "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>zoropa \u00b7 Potsdam \u2014 guia de bolso</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,600;9..144,700,100&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#FFFFFF; --ink:#101828; --muted:#5B6472; --line:#DCE1E8;\n  --azul:#1E5A3A; --azul-esc:#0F3A24; --azul-tint:#E7F1EA;\n  --amarelo:#C9A227; --amarelo-tint:#F7EFD2;\n  --ok:#1B7F4C; --ok-tint:#E4F5EA; --alerta:#B54708; --alerta-tint:#FDF0E1;\n  --card:#F7F8FA;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;\n    --azul:#8CCFA6; --azul-esc:#BFE6CD; --azul-tint:#16302A;\n    --amarelo:#C9A227; --amarelo-tint:#3A2F10;\n    --ok:#6CCB92; --ok-tint:#13301F; --alerta:#F0A25A; --alerta-tint:#3A2510;\n    --card:#141F33;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;\n  --azul:#8CCFA6; --azul-esc:#BFE6CD; --azul-tint:#16302A;\n  --amarelo:#C9A227; --amarelo-tint:#3A2F10;\n  --ok:#6CCB92; --ok-tint:#13301F; --alerta:#F0A25A; --alerta-tint:#3A2510;\n  --card:#141F33;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Public Sans\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{font-family:\"Fraunces\",\"Georgia\",serif;font-variation-settings:\"SOFT\" 100;line-height:1.15;margin:0}\nh1{font-size:2.4rem;font-weight:700;letter-spacing:-.01em}\nh2{font-size:1.7rem;font-weight:600;margin:0 0 .4rem}\nh3{f
