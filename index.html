b\u00e9m. O jantar especial de ter\u00e7a precisa de outro lugar; as tr\u00eas op\u00e7\u00f5es est\u00e3o abaixo, em \"Jantar \u00b7 ter 29/09\". N\u00e3o liguem para reservar l\u00e1.</div>\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pend\u00eancias e reservas</h2>\n  <div class=\"note\"><b>Lista compartilhada:</b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccb abrir a planilha \"Pend\u00eancias zoropa 2026\"</a> \u2014 \u00e9 a vers\u00e3o oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe t\u00eam edi\u00e7\u00e3o). As caixinhas abaixo s\u00e3o s\u00f3 um espelho r\u00e1pido neste aparelho.</div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"></span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">\ud83d\udd13 travar lista</button></div>\n  <h3>O que ainda falta</h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-0\"> <span class=\"pend-what\">Van Gogh Museum: ingresso com hor\u00e1rio (s\u00f3 online, esgota)</span> <span class=\"pend-when\">para seg 28/09 de manh\u00e3 \u00b7 comprar agora</span> <span class=\"pend-how\">vangoghmuseum.nl</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-1\"> <span class=\"pend-what\">Avisar o Inntel por e-mail: chegada ~00:30 de 28/09</span> <span class=\"pend-when\">at\u00e9 s\u00e1b 26/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-2\"> <span class=\"pend-what\">Definir o cart\u00e3o OVpay de cada um (um s\u00f3, sem trocar)</span> <span class=\"pend-when\">antes do primeiro bonde, seg 28/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-3\"> <span class=\"pend-what\">Apps 9292 e NS instalados + mapa offline (Amsterdam e Zaandam)</span> <span class=\"pend-when\">at\u00e9 s\u00e1b 26/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"amsterdam-4\"> <span class=\"pend-what\">Conferir plataforma do ICE 241 no DB Navigator</span> <span class=\"pend-when\">qua 30/09, 15:00</span> <span class=\"pend-how\">bilhete diz 5a; pode mudar</span></label></li>\n  </ul>\n  <h3>Reservas e documentos</h3>\n  <p class=\"lead\">Os PDFs est\u00e3o no Drive da conta bexorxe (privados: quem n\u00e3o estiver logado nela v\u00ea \"pedir acesso\"). \ud83d\udccd abre o lugar no Maps.</p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">Inntel Hotels Amsterdam Zaandam</span> <span class=\"pend-when\">dom 27/09 \u2192 qua 30/09 \u00b7 check-in ~00:30 de 28/09, recep\u00e7\u00e3o 24 h</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1-Ad5k7HpItHV2HvL8qnQNYyQY-dfRUzv/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 reserva</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Inntel%20Hotels%20Amsterdam%20Zaandam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Casa de Anne Frank</span> <span class=\"pend-when\">seg 28/09 19:15 \u00b7 chegar 15 min antes</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1WUSSq-hTXktBL4q95irdV-n8JnGnQrFY/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 ingressos</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Anne%20Frank%20House%2C%20Amsterdam\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">ICE 241 \u00b7 Amsterdam Centraal \u2192 Berlin Hbf</span> <span class=\"pend-when\">qua 30/09 16:00 \u2192 21:43 \u00b7 plataforma 5a \u00b7 2\u00aa classe</span> <span class=\"pend-leave\">\ud83d\udd50 sa\u00edda sugerida do Albert Cuyp / De Pijp: 14:50 (metr\u00f4 52 at\u00e9 Centraal, ~12 min + folga para achar a plataforma)</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/13QJRzvIKHZGfCm3lpXwjtj9DU3JgyC1V/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 bilhete</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Amsterdam%20Centraal\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n  </ul>\n</section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar</h2>\n  <p class=\"lead\">Amsterdam \u00e9 a cidade mais f\u00e1cil da viagem: <b>n\u00e3o existe bilhete para comprar</b>. O cart\u00e3o de banco por aproxima\u00e7\u00e3o (ou o celular com Apple/Google Pay) \u00e9 o bilhete, no trem, no bonde, no metr\u00f4 e no \u00f4nibus. O sistema chama-se OVpay. A \u00fanica regra que importa \u00e9 encostar ao entrar <b>e ao sair</b>.</p>\n\n  <h3>Antes de sair do Brasil</h3>\n  <ol class=\"steps\">\n    <li><b>Decidam qual cart\u00e3o \u00e9 \"o cart\u00e3o de transporte\" de cada um</b> e n\u00e3o mudem durante a estadia. O sistema cobra pelo par entrada+sa\u00edda do mesmo cart\u00e3o. Se entrar com o f\u00edsico e sair com o celular, cobra tarifa cheia duas vezes. Um cart\u00e3o por pessoa; dois n\u00e3o passam com o mesmo.</li>\n    <li><b>Instalem o app 9292</b> (planejador de rotas de toda a Holanda, em ingl\u00eas) e o <b>NS</b> (trens: hor\u00e1rios ao vivo e a plataforma). O Google Maps funciona bem aqui tamb\u00e9m.</li>\n    <li><b>Baixem o mapa offline</b> de Amsterdam e Zaandam.</li>\n    <li><b>Avisem o Inntel</b> por e-mail que chegam por volta de 00:30 do dia 28: a recep\u00e7\u00e3o \u00e9 24 h, mas o aviso evita a surpresa.</li>\n  </ol>\n\n  <h3>Chegada, dom 27/09, 23:50, Centraal</h3>\n  <ol class=\"steps\">\n    <li><b>Des\u00e7a do Eurostar e siga \"Uitgang/Exit\" para as plataformas dos trens NS</b>, no mesmo pr\u00e9dio. Pain\u00e9is azuis. Procure um Sprinter com destino Uitgeest, Hoorn ou Zaandam; todos param em Zaandam (2\u00aa ou 3\u00aa parada, ~12 min).</li>\n    <li><b>Encoste o cart\u00e3o no totem branco e amarelo do NS na plataforma</b> (ou na catraca). Ele apita e mostra \"check-in\". Em Zaandam, encoste de novo na sa\u00edda: \"check-out\". ~\u20ac3,50 cada.</li>\n    <li><b>Confira no app NS o \u00faltimo trem antes de embarcar no Eurostar em Paris.</b> Em domingo \u00e0 noite os Sprinters para Zaandam rodam at\u00e9 por volta de 00:30, mas o hor\u00e1rio muda. Se n\u00e3o houver: Uber/Bolt na sa\u00edda da esta\u00e7\u00e3o, lado do IJ, ~\u20ac40, 20 min.</li>\n    <li><b>O Inntel fica ao lado da esta\u00e7\u00e3o de Zaandam</b> (o pr\u00e9dio de casinhas verdes empilhadas; n\u00e3o tem como errar). 3 min a p\u00e9.</li>\n  </ol>\n\n  <h3>Como funciona na pr\u00e1tica</h3>\n  <ol class=\"steps\">\n    <li><b>Trem (NS):</b> check-in no totem ou catraca <b>do NS</b> antes de subir, check-out ao sair. Tarifa por dist\u00e2ncia. Esquecer o check-out cobra ~\u20ac20.</li>\n    <li><b>Bonde, metr\u00f4, \u00f4nibus (GVB):</b> os leitores ficam <b>dentro</b> do ve\u00edculo (bonde/\u00f4nibus) ou na catraca (metr\u00f4). Encoste ao entrar e ao descer. ~\u20ac3,40 por viagem, com baldea\u00e7\u00e3o gr\u00e1tis em 35 min.</li>\n    <li><b>NS e GVB s\u00e3o empresas diferentes.</b> Chegando de trem para pegar o bonde: check-out NS, depois check-in GVB. Duas \"bipadas\".</li>\n    <li><b>Ferry (pont) atr\u00e1s da Centraal:</b> gr\u00e1tis, sem encostar nada. \u00c9 s\u00f3 entrar com os pedestres e as bikes.</li>\n    <li><b>Bilhete GVB de 24h (~\u20ac10)</b> s\u00f3 compensa com 4 ou mais viagens de bonde no mesmo dia. Segunda-feira voc\u00eas t\u00eam 3 (bonde ao Van Gogh, bonde \u00e0 Anne Frank, talvez um a mais): n\u00e3o compensa. Fiquem no OVpay.</li>\n    <li><b>Bike (ter\u00e7a):</b> pedale pela direita, na faixa vermelha; bra\u00e7o estendido para virar; nunca pare em cima da ciclovia; tranque sempre; e cruze trilho de bonde em \u00e2ngulo reto, sen\u00e3o a roda entra na fenda.</li>\n    <li><b>Pagar no com\u00e9rcio:</b> \"pinnen\" = pagar com cart\u00e3o. Muitos lugares <b>n\u00e3o aceitam dinheiro</b>, e o supermercado Albert Heijn <b>n\u00e3o aceita cart\u00e3o de cr\u00e9dito de fora da UE</b>: usem o cart\u00e3o de d\u00e9bito global (Wise/Revolut) ou dinheiro l\u00e1.</li>\n  </ol>\n\n  <h3>Trecho a trecho</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Quando</th><th>Trecho</th><th>Como</th><th>Tempo</th></tr>\n    <tr><td>seg 09:00</td><td>Zaandam \u2192 Centraal</td><td>trem NS, check-in NS</td><td>12 min</td></tr>\n    <tr><td>seg 09:30\u201311:00</td><td>Damrak \u2192 Dam \u2192 Begijnhof \u2192 Bloemenmarkt</td><td>a p\u00e9, tudo em linha reta para o sul</td><td>25 min somados</td></tr>\n    <tr><td>seg 11:15</td><td>Bloemenmarkt \u2192 Van Gogh</td><td>bonde 2 ou 12 na parada Koningsplein, descer em Rijksmuseum (check-in GVB)</td><td>10 min</td></tr>\n    <tr><td>seg 13:30\u201316:30</td><td>Van Gogh \u2192 Vondelpark \u2192 barco \u2192 Jordaan</td><td>a p\u00e9 (5 min ao parque; 20 min do Rijksmuseum ao Jordaan)</td><td></td></tr>\n    <tr><td>seg 19:05</td><td>Jordaan \u2192 Anne Frank</td><td>a p\u00e9: fica no Jordaan, 5 min do 't Smalle</td><td>5 min</td></tr>\n    <tr><td>seg 22:30</td><td>Red Light \u2192 Centraal \u2192 Zaandam</td><td>a p\u00e9 10 min + trem</td><td>25 min</td></tr>\n    <tr><td>ter 09:15</td><td>Zaandam \u2192 Zaanse Schans</td><td>trem 1 parada (Zaandijk Zaanse Schans, sentido Uitgeest) + 15 min a p\u00e9 cruzando a ponte; ou bike ~20 min pelo rio</td><td>20 min</td></tr>\n    <tr><td>ter 14:30</td><td>Zaandam \u2192 Centraal</td><td>trem</td><td>12 min</td></tr>\n    <tr><td>ter 15:00</td><td>Centraal \u2192 NDSM</td><td>ferry F4, cais atr\u00e1s da esta\u00e7\u00e3o (lado do IJ), gr\u00e1tis</td><td>15 min</td></tr>\n    <tr><td>ter 16:30</td><td>NDSM \u2192 Scheepvaartmuseum</td><td>ferry de volta + a p\u00e9 20 min pela orla, ou \u00f4nibus 22</td><td>35 min</td></tr>\n    <tr><td>ter 18:15</td><td>\u2192 jantar (Moeders/Pantry)</td><td>bonde 13/17 at\u00e9 Westermarkt (Moeders) ou 2/12 at\u00e9 Leidseplein (Pantry)</td><td>15 min</td></tr>\n    <tr><td>qua 10:00</td><td>Zaandam \u2192 Centraal (malas nos arm\u00e1rios)</td><td>trem; arm\u00e1rios \"Lockers\" na esta\u00e7\u00e3o, pagamento s\u00f3 com cart\u00e3o, ~\u20ac10\u201315 o dia</td><td>12 min</td></tr>\n    <tr><td>qua 10:45</td><td>Centraal \u2192 De Pijp</td><td>metr\u00f4 52 sentido Zuid, 3 paradas; check-in GVB na catraca</td><td>6 min</td></tr>\n    <tr><td>qua 15:30</td><td>ICE 241 para Berlim</td><td>plataforma 5a; bilhete DB no celular + passaporte; sem check-in OVpay (\u00e9 bilhete internacional)</td><td>5h43</td></tr>\n  </table></div>\n\n  <h3 id=\"glossario\">Gloss\u00e1rio</h3>\n  <dl class=\"gloss\">\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('OVpay','nl-NL',this)\" aria-label=\"Ouvir OVpay\">\ud83d\udd0a</button> OVpay</dt><dd>Pagar o transporte encostando cart\u00e3o de banco ou celular. Vale em todo o pa\u00eds.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Inchecken / uitchecken','nl-NL',this)\" aria-label=\"Ouvir Inchecken / uitchecken\">\ud83d\udd0a</button> Inchecken / uitchecken</dt><dd>Encostar ao entrar / ao sair. A palavra que os avisos sonoros repetem.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('NS','nl-NL',this)\" aria-label=\"Ouvir NS\">\ud83d\udd0a</button> NS</dt><dd>A ferrovia nacional. Trens amarelos e azuis. Sprinter para em tudo; Intercity s\u00f3 nas grandes.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('GVB','nl-NL',this)\" aria-label=\"Ouvir GVB\">\ud83d\udd0a</button> GVB</dt><dd>A empresa municipal: bondes, metr\u00f4, \u00f4nibus e ferries de Amsterdam.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Pont / veer','nl-NL',this)\" aria-label=\"Ouvir Pont / veer\">\ud83d\udd0a</button> Pont / veer</dt><dd>Ferry. O F4 vai ao NDSM; o F3 a Buiksloterweg (o mais curto, 3 min, se quiserem s\u00f3 a travessia).</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Fietspad','nl-NL',this)\" aria-label=\"Ouvir Fietspad\">\ud83d\udd0a</button> Fietspad</dt><dd>Ciclovia. Asfalto vermelho. As bikes t\u00eam prefer\u00eancia e n\u00e3o param.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Gracht','nl-NL',this)\" aria-label=\"Ouvir Gracht\">\ud83d\udd0a</button> Gracht</dt><dd>Canal. Prinsengracht, Herengracht, Keizersgracht: os tr\u00eas an\u00e9is.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Bruin caf\u00e9','nl-NL',this)\" aria-label=\"Ouvir Bruin caf\u00e9\">\ud83d\udd0a</button> Bruin caf\u00e9</dt><dd>\"Caf\u00e9 marrom\": bar antigo de madeira escura, cerveja e petisco. O do roteiro \u00e9 o 't Smalle.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Bitterballen','nl-NL',this)\" aria-label=\"Ouvir Bitterballen\">\ud83d\udd0a</button> Bitterballen</dt><dd>Bolinhas fritas de ragu de carne, com mostarda. O petisco nacional.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Borrel','nl-NL',this)\" aria-label=\"Ouvir Borrel\">\ud83d\udd0a</button> Borrel</dt><dd>A hora do aperitivo com petiscos, fim de tarde. \"Borrelplank\" \u00e9 a t\u00e1bua.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Pinnen','nl-NL',this)\" aria-label=\"Ouvir Pinnen\">\ud83d\udd0a</button> Pinnen</dt><dd>Pagar com cart\u00e3o. \"Alleen pinnen\" = s\u00f3 cart\u00e3o, sem dinheiro.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Coffeeshop','nl-NL',this)\" aria-label=\"Ouvir Coffeeshop\">\ud83d\udd0a</button> Coffeeshop</dt><dd>Loja licenciada de cannabis. Caf\u00e9 de caf\u00e9 chama-se \"koffiehuis\" ou \"caf\u00e9\".</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Gezellig','nl-NL',this)\" aria-label=\"Ouvir Gezellig\">\ud83d\udd0a</button> Gezellig</dt><dd>Aconchegante, agrad\u00e1vel, a palavra que os holandeses dizem n\u00e3o ter tradu\u00e7\u00e3o. Um bruin caf\u00e9 cheio numa noite fria \u00e9 gezellig.</dd></div>\n  </dl>\n\n  <h3>Como se fala</h3>\n  <div class=\"note\"><span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Gracht','nl-NL',this)\" aria-label=\"Ouvir Gracht\">\ud83d\udd0a</button> <b>Gracht</b> \u2014 <i>rr\u00e1kht (o \"kh\" \u00e9 gutural, tipo pigarro)</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Gezellig','nl-NL',this)\" aria-label=\"Ouvir Gezellig\">\ud83d\udd0a</button> <b>Gezellig</b> \u2014 <i>rr\u00ea-Z\u00c9-luerkh</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Bitterballen','nl-NL',this)\" aria-label=\"Ouvir Bitterballen\">\ud83d\udd0a</button> <b>Bitterballen</b> \u2014 <i>BI-ter-ba-len</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Borrel','nl-NL',this)\" aria-label=\"Ouvir Borrel\">\ud83d\udd0a</button> <b>Borrel</b> \u2014 <i>B\u00d3-rel</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Fietspad','nl-NL',this)\" aria-label=\"Ouvir Fietspad\">\ud83d\udd0a</button> <b>Fietspad</b> \u2014 <i>FITS-pat</i></span> \u00b7 <span class=\"say\"><button class=\"say-btn\" onclick=\"zoropaSpeak('Pinnen','nl-NL',this)\" aria-label=\"Ouvir Pinnen\">\ud83d\udd0a</button> <b>Pinnen</b> \u2014 <i>PI-nen</i></span></div>\n\n  <h3>Frases \u00fateis</h3>\n  <ul class=\"phrases\">\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hallo','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Hallo</b> \u2014 <i>HA-l\u00f4 (ol\u00e1)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Goedemorgen','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Goedemorgen</b> \u2014 <i>RRU-de-m\u00f3r-rren (bom dia)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Dank u wel','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Dank u wel</b> \u2014 <i>dank \u00fc V\u00c9L (muito obrigada)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Alstublieft','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Alstublieft</b> \u2014 <i>als-t\u00fc-BLIFT (por favor / aqui est\u00e1)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Sorry','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Sorry</b> \u2014 <i>S\u00d3-ri (desculpe / com licen\u00e7a)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Spreekt u Engels?','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Spreekt u Engels?</b> \u2014 <i>spr\u00eakt \u00fc \u00c9N-guels (fala ingl\u00eas?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Ik begrijp het niet','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Ik begrijp het niet</b> \u2014 <i>ik be-RR\u00caIP het NIT (n\u00e3o entendo)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Waar is het toilet?','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Waar is het toilet?</b> \u2014 <i>v\u00e1r is het tua-L\u00c9T (onde \u00e9 o banheiro?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Hoeveel kost dit?','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Hoeveel kost dit?</b> \u2014 <i>RU-v\u00eal k\u00f3st dit (quanto custa isso?)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Mag ik de rekening?','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Mag ik de rekening?</b> \u2014 <i>mahk ik de R\u00ca-ke-ning (a conta, por favor)</i></li>\n    <li><button class=\"say-btn\" onclick=\"zoropaSpeak('Twee, alstublieft','nl-NL',this)\" aria-label=\"Ouvir\">\ud83d\udd0a</button> <b>Twee, alstublieft</b> \u2014 <i>tv\u00ea als-t\u00fc-BLIFT (dois, por favor)</i></li>\n  </ul>\n\n  <h3>Apps: qual e por qu\u00ea</h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">\ud83e\udded</div><div><b>9292</b><span>Rotas em toda a Holanda com trem, bonde, ferry e \u00f4nibus juntos. O \u00fanico que voc\u00eas precisam para \"como vou\".</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83d\ude86</div><div><b>NS</b><span>Hor\u00e1rios dos trens ao vivo, plataforma e o \u00faltimo Sprinter para Zaandam. Tamb\u00e9m mostra atrasos.</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83d\udcb3</div><div><b>OVpay</b><span>Opcional: mostra cada viagem cobrada no cart\u00e3o. \u00datil para conferir se o check-out foi registrado.</span></div></div>\n  </div>\n\n  <h3>Quanto custa</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Item</th><th>Os dois</th></tr>\n    <tr><td>Trem Zaandam \u2194 Centraal, 6 idas/voltas</td><td>~\u20ac42</td></tr>\n    <tr><td>Bondes e metr\u00f4, ~7 viagens</td><td>~\u20ac24</td></tr>\n    <tr><td>Ferries</td><td>\u20ac0</td></tr>\n    <tr><td>Bike em Zaandam, 1 dia</td><td>\u20ac25\u201330</td></tr>\n    <tr><td>Arm\u00e1rios na Centraal</td><td>\u20ac10\u201315</td></tr>\n    <tr><td><b>Total transporte em Amsterdam</b></td><td><b>~\u20ac100\u2013110</b></td></tr>\n  </table></div>\n</section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia</h2>\n  <p class=\"lead\">Um mapa da regi\u00e3o (Zaandam fica 12 km ao norte) e um zoom do centro com os pontos de segunda, ter\u00e7a \u00e0 noite e quarta. Pontos nas coordenadas reais. Nos quadros do dia, toque no n\u00famero de um trecho para ver como fazer.</p>\n\n  <figure>\n    <svg viewBox=\"0 0 360 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Regi\u00e3o de Amsterdam: Zaandam, Zaanse Schans, NDSM, Centraal, De Pijp\">\n      <path d=\"M0 228 C 100 236, 200 226, 360 216 L360 246 C 200 256, 100 262, 0 254 Z\" class=\"water\"/>\n      <text x=\"300\" y=\"262\" class=\"mg\">o IJ</text>\n      <path d=\"M56 130 C 52 100, 60 60, 64 34\" class=\"canal\" style=\"stroke-width:5\"/>\n      <text x=\"70\" y=\"80\" class=\"mg\">rio Zaan</text>\n      <text x=\"14\" y=\"22\" class=\"mh\">Regi\u00e3o \u00b7 ter 29/09 e liga\u00e7\u00f5es</text>\n\n      <path d=\"M52 120 C 90 160, 200 200, 267 248\" class=\"rail\"/>\n      <text x=\"120\" y=\"176\" class=\"ms\" style=\"fill:var(--amarelo)\">trem 12 min</text>\n      <path d=\"M56 108 L62 44\" class=\"rail\" style=\"opacity:.6\"/>\n      <text x=\"70\" y=\"140\" class=\"ms\">1 parada ou bike 20 min</text>\n      <path d=\"M264 246 C 256 232, 250 216, 248 208\" class=\"ferry\"/>\n      <text x=\"262\" y=\"228\" class=\"ms\" style=\"fill:var(--azul)\">F4 gr\u00e1tis</text>\n      <path d=\"M270 258 L266 296\" class=\"rail\" style=\"opacity:.6\"/><text x=\"276\" y=\"286\" class=\"ms\" style=\"fill:var(--amarelo)\">metr\u00f4 52</text>\n\n  x=\"104\" y=\"76\" class=\"ms\">Grey Area</text>\n      <circle cx=\"88\" cy=\"99\" r=\"4\" class=\"eat\"/><text x=\"94\" y=\"104\" class=\"ms\">Black &amp; Blue \u00b7 De Prins</text>\n      <circle cx=\"86\" cy=\"139\" r=\"4\" class=\"shop\"/><text x=\"36\" y=\"132\" class=\"ms\">Kaaskamer</text>\n      <circle cx=\"191\" cy=\"108\" r=\"6\" class=\"pt\"/><text x=\"198\" y=\"104\" class=\"m\">Red Light</text>\n      <circle cx=\"173\" cy=\"82\" r=\"4\" class=\"shop\"/><text x=\"150\" y=\"70\" class=\"ms\">Tony's</text>\n      <circle cx=\"165\" cy=\"120\" r=\"4\" class=\"shop\"/><text x=\"170\" y=\"132\" class=\"ms\">Wynand Fockink</text>\n      <circle cx=\"210\" cy=\"210\" r=\"6\" class=\"pt\"/><text x=\"218\" y=\"214\" class=\"m\">Magere Brug</text>\n      <circle cx=\"180\" cy=\"198\" r=\"4\" class=\"cs\"/><text x=\"150\" y=\"196\" class=\"ms\" style=\"text-anchor:end\">Boerejongens</text>\n      <circle cx=\"123\" cy=\"154\" r=\"4\" class=\"cs\"/><text x=\"128\" y=\"164\" class=\"ms\">Dampkring \u00b7 Vleminckx (ter)</text>\n      <circle cx=\"130\" cy=\"206\" r=\"4\" class=\"eat\"/><text x=\"20\" y=\"176\" class=\"ms\">The Pantry (ter) \u2193</text>\n      <circle cx=\"118\" cy=\"214\" r=\"4\" class=\"shop\"/><text x=\"8\" y=\"186\" class=\"ms\">Heinen Delft \u2193</text>\n      <circle cx=\"50\" cy=\"128\" r=\"4\" class=\"eat\"/><text x=\"8\" y=\"112\" class=\"ms\">Moeders (ter) \u2190</text>\n      <circle cx=\"159\" cy=\"294\" r=\"6\" class=\"pt\"/><text x=\"167\" y=\"298\" class=\"m\">Albert Cuyp (qua)</text>\n      <circle cx=\"144\" cy=\"304\" r=\"4\" class=\"cs\"/><text x=\"88\" y=\"316\" class=\"ms\">Katsu</text>\n      <circle cx=\"170\" cy=\"304\" r=\"4\" class=\"eat\"/><text x=\"176\" y=\"310\" class=\"ms\">The Butcher \u00b7 Bazar</text>\n      <circle cx=\"307\" cy=\"128\" r=\"5\" class=\"pt\"/><text x=\"240\" y=\"146\" class=\"ms\">Scheepvaartmuseum (ter)</text>\n    <g class=\"r-badge walk\" data-r=\"1\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: A p\u00e9 \u00b7 Centraal \u2192 Dam\" transform=\"translate(174,83)\"><circle r=\"9\"/><text y=\".5\">1</text></g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A p\u00e9 \u00b7 Dam \u2192 Begijnhof\" transform=\"translate(137,133)\"><circle r=\"9\"/><text y=\".5\">2</text></g><g class=\"r-badge walk\" data-r=\"3\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: A p\u00e9 \u00b7 Begijnhof \u2192 Bloemenmarkt\" transform=\"translate(131,164)\"><circle r=\"9\"/><text y=\".5\">3</text></g><g class=\"r-badge transit\" data-r=\"4\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 4: Bonde 2 ou 12 \u00b7 Bloemenmarkt \u2192 Van Gogh\" transform=\"translate(103.3,223.4)\"><circle r=\"9\"/><text y=\".5\">4</text></g><g class=\"r-badge walk\" data-r=\"5\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 5: A p\u00e9 \u00b7 Van Gogh \u2192 Vondelpark\" transform=\"translate(56,247)\"><circle r=\"9\"/><text y=\".5\">5</text></g><g class=\"r-badge walk\" data-r=\"6\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 6: A p\u00e9 \u00b7 Vondelpark \u2192 Jordaan ('t Smalle)\" transform=\"translate(86.1,165.1)\"><circle r=\"9\"/><text y=\".5\">6</text></g><g class=\"r-badge walk\" data-r=\"7\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 7: A p\u00e9 \u00b7 Jordaan \u2192 Anne Frank\" transform=\"translate(136,99)\"><circle r=\"9\"/><text y=\".5\">7</text></g><g class=\"r-badge walk\" data-r=\"8\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 8: A p\u00e9 \u00b7 Anne Frank/Red Light \u2192 Magere Brug\" transform=\"translate(200,158)\"><circle r=\"9\"/><text y=\".5\">8</text></g><g class=\"r-badge walk\" data-r=\"9\" data-map=\"amsterdam-1\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 9: A p\u00e9 + trem NS \u00b7 Red Light \u2192 Centraal \u2192 Zaandam\" transform=\"translate(195,81)\"><circle r=\"9\"/><text y=\".5\">9</text></g></svg>\n    <figcaption>Centro. Segunda desce em linha reta da Centraal ao Bloemenmarkt, pega o bonde ao Van Gogh, e sobe a p\u00e9 pelo Jordaan at\u00e9 a Anne Frank.</figcaption>\n    <div class=\"legend\">\n      <span><i style=\"background:var(--azul)\"></i>ponto do roteiro</span>\n      <span><i style=\"background:var(--amarelo);border:1px solid var(--ink)\"></i>comer</span>\n      <span><i style=\"background:var(--bg);border:2px solid var(--azul)\"></i>loja</span>\n      <span><i style=\"background:var(--ok)\"></i>coffee shop / hotel</span>\n      <span>\u2014 \u2014 a p\u00e9</span>\n      <span><span style=\"color:var(--amarelo);font-weight:900\">\u2501</span> trem/bonde/metr\u00f4</span>\n      <span><span style=\"color:var(--azul);font-weight:900\">\u2505</span> ferry</span>\n    </div>\n  <div class=\"rota-painel\" id=\"rp-amsterdam-1\" aria-live=\"polite\"></div></figure>\n\n  <p>Mapa real de segunda: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Amsterdam+Centraal&destination=Magere+Brug&waypoints=Dam+Square%7CBegijnhof%7CBloemenmarkt%7CVan+Gogh+Museum%7CVondelpark%7CCaf%C3%A9+%27t+Smalle%7CAnne+Frank+House&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir no Google Maps</a>.</p>\n\n  <h3>Sobre os lugares</h3>\n  <div class=\"attractions\">\n    <h4>Casa de Anne Frank</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">A fam\u00edlia Frank se escondeu no \"Anexo Secreto\", atr\u00e1s de uma estante-porta girat\u00f3ria, de julho de 1942 a agosto de 1944 \u2014 dois anos inteiros sem sair. Foram denunciados por algu\u00e9m nunca identificado com certeza at\u00e9 hoje; Anne morreu no campo de Bergen-Belsen semanas antes da liberta\u00e7\u00e3o, aos 15 anos. O pai, Otto Frank, \u00fanico sobrevivente da fam\u00edlia, foi quem publicou o di\u00e1rio dela em 1947, encontrado intacto no ch\u00e3o do esconderijo depois da pris\u00e3o da fam\u00edlia.</div></details><details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">Por escolha da funda\u00e7\u00e3o que administra a casa, os c\u00f4modos do Anexo Secreto ficam sem mob\u00edlia \u2014 como estavam depois da guerra, quando os m\u00f3veis foram removidos pelos nazistas. Otto Frank pediu explicitamente que continuasse assim.</div></details>\n    <h4>Museu Van Gogh</h4><details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">Tem a maior cole\u00e7\u00e3o do mundo de obras de Van Gogh \u2014 mais de 200 pinturas e 500 desenhos \u2014 reunida porque o irm\u00e3o dele, Theo, guardou praticamente tudo que n\u00e3o foi vendido em vida (Van Gogh vendeu s\u00f3 uma pintura enquanto viveu). A cole\u00e7\u00e3o passou de Theo para o filho dele, e depois para o museu, inaugurado em 1973.</div></details>\n    <h4>Zaanse Schans (moinhos)</h4><details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">N\u00e3o \u00e9 uma vila hist\u00f3rica intacta: \u00e9 uma cole\u00e7\u00e3o de moinhos e casas antigas trazidas de outros pontos da regi\u00e3o do rio Zaan e remontadas ali a partir dos anos 1960, para preservar um jeito de vida que estava desaparecendo com a industrializa\u00e7\u00e3o. Os moinhos que ainda funcionam moem especiarias, \u00f3leo e madeira do jeito que faziam h\u00e1 s\u00e9culos \u2014 a regi\u00e3o do Zaan chegou a ter mais de mil moinhos no auge, no s\u00e9culo XVII; hoje restam poucas dezenas.</div></details>\n  </div>\n</section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 op\u00e7\u00f5es por parada</h2>\n  <p class=\"lead\">Holanda almo\u00e7a leve e cedo (sandu\u00edche ao meio-dia) e janta \u00e0s 18\u201319h; cozinha fecha \u00e0s 21h30 em muita casa. Hor\u00e1rios conferidos para segunda, ter\u00e7a e quarta. Pre\u00e7os por pessoa, sem bebida.</p>\n\n  <div class=\"meal\">\n    <h3>Caf\u00e9 da manh\u00e3 \u00b7 todos os dias \u00b7 Zaandam</h3>\n    <p class=\"when\">O Inntel serve buffet. Se n\u00e3o estiver inclu\u00eddo na reserva (confiram), o <b>Albert Heijn</b> ao lado da esta\u00e7\u00e3o de Zaandam resolve por \u20ac5: broodje, suco, iogurte, e a Chimney Cake de segunda-feira abre 7h em Amsterdam.</p>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Piquenique \u00b7 seg 28/09, 13:30 \u00b7 Vondelpark</h3>\n    <p class=\"when\">Os tr\u00eas ficam na Van Baerlestraat, a rua entre o Van Gogh e a entrada do parque, 3\u20135 min a p\u00e9.</p>\n\n    <div class=\"opt pick\"><h4>Albert Heijn, Van Baerlestraat 33 <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Esquina do Museumplein, 3 min do Van Gogh.</span>\n        <b>Por qu\u00ea</b><span>Supermercado grande: sushi feito na hora, sandu\u00edches prontos, queijo, frutas, stroopwafel de pacote. O piquenique mais barato e mais holand\u00eas.</span>\n        <b>Estrela</b><span>Broodje kroket; queijo jong belegen fatiado; suco de laranja da m\u00e1quina.</span>\n        <b>Custo</b><span>\u20ac6\u20139.</span>\n        <b>Hor\u00e1rio</b><span>8h\u201322h. <b>N\u00e3o aceita cart\u00e3o de cr\u00e9dito estrangeiro:</b> d\u00e9bito global ou dinheiro.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Chimney Cake Bakery &amp; Caf\u00e9</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Van Baerlestraat 92a, em frente ao Vondelpark.</span>\n        <b>Por qu\u00ea</b><span>Sandu\u00edche de focaccia e stroopwafel feito na hora, para comer no parque. Dona simp\u00e1tica, pre\u00e7o baixo.</span>\n        <b>Estrela</b><span>Caprese na focaccia; stroopwafel quente.</span>\n        <b>Custo</b><span>\u20ac7\u201310.</span>\n        <b>Hor\u00e1rio</b><span>7h\u201322h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Corner Bakery</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Johannes Vermeerstraat 40, 4 min do Van Gogh.</span>\n        <b>Por qu\u00ea</b><span>Se chover: brunch sentado, panqueca e french toast, caf\u00e9 forte. Pedido por QR code.</span>\n        <b>Estrela</b><span>Guilty Pleasure Brunch; queijo holand\u00eas com p\u00e3o integral.</span>\n        <b>Custo</b><span>\u20ac12\u201318.</span>\n        <b>Hor\u00e1rio</b><span>Seg 9h\u201316h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Borrel \u00b7 seg 28/09, 16:30 \u00b7 Jordaan</h3>\n    <p class=\"when\">Bitterballen com mostarda e uma cerveja pequena, a hora do aperitivo. Os tr\u00eas s\u00e3o bruin caf\u00e9s de verdade, a 5 min a p\u00e9 da Anne Frank.</p>\n\n    <div class=\"opt pick\"><h4>Caf\u00e9 't Smalle <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Egelantiersgracht 12, com terra\u00e7o flutuante no canal.</span>\n        <b>Por qu\u00ea</b><span>Destilaria de 1780 virada bar; o bruin caf\u00e9 que aparece em todo guia por merecimento. Se o sol aparecer, o deque sobre a \u00e1gua \u00e9 o melhor lugar da cidade.</span>\n        <b>Estrela</b><span>Bitterballen; kaassouffl\u00e9 com mel picante; uma jenever.</span>\n        <b>Custo</b><span>\u20ac10\u201315 o borrel.</span>\n        <b>Hor\u00e1rio</b><span>Seg 14h\u20130h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Caf\u00e9 Papeneiland</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Prinsengracht 2, esquina com a Brouwersgracht, 6 min ao norte.</span>\n        <b>Por qu\u00ea</b><span>De 1642, azulejos de Delft e a torta de ma\u00e7\u00e3 que disputa com a do Winkel 43 o t\u00edtulo de melhor da cidade, sem a fila do Winkel.</span>\n        <b>Estrela</b><span>Appeltaart com chantilly; bitterballen.</span>\n        <b>Custo</b><span>\u20ac8\u201314.</span>\n        <b>Hor\u00e1rio</b><span>Seg 10h\u20131h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Caf\u00e9 de Prins</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Prinsengracht 124, em frente \u00e0 Westerkerk, 2 min da Anne Frank.</span>\n        <b>Por qu\u00ea</b><span>Bar de bairro com cozinha at\u00e9 tarde: serve de borrel \u00e0s 16h30 e de plano B para o jantar depois da Anne Frank.</span>\n        <b>Estrela</b><span>Bitterballen; steak-frites com salada.</span>\n        <b>Custo</b><span>\u20ac8\u201320.</span>\n        <b>Hor\u00e1rio</b><span>Seg 10h\u20131h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar leve \u00b7 seg 28/09, 20:30 \u00b7 depois da Anne Frank</h3>\n    <p class=\"when\">Sa\u00edda da Anne Frank por volta de 20:20. A ideia \u00e9 comer em 45 min e seguir para o Red Light e a Magere Brug. Os tr\u00eas ficam a 2\u20133 min da porta.</p>\n\n    <div class=\"opt pick\"><h4>Black and Blue <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Leliegracht 46, 2 min.</span>\n        <b>Por qu\u00ea</b><span>Steakhouse pequeno de canal, r\u00e1pido, com hamb\u00farguer bom para quem n\u00e3o quer cerim\u00f4nia \u00e0s 20h30.</span>\n        <b>Estrela</b><span>Copa lombo (pork collar); hamb\u00farguer; salada de bife.</span>\n        <b>Custo</b><span>\u20ac20\u201330.</span>\n        <b>Hor\u00e1rio</b><span>Seg 11h\u201323h. +31 20 625 0807.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>'t Westerhuys</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Prinsengracht 277, 3 min, com vista da Westerkerk.</span>\n        <b>Por qu\u00ea</b><span>Mesa no canal, salada e prato do dia, sossegado.</span>\n        <b>Estrela</b><span>Salada de beterraba; stamppot.</span>\n        <b>Custo</b><span>\u20ac18\u201325.</span>\n        <b>Hor\u00e1rio</b><span>Seg at\u00e9 22h: pedir at\u00e9 21h15. O servi\u00e7o \u00e9 lento; contar com isso.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Caf\u00e9 de Prins</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Prinsengracht 124, 2 min.</span>\n        <b>Por qu\u00ea</b><span>Se quiserem s\u00f3 um prato r\u00e1pido no balc\u00e3o, sem sair do bruin caf\u00e9.</span>\n        <b>Estrela</b><span>Steak-frites; tosti.</span>\n        <b>Custo</b><span>\u20ac12\u201320.</span>\n        <b>Hor\u00e1rio</b><span>Seg at\u00e9 1h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 ter 29/09, 13:00 \u00b7 Zaanse Schans / Zaandam</h3>\n    <p class=\"when\">Pannenkoeken: a panqueca holandesa, fina e do tamanho do prato, doce ou salgada. As duas primeiras ficam dentro da vila dos moinhos; a terceira, no centro de Zaandam, ao lado do hotel.</p>\n\n    <div class=\"opt pick\"><h4>Restaurant De Kraai <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Kraaienpad 1, no meio da Zaanse Schans, num celeiro antigo.</span>\n        <b>Por qu\u00ea</b><span>A panquecaria da vila: 20 tipos, feitos \u00e0 vista, autosservi\u00e7o, mesas fora com os patos. Bate os \u00f4nibus de turismo se chegarem antes das 12h30.</span>\n        <b>Estrela</b><span>Panqueca de bacon, queijo e cebola; a de stroopwafel com mel e chantilly.</span>\n        <b>Custo</b><span>\u20ac12\u201315.</span>\n        <b>Hor\u00e1rio</b><span>9h\u201318h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>De Hoop op d'Swarte Walvis</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Kalverringdijk 15, \u00e0 beira do rio Zaan, na ponta da vila.</span>\n        <b>Por qu\u00ea</b><span>Restaurante de verdade, com deque sobre a \u00e1gua e o \"prato holand\u00eas\" (sopa de mostarda, croquete, sandu\u00edche aberto) para quem n\u00e3o quer doce ao meio-dia.</span>\n        <b>Estrela</b><span>Dutch lunch plate; ensopado de carne; batata com trufa.</span>\n        <b>Custo</b><span>\u20ac15\u201322.</span>\n        <b>Hor\u00e1rio</b><span>Ter 12h\u201317h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Het Zaanse Pannenkoeken Paleis</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Wilhelminastraat 8, centro de Zaandam, 8 min a p\u00e9 do Inntel.</span>\n        <b>Por qu\u00ea</b><span>Para quem prefere almo\u00e7ar de volta ao hotel antes do trem: poffertjes (as mini-panquecas fofas) elogiados como os melhores da regi\u00e3o, mesas no canal.</span>\n        <b>Estrela</b><span>Poffertjes de morango e banana.</span>\n        <b>Custo</b><span>\u20ac10\u201314.</span>\n        <b>Hor\u00e1rio</b><span>Ter 11h\u201321h.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Lanche \u00b7 ter 29/09, 17:30 \u00b7 centro</h3>\n    <p class=\"when\"><b>Vleminckx</b> (Voetboogstraat 33, ao lado do Spui): batata frita belga em cone com 30 molhos, s\u00f3 para viagem, \u20ac4\u20136, ter at\u00e9 19h; pe\u00e7a \"oorlog\" (maionese + satay + cebola). Stroopwafel na hora: a <b>Van Wonderen</b> (Kalverstraat 190) \u00e9 a famosa do Instagram e divide opini\u00f5es; a barraca do Albert Cuyp na quarta faz melhor e mais barato. No NDSM, o caf\u00e9-restaurante <b>Pllek</b>, feito de cont\u00eaineres na beira do IJ, serve caf\u00e9 e petisco das 9h30 \u00e0 1h.</p>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar especial \u00b7 ter 29/09, 18:30 \u00b7 substitui o Pasta e Basta</h3>\n    <p class=\"when\">J\u00e1 que o dia \u00e9 do Jorge e o jantar era o especial, as tr\u00eas s\u00e3o o que Amsterdam tem de mais pr\u00f3prio: comida holandesa de casa, num sal\u00e3o com personalidade. Reservar hoje.</p>\n\n    <div class=\"opt pick\"><h4>Moeders <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rozengracht 251, na ponta oeste do Jordaan. Bonde 13/17 at\u00e9 Marnixstraat, ou 15 min a p\u00e9 da Anne Frank.</span>\n        <b>Por qu\u00ea</b><span>Comida holandesa como a de av\u00f3 \u2014 o jantar com hist\u00f3ria para contar.</span>\n        <b>Estrela</b><span>T\u00e1bua holandesa (Hollandse rijsttafel: stamppot, hutspot, alm\u00f4ndega, chucrute); a sopa; o pudim.</span>\n        <b>Custo</b><span>\u20ac25\u201335.</span>\n        <b>Hor\u00e1rio</b><span>Ter 17h\u201323h30. <b>Reservar: +31 20 626 7957.</b> Sem reserva a espera passa de 1 h. Levem uma foto impressa da m\u00e3e de cada um: eles penduram.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">\"M\u00e3es\": as paredes s\u00e3o cobertas de fotos de m\u00e3es que os pr\u00f3prios clientes trazem e deixam penduradas \u2014 a cole\u00e7\u00e3o j\u00e1 passa de mil retratos.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>The Pantry</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Leidsekruisstraat 21, perto do Leidseplein. Bonde 2/12 at\u00e9 Leidseplein.</span>\n        <b>Por qu\u00ea</b><span>Sal\u00e3o min\u00fasculo de madeira, menus fixos de 3 pratos holandeses por ~\u20ac32, nota 4,7 em quase 10 mil avalia\u00e7\u00f5es. Metade das mesas \u00e9 reserva, metade fila.</span>\n        <b>Estrela</b><span>Menu 2: sopa, stamppot com salsicha defumada, poffertjes.</span>\n        <b>Custo</b><span>\u20ac28\u201335.</span>\n        <b>Hor\u00e1rio</b><span>Ter 10h30\u201322h30. Reservar: +31 20 620 0922.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Loetje Centraal</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Stationsplein 10, na pr\u00f3pria Centraal, mesa sobre a \u00e1gua.</span>\n        <b>Por qu\u00ea</b><span>O bife holand\u00eas cl\u00e1ssico com molho de manteiga e p\u00e3o para molhar, a 2 min do trem para Zaandam. Era a alternativa do roteiro; continua valendo.</span>\n        <b>Estrela</b><span>Biefstuk Bali (com molho de amendoim picante) ou o \"Ossenhaas met knoflook\"; croquete de camar\u00e3o.</span>\n        <b>Custo</b><span>\u20ac30\u201340.</span>\n        <b>Hor\u00e1rio</b><span>10h\u201322h30. +31 20 623 3777.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 qua 30/09, 12:00 \u00b7 Albert Cuyp</h3>\n    <p class=\"when\">Quarta \u00e9 dia normal de feira (seg\u2013s\u00e1b). A regra: comer de barraca em barraca. As alternativas s\u00e3o para sentar.</p>\n\n    <div class=\"opt pick\"><h4>As barracas do mercado <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Albert Cuypstraat, 1 km de feira. Sa\u00edda do metr\u00f4 De Pijp.</span>\n        <b>Por qu\u00ea</b><span>\u00c9 a refei\u00e7\u00e3o-degusta\u00e7\u00e3o da Holanda inteira em 300 m: haring cru com cebola e picles (segure pelo rabo), kibbeling (bacalhau frito com molho de alho), poffertjes, stroopwafel sa\u00eddo da chapa, queijo de cunha.</span>\n        <b>Estrela</b><span>Haring \"Hollandse Nieuwe\" e kibbeling.</span>\n        <b>Custo</b><span>\u20ac12\u201318 comendo de tudo.</span>\n        <b>Hor\u00e1rio</b><span>9h30\u201317h. Barracas aceitam cart\u00e3o; algumas s\u00f3 dinheiro.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>The Butcher</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Albert Cuypstraat 129, dentro da feira.</span>\n        <b>Por qu\u00ea</b><span>A hamburgueria original de Amsterdam, carne Angus maturada, decora\u00e7\u00e3o de a\u00e7ougue. Bar secreto atr\u00e1s da geladeira.</span>\n        <b>Estrela</b><span>Truffle burger; Cowboy.</span>\n        <b>Custo</b><span>\u20ac15\u201320.</span>\n        <b>Hor\u00e1rio</b><span>11h30\u201323h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>The Bazar</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Albert Cuypstraat 182, uma antiga igreja.</span>\n        <b>Por qu\u00ea</b><span>Turco e marroquino num sal\u00e3o de igreja coberto de lanternas; prato do dia por menos de \u20ac10; todo mundo de De Pijp almo\u00e7a aqui.</span>\n        <b>Estrela</b><span>Pilic sis (espetinho de frango); t\u00e1bua de doces com ch\u00e1.</span>\n        <b>Custo</b><span>\u20ac10\u201318.</span>\n        <b>Hor\u00e1rio</b><span>N\u00e3o confirmado para quarta: conferir no Maps na hora.</span>\n      </div></div>\n\n    <div class=\"note\">Para o trem das 16h (5h43 at\u00e9 Berlim): comprar na feira um saco de stroopwafel, queijo e fruta, e no Albert Heijn da Centraal \u00e1gua e sandu\u00edche. O bar do ICE existe, mas \u00e9 caro e acaba.</div>\n  </div>\n</section>\n\n<!-- ====================== COFFEE SHOPS ====================== -->\n<section id=\"coffeeshops\">\n  <h2>Coffee shops</h2>\n  <p class=\"lead\">Os coffeeshops s\u00e3o licenciados pela prefeitura: compra e consumo de cannabis dentro deles \u00e9 tolerado por lei, para maiores de 18, at\u00e9 5 g por pessoa por dia. Fora deles, n\u00e3o: comprar na rua \u00e9 ilegal e \u00e9 golpe, e fumar na rua no Red Light e no centro d\u00e1 multa de \u20ac100.</p>\n\n  <h3>Como funciona</h3>\n  <ol class=\"steps\">\n    <li><b>Passaporte na m\u00e3o.</b> Pedem documento na porta ou no balc\u00e3o, mesmo para quem tem 40 anos.</li>\n    <li><b>O card\u00e1pio fica no balc\u00e3o</b>, \u00e0s vezes numa pasta, \u00e0s vezes em tela. Divide-se em flor (wiet), haxixe (hasj), pr\u00e9-enrolados (joints) e comest\u00edveis (space cake, brownies). Diga o que procura em ingl\u00eas; o atendente (\"budtender\") explica.</li>\n    <li><b>\"Pure\" \u00e9 sem tabaco.</b> Os pr\u00e9-enrolados holandeses tradicionais v\u00eam misturados com tabaco; os \"pure\" n\u00e3o. Pedir sempre \"pure joint\" se n\u00e3o fumam tabaco.</li>\n    <li><b>\u00c1lcool n\u00e3o \u00e9 servido</b> em coffeeshop, por lei. Caf\u00e9, ch\u00e1, suco e milkshake sim, e \u00e9 educado consumir algo se ficar sentado.</li>\n    <li><b>Comest\u00edveis demoram 1\u20132 h para fazer efeito e duram horas.</b> As avalia\u00e7\u00f5es de todas as lojas abaixo t\u00eam relatos de gente que comeu o bolo inteiro esperando efeito r\u00e1pido. Meio ou um quarto, e esperar. N\u00e3o combinar com a Anne Frank \u00e0s 19:15 nem com o trem das 16h de quarta.</li>\n    <li><b>N\u00e3o misturar com \u00e1lcool</b> e n\u00e3o pedalar depois: os holandeses multam e, mais importante, as ciclovias n\u00e3o perdoam.</li>\n    <li><b>Cart\u00e3o funciona</b> na maioria; alguns s\u00e3o s\u00f3 dinheiro. Pre\u00e7os: pr\u00e9-enrolado \u20ac5\u201310; 1 g \u20ac10\u201316; comest\u00edvel \u20ac6\u201310.</li>\n  </ol>\n\n  <h3>Os que valem a visita</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Loja</th><th>Onde \u00b7 quando cai no roteiro</th><th>Por qu\u00ea</th></tr>\n    <tr><td><b>Grey Area</b></td><td>Oude Leliestraat 2, Jordaan \u00b7 seg, a 3 min do 't Smalle \u00b7 11h\u201320h</td><td>Min\u00fasculo, dono americano, cultuado por quem entende: qualidade e atendimento que ensinam. Sem banheiro, poucos lugares.</td></tr>\n    <tr><td><b>Paradox</b></td><td>Eerste Bloemdwarsstraat 2, Jordaan \u00b7 seg, 2 min do 't Smalle \u00b7 11h\u201320h</td><td>Calmo, cara de caf\u00e9 de bairro, atendente que explica o que fazer e o que n\u00e3o fazer. O space cake \u00e9 forte: a advert\u00eancia acima vale aqui.</td></tr>\n    <tr><td><b>Boerejongens Centrum</b></td><td>Utrechtsestraat 21 \u00b7 seg \u00e0 noite, a 3 min da Magere Brug \u00b7 7h\u20130h45</td><td>Balc\u00e3o que parece farm\u00e1cia, atendentes de jaleco, pr\u00e9-enrolados pure bem feitos, e os comest\u00edveis mais fortes da cidade (red velvet). Abre cedo e fecha tarde.</td></tr>\n    <tr><td><b>Dampkring</b></td><td>Handboogstraat 29 \u00b7 ter, ao lado do Vleminckx \u00b7 10h\u20131h</td><td>O cen\u00e1rio de Ocean's Twelve, interior de madeira esculpida, milkshakes. Atendimento oscila; \u00e9 a visita pela casa.</td></tr>\n    <tr><td><b>Katsu</b></td><td>Eerste van der Helststraat 70, De Pijp \u00b7 qua, 2 min do Albert Cuyp \u00b7 10h\u20130h</td><td>Galeria de arte com coffeeshop dentro, mesas de jogo, o de bairro de De Pijp. Encaixa no \"coffee shop opcional das 13:30\" de quarta, com a ressalva do trem.</td></tr>\n  </table></div>\n</section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Amsterdam</h2>\n  <p class=\"lead\">Aqui as compras cabem no roteiro sem desvio: Tony's e Wynand Fockink ficam entre a Centraal e o Dam (segunda de manh\u00e3); a Kaaskamer no caminho do Rijksmuseum ao Jordaan (segunda \u00e0 tarde); a feira do Albert Cuyp na quarta.</p>\n\n  <div class=\"warn\">Tr\u00eas alertas. <b>Bulbos de tulipa n\u00e3o entram no Brasil</b> sem certificado fitossanit\u00e1rio: as barracas do Bloemenmarkt vendem \"certified for USA/Canada\", n\u00e3o para o Brasil; a Receita apreende. <b>L\u00edquidos acima de 100 ml n\u00e3o voam</b> no BER\u2192LIS de mala de m\u00e3o: jenever s\u00f3 em miniatura. <b>Queijo</b> passa (\u00e9 alimento processado), a v\u00e1cuo, e pesa: 500 g por cunha.</div>\n\n  <div class=\"scroll\"><table>\n    <tr><th>O qu\u00ea</th><th>Por qu\u00ea</th><th>Onde (na rota)</th><th>Pre\u00e7o</th></tr>\n    <tr><td>Stroopwafels</td><td>O biscoito nacional. Na lata \u00e9 presente; no pacote do Albert Heijn \u00e9 o mesmo biscoito por um quarto do pre\u00e7o.</td><td>Feira do Albert Cuyp (qua): fresco, embalado na hora. Lata: Van Wonderen (Kalverstraat). Pacote: qualquer AH.</td><td>\u20ac3\u201312</td></tr>\n    <tr><td>Queijo a v\u00e1cuo</td><td>Gouda velho (oude), com cominho (komijn) ou trufa. A Kaaskamer embala para viagem e deixa provar tudo.</td><td>De Kaaskamer, Runstraat 7 (seg 12h\u201318h, na rota Rijksmuseum \u2192 Jordaan). Ou a queijaria da Zaanse Schans (ter).</td><td>\u20ac8\u201315 a cunha</td></tr>\n    <tr><td>Chocolate Tony's Chocolonely</td><td>Marca holandesa de com\u00e9rcio justo, barras desiguais de prop\u00f3sito; na Superstore voc\u00eas montam a pr\u00f3pria barra com embalagem personalizada (leva 1h30 para ficar pronta).</td><td>Tony's Superstore, Oudebrugsteeg 15, 3 min da Centraal, 10h\u201319h. Fecha 19h: encomendar a barra na ter\u00e7a \u00e0s 14h45 (a caminho do ferry) e buscar na quarta \u00e0s 15h, antes do trem.</td><td>\u20ac4\u201311</td></tr>\n    <tr><td>Casinhas de Delft</td><td>As miniaturas de casas de canal em azul e branco, as mesmas que a KLM d\u00e1 na classe executiva.</td><td>Heinen Delftware, Prinsengracht 440 (na Spiegelstraat, 10h\u201318h); a loja embrulha uma por uma.</td><td>\u20ac10\u201330</td></tr>\n    <tr><td>Drop (alca\u00e7uz)</td><td>O doce que os holandeses comem 2 kg por ano e o resto do mundo detesta: salgado, doce, duro, macio. \u00d3timo presente-provoca\u00e7\u00e3o.</td><td>Het Oud-Hollandsch Snoepwinkeltje, Jordaan (s\u00f3 ter\u2013s\u00e1b 11h\u201317h, s\u00f3 dinheiro: fora da rota de segunda). Na pr\u00e1tica: prateleira do Albert Heijn.</td><td>\u20ac2\u20136</td></tr>\n    <tr><td>Jenever em miniatura</td><td>O \"gin\" original holand\u00eas, de 1679, em garrafinha de cer\u00e2mica ou 50 ml.</td><td>Wynand Fockink, Pijlsteeg 31, viela atr\u00e1s do Dam, 14h\u201321h (segunda \u00e0 noite no caminho do Red Light).</td><td>\u20ac5\u201312</td></tr>\n    <tr><td>Tamancos e pequenos moinhos</td><td>O clich\u00ea, mas feito na hora.</td><td>F\u00e1brica de tamancos da Zaanse Schans (ter): demonstra\u00e7\u00e3o gr\u00e1tis, os pintados custam mais.</td><td>\u20ac10\u201340</td></tr>\n    <tr><td>Hagelslag</td><td>Granulado de chocolate que os holandeses comem no p\u00e3o de manh\u00e3. Caixa de \u20ac2, presente que explica um pa\u00eds.</td><td>Albert Heijn.</td><td>\u20ac2\u20133</td></tr>\n  </table></div>\n</section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que s\u00f3 existem aqui</h2>\n\n  <div class=\"shop\"><b>Tony's Chocolonely Superstore</b><small>Oudebrugsteeg 15, ao lado do Damrak \u00b7 todos os dias 10h\u201319h</small>\n    <p>Loja-f\u00e1brica com a \"parede de chocolate\", a linha do tempo da marca contra o trabalho escravo no cacau, e a bancada de montar a pr\u00f3pria barra. Fila que anda. A ver a caminho do Dam na segunda.</p></div>\n\n  <div class=\"shop\"><b>Wynand Fockink</b><small>Pijlsteeg 31, viela atr\u00e1s do Dam \u00b7 todos os dias 14h\u201321h</small>\n    <p>O barman serve o copinho cheio at\u00e9 a borda; voc\u00ea se curva para o primeiro gole, sem tocar no copo. Dois euros a dose. Segunda \u00e0 noite, antes do Red Light.</p>\n    <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Sala de degusta\u00e7\u00e3o de 1679, do tamanho de uma cozinha \u2014 uma das destilarias mais antigas da Holanda ainda em atividade no mesmo endere\u00e7o.</div></details></div>\n\n  <div class=\"shop\"><b>De Kaaskamer</b><small>Runstraat 7, Nove Ruas \u00b7 seg 12h\u201318h</small>\n    <p>Trezentos queijos empilhados at\u00e9 o teto, funcion\u00e1rios que insistem em dar mais uma prova, e o melhor tosti de queijo da cidade para comer na porta.</p></div>\n\n  <div class=\"shop\"><b>Puccini Bomboni</b><small>Staalstraat 17 \u00b7 seg 11h\u201319h</small>\n    <p>Bombons enormes feitos na cozinha ao lado, sabores como limoncello, amaretto e pimenta. Fica na Staalstraat, a rua bonita entre o Spui e o Waterlooplein: 10 min de desvio do Bloemenmarkt.</p></div>\n\n  <div class=\"shop\"><b>Heinen Delftware</b><small>Prinsengracht 440, Spiegelkwartier \u00b7 10h\u201318h</small>\n    <p>Porcelana de Delft, das casinhas de \u20ac10 ao prato pintado \u00e0 m\u00e3o. Na Spiegelstraat, a rua dos antiqu\u00e1rios, 2 min do Rijksmuseum.</p></div>\n\n  <div class=\"shop\"><b>HEMA</b><small>v\u00e1rias: Nieuwendijk 174, perto do Dam \u00b7 at\u00e9 20h</small>\n    <p>A loja de departamentos barata que todo holand\u00eas usa: design simples, papelaria, Miffy oficial por metade do pre\u00e7o das lojas de souvenir, e o tompouce (o doce rosa) no caf\u00e9.</p></div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">Seg manh\u00e3: Tony's</span>\n    <span class=\"chip\">Seg tarde: Kaaskamer \u00b7 Heinen</span>\n    <span class=\"chip\">Seg noite: Wynand Fockink</span>\n    <span class=\"chip\">Ter: tamancos e queijo na Zaanse Schans</span>\n    <span class=\"chip\">Qua: feira do Albert Cuyp</span>\n  </div>\n</section>\n\n\n</div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"amsterdam-1\": [{\"t\": \"A p\u00e9 \u00b7 Centraal \u2192 Dam\", \"d\": \"~10 min, pela Damrak.\"}, {\"t\": \"A p\u00e9 \u00b7 Dam \u2192 Begijnhof\", \"d\": \"~5 min.\"}, {\"t\": \"A p\u00e9 \u00b7 Begijnhof \u2192 Bloemenmarkt\", \"d\": \"~5 min.\"}, {\"t\": \"Bonde 2 ou 12 \u00b7 Bloemenmarkt \u2192 Van Gogh\", \"d\": \"Parada Koningsplein \u2192 Rijksmuseum, ~10 min. Check-in GVB no bonde.\"}, {\"t\": \"A p\u00e9 \u00b7 Van Gogh \u2192 Vondelpark\", \"d\": \"~5 min. Piquenique no Albert Heijn da Van Baerlestraat.\"}, {\"t\": \"A p\u00e9 \u00b7 Vondelpark \u2192 Jordaan ('t Smalle)\", \"d\": \"~20 min. Borrel no bruin caf\u00e9 ao chegar.\"}, {\"t\": \"A p\u00e9 \u00b7 Jordaan \u2192 Anne Frank\", \"d\": \"~5 min. Hor\u00e1rio reservado: 19:15.\"}, {\"t\": \"A p\u00e9 \u00b7 Anne Frank/Red Light \u2192 Magere Brug\", \"d\": \"Parte da volta noturna pelo centro.\"}, {\"t\": \"A p\u00e9 + trem NS \u00b7 Red Light \u2192 Centraal \u2192 Zaandam\", \"d\": \"~10 min a p\u00e9 at\u00e9 a esta\u00e7\u00e3o + trem. Check-in e check-out NS.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.
