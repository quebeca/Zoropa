<style>

  --card:#F7F8FA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;

    --card:#141F33;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --ink:#E9EEF6; --muted:#A3AEC2; --line:#2A3650;
  --azul:#7FA6E0; --azul-esc:#0B1220; --azul-tint:#172A4A;
  --card:#141F33;
}
*{box-sizing:border-box}
html,body{margin:0;height:auto}
body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

header.shell{position:sticky;top:0;z-index:20;background:var(--azul-esc);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08);transform:translateZ(0);will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
header.shell .top{display:flex;align-items:baseline;justify-content:space-between;padding:.7rem 1rem .1rem;max-width:760px;margin:0 auto}
header.shell h1{font-family:"Fraunces","Georgia",serif;font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em}
header.shell .dates{font-size:.78rem;opacity:.85}

nav.tabs{display:flex;gap:.4rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:.6rem 1rem .7rem;max-width:760px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:.4rem;font-family:inherit;font-size:.92rem;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.45rem .9rem;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.tab .flag{font-size:1rem}
.tab[aria-selected="true"]{background:#fff;color:var(--azul-esc);border-color:#fff}
.tab:focus-visible{outline:3px solid #F5C518;outline-offset:2px}

main{max-width:760px;margin:0 auto}
.panel{width:100%}
.panel iframe{display:block;width:100%;border:0;background:var(--bg)}

.loading{padding:3rem 1.2rem;text-align:center;color:var(--muted);font-size:.95rem}

footer.shell{max-width:760px;margin:0 auto;padding:1.4rem 1.2rem 3rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);margin-top:1rem}
footer.shell a{color:var(--azul)}

[hidden]{display:none !important}
.tools{max-width:760px;margin:0 auto;padding:0 1rem}
.tools:has([id="fxBody"]:not([hidden])),.tools:has([id="searchBody"]:not([hidden])){border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:.2rem}
header.shell .top-right{display:flex;align-items:center;gap:.4rem}
.tool-icon{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;width:1.9rem;height:1.9rem;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem;line-height:1;cursor:pointer;color:#fff;padding:0}
.tool-icon[aria-expanded="true"]{background:rgba(255,255,255,.28)}
.fx-body{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center;padding:.5rem 0 .3rem}
.fx-body label{display:flex;align-items:center;gap:.3rem;font-size:.82rem;color:#fff;opacity:.85}
.fx-body input{width:6.2rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;color:#fff;font-family:inherit;font-size:.95rem;padding:.35rem .5rem}
.fx-body input::placeholder{color:rgba(255,255,255,.5)}
.fx-rate{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:#fff;opacity:.75;width:100%}
.fx-rate input{width:4.2rem;font-size:.82rem;padding:.2rem .4rem}
.fx-rate .fx-date{opacity:.8}
.search-body{padding:.5rem 0 .3rem}
.search-body input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;color:#fff;font-family:inherit;font-size:.95rem;padding:.45rem .6rem}
.search-body input::placeholder{color:rgba(255,255,255,.55)}
.search-results{margin-top:.5rem;display:flex;flex-direction:column;gap:.4rem;max-height:14rem;overflow-y:auto}
.search-result{display:block;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:.45rem .6rem;color:#fff;font-family:inherit;cursor:pointer}
.search-result .sr-city{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;opacity:.75;display:block;margin-bottom:.15rem}
.search-result .sr-snip{font-size:.82rem;opacity:.92;line-height:1.35}
.search-result .sr-snip mark{background:var(--amarelo,#F5C518);color:#1a1a1a;border-radius:2px;padding:0 .1rem}
.search-empty{font-size:.8rem;opacity:.7;padding:.3rem 0}
.jump-outer{max-width:760px;margin:0 auto;padding:0 1rem;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.jump-outer::-webkit-scrollbar{display:none}
.jump-outer a{display:inline-block;padding:.55rem .1rem .5rem;margin-right:1rem;font-size:.85rem;font-weight:600;color:#fff;opacity:.85;text-decoration:none;border-bottom:3px solid transparent}
.jump-outer a:hover,.jump-outer a:active{border-bottom-color:var(--amarelo,#F5C518);opacity:1}
</style>
</head>

<header class="shell">
  <div class="top">
    <h1>zoropa 2026</h1>
    <span class="top-right">
      <span class="dates">23/09–06/10</span>
      <button class="tool-icon" id="fxToggle" aria-expanded="false" aria-controls="fxBody" title="Conversor euro → real" aria-label="Conversor euro → real">💶</button>
      <button class="tool-icon" id="searchToggle" aria-expanded="false" aria-controls="searchBody" title="Buscar no guia" aria-label="Buscar no guia">🔍</button>
    </span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Cidades da viagem">
      <button class="tab" role="tab" id="tab-lisboa" aria-controls="panel-lisboa" aria-selected="true" tabindex="0" data-slug="lisboa"><span class="flag">🇵🇹</span>Lisboa</button>
      <button class="tab" role="tab" id="tab-paris" aria-controls="panel-paris" aria-selected="false" tabindex="-1" data-slug="paris"><span class="flag">🇫🇷</span>Paris</button>
      <button class="tab" role="tab" id="tab-amsterdam" aria-controls="panel-amsterdam" aria-selected="false" tabindex="-1" data-slug="amsterdam"><span class="flag">🇳🇱</span>Amsterdam</button>
      <button class="tab" role="tab" id="tab-berlim" aria-controls="panel-berlim" aria-selected="false" tabindex="-1" data-slug="berlim"><span class="flag">🇩🇪</span>Berlim</button>
      <button class="tab" role="tab" id="tab-potsdam" aria-controls="panel-potsdam" aria-selected="false" tabindex="-1" data-slug="potsdam"><span class="flag">🏰</span>Potsdam</button>
  </nav>
  <div class="tools">
    <div class="fx-body" id="fxBody" hidden>
      <label>€ <input type="number" id="fxEur" inputmode="decimal" placeholder="0"></label>
      <label>R$ <input type="number" id="fxBrl" inputmode="decimal" placeholder="0"></label>
      <div class="fx-rate">1 € = R$ <input type="number" id="fxRate" step="0.01" inputmode="decimal"> <span class="fx-date" id="fxDate"></span></div>
    </div>
    <div class="search-body" id="searchBody" hidden>
      <input type="text" id="searchInput" placeholder="Buscar em todas as cidades…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <nav class="jump-outer" id="jumpOuter" aria-label="Seções da cidade"></nav>
</header>

<main>
    <div class="panel" id="panel-lisboa" role="tabpanel" aria-labelledby="tab-lisboa" data-slug="lisboa"></div>
    <div class="panel" id="panel-paris" role="tabpanel" aria-labelledby="tab-paris" data-slug="paris" style="display:none"></div>
    <div class="panel" id="panel-amsterdam" role="tabpanel" aria-labelledby="tab-amsterdam" data-slug="amsterdam" style="display:none"></div>
    <div class="panel" id="panel-berlim" role="tabpanel" aria-labelledby="tab-berlim" data-slug="berlim" style="display:none"></div>
    <div class="panel" id="panel-potsdam" role="tabpanel" aria-labelledby="tab-potsdam" data-slug="potsdam" style="display:none"></div>
</main>

<footer class="shell">
  <p>Rolê Europeu | BeXorXe</p>

ext{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}\n.r-badge circle{stroke-dasharray:none}\n.r-badge text{stroke:none;stroke-dasharray:none}\n.r-badge.walk{stroke-dasharray:none}\n.r-badge.walk circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}\n.r-badge.walk text{fill:var(--ink)}\n.r-badge.transit circle{fill:var(--amarelo)}\n.r-badge.transit text{fill:#1a1a1a}\n.r-badge.taxi circle{fill:var(--azul)}\n.r-badge.taxi text{fill:#fff}\n.r-path.is-active,.r-hit.is-active + .r-path{stroke-width:5px !important}\n.r-badge.is-active circle{stroke:var(--amarelo);stroke-width:3px}\n.rota-painel{display:none;margin:.6rem 0 1rem;padding:.8rem 1rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:2px;position:relative}\n.rota-painel.show{display:block}\n.rota-painel .num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;font-size:.85rem;margin-right:.5rem;vertical-align:middle}\n.rota-painel h4{display:inline;font-family:\"Public Sans\",sans-serif;font-size:1rem;font-weight:700}\n.rota-painel p{margin:.5rem 0 0;color:var(--muted);font-size:.92rem}\n.rota-painel .fechar{position:absolute;top:.5rem;right:.6rem;background:none;border:0;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer;padding:.3rem}\n.mapa-dica{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <p class=\"kicker\">zoropa 2026 \u00b7 bloco 1 de 5</p>\n    <h1>Lisboa</h1>\n    <p class=\"sub\">Quinta 24/09 (dia inteiro) \u00b7 sexta 25/09 (s\u00f3 a sa\u00edda) \u00b7 segunda 05/10 (noite com a Patr\u00edcia) \u00b7 ter\u00e7a 06/10 (voo \u00e0s 10h).</p>\n  </div>\n</header>\n\n<nav class=\"jump\"><div class=\"wrap\">\n  <a href=\"#pendencias\">Pend\u00eancias</a>\n  <a href=\"#transporte\">Transporte</a>\n  <a href=\"#mapas\">Mapas</a>\n  <a href=\"#comer\">Onde comer</a>\n  <a href=\"#glossario\">Gloss\u00e1rio</a>\n  <a href=\"#lembrancas\">Lembrancinhas</a>\n  <a href=\"#lojas\">Lojas</a>\n</div></nav>\n\n<div class=\"wrap\">\n\n<!-- ====================== TRANSPORTE ====================== -->\n<section id=\"pendencias\">\n  <h2>Pend\u00eancias e reservas</h2>\n  <div class=\"note\"><b>Lista compartilhada:</b> <a href=\"https://docs.google.com/spreadsheets/d/1cEDUtFOnVzotB8YjG1JdIcN-y-77FNoqg7xRRSgQ9uE/edit\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccb abrir a planilha \"Pend\u00eancias zoropa 2026\"</a> \u2014 \u00e9 a vers\u00e3o oficial, sincronizada entre os dois celulares (Rebeca, Jorge e a conta bexorxe t\u00eam edi\u00e7\u00e3o). As caixinhas abaixo s\u00e3o s\u00f3 um espelho r\u00e1pido neste aparelho.</div>\n  <div class=\"pend-bar\"><span class=\"pend-count\" id=\"pendCount\"></span><button type=\"button\" class=\"pend-lock\" id=\"pendLock\">\ud83d\udd13 travar lista</button></div>\n  <h3>O que ainda falta</h3>\n  <ul class=\"pend\">\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-0\"> <span class=\"pend-what\">Uber e Bolt logados, cart\u00e3o internacional cadastrado, corrida-teste feita</span> <span class=\"pend-when\">at\u00e9 ter 22/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-1\"> <span class=\"pend-what\">eSIM comprado e instalado (ativar na fila da imigra\u00e7\u00e3o)</span> <span class=\"pend-when\">at\u00e9 qua 23/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-2\"> <span class=\"pend-what\">Mapa offline de Lisboa no Google Maps</span> <span class=\"pend-when\">at\u00e9 qua 23/09</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-3\"> <span class=\"pend-what\">\u20ac10\u201315 em moedas / notas de \u20ac5 (el\u00e9trico, Ginjinha)</span> <span class=\"pend-when\">no aeroporto, 24/09 de manh\u00e3</span> <span class=\"pend-how\">caixa eletr\u00f4nico do Terminal 1 antes de sair</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-4\"> <span class=\"pend-what\">Avisar a Patr\u00edcia da hora de chegada (pouso 20:05 + Uber)</span> <span class=\"pend-when\">seg 05/10, do aeroporto de Berlim</span></label></li>\n    <li><label><input type=\"checkbox\" data-pend=\"lisboa-5\"> <span class=\"pend-what\">Tax Free do Mac mini: Alf\u00e2ndega + Global Blue no aeroporto</span> <span class=\"pend-when\">ter 06/10, 06:45, antes da seguran\u00e7a</span> <span class=\"pend-how\">Mac mini na m\u00e3o, nota, passaporte</span></label></li>\n  </ul>\n  <h3>Reservas e documentos</h3>\n  <p class=\"lead\">Os PDFs est\u00e3o no Drive da conta bexorxe (privados: quem n\u00e3o estiver logado nela v\u00ea \"pedir acesso\"). \ud83d\udccd abre o lugar no Maps.</p>\n  <ul class=\"pend docs\">\n    <li><span class=\"pend-what\">TAP TP58 \u00b7 Bras\u00edlia \u2192 Lisboa</span> <span class=\"pend-when\">qua 23/09 18:15 \u2192 07:25 (24/09)</span> <span class=\"pend-leave\">\ud83d\udd50 sa\u00edda sugerida de casa: ~3h antes do voo (voo intercontinental) \u2014 ajustem pelo tr\u00e2nsito at\u00e9 o BSB, que n\u00e3o est\u00e1 no guia</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 bilhete Rebeca</a> \u00b7 <a href=\"https://drive.google.com/file/d/1r-RpHkPsmiXf_VqSUOJzqA22bCt7SfzI/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 bilhete Jorge</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Aeroporto%20Internacional%20de%20Bras%C3%ADlia\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Famous Crows Lisbon Suites \u00b7 Rua de Bel\u00e9m 70</span> <span class=\"pend-when\">qui 24/09, chegada ~08:30 (malas) \u00b7 check-out sex 25/09</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1T-P_xIXcqLvqWSeiEmghofHrUoSLWViX/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 reserva</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Famous%20Crows%20Lisbon%20Suites%2C%20Rua%20de%20Bel%C3%A9m%2070%2C%20Lisboa\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Transavia TO7641 \u00b7 Lisboa \u2192 Paris Orly</span> <span class=\"pend-when\">sex 25/09 09:40 \u2192 13:10 \u00b7 check-in online abre 30 h antes</span> <span class=\"pend-leave\">\ud83d\udd50 sa\u00edda sugerida do Famous Crows: 07:30 (Uber ~20\u201325 min + voo dentro do Schengen, chegar 1h30 antes j\u00e1 \u00e9 folgado)</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/18_4HgcDeDFhB4J6vylrSfdqxVikDgR1C/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 reserva</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Aeroporto%20Humberto%20Delgado%2C%20Lisboa\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">TAP TP533 \u00b7 Berlim \u2192 Lisboa</span> <span class=\"pend-when\">seg 05/10 17:20 \u2192 20:05</span> <span class=\"pend-leave\">\ud83d\udd50 sa\u00edda sugerida do hotel: 14:30 (ver \"Trecho a trecho\" de Berlim)</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 bilhete</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Flughafen%20Berlin%20Brandenburg%20BER%20Terminal%201\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">TAP TP57 \u00b7 Lisboa \u2192 Bras\u00edlia</span> <span class=\"pend-when\">ter 06/10 10:00 \u2192 15:40</span> <span class=\"pend-leave\">\ud83d\udd50 sa\u00edda sugerida da casa da Patr\u00edcia: 06:15 (o roteiro achava 07:00 justo demais \u2014 voo intercontinental, controle biom\u00e9trico de sa\u00edda Schengen)</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1ipGi5a165Rrje84JJgX77QuQ-2Q6q37J/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 bilhete</a> \u00b7 <a href=\"https://www.google.com/maps/search/?api=1&query=Aeroporto%20Humberto%20Delgado%2C%20Lisboa\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udccd</a></span></li>\n    <li><span class=\"pend-what\">Seguro-viagem \u00b7 duas ap\u00f3lices</span> <span class=\"pend-when\">toda a viagem</span> <span class=\"pend-links\"><a href=\"https://drive.google.com/file/d/1p7i3b9OIY74B0fFMLf0AZ2TVJ1ts0Cw7/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 ap\u00f3lice 1</a> \u00b7 <a href=\"https://drive.google.com/file/d/1jRMFJK03pfFpwr4MoraSjlOioML3t5Rl/view\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">\ud83d\udcc4 ap\u00f3lice 2</a></span></li>\n  </ul>\n</section>\n\n<section id=\"transporte\">\n  <h2>Transporte: como desenrolar</h2>\n  <p class=\"lead\">A decis\u00e3o importante para Lisboa \u00e9 simples: com s\u00f3 um dia, mala e ladeira, voc\u00eas <b>n\u00e3o precisam de cart\u00e3o de transporte</b>. Uber/Bolt para os trechos longos e moedas para o el\u00e9trico resolvem tudo.</p>\n\n  <h3>Antes de sair do Brasil</h3>\n  <ol class=\"steps\">\n    <li><b>Instale e fa\u00e7a login no Uber e no Bolt.</b> Cadastre o cart\u00e3o de cr\u00e9dito internacional nos dois. Fa\u00e7a uma corrida-teste em Bras\u00edlia para confirmar que a conta est\u00e1 ativa (o Uber \u00e0s vezes pede reverifica\u00e7\u00e3o no exterior).</li>\n    <li><b>Baixe o mapa offline de Lisboa no Google Maps.</b> Maps \u203a seu avatar \u203a Mapas offline \u203a Selecione o seu pr\u00f3prio mapa. Assim funciona mesmo se o eSIM demorar a conectar.</li>\n    <li><b>Separe \u20ac10\u201315 em moedas ou notas de \u20ac5</b> para o el\u00e9trico e a ginjinha (a A Ginjinha s\u00f3 aceita dinheiro).</li>\n  </ol>\n\n  <h3>Chegada, 24/09, 07:25</h3>\n  <ol class=\"steps\">\n    <li><b>Imigra\u00e7\u00e3o.</b> Fila de \"Todos os passaportes\". Desde 2025 h\u00e1 o registro biom\u00e9trico EES (foto e digitais) na primeira entrada: conte 40\u201360 min. Tenham \u00e0 m\u00e3o a reserva do Famous Crows e o bilhete de volta; podem pedir.</li>\n    <li><b>Ligue o eSIM</b> ainda na fila da imigra\u00e7\u00e3o (passos no slide 8 do roteiro).</li>\n    <li><b>Pe\u00e7a o Uber/Bolt.</b> Compare o pre\u00e7o nos dois apps. Coloque como destino \"Famous Crows Lisbon Suites, Rua de Bel\u00e9m 70\". O app mostra o ponto de encontro: \u00e9 a \u00e1rea \"Uber/Bolt/TVDE\" na sa\u00edda das Chegadas do Terminal 1, \u00e0 direita. ~20 min, \u20ac15\u201320.</li>\n    <li><b>Deixe as malas na hospedagem</b> e comece Bel\u00e9m a p\u00e9: Past\u00e9is (2 min), Jer\u00f3nimos (3 min), Padr\u00e3o e Torre pela beira-rio (15 min). Bel\u00e9m \u00e9 plano; o resto de Lisboa n\u00e3o.<details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">O Mosteiro dos Jer\u00f3nimos come\u00e7ou a ser erguido em 1501, sob D. Manuel I, pago com o \"dinheiro da pimenta\" \u2014 o imposto de 5% sobre as especiarias que Vasco da Gama abriu caminho para trazer do Oriente. Levou quase um s\u00e9culo para ficar pronto e foi constru\u00eddo para hospedar monges hieronimitas, que rezavam pela alma dos navegadores antes de embarcarem em Bel\u00e9m. O t\u00famulo de Vasco da Gama est\u00e1 logo \u00e0 entrada da igreja. \u00c9 Patrim\u00f4nio Mundial da UNESCO desde 1983, junto com a Torre.</div></details><details class=\"curio\"><summary>\ud83c\udfdb\ufe0f um pouco de arquitetura</summary><div class=\"in\">O estilo \u00e9 o manuelino \u2014 o g\u00f3tico tardio portugu\u00eas cheio de cordas, esferas armilares e motivos mar\u00edtimos esculpidos na pedra, uma assinatura visual do per\u00edodo dos Descobrimentos que n\u00e3o existe fora de Portugal. A Torre de Bel\u00e9m, erguida entre 1514 e 1520 por Francisco de Arruda, mistura esse manuelino com influ\u00eancias mouriscas nas torres de vigia \u2014 ele tinha trabalhado em fortalezas no Marrocos antes. Originalmente a Torre ficava no meio do rio Tejo, guardando a entrada do porto; o curso do rio mudou ao longo dos s\u00e9culos e hoje ela parece estar na margem.</div></details></li>\n  </ol>\n\n  <h3>Bel\u00e9m \u2192 centro, 17:00</h3>\n  <ol class=\"steps\">\n    <li><b>El\u00e9trico 15E.</b> Parada \"Mosteiro dos Jer\u00f3nimos\", do lado da rua oposto ao mosteiro, sentido Pra\u00e7a da Figueira. Pague ao motorista: <b>~\u20ac3 por pessoa, dinheiro</b>. Des\u00e7a em \"Pra\u00e7a do Com\u00e9rcio\", ~25 min. \u00c9 um bonde moderno e comprido, n\u00e3o o amarelinho antigo.</li>\n    <li><b>Se estiver lotado</b> (comum \u00e0s 17h): Uber at\u00e9 a Pra\u00e7a do Com\u00e9rcio, ~\u20ac8\u201310, 15 min. N\u00e3o perca tempo esperando o pr\u00f3ximo.</li>\n    <li><b>Pra\u00e7a do Com\u00e9rcio \u2192 Rossio</b>: a p\u00e9 pela Rua Augusta, 10 min, plano. Aqui \u00e9 a janela de compras (ver Lembrancinhas).</li>\n    <li><b>Rossio \u2192 Castelo.</b> Subida forte, 20 min. Para poupar: <b>\u00f4nibus 737</b> na Pra\u00e7a da Figueira, para na porta do castelo, pague a bordo em dinheiro (~\u20ac2\u20133). Ou tuk-tuk/Uber, \u20ac6\u20138.<details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">A colina j\u00e1 foi fortificada desde o s\u00e9culo I a.C.; as muralhas que se veem hoje s\u00e3o principalmente do per\u00edodo mouro, dos s\u00e9culos IX a XI. Em 1147, D. Afonso Henriques tomou o castelo dos mouros com a ajuda de cruzados que seguiam a caminho da Terra Santa e pararam em Lisboa a caminho \u2014 um dos epis\u00f3dios mais citados da Reconquista ib\u00e9rica. Foi resid\u00eancia real at\u00e9 o s\u00e9culo XVI, quando a corte se mudou para o que hoje \u00e9 a Pra\u00e7a do Com\u00e9rcio, \u00e0 beira-rio. O terramoto de 1755 arrasou boa parte da estrutura, e o castelo s\u00f3 ganhou a cara atual numa restaura\u00e7\u00e3o pesada dos anos 1940, feita pelo Estado Novo \u2014 alguns historiadores discutem at\u00e9 hoje quanto daquilo \u00e9 fiel ao original.</div></details></li>\n    <li><b>Castelo \u2192 Santa Luzia \u2192 A Baiuca</b>: s\u00f3 descida, a p\u00e9, 5\u201310 min cada trecho.</li>\n    <li><b>Volta para Bel\u00e9m, 22h.</b> Chame o Uber no <b>Largo das Portas do Sol</b> (as ruelas de Alfama n\u00e3o t\u00eam onde parar carro). ~\u20ac10\u201312, 15 min.</li>\n  </ol>\n\n  <h3>Sa\u00edda para Paris, 25/09</h3>\n  <ol class=\"steps\">\n    <li><b>07:15 Uber Bel\u00e9m \u2192 Aeroporto</b>, 25 min. Pe\u00e7a \u00e0s 07:05: de manh\u00e3 os carros demoram um pouco mais em Bel\u00e9m.</li>\n    <li>Terminal 1. O check-in da Transavia \u00e9 online (30 h antes); direto para a seguran\u00e7a.</li>\n  </ol>\n\n  <h3>Volta, 05 e 06/10</h3>\n  <ol class=\"steps\">\n    <li><b>20:05 pouso \u2192 Uber at\u00e9 a casa da Patr\u00edcia</b> (Estrela/S\u00e3o Bento), ~20 min, \u20ac12\u201318. Avisar a Patr\u00edcia da chegada.</li>\n    <li><b>Casa \u2192 Caf\u00e9 de S\u00e3o Bento</b>: a p\u00e9, ~10 min, \u00e9 na mesma rua.</li>\n    <li><b>06/10, 06:15 Uber para o aeroporto.</b> Voo intercontinental \u00e0s 10h: chegar 07:30 \u00e9 o m\u00ednimo, e a sa\u00edda de Schengen tem controle biom\u00e9trico de novo. Sair \u00e0s 06:15 d\u00e1 folga real; o roteiro diz 07:00 e isso \u00e9 justo demais.</li>\n  </ol>\n\n  <h3 id=\"glossario\">Gloss\u00e1rio</h3>\n  <dl class=\"gloss\">\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('El\u00e9trico','pt-PT',this)\" aria-label=\"Ouvir El\u00e9trico\">\ud83d\udd0a</button> El\u00e9trico</dt><dd>Bonde. O <b>15E</b> \u00e9 moderno e vai a Bel\u00e9m; o <b>28</b> \u00e9 o amarelo antigo, cheio e cheio de batedores de carteira.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Carris','pt-PT',this)\" aria-label=\"Ouvir Carris\">\ud83d\udd0a</button> Carris</dt><dd>Empresa dos \u00f4nibus e el\u00e9tricos. O Google Maps mostra os hor\u00e1rios dela ao vivo.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Metro','pt-PT',this)\" aria-label=\"Ouvir Metro\">\ud83d\udd0a</button> Metro</dt><dd>4 linhas por cor. A <b>vermelha</b> sai do aeroporto. Voc\u00eas n\u00e3o v\u00e3o precisar dele neste roteiro.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Navegante','pt-PT',this)\" aria-label=\"Ouvir Navegante\">\ud83d\udd0a</button> Navegante</dt><dd>Cart\u00e3o recarreg\u00e1vel de transporte (\u20ac0,50). S\u00f3 compensa a partir de 3\u20134 viagens. N\u00e3o comprem.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Zapping','pt-PT',this)\" aria-label=\"Ouvir Zapping\">\ud83d\udd0a</button> Zapping</dt><dd>Modo do Navegante em que voc\u00ea carrega dinheiro e paga por viagem (~\u20ac1,85). Idem: n\u00e3o precisam.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Validar','pt-PT',this)\" aria-label=\"Ouvir Validar\">\ud83d\udd0a</button> Validar</dt><dd>Encostar o cart\u00e3o no leitor ao entrar. S\u00f3 se aplica ao Navegante; pagando a bordo, n\u00e3o h\u00e1 o que validar.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Paragem','pt-PT',this)\" aria-label=\"Ouvir Paragem\">\ud83d\udd0a</button> Paragem</dt><dd>Ponto de \u00f4nibus/bonde.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('TVDE','pt-PT',this)\" aria-label=\"Ouvir TVDE\">\ud83d\udd0a</button> TVDE</dt><dd>Nome oficial em Portugal para Uber, Bolt etc. \u00c9 o que est\u00e1 escrito nas placas do aeroporto.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Miradouro','pt-PT',this)\" aria-label=\"Ouvir Miradouro\">\ud83d\udd0a</button> Miradouro</dt><dd>Mirante. Santa Luzia e Portas do Sol s\u00e3o os dois de Alfama, um ao lado do outro.</dd></div>\n    <div><dt><button class=\"say-btn\" onclick=\"zoropaSpeak('Cal\u00e7ada','pt-PT',this)\" aria-label=\"Ouvir Cal\u00e7ada\">\ud83d\udd0a</button> Cal\u00e7ada</dt><dd>O piso de pedrinhas brancas e pretas. Escorrega quando molhado: t\u00eanis.</dd></div>\n  </dl>\n\n  <h3>Apps: qual e por qu\u00ea</h3>\n  <div class=\"apps\">\n    <div class=\"app\"><div class=\"ic\">\ud83d\ude95</div><div><b>Uber e Bolt</b><span>Os dois, porque o pre\u00e7o varia muito na hora. Bolt costuma ser um pouco mais barato em Lisboa.</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83d\uddfa\ufe0f</div><div><b>Google Maps</b><span>Hor\u00e1rios da Carris em tempo real e o mapa offline. \u00c9 o \u00fanico app de transporte que voc\u00eas precisam em Lisboa.</span></div></div>\n    <div class=\"app\"><div class=\"ic\">\ud83d\udcac</div><div><b>WhatsApp</b><span>A Baiuca confirma reserva por Instagram/WhatsApp; a Patr\u00edcia \u00e9 por aqui tamb\u00e9m.</span></div></div>\n  </div>\n\n  <h3>Quanto custa</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>Trecho</th><th>Como</th><th>Os dois</th></tr>\n    <tr><td>Aeroporto \u2192 Bel\u00e9m</td><td>Uber/Bolt</td><td>\u20ac15\u201320</td></tr>\n    <tr><td>Bel\u00e9m \u2192 Pra\u00e7a do Com\u00e9rcio</td><td>15E, a bordo</td><td>\u20ac6</td></tr>\n    <tr><td>Rossio \u2192 Castelo</td><td>\u00f4nibus 737 ou tuk-tuk</td><td>\u20ac5\u20138</td></tr>\n    <tr><td>Alfama \u2192 Bel\u00e9m</td><td>Uber</td><td>\u20ac10\u201312</td></tr>\n    <tr><td>Bel\u00e9m \u2192 Aeroporto (25/09)</td><td>Uber</td><td>\u20ac15\u201320</td></tr>\n    <tr><td>Aeroporto \u2194 Estrela (05\u201306/10)</td><td>Uber \u00d72</td><td>\u20ac25\u201335</td></tr>\n    <tr><td colspan=\"2\"><b>Total transporte em Lisboa</b></td><td><b>~\u20ac80\u2013100</b></td></tr>\n  </table></div>\n</section>\n\n<!-- ====================== MAPAS ====================== -->\n<section id=\"mapas\">\n  <h2>Mapas do dia</h2>\n  <p class=\"lead\">Os pontos est\u00e3o nas posi\u00e7\u00f5es reais (coordenadas), sobre um fundo simplificado: rio, pra\u00e7as e colinas. Dist\u00e2ncias dentro de cada quadro s\u00e3o proporcionais; entre quadros, n\u00e3o. Nos quadros do dia, toque no n\u00famero de um trecho para ver como fazer.</p>\n\n  <style>\n    .m{font-family:\"Public Sans\",system-ui,sans-serif;font-size:10.5px;fill:var(--ink)}\n    .ms{font-family:\"Public Sans\",system-ui,sans-serif;font-size:9px;fill:var(--muted)}\n    .mh{font-family:\"Fraunces\",Georgia,serif;font-size:13px;font-weight:600;fill:var(--azul)}\n    .mg{font-family:\"Fraunces\",Georgia,serif;font-size:11px;font-style:italic;fill:var(--muted);opacity:.7}\n    .water{fill:var(--azul-tint)}\n    .hill{fill:var(--line);opacity:.35}\n    .street{stroke:var(--line);stroke-width:5;fill:none;stroke-linecap:round}\n    .walk{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:3 4;stroke-linecap:round}\n    .tram{stroke:var(--amarelo);stroke-width:4;fill:none;stroke-linecap:round}\n    .uber{stroke:var(--azul);stroke-width:2.5;fill:none;stroke-linecap:round}\n    .pt{fill:var(--azul);stroke:var(--bg);stroke-width:1.5}\n    .eat{fill:var(--amarelo);stroke:var(--ink);stroke-width:1.2}\n    .shop{fill:var(--bg);stroke:var(--azul);stroke-width:2}\n    .bed{fill:var(--ok);stroke:var(--bg);stroke-width:1.5}\n    .num{font-family:\"Public Sans\",sans-serif;font-size:8px;font-weight:700;fill:#fff}\n  </style>\n\n  <!-- vis\u00e3o geral -->\n  <figure>\n    <svg viewBox=\"0 0 360 90\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Vis\u00e3o geral: Bel\u00e9m a oeste, Baixa e Alfama a leste, aeroporto a nordeste\">\n      <rect x=\"0\" y=\"66\" width=\"360\" height=\"24\" class=\"water\"/>\n      <text x=\"8\" y=\"82\" class=\"mg\">rio Tejo</text>\n      <circle cx=\"60\" cy=\"52\" r=\"7\" class=\"pt\"/><text x=\"30\" y=\"40\" class=\"m\">Bel\u00e9m</text>\n      <path d=\"M67 52 L253 52\" class=\"tram\"/><text x=\"118\" y=\"46\" class=\"ms\">el\u00e9trico 15E \u00b7 7 km \u00b7 25 min</text>\n      <circle cx=\"260\" cy=\"52\" r=\"7\" class=\"pt\"/><text x=\"234\" y=\"40\" class=\"m\">Baixa \u00b7 Alfama</text>\n      <text x=\"294\" y=\"18\" class=\"m\">\u2708 aeroporto</text>\n      <path d=\"M318 22 C 250 30, 120 30, 66 46\" class=\"uber\"/>\n      <path d=\"M318 22 C 300 34, 280 40, 266 46\" class=\"uber\"/>\n      <text x=\"110\" y=\"26\" class=\"ms\">Uber 20 min</text>\n    </svg>\n    <figcaption>Onde cada quadro fica em rela\u00e7\u00e3o aos outros.</figcaption>\n  </figure>\n\n  <!-- quadro A: Bel\u00e9m -->\n  <figure>\n    <svg viewBox=\"0 0 360 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Bel\u00e9m, manh\u00e3 de 24 de setembro\">\n      <path d=\"M0 162 L60 162 Q100 150 200 156 T360 150 L360 215 L0 215 Z\" class=\"water\"/>\n      <text x=\"300\" y=\"200\" class=\"mg\">rio Tejo</text>\n      <path d=\"M120 78 L360 78\" class=\"street\"/><text x=\"295\" y=\"70\" class=\"ms\">Rua de Bel\u00e9m</text>\n      <path d=\"M0 118 L360 118\" class=\"street\" style=\"stroke-width:3;opacity:.6\"/><text x=\"8\" y=\"112\" class=\"ms\">Av. da \u00cdndia \u00b7 linha do trem</text>\n      <rect x=\"192\" y=\"86\" width=\"52\" height=\"28\" class=\"hill\" rx=\"3\"/><text x=\"197\" y=\"103\" class=\"ms\">Pra\u00e7a do Imp\u00e9rio</text>\n      <text x=\"14\" y=\"26\" class=\"mh\">Bel\u00e9m \u00b7 09:00\u201317:00 \u00b7 tudo a p\u00e9, plano</text>\n\n      <!-- chegada -->\n      <text x=\"249\" y=\"26\" class=\"m\">\u2708 Uber do aeroporto</text>\n      <path d=\"M340 30 C 330 45, 300 55, 262 64\" class=\"r-hit\" data-r=\"1\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M340 30 C 330 45, 300 55, 262 64\" class=\"uber r-path\" data-r=\"1\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n\n      <!-- caminhada -->\n      <path d=\"M213 69 L253 72\" class=\"r-hit\" data-r=\"2\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M213 69 L253 72\" class=\"walk r-path\" data-r=\"2\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n      <path d=\"M258 84 L228 132\" class=\"r-hit\" data-r=\"3\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M258 84 L228 132\" class=\"walk r-path\" data-r=\"3\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n      <path d=\"M220 140 C 180 158, 130 165, 94 168\" class=\"r-hit\" data-r=\"4\" data-map=\"lisboa-1\" tabindex=\"-1\"/><path d=\"M220 140 C 180 158, 130 165, 94 168\" class=\"walk r-path\" data-r=\"4\" data-map=\"lisboa-1\" tabindex=\"-1\"/>\n\n      <!-- pontos -->\n      <rect x=\"247\" y=\"64\" width=\"12\" height=\"12\" class=\"bed\"/><text x=\"239\" y=\"60\" class=\"m\">Famous Crows (malas)</text>\n      <circle cx=\"258\" cy=\"82\" r=\"6\" class=\"eat\"/><text x=\"266\" y=\"86\" class=\"m\">Past\u00e9is de Bel\u00e9m</text>\n      <circle cx=\"292\" cy=\"96\" r=\"5\" class=\"eat\"/><text x=\"258\" y=\"100\" class=\"m\">Almo\u00e7o: 3 op\u00e7\u00f5es</text>\n      <circle cx=\"213\" cy=\"69\" r=\"6\" class=\"pt\"/><text x=\"150\" y=\"60\" class=\"m\">Jer\u00f3nimos</text>\n      <circle cx=\"235\" cy=\"78\" r=\"4\" class=\"tram\" style=\"fill:var(--amarelo);stroke:none\"/><text x=\"180\" y=\"130\" class=\"ms\">parada 15E \"Mosteiro dos Jer\u00f3nimos\"</text>\n      <path d=\"M235 82 L235 122\" class=\"ms\" style=\"stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2\"/>\n      <circle cx=\"224\" cy=\"137\" r=\"6\" class=\"pt\"/><text x=\"211\" y=\"141\" class=\"m\">Padr\u00e3o dos Descobrimentos</text>\n      <circle cx=\"87\" cy=\"169\" r=\"6\" class=\"pt\"/><text x=\"20\" y=\"150\" class=\"m\">Torre de Bel\u00e9m</text>\n      <text x=\"100\" y=\"188\" class=\"ms\">beira-rio 15 min</ ext x=\"146\" y=\"92\" class=\"ms\">posi\u00e7\u00e3o aproximada</text>\n      <path d=\"M134 90 L120 128\" class=\"r-hit\" data-r=\"2\" data-map=\"lisboa-3\" tabindex=\"-1\"/><path d=\"M134 90 L120 128\" class=\"walk r-path\" data-r=\"2\" data-map=\"lisboa-3\" tabindex=\"-1\"/><text x=\"150\" y=\"116\" class=\"ms\">a p\u00e9 ~10 min</text>\n      <circle cx=\"118\" cy=\"131\" r=\"6\" class=\"eat\"/><text x=\"128\" y=\"135\" class=\"m\">Caf\u00e9 de S\u00e3o Bento</text>\n      <circle cx=\"120\" cy=\"140\" r=\"4\" class=\"eat\"/><text x=\"128\" y=\"150\" class=\"ms\">O Jardim Sr. Lisboa (vizinho)</text>\n      <circle cx=\"108\" cy=\"116\" r=\"4\" class=\"eat\"/><text x=\"20\" y=\"112\" class=\"ms\">Madam Bo (fecha seg)</text>\n      <circle cx=\"48\" cy=\"46\" r=\"5\" class=\"eat\"/><text x=\"56\" y=\"42\" class=\"m\">Churrasqueira de S\u00e3o Bento</text>\n      <text x=\"56\" y=\"54\" class=\"ms\">10 min subindo a rua</text>\n      <path d=\"M140 80 C 200 70, 260 44, 300 28\" class=\"r-hit\" data-r=\"3\" data-map=\"lisboa-3\" tabindex=\"-1\"/><path d=\"M140 80 C 200 70, 260 44, 300 28\" class=\"uber r-path\" style=\"stroke-dasharray:6 4\" data-r=\"3\" data-map=\"lisboa-3\" tabindex=\"-1\"/>\n      <text x=\"196\" y=\"40\" class=\"ms\" style=\"fill:var(--azul)\">06/10 \u00b7 06:15</text>\n    <g class=\"r-badge taxi\" data-r=\"1\" data-map=\"lisboa-3\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 1: Uber \u00b7 aeroporto \u2192 casa da Patr\u00edcia (Estrela)\" transform=\"translate(292,33)\"><circle r=\"9\"/><text y=\".5\">1</text></g><g class=\"r-badge walk\" data-r=\"2\" data-map=\"lisboa-3\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 2: A p\u00e9 \u00b7 casa da Patr\u00edcia \u2192 Caf\u00e9 de S\u00e3o Bento\" transform=\"translate(127,109)\"><circle r=\"9\"/><text y=\".5\">2</text></g><g class=\"r-badge taxi\" data-r=\"3\" data-map=\"lisboa-3\" tabindex=\"0\" role=\"button\" aria-label=\"Trecho 3: Uber \u00b7 casa \u2192 aeroporto, 06/10 06:15\" transform=\"translate(155,84)\"><circle r=\"9\"/><text y=\".5\">3</text></g></svg>\n    <figcaption>Quadro C \u00b7 a noite com a Patr\u00edcia. Tudo a p\u00e9 na mesma rua.</figcaption>\n  <div class=\"rota-painel\" id=\"rp-lisboa-3\" aria-live=\"polite\"></div></figure>\n\n  <p>Mapa real com os pontos do dia 24: <a href=\"https://www.google.com/maps/dir/?api=1&origin=Aeroporto+de+Lisboa&destination=A+Baiuca%2C+Rua+de+S%C3%A3o+Miguel+20&waypoints=Famous+Crows+Lisbon+Suites%7CPast%C3%A9is+de+Bel%C3%A9m%7CTorre+de+Bel%C3%A9m%7CPra%C3%A7a+do+Com%C3%A9rcio%7CA+Ginjinha%2C+Largo+de+S%C3%A3o+Domingos%7CCastelo+de+S%C3%A3o+Jorge%7CMiradouro+de+Santa+Luzia&travelmode=walking\" target=\"_blank\" rel=\"noopener noreferrer\" onclick=\"event.preventDefault();var u=this.href;var w=null;try{w=window.open(u,'_blank','noopener')}catch(e){}if(!w){try{window.top.location.href=u}catch(e){}}\">abrir a rota no Google Maps</a>.</p>\n</section>\n\n<!-- ====================== COMER ====================== -->\n<section id=\"comer\">\n  <h2>Onde comer: 3 op\u00e7\u00f5es por parada</h2>\n  <p class=\"lead\">A primeira de cada trio \u00e9 a escolha do roteiro ou a que eu escolheria. Hor\u00e1rios conferidos para o dia da semana em que voc\u00eas estar\u00e3o l\u00e1. Pre\u00e7os por pessoa, sem vinho.</p>\n\n  <div class=\"meal\">\n    <h3>Caf\u00e9 da manh\u00e3 \u00b7 qui 24/09, 09:00 \u00b7 Bel\u00e9m</h3>\n    <p class=\"when\">Aqui n\u00e3o h\u00e1 trio: \u00e9 Past\u00e9is de Bel\u00e9m. Fila do balc\u00e3o anda r\u00e1pido; para sentar, entre e procure os sal\u00f5es do fundo. ~\u20ac1,50 o pastel, ~\u20ac5 com caf\u00e9.</p>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Almo\u00e7o \u00b7 qui 24/09, 12:30 \u00b7 Bel\u00e9m</h3>\n    <p class=\"when\">Os tr\u00eas ficam a menos de 5 min a p\u00e9 da hospedagem. Bel\u00e9m tem muita armadilha tur\u00edstica na rua principal; estes tr\u00eas s\u00e3o as exce\u00e7\u00f5es que os moradores usam.</p>\n\n    <div class=\"opt pick\"><h4>Taberna dos Ferreiros <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Travessa dos Ferreiros a Bel\u00e9m 5, ruela de tr\u00e1s, 2 min da Rua de Bel\u00e9m.</span>\n        <b>Por qu\u00ea</b><span>Cozinha portuguesa de verdade escondida numa travessa, sem card\u00e1pio com foto. Nota 4,6 em quase 2 mil avalia\u00e7\u00f5es.</span>\n        <b>Estrela</b><span>Polvo guisado em molho de tomate. O atum tamb\u00e9m \u00e9 elogiado.</span>\n        <b>Custo</b><span>\u20ac18\u201325.</span>\n        <b>Hor\u00e1rio</b><span>Quinta 12h\u201315h. Reservar \u00e9 prudente: +351 21 587 3837.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Adega de Bel\u00e9m</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rua de Bel\u00e9m 40, a 100 m da hospedagem.</span>\n        <b>Por qu\u00ea</b><span>Adega tradicional com azulejos azuis e brancos, mistura de moradores e turistas, por\u00e7\u00e3o generosa.</span>\n        <b>Estrela</b><span>Sardinhas grelhadas e arroz de marisco (a por\u00e7\u00e3o \"para dois\" serve quatro).</span>\n        <b>Custo</b><span>\u20ac15\u201322. P\u00e3o, manteiga e azeitonas na mesa s\u00e3o cobrados: recuse se n\u00e3o quiser.</span>\n        <b>Hor\u00e1rio</b><span>Quinta 12h\u201316h30. Chega cheio \u00e0s 13h.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Miolo</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rua de Bel\u00e9m 36.</span>\n        <b>Por qu\u00ea</b><span>Se estiverem sem fome de prato grande depois dos past\u00e9is: caf\u00e9 de brunch, leve, muitas op\u00e7\u00f5es vegetais, nota 4,8.</span>\n        <b>Estrela</b><span>Slider de bochecha de porco; salm\u00e3o crocante.</span>\n        <b>Custo</b><span>\u20ac10\u201315.</span>\n        <b>Hor\u00e1rio</b><span>9h\u201316h30.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Lanche \u00b7 qui 24/09, ~17:45 \u00b7 Rossio</h3>\n    <p class=\"when\">Ginjinha no balc\u00e3o da <b>A Ginjinha</b> (Largo de S\u00e3o Domingos 8): ~\u20ac2 o copinho, \"com\" ou \"sem\" a cereja, s\u00f3 dinheiro. Toma-se de p\u00e9 na cal\u00e7ada. \u00c9 o ritual, n\u00e3o a refei\u00e7\u00e3o.</p>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar com fado \u00b7 qui 24/09, 20:00 \u00b7 Alfama</h3>\n    <p class=\"when\">Regra das casas de fado: o jantar gira em torno da m\u00fasica. Quando a luz baixa, sil\u00eancio total; o gar\u00e7om n\u00e3o vem. Nas tr\u00eas, reservar \u00e9 obrigat\u00f3rio.</p>\n\n    <div class=\"opt pick\"><h4>A Baiuca <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rua de S\u00e3o Miguel 20, 5 min descendo de Santa Luzia.</span>\n        <b>Por qu\u00ea</b><span>Sala de 30 lugares, a experi\u00eancia mais \u00edntima e menos encenada de Alfama.</span>\n        <b>Estrela</b><span>Carne de porco \u00e0 alentejana; guisado de porco com batata.</span>\n        <b>Custo</b><span>M\u00ednimo ~\u20ac25 por pessoa em comida; espere \u20ac30\u201340.</span>\n        <b>Hor\u00e1rio</b><span>Abre \u00e0s 20h. Reserva por telefone (+351 939 457 098) ou mensagem no Instagram; eles respondem melhor no Instagram. Diga se n\u00e3o quiser os petiscos que j\u00e1 v\u00eam na mesa: s\u00e3o cobrados.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">Fado vadio: quem canta s\u00e3o amadores e vizinhos da casa \u2014 \u00e0s vezes a pr\u00f3pria dona. Nada de m\u00fasicos contratados. O fado \u00e9 Patrim\u00f4nio Cultural Imaterial da Humanidade pela UNESCO desde 2011, reconhecido como a m\u00fasica urbana de Lisboa por excel\u00eancia, nascida no s\u00e9culo XIX nos bairros populares como Alfama e Mouraria \u2014 a tradi\u00e7\u00e3o diz que surgiu entre marinheiros, prostitutas e a saudade de quem ficava no cais.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>Parreirinha de Alfama</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Largo do Chafariz de Dentro, no p\u00e9 de Alfama, 8 min de Santa Luzia.</span>\n        <b>Por qu\u00ea</b><span>Fadistas profissionais, tr\u00eas por noite. \u00c9 a op\u00e7\u00e3o \"fado de qualidade garantida\".</span>\n        <b>Estrela</b><span>Bochecha de porco. Menu fixo com entrada, prato e sobremesa.</span>\n        <b>Custo</b><span>\u20ac45\u201355 (menu fixo, bebidas \u00e0 parte).</span>\n        <b>Hor\u00e1rio</b><span>Quinta 19h30\u201300h30. Chegar \u00e0s 20h para jantar antes de a m\u00fasica come\u00e7ar. +351 21 886 8209.</span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Fundada por Argentina Santos, cantora que virou uma das grandes refer\u00eancias do fado do s\u00e9culo XX \u2014 ela come\u00e7ou a cantar ainda crian\u00e7a na taberna do pai, em Alfama, e nunca teve forma\u00e7\u00e3o musical formal. A casa abriu em 1952 e continua na fam\u00edlia; \u00e9 uma das \u00faltimas do bairro a manter fadistas profissionais contratados todas as noites, em vez de sess\u00f5es abertas a amadores.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>Tasca do Chico Alfama</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rua dos Rem\u00e9dios 83, 10 min de Santa Luzia.</span>\n        <b>Por qu\u00ea</b><span>Fado amador num sal\u00e3o de fam\u00edlia, com moradores entrando para cantar. A noite inteira dura 4 horas.</span>\n        <b>Estrela</b><span>Menu fixo de 4 pratos de petiscos partilhados.</span>\n        <b>Custo</b><span>~\u20ac35 fixo. <b>S\u00f3 dinheiro.</b></span>\n        <b>Hor\u00e1rio</b><span>Quinta 20h30\u20132h. +351 961 339 697.</span>\n      </div></div>\n\n    <div class=\"note\">Plano sem fado (chuva, cansa\u00e7o ou reserva que n\u00e3o deu): <b>Honorato Chiado</b>, Largo Rafael Bordalo Pinheiro 12, hamb\u00farguer artesanal, \u20ac15\u201320, quinta at\u00e9 23h. Ou o <b>Time Out Market</b> (Cais do Sodr\u00e9), coberto, 30 bancas dos melhores chefs da cidade, \u20ac15\u201325, at\u00e9 meia-noite.</div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Jantar de despedida \u00b7 seg 05/10, 21:30 \u00b7 S\u00e3o Bento</h3>\n    <p class=\"when\">Os tr\u00eas est\u00e3o na Rua de S\u00e3o Bento, a rua da casa da Patr\u00edcia. O primeiro e o segundo s\u00e3o vizinhos de porta.</p>\n\n    <div class=\"opt pick\"><h4>Caf\u00e9 de S\u00e3o Bento <span class=\"tag\">escolha</span></h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rua de S\u00e3o Bento 212, em frente ao jardim do Parlamento. Toca-se a campainha para entrar.</span>\n        <b>Por qu\u00ea</b><span>O bife de refer\u00eancia de Lisboa desde 1982, frequentado pelos deputados.</span>\n        <b>Estrela</b><span>Bife \u00e0 Caf\u00e9 de S\u00e3o Bento: fil\u00e9 com molho de natas e batata palha, ovo opcional. O steak tartare tamb\u00e9m \u00e9 dos melhores da cidade.</span>\n        <b>Custo</b><span>\u20ac35\u201345 com uma ta\u00e7a.</span>\n        <b>Hor\u00e1rio</b><span>Segunda 19h\u20131h. <b>Reservar: +351 913 658 343.</b></span>\n      </div>\n      <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">O sal\u00e3o \u00e9 de veludo vermelho e madeira escura, decora\u00e7\u00e3o de s\u00e9culo XIX que sobrevive quase intacta. A casa abriu em 1982 num pr\u00e9dio bem mais antigo, de frente para o jardim da Assembleia da Rep\u00fablica \u2014 da\u00ed o p\u00fablico fiel de deputados e jornalistas pol\u00edticos, que fizeram do restaurante quase uma extens\u00e3o informal do Parlamento.</div></details>\n    </div>\n\n    <div class=\"opt\"><h4>O Jardim Sr. Lisboa</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rua de S\u00e3o Bento 202, porta ao lado.</span>\n        <b>Por qu\u00ea</b><span>Cozinha portuguesa com toque asi\u00e1tico, num sal\u00e3o com uma \u00e1rvore no meio. Se a Patr\u00edcia j\u00e1 conhece o S\u00e3o Bento de cor, aqui \u00e9 a alternativa mais leve e mais atual.</span>\n        <b>Estrela</b><span>Ceviche de corvina, peixinhos da horta, batata frita com parmes\u00e3o.</span>\n        <b>Custo</b><span>\u20ac30\u201340 em pratos para partilhar.</span>\n        <b>Hor\u00e1rio</b><span>Segunda 12h\u20130h. +351 21 396 1529.</span>\n      </div></div>\n\n    <div class=\"opt\"><h4>Churrasqueira de S\u00e3o Bento</h4>\n      <div class=\"grid\">\n        <b>Onde</b><span>Rua de S\u00e3o Bento 708, 10 min subindo a rua.</span>\n        <b>Por qu\u00ea</b><span>Frango de churrasco portugu\u00eas, o prato que os lisboetas comem de verdade numa segunda \u00e0 noite. Fachada feia, comida \u00f3tima, conta de \u20ac12 por pessoa com vinho.</span>\n        <b>Estrela</b><span>Meio frango com piri-piri, arroz e batata.</span>\n        <b>Custo</b><span>\u20ac10\u201314.</span>\n        <b>Hor\u00e1rio</b><span>Segunda 18h\u20130h. Sem reserva.</span>\n      </div></div>\n  </div>\n\n  <div class=\"meal\">\n    <h3>Caf\u00e9 da manh\u00e3 \u00b7 ter 06/10 \u00b7 aeroporto</h3>\n    <p class=\"when\">Sa\u00edda \u00e0s 06:15 n\u00e3o deixa tempo em casa. Depois da seguran\u00e7a, no Terminal 1, h\u00e1 uma <b>Manteigaria</b> e uma <b>Past\u00e9is de Bel\u00e9m</b>: \u00faltimo pastel de nata da viagem, e \u00e9 a compara\u00e7\u00e3o que todo mundo faz.</p>\n  </div>\n</section>\n\n<!-- ====================== LEMBRANCINHAS ====================== -->\n<section id=\"lembrancas\">\n  <h2>Lembrancinhas de Lisboa</h2>\n  <p class=\"lead\">Ponto que o roteiro n\u00e3o resolvia: <b>a \u00fanica janela de compras em Lisboa \u00e9 17:30\u201318:30 do dia 24, na Baixa.</b> No dia 05 voc\u00eas chegam \u00e0s 21h e no dia 06 saem \u00e0s 6h. O que n\u00e3o for comprado na quinta fica para o aeroporto ou para as outras cidades.</p>\n\n  <div class=\"warn\">Mala de m\u00e3o de 10 kg: conservas pesam (~120 g a lata), azulejo pesa (~300 g), vinho n\u00e3o passa na seguran\u00e7a. Sabonete, corti\u00e7a e uma lata ou duas cabem.</div>\n\n  <h3>O que \u00e9 t\u00edpico e onde comprar</h3>\n  <div class=\"scroll\"><table>\n    <tr><th>O qu\u00ea</th><th>Por qu\u00ea</th><th>Onde (na rota)</th><th>Pre\u00e7o</th></tr>\n    <tr><td>Conservas de peixe</td><td>Sardinha, atum, bacalhau em lata de design; o presente mais portugu\u00eas que cabe na mala.</td><td>Conserveira de Lisboa (Rua dos Bacalhoeiros 34, 2 min da Pra\u00e7a do Com\u00e9rcio, at\u00e9 19h). Mais barata e mais honesta que as lojas coloridas de \"sardinha fant\u00e1stica\".</td><td>\u20ac3\u20138 a lata</td></tr>\n    <tr><td>Sabonetes Claus Porto</td><td>Marca de 1887, embalagem art d\u00e9co, cheiro que dura. Leve e bonito.</td><td>Loja Claus Porto no Chiado (Rua da Miseric\u00f3rdia 135) ou A Vida Portuguesa.</td><td>\u20ac8\u201315</td></tr>\n    <tr><td>Azulejo</td><td>Um azulejo antigo de verdade, de demoli\u00e7\u00e3o, n\u00e3o a r\u00e9plica de \u00edm\u00e3.</td><td>Corti\u00e7o & Netos (Intendente, fora da rota, fecha 19h). Na rota: A Vida Portuguesa vende r\u00e9plicas boas.</td><td>\u20ac5\u201325</td></tr>\n    <tr><td>Cer\u00e2mica Bordallo Pinheiro</td><td>Andorinhas, couves e sardinhas de lou\u00e7a, o kitsch elegante lisboeta.</td><td>A Vida Portuguesa (Chiado).</td><td>\u20ac10\u201340</td></tr>\n    <tr><td>Corti\u00e7a</td><td>Portugal produz metade da corti\u00e7a do mundo; carteiras, bolsas e porta-copos.</td><td>A Vida Portuguesa; lojinhas da Rua Augusta (conferir se \u00e9 corti\u00e7a de verdade, n\u00e3o papel).</td><td>\u20ac5\u201330</td></tr>\n    <tr><td>Ginjinha em garrafa</td><td>O licor de ginja para levar. Compra-se no mesmo balc\u00e3o onde se bebe.</td><td>A Ginjinha (Rossio). S\u00f3 cabe na mala se for despachada: n\u00e3o \u00e9 o caso de voc\u00eas. Comprar no free shop do aeroporto no dia 06.</td><td>\u20ac10\u201315</td></tr>\n    <tr><td>Livro carimbado</td><td>A Bertrand \u00e9 a livraria mais antiga do mundo em funcionamento (1732) e carimba o livro comprado.</td><td>Livraria Bertrand, Rua Garrett 73, Chiado, at\u00e9 22h.</td><td>pre\u00e7o do livro</td></tr>\n  </table></div>\n\n  <div class=\"ok\">Se quiserem fazer as compras de Lisboa, o desvio \u00e9: da Pra\u00e7a do Com\u00e9rcio, Conserveira (2 min) \u2192 Rua Augusta \u2192 subir ao Chiado pela Rua Garrett (8 min): Bertrand, A Vida Portuguesa, Claus Porto e Manteigaria est\u00e3o num raio de 200 m. Depois, Chiado \u2192 Rossio s\u00e3o 5 min descendo. Custa uns 40 min a mais e adia o castelo para 19h. O p\u00f4r do sol \u00e0s 19h35 continua de p\u00e9.</div>\n</section>\n\n<!-- ====================== LOJAS ====================== -->\n<section id=\"lojas\">\n  <h2>Lojas que s\u00f3 existem aqui</h2>\n\n  <div class=\"shop\"><b>A Vida Portuguesa</b><small>Rua Nova do Almada 72, Chiado \u00b7 todos os dias at\u00e9 19h30</small>\n    <p>A loja que reuniu as marcas portuguesas antigas (sabonete, l\u00e1pis, pasta de dente, lou\u00e7a) com a embalagem original. \u00c9 o resumo do pa\u00eds numa loja: se entrarem numa s\u00f3, \u00e9 esta.</p></div>\n\n  <div class=\"shop\"><b>Conserveira de Lisboa</b><small>Rua dos Bacalhoeiros 34, Baixa \u00b7 seg\u2013s\u00e1b at\u00e9 19h</small>\n    <p>S\u00f3 vende as tr\u00eas marcas da casa (Tricana, Minor, Prata do Mar). O dono explica as diferen\u00e7as se perguntarem.</p>\n    <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Aberta em 1930, \u00e9 uma das \u00faltimas lojas de Lisboa que ainda embrulha cada lata em papel \u00e0 m\u00e3o, no balc\u00e3o, na frente do cliente. A ind\u00fastria conserveira portuguesa viveu seu auge nas d\u00e9cadas de 1930\u201350, quando o pa\u00eds chegou a ter centenas de f\u00e1bricas na regi\u00e3o de Set\u00fabal e Matosinhos; boa parte fechou com a concorr\u00eancia asi\u00e1tica a partir dos anos 1970, e lojas como esta sobreviveram justamente por venderem direto ao consumidor, sem intermedi\u00e1rio.</div></details></div>\n\n  <div class=\"shop\"><b>Livraria Bertrand</b><small>Rua Garrett 73, Chiado \u00b7 at\u00e9 22h</small>\n    <p>Salas abobadadas, caf\u00e9 no fundo, poucos t\u00edtulos em ingl\u00eas, e o carimbo \"comprado na livraria mais antiga do mundo\".</p>\n    <details class=\"curio\"><summary>\ud83d\udcd6 a hist\u00f3ria por tr\u00e1s</summary><div class=\"in\">Aberta em 1732, est\u00e1 no Guinness como a livraria mais antiga do mundo ainda em funcionamento \u2014 sobreviveu ao terramoto de 1755, que destruiu o pr\u00e9dio original, e reabriu poucos metros dali. Fernando Pessoa, o maior poeta portugu\u00eas do s\u00e9culo XX, era cliente frequente e chegou a lan\u00e7ar livros por l\u00e1; as salas abobadadas onde hoje fica a se\u00e7\u00e3o de literatura eram, no s\u00e9culo XVIII, parte de um antigo convento.</div></details></div>\n\n  <div class=\"shop\"><b>Claus Porto</b><small>Rua da Miseric\u00f3rdia 135, Chiado \u00b7 at\u00e9 19h</small>\n    <p>Loja-museu da marca de sabonetes do Porto. Na quinta-feira da visita \u00e9 s\u00f3 a loja \u2014 a barba \u00e0 navalha \u00e9 fim de semana.</p></div>\n\n  <div class=\"shop\"><b>Manteigaria</b><small>Rua do Loreto 2, Chiado \u00b7 8h\u20130h</small>\n    <p>S\u00f3 de p\u00e9, com a f\u00e1brica \u00e0 vista atr\u00e1s do balc\u00e3o. Vale por comparar: massa mais crocante e creme mais quente. Se o desvio ao Chiado acontecer, passem aqui.</p>\n    <details class=\"curio\"><summary>\ud83d\udd16 detalhe curioso</summary><div class=\"in\">\u00c9 a rival direta dos Past\u00e9is de Bel\u00e9m \u2014 a disputa por qual pastel de nata \u00e9 o melhor de Lisboa \u00e9 um cl\u00e1ssico de bar entre os lisboetas. A receita original do pastel de nata nasceu no Mosteiro dos Jer\u00f3nimos, criada por freiras que usavam claras de ovo para engomar h\u00e1bitos e sobravam gemas; a receita da Manteigaria \u00e9 uma reinterpreta\u00e7\u00e3o, n\u00e3o a f\u00f3rmula secreta dos Past\u00e9is de Bel\u00e9m, que continua guardada a sete chaves desde 1837.</div></details></div>\n\n  <div class=\"shop\"><b>Casa Portuguesa do Pastel de Bacalhau</b><small>Rua Augusta 106 \u00b7 at\u00e9 23h</small>\n    <p>Est\u00e1 na rota, tem fila e vitrine bonita, e o pastel com queijo da Serra custa \u20ac8. Vale entrar para ver o sal\u00e3o; comer, s\u00f3 se a curiosidade for maior que o bolso. As avalia\u00e7\u00f5es concordam que \u00e9 caro para o que \u00e9.</p></div>\n\n  <div class=\"chips\">\n    <span class=\"chip\">Na rota de quinta: Conserveira \u00b7 Casa do Bacalhau \u00b7 A Ginjinha</span>\n    <span class=\"chip\">Com o desvio ao Chiado: Bertrand \u00b7 A Vida Portuguesa \u00b7 Claus Porto \u00b7 Manteigaria</span>\n    <span class=\"chip\">Fora da rota: Corti\u00e7o &amp; Netos</span>\n  </div>\n</section>\n\n\n</div>\n\n<script>\n(function(){\n  var ROTA_DADOS = {\"lisboa-1\": [{\"t\": \"Uber/Bolt \u00b7 aeroporto \u2192 Famous Crows\", \"d\": \"~20 min \u00b7 \u20ac15\u201320. Ponto de encontro: \u00e1rea \\\"Uber/Bolt/TVDE\\\" na sa\u00edda das Chegadas do T1.\"}, {\"t\": \"A p\u00e9 \u00b7 malas \u2192 Past\u00e9is \u2192 Jer\u00f3nimos\", \"d\": \"~5 min ao todo, tudo plano.\"}, {\"t\": \"A p\u00e9 \u00b7 Jer\u00f3nimos \u2192 Padr\u00e3o dos Descobrimentos\", \"d\": \"~5 min.\"}, {\"t\": \"A p\u00e9 \u00b7 Padr\u00e3o \u2192 Torre de Bel\u00e9m, pela beira-rio\", \"d\": \"~15 min. Volta \u00e0 hospedagem: tamb\u00e9m 15 min pela beira-rio.\"}], \"lisboa-2\": [{\"t\": \"El\u00e9trico 15E \u00b7 Bel\u00e9m \u2192 Pra\u00e7a do Com\u00e9rcio\", \"d\": \"~25 min \u00b7 pague ao motorista, ~\u20ac3/pessoa, dinheiro. Se lotado (comum \u00e0s 17h): Uber, \u20ac8\u201310, 15 min.\"}, {\"t\": \"A p\u00e9 \u00b7 Com\u00e9rcio \u2192 Rossio, pela Rua Augusta\", \"d\": \"~10 min, plano \u2014 \u00e9 a janela de compras de quinta.\"}, {\"t\": \"A p\u00e9 ou \u00f4nibus \u00b7 Rossio \u2192 Castelo\", \"d\": \"Subida forte, 20 min a p\u00e9; ou \u00f4nibus 737 na Figueira (~\u20ac2\u20133, a bordo); ou tuk-tuk/Uber \u20ac6\u20138.\"}, {\"t\": \"A p\u00e9 \u00b7 Castelo \u2192 Santa Luzia\", \"d\": \"S\u00f3 descida, ~5 min.\"}, {\"t\": \"A p\u00e9 \u00b7 Santa Luzia \u2192 A Baiuca\", \"d\": \"~5\u201310 min, descida.\"}, {\"t\": \"A p\u00e9 (desvio opcional) \u00b7 Baixa \u2192 Chiado\", \"d\": \"+40 min: Bertrand, A Vida Portuguesa, Claus Porto e Manteigaria num raio de 200 m.\"}, {\"t\": \"A p\u00e9 (desvio opcional) \u00b7 Chiado \u2192 Castelo\", \"d\": \"Adia o castelo para 19h; o p\u00f4r do sol \u00e0s 19h35 continua de p\u00e9.\"}], \"lisboa-3\": [{\"t\": \"Uber \u00b7 aeroporto \u2192 casa da Patr\u00edcia (Estrela)\", \"d\": \"~20 min \u00b7 \u20ac12\u201318. Avisar a Patr\u00edcia da chegada.\"}, {\"t\": \"A p\u00e9 \u00b7 casa da Patr\u00edcia \u2192 Caf\u00e9 de S\u00e3o Bento\", \"d\": \"~10 min, mesma rua.\"}, {\"t\": \"Uber \u00b7 casa \u2192 aeroporto, 06/10 06:15\", \"d\": \"Sa\u00edda cedo por causa do controle biom\u00e9trico de sa\u00edda de Schengen.\"}]};\n  function closeAll(mapId){\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"], .r-path[data-map=\"'+mapId+'\"]').forEach(function(el){el.classList.remove('is-active');});\n    var panel = document.getElementById('rp-'+mapId);\n    if(panel){panel.classList.remove('show');panel.innerHTML='';}\n  }\n  function openRoute(mapId, n){\n    var list = ROTA_DADOS[mapId];\n    if(!list) return;\n    var item = list[n-1];\n    if(!item) return;\n    var panel = document.getElementById('rp-'+mapId);\n    if(!panel) return;\n    var wasActive = panel.classList.contains('show') && panel.getAttribute('data-current') === String(n);\n    closeAll(mapId);\n    if(wasActive) return;\n    panel.innerHTML = '<button class=\"fechar\" aria-label=\"Fechar\">\u00d7</button><span class=\"num\">'+n+'</span><h4>'+item.t+'</h4><p>'+item.d+'</p>';\n    panel.classList.add('show');\n    panel.setAttribute('data-current', String(n));\n    panel.querySelector('.fechar').addEventListener('click', function(){closeAll(mapId);});\n    document.querySelectorAll('.r-badge[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"], .r-path[data-map=\"'+mapId+'\"][data-r=\"'+n+'\"]').forEach(function(el){el.classList.add('is-active');});\n    panel.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n  document.querySelectorAll('[data-r][data-map]').forEach(function(el){\n    el.addEventListener('click', function(){ openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10)); });\n    el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); openRoute(el.getAttribute('data-map'), parseInt(el.getAttribute('data-r'),10));} });\n  });\n})();\n<\/script>\n<script>\n(function(){\n  function sendScroll(el){\n    var y = el.getBoundingClientRect().top + (window.pageYOffset||0);\n    if (window.parent && window.parent !== window){\n      try{ window.parent.postMessage({zoropaScroll:y}, '*'); return true; }catch(e){}\n    }\n    return false;\n  }\n  window.addEventListener('message', function(e){\n    if (e.data && typeof e.data.zoropaJump === 'string'){\n      var jt = document.getElementById(e.data.zoropaJump);\n      if (jt) sendScroll(jt);\n      return;\n    }\n    if (!e.data || typeof e.data.zoropaSearch !== 'string') return;\n    var q = e.data.zoropaSearch.toLowerCase();\n    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);\n    var node, target = null;\n    while ((node = walker.nextNode())){\n      var nv = node.nodeValue ? node.nodeValue.replace(/\\s+/g,' ') : '';\n      if (nv && nv.toLowerCase().indexOf(q) !== -1){\n        var p = node.parentElement;\n        if (p && p.closest('script,style')) continue;\n        target = p; break;\n      }\n    }\n    if (!target) return;\n    var det = target.closest('details');\n    if (det && !det.open) det.open = true;\n    sendScroll(target);\n    var prevBg = target.style.backgroundColor, prevTr = target.style.transition;\n    target.style.transition =
